.shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(18,14,48,.62) 0%,rgba(18,14,48,.45) 45%,rgba(18,14,48,.72) 100%);pointer-events:none;}
.app{position:relative;height:100%;max-width:780px;margin:0 auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 12px env(safe-area-inset-bottom,0);}
header{padding:16px 6px 10px;text-align:center;color:#fff;}
header h1{font-family:'Cinzel',Georgia,serif;font-weight:800;font-size:clamp(22px,4.6vw,32px);margin:0;color:#fff;letter-spacing:.01em;text-shadow:0 2px 10px rgba(0,0,0,.55);}
header .es{font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:clamp(14px,2.6vw,17px);color:#fff;margin:2px 0 4px;text-shadow:0 2px 8px rgba(0,0,0,.55);}
header .sub{font-size:14px;color:#fff;margin:0;text-shadow:0 1px 6px rgba(0,0,0,.6);}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.ver{font-size:12px;font-weight:700;color:var(--navy);background:#fff;border-radius:999px;padding:3px 10px;}
.lang{display:flex;background:#fff;border-radius:999px;padding:3px;}
.lang button{border:0;background:transparent;color:var(--navy);font:700 13px 'Libre Franklin',sans-serif;padding:5px 12px;border-radius:999px;cursor:pointer;}
.lang button[aria-pressed="true"]{background:var(--red);color:#fff;}
#log{flex:1;overflow-y:auto;padding:8px 2px 12px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;}
.msg{max-width:86%;padding:12px 15px;border-radius:14px;font-size:16px;box-shadow:0 4px 18px rgba(0,0,0,.28);}
.bot{align-self:flex-start;background:#fff;color:var(--navy);border-left:5px solid var(--red);border-top-left-radius:4px;}
.bot a{color:var(--red);font-weight:700;}
.bot ul{margin:6px 0 0;padding-left:20px;}
.bot li{margin-bottom:3px;}
.bot .who{display:block;font-family:'Cinzel',Georgia,serif;font-weight:800;font-size:13px;color:var(--red);margin-bottom:3px;}
.user{align-self:flex-end;background:var(--red);color:#fff;border-top-right-radius:4px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 2px 10px;}
.chips button{background:#fff;color:var(--navy);border:2px solid #fff;border-radius:999px;padding:8px 14px;font:700 14px 'Libre Franklin',sans-serif;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);}
.chips button:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
form{display:flex;gap:8px;padding:0 0 12px;}
#q{flex:1;min-width:0;border:2px solid #fff;border-radius:12px;padding:13px 14px;font:16px 'Libre Franklin',sans-serif;color:var(--navy);background:#fff;}
#q::placeholder{color:#5b6488;}
#send{border:0;border-radius:12px;background:var(--red);color:#fff;font:700 16px 'Libre Franklin',sans-serif;padding:0 20px;cursor:pointer;}
#send:hover{background:#a00d25;}
.foot{text-align:center;font-size:13px;color:#fff;padding:0 0 12px;text-shadow:0 1px 6px rgba(0,0,0,.7);}
.foot a{color:#fff;font-weight:700;}
button:focus-visible,#q:focus-visible,a:focus-visible{outline:3px solid #FFD166;outline-offset:2px;}
@media (max-width:520px){.msg{max-width:94%;}body{background-attachment:scroll;}}

<body>
<div class="shade"></div>
<div class="app">
<header>
<h1 id="t1">Ask Uncle Sam</h1>
<p class="es" id="t2">Pregúntale al Tío Sam</p>
<p class="sub" id="t3">Santa Fe Fourth of July · Sunday, July 4, 2027 · Franklin E. Miles Park</p>
<div class="bar">
<span class="ver">V1</span>
<div class="lang" role="group" aria-label="Language / Idioma">
<button type="button" id="bEn" aria-pressed="true">English</button>
<button type="button" id="bEs" aria-pressed="false">Español</button>
</div>
</div>
</header>
<div id="log" aria-live="polite"></div>
<div class="chips" id="chips"></div>
<form id="f" autocomplete="off">
<label for="q" style="position:absolute;left:-9999px;">Your question</label>
<input id="q" type="text" placeholder="Ask about parking, shuttles, road closures…">
<button id="send" type="submit">Ask</button>
</form>
<div class="foot" id="foot">Help line <a href="tel:8559696272">(855) 969-6272</a> · Emergencies call 911</div>
</div>
<script>
var LINK=function(u,t){return '<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>';};
var P4=LINK('https://burnzozobra.com/4th/','burnzozobra.com/4th');
var NB=LINK('https://burnzozobra.com/4th-neighbors/','burnzozobra.com/4th-neighbors');
var SU=LINK('https://burnzozobra.com/july4signup','burnzozobra.com/july4signup');
var TEL='<a href="tel:8559696272">(855) 969-6272</a>';
var KB=[
{id:'hello',k:['hello','hi','hey','howdy','good morning','good afternoon','who are you','uncle sam','hola','buenos dias','buenas tardes','quien eres','tio sam'],
en:'Howdy, friend! I’m Uncle Sam, and I’m here to help you plan Santa Fe’s Fourth of July on <b>Sunday, July 4, 2027</b> at Franklin E. Miles Park. Ask me about the date and time, parking, shuttles, road closures, neighbor passes, the show, or what to bring.',
es:'¡Hola, amigo! Soy el Tío Sam y estoy aquí para ayudarte a planear el Cuatro de Julio de Santa Fe el <b>domingo 4 de julio de 2027</b> en el Parque Franklin E. Miles. Pregúntame sobre la fecha y hora, estacionamiento, shuttles, cierres de calles, pases para vecinos, el espectáculo o qué traer.'},
{id:'when',k:['when','what time','date','time','hours','start','starts','begin','gates open','what day','what night','cuando','a que hora','fecha','hora','horario','empieza','comienza','abren'],
en:'The celebration is <b>Sunday, July 4, 2027</b>. Gates and free shuttles open at <b>4:00 PM</b>, live music starts in the early evening, the sky show begins after dark (around 9:15–9:30 PM), and roads reopen around 10:30–11:00 PM once foot traffic clears. Final 2027 times will be posted at '+P4+'.',
es:'La celebración es el <b>domingo 4 de julio de 2027</b>. La entrada y los shuttles gratuitos abren a las <b>4:00 PM</b>, la música en vivo empieza al atardecer, el espectáculo en el cielo comienza al oscurecer (alrededor de las 9:15–9:30 PM) y las calles reabren alrededor de las 10:30–11:00 PM, cuando se despeja el tráfico peatonal. Los horarios finales de 2027 se publicarán en '+P4+'.'},
{id:'where',k:['where is','where s','where will','where it is','location','address','venue','franklin miles','miles park','which park','donde es','donde esta','donde sera','donde queda','ubicacion','direccion','lugar','que parque'],
en:'<b>Franklin E. Miles Park, 1027 Camino Carlos Rey, Santa Fe.</b> It’s nearly 29 acres, with about six acres of open grass for blankets and lawn chairs, plus a playground, sports courts, restrooms, and picnic shelters.',
es:'<b>Parque Franklin E. Miles, 1027 Camino Carlos Rey, Santa Fe.</b> Tiene casi 29 acres, con unos seis acres de pasto abierto para cobijas y sillas, además de juegos infantiles, canchas, baños y áreas de picnic techadas.'},
{id:'cost',k:['free','cost','price','ticket','tickets','admission','how much','pay','gratis','costo','precio','boleto','boletos','entrada','cuanto cuesta','pagar'],
en:'It’s <b>free</b>! No tickets needed. Admission is free and open to everyone. The Kiwanis Club of Santa Fe produces the celebration with the City of Santa Fe, and every dollar raised supports Kiwanis youth and community programs.',
es:'¡Es <b>gratis</b>! No se necesitan boletos. La entrada es libre y abierta a todos. El Club Kiwanis de Santa Fe produce la celebración junto con la Ciudad de Santa Fe, y cada dólar recaudado apoya los programas juveniles y comunitarios de Kiwanis.'},
{id:'schedule',k:['schedule','agenda','timeline','program','run of show','at a glance','order of events','itinerario','programa','cronograma','orden'],
en:'Here’s the evening at a glance (based on last year’s plan):<ul><li><b>4:00 PM</b>: gates and free shuttles open; road closures begin</li><li><b>Early evening</b>: live music on the main stage</li><li><b>After dark, about 9:15–9:30 PM</b>: sky show and fireworks</li><li><b>About 10:30–11:00 PM</b>: roads reopen</li></ul>Final 2027 times will be posted at '+P4+'.',
es:'Así se ve la noche (según el plan del año pasado):<ul><li><b>4:00 PM</b>: abren la entrada y los shuttles gratuitos; comienzan los cierres de calles</li><li><b>Al atardecer</b>: música en vivo en el escenario principal</li><li><b>Al oscurecer, alrededor de las 9:15–9:30 PM</b>: espectáculo en el cielo y fuegos artificiales</li><li><b>Alrededor de las 10:30–11:00 PM</b>: reabren las calles</li></ul>Los horarios finales de 2027 se publicarán en '+P4+'.'},
{id:'drones',k:['drone','drones','sky elements','light show','drone show','dron','espectaculo de luces','show de drones'],
en:'In 2026, Santa Fe had its <b>first-ever drone show</b>: 400 synchronized drones by Sky Elements, launched from the Nava Elementary basketball courts just north of the park. The 2027 sky show plan will be announced at '+P4+' once it’s confirmed.',
es:'En 2026, Santa Fe tuvo su <b>primer espectáculo de drones</b>: 400 drones sincronizados de Sky Elements, lanzados desde las canchas de básquetbol de la Primaria Nava, justo al norte del parque. El plan del espectáculo en el cielo para 2027 se anunciará en '+P4+' cuando esté confirmado.'},
{id:'fireworks',k:['fireworks','firework','pyro','pyrotechnics','finale','fuegos artificiales','fuegos','pirotecnia','cohetes'],
en:'Fireworks are the centerpiece! More than 72% of residents surveyed said they want them. The display is choreographed and fired by licensed pyrotechnicians, with the Santa Fe Fire Department on site. In 2026, Fireworks by Western lit up the sky for about 34 minutes.',
es:'¡Los fuegos artificiales son lo principal! Más del 72% de los residentes encuestados dijeron que los quieren. El espectáculo lo diseñan y disparan pirotécnicos con licencia, con el Departamento de Bomberos de Santa Fe presente. En 2026, Fireworks by Western iluminó el cielo por unos 34 minutos.'},
{id:'music',k:['music','band','bands','lineup','line up','stage','concert','who is playing','entertainment','performers','musica','banda','bandas','grupos','escenario','concierto','entretenimiento','quien toca'],
en:'The 2027 main-stage lineup is <b>coming soon</b>. Watch '+P4+' or join the mailing list at '+SU+'. Last year’s stage featured Lumpy, Lumbros, and Say When.',
es:'El programa musical de 2027 se anunciará <b>muy pronto</b>. Revisa '+P4+' o suscríbete en '+SU+'. El año pasado tocaron Lumpy, Lumbros y Say When.'},
{id:'food',k:['food','food trucks','food truck','eat','vendor','vendors','drinks','snacks','picnic','comida','comer','vendedor','vendedores','bebidas','puestos','antojitos'],
en:'Food trucks and vendors will be on site; the 2027 vendor list is <b>coming soon</b>. You’re welcome to bring a picnic, too. Interested in being a vendor? Email '+LINK('mailto:vendors@burnzozobra.com','vendors@burnzozobra.com')+'.',
es:'Habrá food trucks y vendedores; la lista de vendedores de 2027 se anunciará <b>muy pronto</b>. También puedes traer tu picnic. ¿Te interesa ser vendedor? Escribe a '+LINK('mailto:vendors@burnzozobra.com','vendors@burnzozobra.com')+'.'},
{id:'roads',k:['road closures','road closure','closures','closed roads','road closed','streets closed','detour','siringo','camino carlos rey','traffic','cierres','cierre','calles cerradas','trafico','desvio'],
en:'Road closures begin at <b>4:00 PM</b>:<ul><li>Siringo Road from Alamosa Place to La Junta Street</li><li>Camino Carlos Rey from Alamosa Drive to Calle de Oriente</li></ul>Cerrillos Road stays open. Roads reopen once pedestrian traffic clears, roughly 10:30–11:00 PM. The final 2027 map will be posted at '+P4+'.',
es:'Los cierres de calles comienzan a las <b>4:00 PM</b>:<ul><li>Siringo Road, de Alamosa Place a La Junta Street</li><li>Camino Carlos Rey, de Alamosa Drive a Calle de Oriente</li></ul>Cerrillos Road permanece abierta. Las calles reabren cuando se despeja el tráfico peatonal, alrededor de las 10:30–11:00 PM. El mapa final de 2027 se publicará en '+P4+'.'},
{id:'parking',k:['parking','park my car','where to park','where do i park','where can i park','lot','lots','parking lot','estacionamiento','estacionar','estaciono','estacionarme','me estaciono','donde estaciono','lote'],
en:'Park free in the <b>State of New Mexico lots just north of the park</b>. They’re close enough to walk, no shuttle needed. Please don’t park on neighborhood streets: street parking can block fire trucks and ambulances, and obstructing vehicles will be towed.',
es:'Estaciónate gratis en los <b>lotes del Estado de Nuevo México, justo al norte del parque</b>. Están tan cerca que puedes caminar, sin shuttle. Por favor no te estaciones en las calles del vecindario: puede bloquear a bomberos y ambulancias, y los vehículos que obstruyan serán remolcados.'},
{id:'shuttle',k:['shuttle','shuttles','bus','buses','ride','transportation','transit','camion','autobus','transporte'],
en:'Free continuous shuttles start at <b>4:00 PM</b> from <b>Santa Fe High School</b> and <b>Milagro Middle School</b>, dropping off and picking up at Nava Elementary next to the park. Final 2027 shuttle locations will be posted with the event map at '+P4+'.',
es:'Los shuttles gratuitos y continuos comienzan a las <b>4:00 PM</b> desde <b>Santa Fe High School</b> y <b>Milagro Middle School</b>, con parada en la Primaria Nava, junto al parque. Las ubicaciones finales de 2027 se publicarán con el mapa del evento en '+P4+'.'},
{id:'tow',k:['tow','towed','towing','impound','tow truck','grua','remolque','remolcado','remolcan','corralon'],
en:'Towing is enforced. Vehicles that block a roadway, driveway, or emergency access <b>will be towed</b>; last year four tow trucks were on standby. The impound yard may be closed the day after the Fourth, so a towed car may not come back until the next business day. Use the free lots and shuttles!',
es:'Se aplican remolques. Los vehículos que bloqueen una calle, una entrada o el acceso de emergencia <b>serán remolcados</b>; el año pasado hubo cuatro grúas listas. El corralón puede estar cerrado el día después del Cuatro, así que un auto remolcado podría no recuperarse hasta el siguiente día hábil. ¡Usa los lotes y shuttles gratuitos!'},
{id:'neighbors',k:['neighbor','neighbors','neighbour','resident','residents','neighborhood pass','credential','pass','passes','password','live near','live by','my house','vecino','vecinos','residente','pase','pases','credencial','contrasena','vivo cerca','mi casa'],
en:'If you live inside the road-closure zone, get a free <b>Neighborhood Credential Pass</b>:<ul><li>Go to '+NB+'. Call '+TEL+' (855-ZOZOBRA) for the page password.</li><li>Residents in the zone qualify automatically. Enter your name, address, phone, and number of guest vehicles.</li><li>Print it or save it to your phone, and display it on your dashboard.</li></ul><b>Important:</b> the pass gets you into the neighborhood through designated access points (for example, Alamosa Drive for streets south of Siringo). It does <b>not</b> get you through the closures on Siringo Road or Camino Carlos Rey. No pass? A driver’s license or utility bill with your address also works, but the pass is faster.',
es:'Si vives dentro de la zona de cierres, obtén tu <b>Pase de Credencial Vecinal</b> gratuito:<ul><li>Ve a '+NB+'. Llama al '+TEL+' (855-ZOZOBRA) para obtener la contraseña de la página.</li><li>Los residentes de la zona califican automáticamente. Ingresa tu nombre, dirección, teléfono y número de vehículos de invitados.</li><li>Imprímelo o guárdalo en tu teléfono y colócalo en el tablero.</li></ul><b>Importante:</b> el pase te permite entrar al vecindario por los puntos de acceso designados (por ejemplo, Alamosa Drive para las calles al sur de Siringo). <b>No</b> te permite pasar los cierres de Siringo Road o Camino Carlos Rey. ¿Sin pase? También sirve tu licencia de conducir o un recibo de servicios con tu dirección, pero el pase es más rápido.'},
{id:'guests',k:['guest','guests','visitors','family coming','hosting','party','friends over','invitado','invitados','visitas','fiesta','amigos'],
en:'Each guest vehicle needs <b>its own Neighborhood Credential Pass</b>, requested with the host resident’s consent at '+NB+'. Ask guests to carpool, park legally next to your home, and never block a driveway. Plan to be home and parked by <b>8:00 PM</b>.',
es:'Cada vehículo de invitados necesita <b>su propio Pase de Credencial Vecinal</b>, solicitado con el consentimiento del residente anfitrión en '+NB+'. Pide a tus invitados que compartan auto, se estacionen legalmente junto a tu casa y nunca bloqueen una entrada. Planea estar en casa y estacionado antes de las <b>8:00 PM</b>.'},
{id:'reentry',k:['re entry','reentry','leave early','leave during','come back','drive out','drive home','can i leave','salir','regresar','reingreso','volver a entrar','irme temprano'],
en:'There’s <b>no vehicle re-entry during the show window</b> (roughly 9:00–10:00 PM). For crowd safety, vehicles stay in place until about 30 minutes after the fireworks end, so settle in and enjoy the show.',
es:'<b>No hay reingreso de vehículos durante el espectáculo</b> (aproximadamente de 9:00 a 10:00 PM). Por seguridad, los vehículos permanecen en su lugar hasta unos 30 minutos después de los fuegos artificiales. ¡Acomódate y disfruta!'},
{id:'bring',k:['bring','what to bring','blanket','blankets','chair','chairs','pack','wear','cooler','traer','que traer','cobija','cobijas','silla','sillas','llevar','hielera'],
en:'Bring blankets, lawn chairs, and the whole family! Pack plenty of water, sun protection for the afternoon, and a light layer, because high-desert evenings cool off after sunset.',
es:'¡Trae cobijas, sillas y a toda la familia! Lleva suficiente agua, protección solar para la tarde y una chamarra ligera, porque las noches del desierto alto refrescan después del atardecer.'},
{id:'pets',k:['pet','pets','dog','dogs','cat','noise','loud','animals','bring my dog','bring the dog','bring pets','bring my pet','dogs allowed','traer mi perro','traer mascotas','mascota','mascotas','perro','perros','gato','ruido','ruidoso'],
en:'Fireworks at this scale can be heard a mile or two away. Keep pets indoors and comfortable at home, and prepare little ones and anyone sensitive to noise ahead of time.',
es:'Los fuegos artificiales de este tamaño se escuchan a una o dos millas. Mantén a tus mascotas adentro y cómodas en casa, y prepara con tiempo a los niños y a quien sea sensible al ruido.'},
{id:'weather',k:['weather','rain','rains','raining','wind','windy','cancel','cancelled','canceled','postponed','forecast','storm','clima','lluvia','viento','llueve','lluvia','cancelado','cancelan','pospuesto','tormenta','tiempo'],
en:'The show runs only within the wind, cloud-ceiling, and visibility limits approved by the Santa Fe Fire Marshal. If conditions aren’t safe, fireworks may be postponed or cancelled; watch the City’s social media and '+LINK('https://santafenm.gov','santafenm.gov')+'. In 2026, forecast winds moved the fireworks a few minutes early to keep everyone safe.',
es:'El espectáculo se realiza solo dentro de los límites de viento, nubosidad y visibilidad aprobados por el Jefe de Bomberos de Santa Fe. Si las condiciones no son seguras, los fuegos pueden posponerse o cancelarse; revisa las redes sociales de la Ciudad y '+LINK('https://santafenm.gov','santafenm.gov')+'. En 2026, el pronóstico de viento adelantó unos minutos los fuegos para mantener a todos seguros.'},
{id:'safety',k:['safe','safety','security','police','fire department','emergency','911','dangerous','seguro','segura','seguridad','policia','bomberos','emergencia','peligroso'],
en:'Yes, it’s safe. Licensed pyrotechnicians run the show inside a controlled, permitted perimeter, and Santa Fe Police and Fire are on site all evening. The park has strong cell service for reliable 911 access, and 2026 had no fire-related incidents. For emergencies, always call <b>911</b>.',
es:'Sí, es seguro. Pirotécnicos con licencia operan el espectáculo dentro de un perímetro controlado y con permisos, y la Policía y los Bomberos de Santa Fe están presentes toda la noche. El parque tiene buena señal celular para llamar al 911, y en 2026 no hubo incidentes de incendio. En una emergencia, siempre llama al <b>911</b>.'},
{id:'ada',k:['accessible','accessibility','ada','wheelchair','disability','disabled','handicap','mobility','accesible','accesibilidad','silla de ruedas','discapacidad','movilidad'],
en:'We want everyone to enjoy the show. For accessible parking and accommodation questions, call our help line at '+TEL+' before the event so we can help plan your visit.',
es:'Queremos que todos disfruten el espectáculo. Para preguntas sobre estacionamiento accesible y adaptaciones, llama a nuestra línea de ayuda al '+TEL+' antes del evento y te ayudamos a planear tu visita.'},
{id:'amenities',k:['restroom','restrooms','bathroom','bathrooms','toilet','playground','shade','shelter','banos','bano','sanitarios','juegos infantiles','sombra'],
en:'The park has restrooms, picnic shelters, a playground, and sports courts, plus about six acres of open grass for viewing.',
es:'El parque tiene baños, áreas de picnic techadas, juegos infantiles y canchas, además de unos seis acres de pasto abierto para ver el espectáculo.'},
{id:'whymove',k:['why moved','why did it move','mall','santa fe place','why franklin','why this park','new location','change location','moved','centro comercial','por que se cambio','nueva ubicacion','por que ese parque'],
en:'The old launch site at Santa Fe Place Mall is no longer safe for fireworks because of new construction nearby. The City and Kiwanis examined 13 locations, weighing safety, emergency access, cell service, parking, and FAA flight restrictions, and Mayor Michael Garcia chose Franklin E. Miles Park.',
es:'El antiguo sitio en el centro comercial Santa Fe Place ya no es seguro para fuegos artificiales por la nueva construcción cercana. La Ciudad y Kiwanis evaluaron 13 lugares, considerando seguridad, acceso de emergencia, señal celular, estacionamiento y restricciones de vuelo de la FAA, y el alcalde Michael Garcia eligió el Parque Franklin E. Miles.'},
{id:'who',k:['who organizes','who puts on','who runs','who hosts','organizer','kiwanis','city of santa fe','quien organiza','organizador','quien lo hace'],
en:'The celebration is presented by the <b>Kiwanis Club of Santa Fe</b>, the same volunteers who bring you the Burning of Zozobra, in partnership with the City of Santa Fe, Santa Fe Public Schools, and public safety agencies.',
es:'La celebración la presenta el <b>Club Kiwanis de Santa Fe</b>, los mismos voluntarios que organizan la Quema de Zozobra, en colaboración con la Ciudad de Santa Fe, las Escuelas Públicas de Santa Fe y las agencias de seguridad pública.'},
{id:'recap',k:['last year','2026','how many people','attendance','crowd','how big','how many attended','el ano pasado','cuanta gente','asistencia','cuantas personas'],
en:'2026 was one for the history books: <b>38,641 people</b> celebrated America’s 250th with us, Santa Fe saw its first-ever drone show (400 drones), the fireworks lit the sky for about 34 minutes, and post-event traffic cleared in about an hour. It was the Capital City’s official NM Spirit celebration of America’s 250th, with opening ceremonies by the Daughters of the American Revolution and American Legion Post 12.',
es:'2026 fue histórico: <b>38,641 personas</b> celebraron con nosotros los 250 años de Estados Unidos, Santa Fe vio su primer espectáculo de drones (400 drones), los fuegos artificiales duraron unos 34 minutos y el tráfico se despejó en aproximadamente una hora. Fue la celebración oficial NM Spirit de la Ciudad Capital por los 250 años del país, con ceremonias de apertura de las Daughters of the American Revolution y la American Legion Post 12.'},
{id:'birthday',k:['251','250','251st','250th','semiquincentennial','america 250','birthday','anniversary','nm spirit','aniversario','cumpleanos'],
en:'July 4, 2027 marks <b>America’s 251st birthday</b>! In 2026, Santa Fe’s celebration was named the official New Mexico Spirit (NM Spirit) celebration of America’s 250th, the Semiquincentennial.',
es:'¡El 4 de julio de 2027 celebramos el <b>cumpleaños 251 de Estados Unidos</b>! En 2026, la celebración de Santa Fe fue nombrada la celebración oficial New Mexico Spirit (NM Spirit) por los 250 años del país.'},
{id:'parkname',k:['named after','who was franklin','why is it called','name of the park','park named','general miles','nombre del parque','quien fue franklin','por que se llama'],
en:'The park honors <b>Major General Franklin E. Miles</b>, a decorated World War II veteran, former Adjutant General of the New Mexico National Guard, and longtime Santa Fe community leader.',
es:'El parque honra al <b>Mayor General Franklin E. Miles</b>, veterano condecorado de la Segunda Guerra Mundial, ex Ayudante General de la Guardia Nacional de Nuevo México y líder comunitario de Santa Fe por muchos años.'},
{id:'merch',k:['merch','merchandise','shirt','shirts','t shirt','souvenir','souvenirs','zozobra gear','store','shop','mercancia','camiseta','camisetas','recuerdos','tienda'],
en:'Official Zozobra merchandise is available at the park, a great chance to get a jump on the season before Old Man Gloom burns in September. You can also shop online at the '+LINK('https://www.ticketsignup.io/TicketEvent/Zozobra/Store','Zozobra store')+'.',
es:'Habrá mercancía oficial de Zozobra en el parque, una gran oportunidad para prepararte antes de que arda el Viejo Gloom en septiembre. También puedes comprar en línea en la '+LINK('https://www.ticketsignup.io/TicketEvent/Zozobra/Store','tienda de Zozobra')+'.'},
{id:'zozobra',k:['zozobra','old man gloom','burning','gloom','quema','viejo gloom'],

var FALL={en:'Good question! I don’t have that answer yet. Call our help line at '+TEL+' (855-ZOZOBRA) or email '+LINK('mailto:BurnHim@BurnZozobra.com','BurnHim@BurnZozobra.com')+', and a Kiwanis volunteer will help you.',

var UI={en:{sub:'Santa Fe Fourth of July · Sunday, July 4, 2027 · Franklin E. Miles Park',ph:'Ask about parking, shuttles, road closures…',send:'Ask',foot:'Help line <a href="tel:8559696272">(855) 969-6272</a> · Emergencies call 911',who:'Uncle Sam'},

var lang='en';
function norm(s){return (' '+s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()+' ');}
KB.forEach(function(e){e.nk=e.k.map(function(p){return norm(p).trim();});});
function lev(a,b){if(Math.abs(a.length-b.length)>1)return 9;var d=[],i,j;for(i=0;i<=a.length;i++){d[i]=[i];}for(j=0;j<=b.length;j++)d[0][j]=j;for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));if(i>1&&j>1&&a[i-1]==b[j-2]&&a[i-2]==b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);}return d[a.length][b.length];}
function score(t,e){var s=0,toks=t.trim().split(' ');e.nk.forEach(function(p){if(!p)return;if(p.indexOf(' ')>-1){if(t.indexOf(' '+p+' ')>-1)s+=3;}else if(t.indexOf(' '+p+' ')>-1){s+=2;}else if(p.length>=5){for(var i=0;i<toks.length;i++){if(toks[i].length>=4&&lev(toks[i],p)<=1){s+=(p.length>=6?2:1);break;}}}});return s;}
var ESW=['me','se','quiero','tengo','llego','donde','cuando','como','que','cuanto','cuesta','hay','puedo','estacionamiento','calles','gracias','hola','fuegos','vecinos','vecino','pase','perro','la','los','las','es','esta','el','para','mi','hora','traer','gratis','cierres'];
var ENW=['where','when','what','how','is','the','can','parking','do','does','i','my','time','free','are','will','there'];
function detect(t){var w=t.trim().split(' '),es=0,en=0;w.forEach(function(x){if(ESW.indexOf(x)>-1)es++;if(ENW.indexOf(x)>-1)en++;});if(es>=2&&es>en)return 'es';if(en>=2&&en>es)return 'en';return lang;}
function add(html,cls){var d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;var log=document.getElementById('log');log.appendChild(d);log.scrollTop=log.scrollHeight;}
function bot(html){add('<span class="who">'+UI[lang].who+'</span>'+html,'bot');}
function byId(id){for(var i=0;i<KB.length;i++)if(KB[i].id==id)return KB[i];}
function answer(q){var t=norm(q),L=detect(t);if(L!=lang)setLang(L,true);var r=KB.map(function(e){return [score(t,e),e];}).sort(function(a,b){return b[0]-a[0];});
if(r[0][0]<2){bot(FALL[lang]);return;}var out=r[0][1][lang];
if(r[1][0]>=3&&r[1][0]>=r[0][0]*0.6&&r[0][1].id!='hello'&&r[1][1].id!='hello')out+='<br><br>'+r[1][1][lang];bot(out);}
function renderChips(){var c=document.getElementById('chips');c.innerHTML='';CHIPS[lang].forEach(function(ch){var b=document.createElement('button');b.type='button';b.textContent=ch[0];b.onclick=function(){add(ch[0],'user');bot(ch[1].map(function(id){return byId(id)[lang];}).join('<br><br>'));};c.appendChild(b);});}
function setLang(L,quiet){lang=L;document.documentElement.lang=L;document.getElementById('bEn').setAttribute('aria-pressed',L=='en');document.getElementById('bEs').setAttribute('aria-pressed',L=='es');
document.getElementById('t3').textContent=UI[L].sub;document.getElementById('q').placeholder=UI[L].ph;document.getElementById('send').textContent=UI[L].send;document.getElementById('foot').innerHTML=UI[L].foot;renderChips();if(!quiet)bot(byId('hello')[L]);}
document.getElementById('bEn').onclick=function(){if(lang!='en')setLang('en');};
document.getElementById('bEs').onclick=function(){if(lang!='es')setLang('es');};
document.getElementById('f').onsubmit=function(ev){ev.preventDefault();var q=document.getElementById('q'),v=q.value.trim();if(!v)return;add(v.replace(/</g,'&lt;'),'user');q.value='';answer(v);};
(function(){var p=new URLSearchParams(location.search);var L=p.get('lang')=='es'?'es':'en';setLang(L,true);bot(byId('hello')[L]);var tp=p.get('topic');if(tp&&byId(tp))bot(byId(tp)[L]);})();
</script>
