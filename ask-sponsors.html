<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the Sponsor Desk · Kiwanis Club of Santa Fe</title>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Bitter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF6EC;--ink:#1E1A16;--red:#E8192B;--deep:#9E1420;--brown:#4A2412;--line:#E2D6C2;--orange:#E87722;--gold:#E8A828;}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:'Bitter',Georgia,serif;color:var(--ink);background:#FFFFFF;display:flex;flex-direction:column;}
#bg{position:fixed;inset:0;background:#FFFFFF url('https://burnhim.github.io/zozobra-bots/img/sponsor-bg.jpg') center 56% / min(84vw,430px) no-repeat;opacity:.22;pointer-events:none;}
#bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 0;position:relative;z-index:2;flex:0 0 auto;}
#bar .t{display:flex;align-items:center;gap:10px;}
#bar .t img{width:50px;height:50px;object-fit:contain;}
#bar h1{font-family:'Rye',Georgia,serif;font-weight:400;font-size:24px;margin:0;color:var(--brown);}
#bar .r{display:flex;align-items:center;gap:10px;}
#bar button{background:var(--red);color:#fff;-webkit-text-fill-color:#fff;border:0;border-radius:18px;padding:8px 16px;font-weight:700;font-size:19px;cursor:pointer;font-family:inherit;}
#bar button:hover{background:var(--deep);}
#chat{flex:1 1 auto;overflow-y:auto;padding:16px;position:relative;z-index:1;}
.msg{max-width:90%;padding:13px 16px;border-radius:16px;margin-bottom:12px;line-height:1.5;font-size:19px;white-space:pre-line;}
.bot{background:#fff;border:2px solid var(--line);border-top-left-radius:4px;color:var(--ink);}
.me{background:var(--red);color:#fff;margin-left:auto;border-top-right-radius:4px;}
#chips{padding:2px 16px 10px;display:flex;flex-wrap:nowrap;gap:8px;position:relative;z-index:1;flex:0 0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch;}
#chips button{flex:0 0 auto;white-space:nowrap;background:#fff;border:2px solid var(--red);color:var(--deep);border-radius:22px;padding:7px 14px;font-size:19px;font-weight:700;cursor:pointer;font-family:inherit;}
#chips button:hover{background:var(--red);color:#fff;}
form{display:flex;gap:8px;padding:12px 16px;background:var(--brown);flex:0 0 auto;position:relative;z-index:1;}
input{flex:1;min-width:0;border:0;border-radius:24px;padding:12px 16px;font-size:19px;font-family:inherit;color:var(--ink);background:#fff;}
form button{background:var(--orange);color:#fff;border:0;border-radius:24px;padding:12px 20px;font-weight:700;cursor:pointer;font-size:19px;font-family:inherit;}
form button:hover{background:var(--red);}
footer{background:var(--brown);color:#fff;-webkit-text-fill-color:#fff;text-align:center;font-size:19px;padding:0 16px 12px;position:relative;z-index:1;flex:0 0 auto;}
footer a{color:#FFD7A8;-webkit-text-fill-color:#FFD7A8;}
.bot a{color:var(--deep);-webkit-text-fill-color:var(--deep);font-weight:700;text-decoration:underline;word-break:break-word;}
</style>
</head>

var EN = {
  hdr:"Ask the Sponsor Desk", lang:"Español", ph:"Ask about sponsoring…", send:"Send",
  foot:'Kiwanis Club of Santa Fe Sponsor Desk · <b>v2</b> · <a href="mailto:burnhim@burnzozobra.com">burnhim@burnzozobra.com</a>',
  hello:"Howdy, partner! I answer questions about sponsoring the 103rd Burning of Zozobra on Friday, September 3, 2027, plus Zozobra the Balloon, Día de los Muertos, New Year's Eve on the Plaza and the Fourth of July: levels, benefits, who you'll reach, in-kind gifts, custom packages, payment and tax letters.\n\nTap a button below or type your question.\n\nPuedes preguntarme en español también: toca el botón de arriba.",
  chips:["Why sponsor?","Zozobra levels","What every sponsor gets","Who will I reach?","Custom package","In-kind","Small budget","Other events","How do I apply?","Paying","Tax letter","Talk to Ray"],
  fallback:"I'm not sure about that one. Try asking about sponsorship levels, benefits, who you'll reach, tickets for your team, stage time, the wristbands, in-kind gifts, custom packages, paying, tax letters, or the Balloon, Día de los Muertos, New Year's Eve and Fourth of July. For anything else, Ray, our Event Chairman, is glad to talk it through: " + EMAIL + " or " + PHONE + ".",
  kb:[
   {k:["why sponsor","why should","why do you need","need sponsors","why","what does my money do","what does it pay for","make a difference","free for kids","keep zozobra free"],
    a:"Because sponsors keep Zozobra open to every family.\n\n• Kids 10 and under get into General Admission free, and we intend to keep it that way.\n• General admission stays at $30, with no processing or credit card fees.\n• We give significant numbers of free tickets to disadvantaged New Mexico families who couldn't otherwise be there.\n• Free shuttles, a free ADA shuttle and a free Bike Valet get people there, and ZozoFest is free for four days the week before the burn.\n\nLike every business, our costs keep rising with inflation. We won't charge for children and we won't raise the ticket price, so sponsorships and premium seating make up the difference. Once all of Zozobra's bills are paid, net proceeds go to the Santa Fe Downtown Kiwanis Foundation for grants to nonprofits serving the region's children. Your gift works twice.\n\nMore on our " + WHY + "."},
   {k:["level","levels","tier","tiers","packages","package list","price list","prices","how much","cost","options","menu","deck"],
    a:"2027 Zozobra sponsorship levels:\n\n• Flare-Up · $500 to $1,000\n• Tio Coco · $1,000\n• Gloomies · $2,500\n• Torchbearer · $5,000\n• Beach Ball · $10,000\n• Fire Spirit · $12,000\n• ZozoFest · $15,000\n• Tickets · $25,000\n• Wristband · $50,000\n• You Name It · $60,000 and up\n\nYou can also build a custom package or give in kind. Ask me about any level by name, or open the " + DECK + "."},
   {k:["flare-up","flare up","flareup","stage time","on stage","main stage","skit","song","giveaway","my message","five minutes","5 minutes"],
    a:"Flare-Up · $500 to $1,000: five minutes on the main stage between 6 and 7 p.m. on burn night, for your message, a skit, a song or a giveaway. You supply the content and any gifts.\n\nThat 6 to 7 p.m. window is when the field is filling up, so stage time is some of the most valuable recognition we offer."},
   {k:["tio coco","tío coco","coco","project eliminate"],
    a:"Tio Coco · $1,000:\n\n• 4 General Admission tickets\n• Named as donating to Kiwanis Project Eliminate\n• Your logo on the website, the ZozoFest Digital Splash Wall and at the burn\n• A banner at ZozoFest and the burn\n• 2 each of T-shirts, posters and children's posters"},
   {k:["gloomies","gloomie","gloom queen","east of the beast","staircase photo"],
    a:"Gloomies · $2,500:\n\n• 2 East of the Beast Premium tickets\n• A keepsake photo with the Gloom Queen on the Zozobra staircase\n• Logo and banner recognition\n• 2 each of T-shirts, posters and children's posters"},
   {k:["torchbearer","torchbearers","fire pit","patch","patches"],
    a:"Torchbearer · $5,000:\n\n• 4 Fire Pit Premium tickets\n• Prominent banner placement\n• 2 Torchbearer patches\n• Logo recognition\n• 2 each of T-shirts, posters and children's posters"},
   {k:["beach ball","beach balls","beachball"],
    a:"Beach Ball · $10,000:\n\n• 4 Front and Center Premium tickets\n• Your logo on 2,000 keepsake beach balls bouncing through the crowd\n• A named grant to a Santa Fe youth nonprofit, with a check presentation\n• Primacy logo placement\n• 20 beach balls for you"},
   {k:["fire spirit level","fire spirit sponsor","fire spirit","front and center"],
    a:"Fire Spirit · $12,000:\n\n• 4 Front and Center Premium tickets\n• A named grant with a check presentation\n• A keepsake photo with the Fire Spirit on the Zozobra staircase\n• Primacy logo placement, including the grant press releases"},
   {k:["zozofest sponsor","zozofest level","zozofest","art exhibit","art show"],
    a:"ZozoFest · $15,000:\n\n• Named sponsor of ZozoFest and the Zozobra Art Exhibit, four free days the week before the burn (46,331 visits in 2026)\n• 2 Ultimate Zozobra Experience tickets\n• A :30 spot on 3 jumbotron screens\n• Coverage on KOAT\n• A named grant"},
   {k:["tickets sponsor","ticket sponsor","tickets level","logo on tickets","logo on the tickets","on every ticket"],
    a:"Tickets · $25,000:\n\n• Your logo on the tickets for 50,000 attendees and every online ticket\n• A live thank-you from the pageant stage\n• 2 Ultimate Zozobra Experience tickets\n• A :30 jumbotron spot\n• Coverage on KOAT\n• A named grant"},
   {k:["wristband","wristbands","light-up","light up","qr code","qr","coupon code","led"],
    a:"Wristband · $50,000: your logo and a QR code on 45,000 light-up wristbands that change color with the show.\n\n• The QR code opens your promotion, or a site with your coupon code built in.\n• Fans can bring the wristband to your locations for a discount or special offer, so the night keeps working for you long after the fire is out. A bank, for example, might offer a bonus for opening an account.\n• Plus a live stage thank-you, 2 Ultimate Zozobra Experience tickets, a :30 jumbotron spot, coverage on KOAT and a named grant."},
   {k:["you name it","name it","top level","biggest","largest","presenting","title sponsor","60,000","lead sponsor"],
    a:"You Name It · $60,000 and up: a Zozobra experience built around you, plus lead sponsor billing on the Foundation's grant RFP and funding press releases.\n\nTell us your goals and Ray will build it with you: " + EMAIL + " or " + PHONE + "."},
   {k:["benefit","benefits","what do i get","what do sponsors get","every sponsor","all sponsors","recognition","logo","thank you from the stage","perks"],
    a:"Every Zozobra sponsor receives:\n\n• A tax-deductible donation letter\n• Your logo on burnzozobra.com\n• A public thank-you from the stage\n\nHigher levels add premium viewing tickets, banners at ZozoFest and the burn, jumbotron spots, coverage on KOAT, keepsake photos and named grants. Ask me about any level, or open the " + DECK + "."},
   {k:["reach","audience","attendance","how many people","crowd","exposure","impressions","viewers","koat","tv","broadcast","livestream","facebook","social media","email list","marketing"],
    a:"Who you'll reach:\n\n• 50,000 people on the field at Fort Marcy Park, a crowd we fill again and again. Four out of five are Santa Fe County residents.\n• 1,265,932 total audience in 2026, in person, on KOAT-TV and livestreamed\n• 46,331 ZozoFest visits over four free days\n• 7.1 million Facebook reach in 2026, 76% of it beyond our followers\n• More than 100,000 email subscribers, plus 1.8 million website sessions in 2026\n\nIn 2026 the Burning was designated an official NM Spirit event for the nation's 250th anniversary by the New Mexico Department of Cultural Affairs."},
   {k:["custom","build my own","build your own","my own package","idea","ideas","unique","special","something different","creative","activation","sampling","booth for my brand","photo booth","saloon","wanted poster"],
    a:"Custom packages are our favorite. Tell us your budget and goals and we'll build it with you. A few ideas:\n\n• A reserved block for a high school, college, family or company reunion\n• A private VIP section or hospitality tent for your clients\n• Your name on a premium section for the night, or on a ZozoFest night\n• A Zozobra the Kid saloon or wanted-poster photo booth\n• Product sampling or a brand activation at ZozoFest\n• Your team volunteering together on the build crew or the balloon crew\n• The radio-controlled Zozobra balloon at your company event\n• Tickets donated in your name to a school or nonprofit\n\nThe best packages give your guests something they can't buy a ticket for. Choose \"Create my own custom package\" on the " + APPLY + ", or talk to Ray: " + EMAIL + "."},
   {k:["in-kind","in kind","inkind","products","services","donate goods","trade","barter","printing","signage","catering","equipment"],
    a:"In-kind support helps just as much as a check. Printing, signage, catering, equipment and other products or services that lower our costs leave more net proceeds for kids once Zozobra's bills are paid.\n\nChoose \"In-kind\" on the " + APPLY + " and tell us what you could provide. You can add an estimated value; valuing an in-kind gift is the donor's responsibility, and we'll acknowledge what you give."},
   {k:["small","small business","small budget","little","not much","limited budget","too small","minimum","smallest","cheapest","under 500","less than","any amount"],
    a:"No amount is too big or too small. Everything helps.\n\nLevels start with the $500 Flare-Up, and if nothing in the deck fits your budget, tell us what does and we'll work out a sponsorship with you. In-kind gifts count too.\n\nGiving as an individual instead of a business? You can donate at [burnzozobra.com/donate](https://burnzozobra.com/donate/)."},
   {k:["multiple events","more than one","several events","bundle","multi-event","multi event","discount","all events","combine"],
    a:"Sponsoring more than one event earns a multi-event discount. Pick \"More than one event\" on the " + APPLY + " and check the events you want, or ask Ray to put a bundle together: " + EMAIL + "."},
   {k:["other events","balloon","dia","día","muertos","day of the dead","new year","nye","fourth of july","july 4","4th of july","fireworks","events"],
    a:"The Kiwanis Club of Santa Fe produces five celebrations you can sponsor:\n\n• The Burning of Zozobra: about 50,000 people in person. " + DECK + "\n• Zozobra the Balloon: flew 5 times at the 2025 Balloon Fiesta, which drew 851,994 guest visits. Ask me about \"Balloon levels.\"\n• Día de los Muertos on the Santa Fe Plaza: 46,891 people over two nights in 2025. Ask me about \"Día levels.\"\n• New Year's Eve on the Santa Fe Plaza: 13,980 people in 2025. Ask me about \"New Year's Eve levels.\"\n• The Fourth of July at Franklin E. Miles Park: 45,890 people in 2026. Ask me about \"Fourth of July partners.\""},
   {k:["balloon level","balloon levels","balloon sponsor","hot air balloon","flight sponsor","glow","inflation","rc balloon","radio-controlled","fiesta"],
    a:"Zozobra the Balloon sponsorship levels:\n\n• Flight · $20,000: your banner on the balloon basket, your logo on the balloon trailer, TV and radio interview opportunities, named sponsor at the rally of your choice, and 4 VIP Premium Viewing tickets to the 103rd Burning\n• Glow · $15,000: your banner on the basket during glows, named sponsor at the rally of your choice, and 2 VIP Premium Viewing tickets\n• Inflation · $10,000: named sponsor at the rally of your choice and 4 Premium Viewing bleacher seats\n• RC Balloon · $5,000: named sponsor at an RC balloon rally and 2 Premium Viewing bleacher seats\n\nEvery Balloon sponsor's banner also hangs at the Burning of Zozobra, and every sponsor gets marketing and social media features, an invitation to crew at balloon events, and official balloon merchandise. " + BDECK + "."},
   {k:["dia level","día level","dia levels","día levels","dia sponsor","día sponsor","ofrenda","angel","santo","maestro","corazon","corazón","amigo","ayudante","recuerdos","alegria","alegría"],
    a:"Día de los Muertos sponsorship levels:\n\n• Angel · $15,000\n• Santo · $10,000\n• Maestro · $5,000\n• Corazón · $2,500\n• Amigo · $1,500\n• Ayudante · $1,000\n• Recuerdos · $750\n• Alegría · $600\n• Ofrenda sponsor · $500: your name on one of the community altars on the Plaza\n\nEvery Día sponsor receives a public thank-you from the stage, a logo on the event website, banner and booth or ofrenda signage, and social media mentions. All gifts are tax-deductible. " + DDECK + "."},
   {k:["new year's eve level","new years eve level","nye level","nye levels","nye sponsor","new year's eve sponsor","new years eve sponsor","new years eve sponsorship","new year's eve sponsorship","zia rising","bonfire","bizcochito","farolito","midnight"],
    a:"New Year's Eve on the Santa Fe Plaza is the City of Santa Fe's free celebration, produced by the Kiwanis Club of Santa Fe: live music on the Bandstand, piñon bonfires, hot chocolate and bizcochitos, and the Zia rising at midnight.\n\n• Zia Rising · $5,000\n• Bonfire · $2,500\n• Bizcochito · $1,000\n• Farolito · $500\n\nOr build your own, like the midnight countdown from the Dignitary Stage, and we'll put together recognition that fits."},
   {k:["fourth of july partner","july 4 partner","4th of july partner","fourth of july sponsor","july sponsor","presenting partner","media partner","trade partner","drone"],
    a:"Santa Fe's Fourth of July is funded by the City of Santa Fe and hosted by the Kiwanis Club of Santa Fe. We welcome presenting partners and media or trade partners, and we'll build the package with you. Choose the Fourth of July on the " + APPLY + ", or write to " + EMAIL + "."},
   {k:["apply","application","sign up","how do i","how to","get started","start","become a sponsor","join","form"],
    a:"Apply in four short steps on the " + APPLY + ":\n\n1. Pick your event, or more than one.\n2. Choose a level, or build your own package. In-kind counts too.\n3. Tell us about your business and how you'd like to be recognized.\n4. Choose how you'd like to pay.\n\nApplying isn't a contract or a payment. Ray will follow up personally to confirm your benefits, then send an agreement or invoice.\n\nThe deadline to commit is Tuesday, December 15, 2026."},
   {k:["deadline","when do i","by when","due","commit","timeline","how soon","last day","too late"],
    a:"The deadline to commit is Tuesday, December 15, 2026. That locks in your logo and benefits as we roll out materials for the 103rd.\n\nThe " + APPLY + " takes about ten minutes, and Ray will follow up personally to confirm your benefits. Don't wait: start today."},
   {k:["pay","payment","paying","credit card","card","invoice","check","cheque","mail a check","stripe","installments","pay later"],
    a:"On the " + APPLY + " you can choose to:\n\n• Pay now by credit card. Your card is charged the estimated total shown on the form, processed securely by Stripe.\n• Ask for an invoice.\n• Mail a check.\n• Ask Ray to call you first to talk it through.\n\nChecks go to Kiwanis Club of Santa Fe / Zozobra Service Account, P.O. Box 622, Santa Fe, NM 87504."},
   {k:["tax","deductible","tax-deductible","write off","writeoff","receipt","donation letter","501","501c3","nonprofit status","ein","w-9","w9"],
    a:"Every sponsor can receive a tax-deductible donation letter; just say yes on the application. Gifts go through the Kiwanis Club of Santa Fe as fiscal agent for the Preservation of the Burning of Zozobra, a 501(c)(3).\n\nYour tax advisor can tell you how it applies to your business. Need a W-9? Email " + EMAIL + "."},
   {k:["grant","named grant","which nonprofit","choose the charity","choose the grantee","pick the charity","pick the nonprofit","charity","which charity","grantee","where does the money go","foundation","kids charity","net proceeds","proceeds"],
    a:"Once all of Zozobra's bills are paid, net proceeds go to the Santa Fe Downtown Kiwanis Foundation, which grants them to nonprofits serving the region's children.\n\nSponsorships that include a named grant carry your company's name on a grant, with a check presentation, but the Foundation chooses the grantee; sponsors don't select it."},
   {k:["tickets for","employees","clients","staff","premium viewing","premium seats","vip","hospitality","seats","bleachers","ultimate zozobra experience","uze"],
    a:"Many levels include tickets you can share with employees and clients: General Admission at Tio Coco, premium viewing from Gloomies up, and Ultimate Zozobra Experience tickets at ZozoFest, Tickets and Wristband. A private VIP section or hospitality tent can be built as a custom package.\n\nPublic tickets for the 103rd go on sale Tuesday, April 13, 2027."},
   {k:["hotel","hotels","lodging","restaurant","restaurants","bar","coupon for tickets","partner with","package for guests"],
    a:"Hotels and restaurants make great partners.\n\n• Hotels can offer guest packages that pair a stay with premium seating at the burn.\n• Restaurants can offer guests a discount or coupon on Zozobra tickets, or the reverse.\n\nRay sets these up personally: " + EMAIL + " or " + PHONE + "."},
   {k:["volunteer","team day","our team","employees volunteer","build crew","service day"],
    a:"A volunteer day for your team is a great add-on. Your crew can work alongside ours, on the build crew or the balloon crew, and it can be part of a custom package. Mention it in \"Tell us your idea\" on the " + APPLY + "."},
   {k:["logo file","send logo","upload logo","logo format","vector","high resolution","artwork for banner"],
    a:"You can upload your logo on the application: PNG, JPG, SVG, EPS, AI or PDF, up to 25 MB. A high-resolution or vector file looks best on banners and screens. You can also send it later to " + EMAIL + "."},
   {k:["sponsored before","renew","renewal","last year","returning","again"],
    a:"Welcome back, and thank you! Use the same " + APPLY + " and choose \"Yes\" for having sponsored before. Ray will follow up to confirm your benefits for the 103rd."},
   {k:["vendor","vend","sell food","food truck","booth","sell at"],
    a:"Looking to sell food or goods instead? That's our vendor program. Apply at [burnzozobra.com/vendors](https://burnzozobra.com/vendors/) or email vendors@burnzozobra.com."},
   {k:["donate","donation","individual","personal gift","give money"],
    a:"Giving as an individual? Thank you! You can donate at [burnzozobra.com/donate](https://burnzozobra.com/donate/), or mail a check to Kiwanis Club of Santa Fe / Zozobra Service Account, P.O. Box 622, Santa Fe, NM 87504."},
   {k:["contact","talk","call","phone","email","ray","chairman","person","human","someone","question"],
    a:"Ray, our Event Chairman, follows up with every sponsor personally.\n\n• Email " + EMAIL + "\n• Call " + PHONE + "\n\nOr send your application and choose \"Call me first to talk it through.\""},
   {k:["date","when is","where is","burn day","fort marcy","103rd","theme","zozobra the kid"],
    a:"The 103rd Burning of Zozobra is Friday, September 3, 2027, at Fort Marcy Park in Santa Fe. This year's theme is \"Zozobra the Kid,\" and ZozoFest runs the week before.\n\nWant your business in the story? Ask me about \"custom packages.\""},
   {k:["hello","hi","hey","howdy","hola"],
    a:"Howdy! Ask me anything about sponsoring, or tap a button below to get started."},
   {k:["thank","thanks","gracias"],
    a:"Thank you for riding with us! When you're ready, the " + APPLY + " takes about ten minutes."}
  ]

var L = (location.search.indexOf('lang=es') > -1) ? ES : EN;
var chat = document.getElementById('chat');

function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’]/g,"'");}

function answer(text){
  var q = ' ' + norm(text) + ' ', best = null, score = 0;
  for (var i=0;i<L.kb.length;i++){
    var s = 0;
    for (var j=0;j<L.kb[i].k.length;j++){
      var key = norm(L.kb[i].k[j]);
      var hit = key.length <= 3 ? new RegExp('[^a-z0-9]' + key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '[^a-z0-9]').test(q) : q.indexOf(key) > -1;
      if (hit) s += key.length;
    }
    if (s > score){ score = s; best = L.kb[i]; }
  }
  return best ? best.a : L.fallback;
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rich(s){
  var h = esc(s);
  h = h.replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,})/g, '<a href="mailto:$1">$1</a>');
  return h;
}

function add(text, who){
  var d = document.createElement('div');
  d.className = 'msg ' + who;
  if (who === 'bot') d.innerHTML = rich(text); else d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function chips(){
  var box = document.getElementById('chips');
  box.innerHTML = '';
  L.chips.forEach(function(c){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = c;
    b.onclick = function(){ ask(c); };
    box.appendChild(b);
  });
}

function ask(text){
  add(text,'me');
  setTimeout(function(){ add(answer(text),'bot'); }, 280);
}

function paint(){
  document.getElementById('hdr').textContent = L.hdr;
  document.getElementById('lang').textContent = L.lang;
  document.getElementById('q').placeholder = L.ph;
  document.getElementById('send').textContent = L.send;
  document.getElementById('foot').innerHTML = L.foot;
  document.documentElement.lang = (L === ES) ? 'es' : 'en';
  chat.innerHTML = '';
  add(L.hello,'bot');
  chips();
}

document.getElementById('lang').onclick = function(){
  L = (L === EN) ? ES : EN;
  paint();
};

document.getElementById('f').onsubmit = function(e){
  e.preventDefault();
  var v = document.getElementById('q').value.trim();
  if (!v) return;
  document.getElementById('q').value = '';
  ask(v);
};

paint();
</script>
