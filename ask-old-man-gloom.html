obra|6", "selfie con zozobra|5", "ver"], "related": ["zozofest", "raising", "stuffday"], "a": "<h3>Seeing him before the burn<\/h3><ul><li><b>At ZozoFest<\/b> the week before (Aug. 25 and 27–29, Santa Fe Place Mall, free): this is where you meet him up close, take photos, and stuff your glooms inside him.<\/li><li><b>On burn morning<\/b>, Friday, September 3: Zozobra leaves Santa Fe Place Mall at 6:00 a.m. under police escort, and at about <b>9:00 a.m. he rises onto his pole<\/b> at Fort Marcy. Everyone is welcome to watch, free.<\/li><li><b>At noon<\/b> the field closes to the public until gates open at 4:00 p.m. After that you need a ticket.<\/li><\/ul>", "a_es": "<h3>Verlo antes de la quema<\/h3><ul><li><b>En ZozoFest<\/b>, la semana anterior (25 y 27–29 de agosto, Santa Fe Place Mall, gratis): aquí es donde puede conocerlo de cerca, tomarse fotos y meter sus \"glooms\" (sus penas y preocupaciones) dentro de él.<\/li><li><b>La mañana de la quema<\/b>, viernes 3 de septiembre: Zozobra sale de Santa Fe Place Mall a las 6:00 a.m. con escolta policial, y alrededor de las <b>9:00 a.m. lo levantan sobre su poste<\/b> en Fort Marcy. Todos son bienvenidos a mirar, gratis.<\/li><li><b>Al mediodía<\/b> el campo se cierra al público hasta que las puertas abren a las 4:00 p.m. Después de eso se necesita boleto.<\/li><\/ul>"}, {"id": "neighborcar", "title": "Neighbors: cars, late arrivals and guests", "title_es": "Vecinos: autos, llegadas tarde e invitados", "terms": ["leave my house|12", "leave during|8", "drive out|10", "get my car out|12", "can i leave my neighborhood|12", "leave before the fireworks|12", "arriving home late|12", "coming home late|12", "luggage|10", "airport pickup|8", "short term rental|12", "airbnb guest|12", "vrbo|10", "renting a house|10", "medical appointment|12", "doctor appointment|10", "guest pass|12", "pass for my guests|12", "password|10", "carry food home|12", "groceries|8", "live inside the closure|12", "salir de mi casa|7", "sacar mi carro|7", "sacar mi auto|7", "salir en carro|6", "puedo salir de mi vecindario|7", "irme antes de los fuegos artificiales|6", "llegar tarde a casa|7", "equipaje|5", "maletas|4", "recoger en el aeropuerto|4", "renta a corto plazo|7", "huesped de airbnb|7", "vrbo|6", "rento una casa|5", "cita medica|7", "cita con el doctor|6", "pase para invitados|7", "contrasena|6", "llevar comida a casa|7", "vivo dentro del cierre|7"], "related": ["neighbors", "closures", "contact"], "a": "<h3>Living inside the closure on burn night<\/h3><ul><li><b>Can I drive out mid-evening?<\/b> No. Once the hard closure begins (5:30 p.m. on most streets) the roads are closed in <b>both directions<\/b>, and they reopen roughly 45–75 minutes after the show ends. If you must leave, walk out to a pickup point outside the closures. For an emergency, call 911; emergency vehicles have access throughout.<\/li><li><b>Getting home late, with luggage?<\/b> Park on <b>Gonzales Road<\/b>, which stays open, and walk in. Bags are searched at the roadblock, and you will need ID showing your address.<\/li><li><b>Can residents carry food home?<\/b> Yes. The no-food rule at the roadblocks applies to party guests, not to residents going home.<\/li><li><b>Passes for your guests:<\/b> each guest registers on the password-protected page at <a href=\"https://burnzozobra.com/fmn/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/fmn<\/a> and their pass is emailed to them. The password is on your neighbor postcard and in the neighbor emails. I cannot give it out here.<\/li><li><b>A medical appointment, a short-term rental guest, or anything unusual?<\/b> Write <a href=\"mailto:neighbors@burnzozobra.com\">neighbors@burnzozobra.com<\/a> <b>before burn day<\/b> so we can plan it with you.<\/li><\/ul>", "a_es": "<h3>Vivir dentro del cierre la noche de la quema<\/h3><ul><li><b>¿Puedo salir en auto a media tarde o noche?<\/b> No. Una vez que comienza el cierre total (5:30 p.m. en la mayoría de las calles), las calles quedan cerradas en <b>ambos sentidos<\/b>, y se reabren aproximadamente entre 45 y 75 minutos después de que termina el espectáculo. Si tiene que salir, camine hasta un punto de recogida fuera de los cierres. En caso de emergencia, llame al 911; los vehículos de emergencia tienen acceso en toda la zona.<\/li><li><b>¿Llega a casa tarde, con equipaje?<\/b> Estaciónese en <b>Gonzales Road<\/b>, que permanece abierta, y entre caminando. Las maletas y bolsas se revisan en el puesto de control, y necesitará una identificación que muestre su dirección.<\/li><li><b>¿Pueden los residentes llevar comida a su casa?<\/b> Sí. La regla de no pasar comida en los puestos de control se aplica a los invitados a fiestas, no a los residentes que van a su casa.<\/li><li><b>Pases para sus invitados:<\/b> cada invitado se registra en la página protegida con contraseña en <a href=\"https://burnzozobra.com/fmn/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/fmn<\/a> y su pase se le envía por correo electrónico. La contraseña está en su postal para vecinos y en los correos electrónicos para vecinos. Yo no puedo darla aquí.<\/li><li><b>¿Una cita médica, un huésped de renta a corto plazo o cualquier situación fuera de lo común?<\/b> Escriba a <a href=\"mailto:neighbors@burnzozobra.com\">neighbors@burnzozobra.com<\/a> <b>antes del día de la quema<\/b> para que podamos planearlo con usted.<\/li><\/ul>"}, {"id": "ashes", "title": "A loved one’s ashes", "title_es": "Las cenizas de un ser querido", "terms": ["ashes|14", "cremains|14", "cremated|12", "my husbands ashes|14", "my wifes ashes|14", "loved ones ashes|14", "memorial|8", "in memory|8", "passed away|8", "died|6", "scatter|8", "cenizas|8", "restos cremados|8", "cremado|7", "cremacion|6", "cenizas de mi esposo|8", "cenizas de mi esposa|8", "cenizas de un ser querido|8", "cenizas de mi mama|7", "cenizas de mi papa|7", "memorial|4", "en memoria|5", "fallecio|5", "murio|4", "esparcir|5", "difunto|4"], "related": ["burnitem", "inside", "contact"], "a": "<h3>Ashes of a loved one<\/h3><p>Over the years, families have entrusted the ashes of loved ones to Zozobra, and we treat that with care. It is arranged <b>personally and ahead of time<\/b>, never at the gate. Please email <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a> or call 855-ZOZOBRA (855-969-6272) well before event week so the Event Chairman’s team can speak with you directly.<\/p>", "a_es": "<h3>Cenizas de un ser querido<\/h3><p>A lo largo de los años, muchas familias han confiado a Zozobra las cenizas de sus seres queridos, y lo tratamos con cuidado y respeto. Se organiza <b>de manera personal y con anticipación<\/b>, nunca en la puerta. Por favor escriba a <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a> o llame al 855-ZOZOBRA (855-969-6272) con bastante anticipación a la semana del evento para que el equipo del Presidente del Evento pueda hablar con usted directamente.<\/p>"}, {"id": "trademark", "title": "Using Zozobra’s name or image", "title_es": "Uso del nombre o la imagen de Zozobra", "terms": ["trademark|14", "copyright|12", "use the image|12", "use zozobras image|14", "use the name|12", "use the logo|12", "logo|8", "license|10", "licensing|10", "permission|10", "commercial use|14", "sell zozobra|12", "make zozobra shirts|12", "my own merchandise|10", "in my ad|10", "in an ad|10", "library card|8", "fan art|8", "marca registrada|8", "derechos de autor|7", "copyright|6", "usar la imagen|7", "usar la imagen de zozobra|8", "usar el nombre|7", "usar el logo|7", "logo|4", "licencia|6", "permiso|5", "uso comercial|8", "vender zozobra|6", "hacer camisetas de zozobra|7", "mi propia mercancia|6", "en mi anuncio|6", "en un anuncio|5", "tarjeta de biblioteca|4", "fan art|4"], "related": ["contact", "sponsor", "merch"], "a": "<h3>Zozobra is a registered trademark<\/h3><p>Zozobra’s name and image belong to the <b>Kiwanis Club of Santa Fe<\/b>, and every use needs permission first, commercial or not. Send a proof of what you want to make to <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a> <b>before<\/b> you print or publish. Approved uses carry this credit line:<\/p><p><i>“Zozobra is a trademark of the Kiwanis Club of Santa Fe. Used with permission.”<\/i><\/p><p class=\"fine\">Unlicensed Zozobra merchandise takes money from the children’s charities the burn supports.<\/p>", "a_es": "<h3>Zozobra es una marca registrada<\/h3><p>El nombre y la imagen de Zozobra pertenecen al <b>Club Kiwanis de Santa Fe<\/b>, y todo uso necesita permiso previo, sea comercial o no. Envíe una prueba de lo que quiere hacer a <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a> <b>antes<\/b> de imprimir o publicar. Los usos aprobados llevan esta línea de crédito:<\/p><p><i>“Zozobra is a trademark of the Kiwanis Club of Santa Fe. Used with permission.”<\/i><\/p><p class=\"fine\">La mercancía de Zozobra sin licencia les quita dinero a las organizaciones benéficas para niños que la quema apoya.<\/p>"}, {"id": "grants", "title": "Applying for a Kiwanis grant", "title_es": "Cómo solicitar una subvención de Kiwanis", "terms": ["grant|12", "grants|12", "apply for a grant|14", "grant application|14", "funding|8", "fund my|8", "nonprofit funding|12", "apply for funding|12", "partnership|8", "partner with|6", "donation request|12", "request a donation|12", "subvencion|7", "subvenciones|7", "solicitar una subvencion|8", "solicitud de subvencion|8", "beca|5", "fondos|4", "financiamiento|5", "fondos para organizacion sin fines de lucro|7", "solicitar fondos|7", "apoyo economico|5", "alianza|4", "asociarse con|3", "solicitud de donacion|7", "pedir una donacion|7", "fundacion kiwanis|6"], "related": ["money", "contact"], "a": "<h3>Kiwanis grants<\/h3><p>Net proceeds from the burn are granted to organizations serving the region’s children by the <b>Santa Fe Downtown Kiwanis Foundation<\/b>, which is a separate entity from the event. To be considered, send a full written proposal to the Foundation. The Event Chairman does not advocate for individual applicants, so that every organization is treated the same.<\/p>", "a_es": "<h3>Subvenciones de Kiwanis<\/h3><p>Las ganancias netas de la quema se otorgan a organizaciones que sirven a los niños de la región por medio de la <b>Santa Fe Downtown Kiwanis Foundation<\/b>, que es una entidad separada del evento. Para ser considerado, envíe una propuesta completa por escrito a la Fundación. El Presidente del Evento no aboga por ningún solicitante en particular, para que todas las organizaciones reciban el mismo trato.<\/p>"}, {"id": "suggest", "title": "Suggesting a theme", "title_es": "Cómo sugerir un tema", "terms": ["suggest a theme|14", "theme idea|14", "theme suggestion|14", "idea for a theme|14", "idea for next year|12", "i have an idea|10", "suggestion|8", "next years theme|12", "2028|8", "sugerir un tema|8", "idea para un tema|8", "idea de tema|8", "sugerencia de tema|8", "idea para el proximo ano|7", "tengo una idea|6", "sugerencia|5", "sugerencias|4", "tema del proximo ano|7", "proponer un tema|7", "2028|5", "song idea|12", "song suggestion|12", "suggest a song|12", "play a song|10", "sugerir una cancion|10"], "related": ["whythemes", "theme", "contact"], "a": "<h3>We keep a theme file<\/h3><p>Theme ideas are welcome, and every one goes into the theme file. Email yours to <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a>. The 2027 theme is already set: <b>Zozobra the Kid<\/b>, a country western burn that people asked for year after year, which tells you suggestions are heard. Song ideas for the show are welcome at the same address.<\/p>", "a_es": "<h3>Tenemos un archivo de temas<\/h3><p>Las ideas para temas son bienvenidas, y cada una entra al archivo de temas. Envíe la suya por correo electrónico a <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a>. El tema de 2027 ya está decidido: <b>Zozobra the Kid<\/b>, una quema al estilo country western que la gente pidió año tras año, lo cual le demuestra que las sugerencias sí se escuchan. Las ideas de canciones para el espectáculo también son bienvenidas en el mismo correo.<\/p>"}, {"id": "begloomie", "title": "How can my child be a Gloomie?", "title_es": "¿Cómo puede mi hijo o hija ser un Gloomie?", "terms": ["be a gloomie|14", "become a gloomie|14", "gloomie audition|14", "gloomie tryouts|14", "gloomie tryout|14", "audition|10", "tryouts|10", "my child perform|12", "my kid be in the show|12", "kids in the show|12", "child dancer|10", "be in the pageant|12", "perform in the burn|12", "sign up my child|10", "ser un gloomie|20", "ser gloomie|20", "convertirse en gloomie|7", "audicion de gloomies|8", "audiciones gloomie|8", "pruebas para gloomie|7", "audicion|5", "audiciones|5", "mi hijo puede actuar|7", "mi hija en el espectaculo|7", "ninos en el espectaculo|7", "nino bailarin|5", "participar en el espectaculo|6", "actuar en la quema|7", "inscribir a mi hijo|6", "inscribir a mi hija|6", "gloomie|4", "how do i become a gloomie|14", "how can my child be a gloomie|14", "can my kid be a gloomie|14", "como puede mi hijo ser gloomie|20", "como ser gloomie|20"], "related": ["gloomies", "volunteer", "mythology"], "a": "<h3>Becoming a Gloomie<\/h3><p>The Gloomies are real Santa Fe kids, and yours can audition for the 103rd.<\/p><ul><li><b>Ages 11–15<\/b>, no exceptions.<\/li><li><b>Applications open Tuesday, June 1, 2027<\/b> at <a href=\"https://burnzozobra.com/gloomie\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/gloomie<\/a> and close <b>Friday, July 16, at 11:59 p.m.<\/b> A parent or guardian fills out and signs the application with the child.<\/li><li><b>One audition day, in person: Saturday, July 17, 2027, 9–11 a.m.<\/b>, at Fort Marcy Park.<\/li><li><b>Every rehearsal is mandatory, no exceptions<\/b>: Saturdays July 31 and August 7, 14, 21 and 28, 11 a.m.–1 p.m. on the stage at Fort Marcy Park, plus the dress rehearsal on <b>Wednesday, September 1, 6–10 p.m.<\/b> The burn is Friday, September 3. If your family cannot make every date, please do not apply.<\/li><li>Selected children receive training in fire protection and safety and are chaperoned by Kiwanis volunteers. Parents and family watch from the ballpark.<\/li><\/ul><p><b>What we look for:<\/b> a good listener who follows directions, is not shy about performing in front of tens of thousands of people, can stay physically active for long stretches, gets along well with others, and is <b>not afraid of Zozobra, loud noises, fire or fireworks<\/b>.<\/p><p class=\"fine\">Questions: <a href=\"mailto:gloomies@burnzozobra.com\">gloomies@burnzozobra.com<\/a> or 855-ZOZOBRA.<\/p>", "a_es": "<h3>Cómo llegar a ser un Gloomie<\/h3><p>Los Gloomies son niños de verdad de Santa Fe, y el suyo puede hacer la audición para la 103.ª.<\/p><ul><li><b>Edades de 11 a 15 años<\/b>, sin excepciones.<\/li><li><b>Las solicitudes abren el martes 1 de junio de 2027<\/b> en <a href=\"https://burnzozobra.com/gloomie\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/gloomie<\/a> y cierran el <b>viernes 16 de julio a las 11:59 p.m.<\/b> El padre, la madre o el tutor llena y firma la solicitud junto con el niño.<\/li><li><b>Un solo día de audiciones, en persona: sábado 17 de julio de 2027, 9–11 a.m.<\/b>, en Fort Marcy Park.<\/li><li><b>Todos los ensayos son obligatorios, sin excepciones<\/b>: los sábados 31 de julio y 7, 14, 21 y 28 de agosto, 11 a.m.–1 p.m. en el escenario de Fort Marcy Park, más el ensayo general el <b>miércoles 1 de septiembre, 6–10 p.m.<\/b> La quema es el viernes 3 de septiembre. Si su familia no puede cumplir con todas las fechas, por favor no presente solicitud.<\/li><li>Los niños seleccionados reciben capacitación en protección y seguridad contra el fuego y están acompañados por voluntarios de Kiwanis. Los padres y la familia miran desde el campo de béisbol.<\/li><\/ul><p><b>Lo que buscamos:<\/b> alguien que sepa escuchar y siga instrucciones, que no sea tímido para actuar frente a decenas de miles de personas, que pueda mantenerse físicamente activo por periodos largos, que se lleve bien con los demás y que <b>no le tenga miedo a Zozobra, a los ruidos fuertes, al fuego ni a los fuegos artificiales<\/b>.<\/p><p class=\"fine\">Preguntas: <a href=\"mailto:gloomies@burnzozobra.com\">gloomies@burnzozobra.com<\/a> o 855-ZOZOBRA.<\/p>"}, {"id": "stuffday", "title": "Public Stuff Day", "title_es": "Public Stuff Day (día público para rellenar a Zozobra)", "terms": ["stuff day|14", "stuffing day|14", "public stuff day|14", "stuff zozobra|14", "help stuff|12", "stuffing zozobra|14", "pizza party|12", "shredded paper|8", "help build|8", "stuff day|8", "public stuff day|8", "dia de relleno|8", "dia de rellenar|8", "rellenar a zozobra|8", "ayudar a rellenar|7", "relleno de zozobra|7", "fiesta de pizza|6", "pizza gratis|6", "papel triturado|5", "ayudar a construir|5", "zapatos cerrados|4"], "related": ["gloom", "seehim", "volunteer"], "a": "<h3>Come stuff him yourself<\/h3><p><b>Public Stuff Day<\/b> is a free, all-ages morning when anyone can help stuff Zozobra and bring glooms to put inside him. No RSVP. In 2026 it was held in mid-May at 9:00 a.m.; the 2027 date and location will be announced at <a href=\"https://burnzozobra.com\" target=\"_blank\" rel=\"noopener\">burnzozobra.com<\/a>.<\/p><ul><li><b>Closed-toe shoes are required.<\/b> Long sleeves and pants are recommended.<\/li><li>Masks and goggles are provided.<\/li><li>There is free pizza.<\/li><\/ul>", "a_es": "<h3>Venga a rellenarlo usted mismo<\/h3><p><b>Public Stuff Day<\/b> (el día público para rellenar a Zozobra) es una mañana gratuita, para todas las edades, en la que cualquiera puede ayudar a rellenar a Zozobra y traer \"glooms\" (sus penas y preocupaciones) para ponerlos dentro de él. No hace falta reservar. En 2026 se llevó a cabo a mediados de mayo a las 9:00 a.m.; la fecha y el lugar de 2027 se anunciarán en <a href=\"https://burnzozobra.com\" target=\"_blank\" rel=\"noopener\">burnzozobra.com<\/a>.<\/p><ul><li><b>Es obligatorio llevar zapatos cerrados.<\/b> Se recomiendan mangas largas y pantalones largos.<\/li><li>Se proporcionan cubrebocas y gafas protectoras.<\/li><li>Hay pizza gratis.<\/li><\/ul>"}, {"id": "anthem", "title": "National Anthem competition", "title_es": "Concurso del Himno Nacional", "terms": ["anthem competition|14", "national anthem competition|14", "sing the anthem|14", "sing the national anthem|14", "anthem audition|14", "anthem tryouts|12", "sing at zozobra|14", "perform the anthem|12", "singer|6", "star spangled|10", "concurso del himno|8", "concurso del himno nacional|8", "cantar el himno|8", "cantar el himno nacional|8", "audicion del himno|8", "pruebas del himno|7", "cantar en zozobra|8", "interpretar el himno|7", "himno nacional|6", "himno|5", "cantante|4", "star spangled|5"], "related": ["music", "begloomie", "contact"], "a": "<h3>Sing the National Anthem at Zozobra<\/h3><p>Each summer Zozobra holds an open <b>National Anthem competition<\/b>. Vocal and musical performers are both welcome.<\/p><ul><li><b>Auditions: Saturday, July 24, 2027, at noon<\/b> (arrive by 11:30 a.m.) at the Santa Fe Convention Center, before a panel of seven judges. Sign up at <a href=\"https://burnzozobra.com/natlanthem\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/natlanthem<\/a>.<\/li><li><b>Finalists must attend<\/b> rehearsals on Saturday, August 21 and Saturday, August 28, and the final rehearsal on Wednesday, September 1, 6–8 p.m.<\/li><li>Performers must be able to walk up steps to perform, should know what the event is about before tryouts, and may not be related to a member of the Kiwanis Club of Santa Fe.<\/li><\/ul><p><b>The winner performs at the burn<\/b> on Friday, September 3, 2027, in front of the whole field and a live statewide broadcast. The first runner-up is the backup performer, the second runner-up performs at the City of Santa Fe’s July 4th celebration, and the third and fourth runners-up are invited to perform at the Santa Fe Wine &amp; Chile Fiesta.<\/p>", "a_es": "<h3>Cante el Himno Nacional en Zozobra<\/h3><p>Cada verano Zozobra organiza un <b>concurso del Himno Nacional<\/b> abierto al público. Son bienvenidos tanto cantantes como intérpretes musicales.<\/p><ul><li><b>Audiciones: sábado 24 de julio de 2027, al mediodía<\/b> (llegue a más tardar a las 11:30 a.m.) en el Centro de Convenciones de Santa Fe (Santa Fe Convention Center), ante un panel de siete jueces. Inscríbase en <a href=\"https://burnzozobra.com/natlanthem\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/natlanthem<\/a>.<\/li><li><b>Los finalistas deben asistir<\/b> a los ensayos del sábado 21 de agosto y del sábado 28 de agosto, y al ensayo final del miércoles 1 de septiembre, 6–8 p.m.<\/li><li>Los participantes deben poder subir escalones para presentarse, deben saber de qué se trata el evento antes de las pruebas, y no pueden ser parientes de un miembro del Club Kiwanis de Santa Fe.<\/li><\/ul><p><b>El ganador se presenta en la quema<\/b> el viernes 3 de septiembre de 2027, frente a todo el campo y en una transmisión en vivo a todo el estado. El segundo lugar es el intérprete suplente, el tercer lugar se presenta en la celebración del 4 de julio de la Ciudad de Santa Fe, y el cuarto y el quinto lugar están invitados a presentarse en la Santa Fe Wine &amp; Chile Fiesta.<\/p>"}, {"id": "artists", "title": "Artists: two ways to take part", "title_es": "Artistas: dos maneras de participar", "terms": ["artist|10", "artists|10", "i am an artist|14", "im an artist|14", "for artists|12", "art opportunities|14", "how can artists|14", "participate as an artist|14", "submit art|10", "submit my art|12", "submit artwork|12", "my artwork|10", "art|4", "painter|8", "illustrator|8", "graphic designer|8", "missed|12", "too late|8", "missed the contest|14", "missed the art contest|14", "call for artists|10", "call for art|10", "artista|5", "artistas|5", "soy artista|8", "para artistas|7", "oportunidades de arte|8", "como pueden participar los artistas|8", "participar como artista|8", "enviar arte|6", "enviar mi arte|7", "enviar mi obra|7", "mi obra|5", "arte|2", "pintor|4", "ilustrador|4", "disenador grafico|4", "se me paso el concurso|8", "me perdi el concurso de arte|8", "demasiado tarde|4", "convocatoria para artistas|6", "convocatoria de arte|6"], "related": ["artcontest", "artexhibit", "artai", "artweapons"], "a": "<h3>Two ways for artists to be part of Zozobra<\/h3><p><b>1. The Official Zozobra Art Contest, in January.<\/b> This is where the year’s official poster, T-shirt and merchandise art comes from. It has to happen in winter, because the winning designs go into production so the merchandise is ready the day tickets go on sale, which for the 103rd is April 13, 2027. <b>Entries are due Friday, January 29, 2027, at 5 p.m.<\/b><\/p><p><b>2. The Zozobra Art Exhibit at ZozoFest, in summer.<\/b> Missed the contest, or work in something that is not a poster? This one is for you. The call for artists goes out after tickets are on sale. Entry is free, every medium is welcome, and you can sell your work in front of thousands of Zozobra fans. The deadline always falls near the beginning of August: <b>Monday, August 2, 2027<\/b>.<\/p><p><b>You can do both.<\/b> Artists whose contest entries are not chosen are invited to show that same piece at ZozoFest.<\/p><p><b>One rule for both:<\/b> the 103rd theme is Zozobra the Kid, an amalgamation of all the villains of the Old West, and we ask for <b>no weapons and no guns<\/b> in the artwork.<\/p><p>Both are laid out at <a href=\"https://burnzozobra.com/art-artists/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/art-artists<\/a>.<\/p><p class=\"fine\">Ask me about “the art contest” or “the ZozoFest art exhibit” for the details of each.<\/p>", "a_es": "<h3>Dos maneras en que los artistas pueden ser parte de Zozobra<\/h3><p><b>1. El Concurso Oficial de Arte de Zozobra, en enero.<\/b> De aquí sale el arte oficial del año para el póster, la camiseta y la mercancía. Tiene que hacerse en invierno, porque los diseños ganadores entran a producción para que la mercancía esté lista el día en que los boletos salen a la venta, que para la 103.ª es el 13 de abril de 2027. <b>Las obras deben entregarse a más tardar el viernes 29 de enero de 2027 a las 5 p.m.<\/b><\/p><p><b>2. La Exposición de Arte de Zozobra en ZozoFest, en verano.<\/b> ¿Se le pasó el concurso, o trabaja en algo que no es un póster? Esta es para usted. La convocatoria para artistas sale después de que los boletos están a la venta. La inscripción es gratuita, se aceptan todos los medios, y puede vender su obra frente a miles de fanáticos de Zozobra. La fecha límite siempre cae cerca de principios de agosto: <b>lunes 2 de agosto de 2027<\/b>.<\/p><p><b>Puede hacer las dos.<\/b> A los artistas cuyas obras del concurso no son elegidas se les invita a exhibir esa misma pieza en ZozoFest.<\/p><p><b>Una regla para ambas:<\/b> el tema de la 103.ª es Zozobra the Kid, una amalgama de todos los villanos del Viejo Oeste, y pedimos que <b>no haya armas ni pistolas<\/b> en las obras.<\/p><p>Las dos se explican en <a href=\"https://burnzozobra.com/art-artists/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/art-artists<\/a>.<\/p><p class=\"fine\">Pregúnteme por “el concurso de arte” o “la exposición de arte de ZozoFest” para conocer los detalles de cada una.<\/p>"}, {"id": "artexhibit", "title": "Zozobra Art Exhibit at ZozoFest (summer)", "title_es": "Exposición de Arte de Zozobra en ZozoFest (verano)", "terms": ["art exhibit|14", "zozofest art|14", "zozofest art show|14", "art show|12", "zozobra art show|14", "show my art|14", "exhibit my art|14", "sell my art|14", "sell my artwork|14", "prospectus|12", "art prospectus|14", "art reservation|12", "commission|8", "hang my art|10", "gallery|8", "sculpture|6", "jewelry|6", "photography|5", "enter the art show|14", "exposicion de arte|8", "exhibicion de arte|8", "exposicion de arte de zozofest|8", "arte en zozofest|8", "muestra de arte|7", "exponer mi arte|8", "exhibir mi arte|8", "mostrar mi arte|7", "vender mi arte|8", "vender mis obras|8", "prospecto|6", "prospecto de arte|8", "reservacion de arte|6", "comision|4", "colgar mi obra|5", "galeria|4", "escultura|3", "joyeria|3", "fotografia|3", "inscribirme en la exposicion|7"], "related": ["artists", "artweapons", "artai", "zozofest"], "a": "<h3>Zozobra Art Exhibit at ZozoFest<\/h3><p>Every summer, ZozoFest hosts the <b>Zozobra Art Exhibit<\/b> at Santa Fe Place Mall. <b>Anyone may enter<\/b>: any age, anywhere, <b>free<\/b>, with no limit on the number of pieces.<\/p><ul><li><b>Deadline to enter online: Monday, August 2, 2027, 11:59 p.m.<\/b> Shipped work must arrive by 5 p.m. that day.<\/li><li><b>Artwork drop-off:<\/b> Sunday, August 8, 2027, 11 a.m.–5 p.m. Work not delivered on time cannot be shown.<\/li><li><b>On view during ZozoFest:<\/b> Friday, August 27, 5–8 p.m.; Saturday, August 28, 10 a.m.–6 p.m.; Sunday, August 29, 11 a.m.–4 p.m.<\/li><li><b>Pick up unsold work:<\/b> Sunday, August 29, 4–6 p.m. only. Work left behind is treated as a donation to the Kiwanis Club of Santa Fe.<\/li><\/ul><p><b>What to make:<\/b> all media are welcome, from painting, sculpture, jewelry, ceramics, fabric and photography to digital art, video, even Legos. <b>Zozobra must be the star<\/b>, and for the 103rd that means <b>Zozobra the Kid<\/b>, an amalgamation of all the villains of the Old West. <b>One thing we ask: no weapons and no guns in your artwork.<\/b> The Fire Spirit, Gloomies and Torchbearers are welcome subjects, as is work inspired by Will Shuster or Los Cinco Pintores. ZozoFest is family-friendly: no nudity, no weapons, no overtly political or religious themes, no controversial public figures.<\/p><p><b>How to enter:<\/b> submit each piece on its own, with a description and a JPEG (1,500–3,000 pixels on the longest side, named YourName_ArtworkTitle.jpg), at <a href=\"https://burnzozobra.com/art-reservation-forms/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/art-reservation-forms<\/a>. There are two forms: <a href=\"https://burnzozobra.com/single-art/\" target=\"_blank\" rel=\"noopener\">one for a single unique piece<\/a>, and <a href=\"https://burnzozobra.com/multiple-art/\" target=\"_blank\" rel=\"noopener\">one for multiple identical pieces<\/a> such as prints or stickers (same design, size and price). Anything different gets its own form. Work must arrive framed or wired, <b>ready to hang<\/b>. Full prospectus: <a href=\"https://burnzozobra.com/zozobra-art-prospectus/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/zozobra-art-prospectus<\/a>.<\/p><p><b>Selling:<\/b> you set the price and keep <b>75%<\/b>; Kiwanis keeps 25% for the children’s charities, and artists are paid within 30 days of the show closing.<\/p><p class=\"fine\">Questions: Art Chair Brandi Fields, <a href=\"mailto:art@burnzozobra.com\">art@burnzozobra.com<\/a>.<\/p>", "a_es": "<h3>Exposición de Arte de Zozobra en ZozoFest<\/h3><p>Cada verano, ZozoFest presenta la <b>Exposición de Arte de Zozobra<\/b> (Zozobra Art Exhibit) en Santa Fe Place Mall. <b>Cualquier persona puede participar<\/b>: de cualquier edad, de cualquier lugar, <b>gratis<\/b>, sin límite en el número de piezas.<\/p><ul><li><b>Fecha límite para inscribirse en línea: lunes 2 de agosto de 2027, 11:59 p.m.<\/b> Las obras enviadas por paquetería deben llegar a más tardar a las 5 p.m. de ese día.<\/li><li><b>Entrega de obras:<\/b> domingo 8 de agosto de 2027, 11 a.m.–5 p.m. Las obras que no se entreguen a tiempo no podrán exhibirse.<\/li><li><b>En exhibición durante ZozoFest:<\/b> viernes 27 de agosto, 5–8 p.m.; sábado 28 de agosto, 10 a.m.–6 p.m.; domingo 29 de agosto, 11 a.m.–4 p.m.<\/li><li><b>Recoger las obras no vendidas:<\/b> domingo 29 de agosto, solamente de 4 a 6 p.m. Las obras que se queden se consideran una donación al Club Kiwanis de Santa Fe.<\/li><\/ul><p><b>Qué crear:<\/b> se aceptan todos los medios, desde pintura, escultura, joyería, cerámica, tela y fotografía hasta arte digital, video, incluso Legos. <b>Zozobra debe ser la estrella<\/b>, y para la 103.ª eso significa <b>Zozobra the Kid<\/b>, una amalgama de todos los villanos del Viejo Oeste. <b>Una cosa le pedimos: que no haya armas ni pistolas en su obra.<\/b> El Espíritu del Fuego (Fire Spirit), los Gloomies y los Portadores de Antorchas son temas bienvenidos, al igual que las obras inspiradas en Will Shuster o en Los Cinco Pintores. ZozoFest es un evento familiar: nada de desnudos, nada de armas, nada de temas abiertamente políticos o religiosos, nada de figuras públicas controvertidas.<\/p><p><b>Cómo participar:<\/b> envíe cada pieza por separado, con una descripción y un JPEG (de 1,500 a 3,000 pixeles en el lado más largo, con el nombre SuNombre_TituloDeLaObra.jpg), en <a href=\"https://burnzozobra.com/art-reservation-forms/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/art-reservation-forms<\/a>. Hay dos formularios: <a href=\"https://burnzozobra.com/single-art/\" target=\"_blank\" rel=\"noopener\">uno para una sola pieza única<\/a>, y <a href=\"https://burnzozobra.com/multiple-art/\" target=\"_blank\" rel=\"noopener\">uno para varias piezas idénticas<\/a>, como impresiones o calcomanías (mismo diseño, tamaño y precio). Todo lo que sea diferente lleva su propio formulario. Las obras deben llegar enmarcadas o con alambre, <b>listas para colgar<\/b>. Prospecto completo: <a href=\"https://burnzozobra.com/zozobra-art-prospectus/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/zozobra-art-prospectus<\/a>.<\/p><p><b>Ventas:<\/b> usted fija el precio y se queda con el <b>75%<\/b>; Kiwanis se queda con el 25% para las organizaciones benéficas para niños, y a los artistas se les paga dentro de los 30 días siguientes al cierre de la exposición.<\/p><p class=\"fine\">Preguntas: Brandi Fields, responsable de Arte, <a href=\"mailto:art@burnzozobra.com\">art@burnzozobra.com<\/a>.<\/p>"}, {"id": "artcontest", "title": "Official Art Contest: posters & T-shirts (January)", "title_es": "Concurso Oficial de Arte: pósters y camisetas (enero)", "terms": ["poster contest|14", "t-shirt contest|14", "tshirt contest|14", "shirt contest|12", "art contest|14", "art competition|14", "official art contest|14", "design contest|14", "design the poster|14", "design the shirt|14", "submit my design|12", "poster artist|12", "who designs the poster|12", "official poster|10", "youth art|10", "kids art contest|12", "childrens art contest|12", "january 29|10", "concurso de poster|8", "concurso de cartel|8", "concurso de camisetas|8", "concurso de playeras|7", "concurso de arte|8", "competencia de arte|8", "concurso oficial de arte|8", "concurso de diseno|8", "disenar el poster|8", "disenar la camiseta|8", "enviar mi diseno|6", "quien disena el poster|6", "poster oficial|5", "arte juvenil|5", "concurso de arte para ninos|7", "29 de enero|5", "submissions open|16", "still open|12", "is the contest open|16", "contest closed|16", "submissions|10", "deadline|12", "due date|14", "when is it due|16", "when are entries due|16", "fecha limite|8", "submit illustrations|14", "ticket contest|14", "contest|6", "concurso|4"], "related": ["artfiles", "artai", "artweapons", "artprize"], "a": "<h3>The Official Zozobra Art Contest<\/h3><p>Every year’s official <b>poster, T-shirt and merchandise art<\/b> comes from a public contest held in winter. The timing is not optional: the winning designs go into production so the merchandise is ready the day tickets go on sale, <b>April 13, 2027<\/b>.<\/p><ul><li><b>Deadline: Friday, January 29, 2027, at 5 p.m.<\/b>, for every category.<\/li><li><b>Adult categories<\/b> (open to all artists, all ages): poster art must scale to 24″ × 36″; T-shirt art to 9″ × 11″.<\/li><li><b>Youth categories<\/b> (artists up to age 15): poster art must scale to 11″ × 14″; T-shirt art to 9″ × 11″.<\/li><li>The image must be <b>primarily of Zozobra<\/b>, in this year’s theme: <b>Zozobra the Kid<\/b>. He is not one outlaw but an amalgamation of all the villains of the Old West: the card shark, the snake oil salesman, the rustler, the claim jumper, the crooked lawman, the land-grabbing man in the good suit.<\/li><li><b>One thing we ask: no weapons and no guns in your artwork.<\/b> The Old West had plenty of other ways to be a villain.<\/li><li>Work must be original and made by the artist. <b>Digital art is welcome; AI-generated artwork is not<\/b>, and every entry is run through an AI filter.<\/li><\/ul><p><b>How to enter:<\/b> online (preferred) with the entry form at <a href=\"https://burnzozobra.com/z27artcontest/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/z27artcontest<\/a>; by mail to P.O. Box 622, Santa Fe, NM 87504; or by hand at the Boys &amp; Girls Clubs of Santa Fe/Del Norte, 6600 Valentine Way, weekdays 3–5 p.m. Put an email address and cell number on your entry form.<\/p><p><b>Winners<\/b> receive VIP tickets to the 103rd Burning of Zozobra, and their art becomes the year’s official merchandise.<\/p><p class=\"fine\">Not selected, or missed the deadline? Enter the Zozobra Art Exhibit at ZozoFest this summer. Ask me about “the ZozoFest art exhibit.”<\/p>", "a_es": "<h3>El Concurso Oficial de Arte de Zozobra<\/h3><p>El arte oficial de cada año para <b>el póster, la camiseta y la mercancía<\/b> sale de un concurso público que se realiza en invierno. El calendario no es opcional: los diseños ganadores entran a producción para que la mercancía esté lista el día en que los boletos salen a la venta, el <b>13 de abril de 2027<\/b>.<\/p><ul><li><b>Fecha límite: viernes 29 de enero de 2027 a las 5 p.m.<\/b>, para todas las categorías.<\/li><li><b>Categorías para adultos<\/b> (abiertas a todos los artistas, de todas las edades): el arte para póster debe poder escalarse a 24″ × 36″; el arte para camiseta, a 9″ × 11″.<\/li><li><b>Categorías juveniles<\/b> (artistas de hasta 15 años): el arte para póster debe poder escalarse a 11″ × 14″; el arte para camiseta, a 9″ × 11″.<\/li><li>La imagen debe ser <b>principalmente de Zozobra<\/b>, dentro del tema de este año: <b>Zozobra the Kid<\/b>. No es un solo forajido, sino una amalgama de todos los villanos del Viejo Oeste: el tahúr, el vendedor de remedios milagrosos, el cuatrero, el usurpador de concesiones mineras, el alguacil corrupto, el acaparador de tierras de traje elegante.<\/li><li><b>Una cosa le pedimos: que no haya armas ni pistolas en su obra.<\/b> En el Viejo Oeste había muchas otras maneras de ser un villano.<\/li><li>La obra debe ser original y hecha por el artista. <b>El arte digital es bienvenido; no se aceptan obras generadas con inteligencia artificial (IA)<\/b>, y cada obra pasa por un filtro de IA.<\/li><\/ul><p><b>Cómo participar:<\/b> en línea (de preferencia) con el formulario de inscripción en <a href=\"https://burnzozobra.com/z27artcontest/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/z27artcontest<\/a>; por correo postal a P.O. Box 622, Santa Fe, NM 87504; o en persona en Boys &amp; Girls Clubs of Santa Fe/Del Norte, 6600 Valentine Way, entre semana de 3 a 5 p.m. Ponga una dirección de correo electrónico y un número de celular en su formulario de inscripción.<\/p><p><b>Los ganadores<\/b> reciben boletos VIP para la 103.ª Quema de Zozobra, y su arte se convierte en la mercancía oficial del año.<\/p><p class=\"fine\">¿No fue seleccionado, o se le pasó la fecha límite? Participe en la Exposición de Arte de Zozobra en ZozoFest este verano. Pregúnteme por “la exposición de arte de ZozoFest”.<\/p>"}, {"id": "artai", "title": "Can I use AI? Digital art vs. AI art", "title_es": "¿Puedo usar IA? Arte digital vs. arte con IA", "terms": ["ai|8", "ai art|16", "ai generated|16", "ai-generated|16", "use ai|16", "can i use ai|18", "artificial intelligence|14", "generative|10", "generated|8", "generate|8", "prompt|8", "midjourney|16", "dall e|16", "dalle|16", "chatgpt|12", "firefly|14", "generative fill|16", "stable diffusion|16", "ai filter|16", "ai detection|16", "ai checker|16", "digital art|14", "procreate|14", "photoshop|12", "illustrator|10", "krita|12", "computer art|12", "drawn on a computer|14", "inteligencia artificial|10", "ia|6", "arte con ia|12", "usar ia|12", "puedo usar ia|12", "generado con ia|12", "generado por ia|12", "arte digital|10", "filtro de ia|12", "deteccion de ia|12"], "related": ["artcontest", "artweapons", "arttheme"], "a": "<h3>Digital art: yes. AI-generated art: no.<\/h3><p><b>Digital art is welcome.<\/b> If you draw, paint or design the piece yourself, in Procreate, Photoshop, Illustrator, Krita or any other program, it is your own work, just like pencil, paint or ink.<\/p><p><b>AI-generated artwork is not accepted.<\/b> That means any image, or any part of an image, produced by an AI tool from a prompt: Midjourney, DALL·E, ChatGPT, Firefly or generative fill, Stable Diffusion and the like.<\/p><p><b>Every entry is run through an AI filter<\/b> and reviewed for originality. AI-generated entries are excluded. When you enter, you certify on the form that your piece is original and not AI-generated.<\/p><p class=\"fine\">Why: this is for artists and their work. Kiwanis wants to foster the arts in our community, and it isn’t fair to ask an artist to compete with AI-generated imagery.<\/p>", "a_es": "<h3>Arte digital: sí. Arte generado con IA: no.<\/h3><p><b>El arte digital es bienvenido.<\/b> Si usted mismo dibuja, pinta o diseña la obra, en Procreate, Photoshop, Illustrator, Krita o cualquier otro programa, es su propio trabajo, igual que el lápiz, la pintura o la tinta.<\/p><p><b>No se acepta arte generado con inteligencia artificial.<\/b> Es decir, cualquier imagen, o parte de una imagen, producida por una herramienta de IA a partir de una instrucción: Midjourney, DALL·E, ChatGPT, Firefly o el relleno generativo, Stable Diffusion y similares.<\/p><p><b>Cada obra pasa por un filtro de IA<\/b> y se revisa su originalidad. Las obras generadas con IA quedan excluidas. Al inscribirse, usted certifica en el formulario que su obra es original y no fue generada con IA.<\/p><p class=\"fine\">Por qué: esto es para los artistas y su trabajo. Kiwanis quiere fomentar las artes en nuestra comunidad, y no es justo pedirle a un artista que compita con imágenes generadas por IA.<\/p>"}, {"id": "artweapons", "title": "No weapons or guns in the art", "title_es": "Sin armas ni pistolas en el arte", "terms": ["weapon in my art|18", "weapon in the art|18", "weapons in art|18", "gun in my art|18", "gun in the art|18", "can he have a gun|18", "can zozobra have a gun|18", "can he hold a gun|18", "holster|12", "gun belt|12", "draw a gun|16", "shootout|10", "gunfight|10", "gunslinger|12", "lasso|8", "allowed in my art|12", "what can i draw|12", "what is not allowed|10", "arma en mi arte|12", "armas en el arte|12", "pistola en mi arte|12", "puede tener una pistola|12", "funda|6", "cinturon de balas|8", "pistolero|8", "lazo|5", "gun in my poster|18", "weapon in my poster|18", "gun in my drawing|18", "zozobra hold a gun|18", "zozobra have a gun|18", "draw a weapon|16", "arma en mi dibujo|10", "zozobra con pistola|10"], "related": ["arttheme", "artai", "artcontest"], "a": "<h3>No weapons. No guns.<\/h3><p>This is the one firm rule for the 103rd, for the <b>Official Art Contest and the ZozoFest Art Exhibit<\/b> alike. Leave out guns of every kind, holsters and gun belts, bullets, knives, and any other weapon.<\/p><p><b>What works instead:<\/b> the Old West had plenty of ways to be a villain. Zozobra the Kid is the card shark with an ace up his sleeve, the snake oil salesman with his bottles, the rustler, the claim jumper, the crooked lawman with a tarnished star, and the land-grabbing man in the good suit. His lasso, dark hat, handlebar mustache, red bandana and vest are all fair game.<\/p><p class=\"fine\">Wanted posters, playing cards, poker chips, pocket watches, spurs, saddles and tumbleweeds all fit the theme without a weapon in sight.<\/p>", "a_es": "<h3>Sin armas. Sin pistolas.<\/h3><p>Esta es la única regla firme de la 103.ª edición, tanto para el <b>Concurso Oficial de Arte como para la Exposición de Arte de ZozoFest<\/b>. No incluya pistolas ni armas de fuego de ningún tipo, fundas ni cinturones de balas, balas, cuchillos ni ningún otro tipo de arma.<\/p><p><b>Lo que sí funciona:<\/b> el Viejo Oeste tenía muchas otras formas de ser villano. Zozobra the Kid es el tahúr con un as bajo la manga, el vendedor de remedios milagrosos con sus botellas, el cuatrero, el usurpador de concesiones mineras, el alguacil corrupto con su estrella deslustrada y el acaparador de tierras de traje elegante. Su lazo, su sombrero oscuro, su bigote de manubrio, su paliacate rojo y su chaleco son bienvenidos.<\/p><p class=\"fine\">Carteles de “Se busca”, naipes, fichas de póquer, relojes de bolsillo, espuelas, sillas de montar y plantas rodadoras encajan con el tema sin un arma a la vista.<\/p>"}, {"id": "arttheme", "title": "Drawing Zozobra the Kid", "title_es": "Cómo dibujar a Zozobra the Kid", "terms": ["drawing zozobra|16", "draw zozobra|16", "how should i draw|16", "what should zozobra look like|18", "what does he look like|12", "style guide|16", "art theme|14", "theme for the art|14", "theme for artists|14", "does it have to be the theme|16", "do i have to use the theme|16", "zozobra the kid|10", "colors|8", "color palette|12", "palette|10", "mustache|8", "bandana|8", "hero|8", "sheriff|8", "badge|8", "caricature|10", "headdress|10", "references|8", "inspiration|10", "guia de estilo|10", "como dibujar a zozobra|10", "dibujar a zozobra|10", "como debe verse zozobra|10", "tema del arte|8", "tengo que usar el tema|10", "colores|5", "paleta|5", "sombrero|4", "bigote|4", "paliacate|5", "chaleco|4", "heroe|5", "alguacil|5", "placa|4", "estrella|4", "caricatura|6", "penacho|6", "inspiracion|6"], "related": ["artweapons", "artai", "artfiles"], "a": "<h3>Drawing Zozobra the Kid<\/h3><p><b>Zozobra must be the star of your image, in the 103rd theme.<\/b> He isn’t one outlaw. He is every villain of the Old West at once: the card shark, the snake oil salesman, the rustler, the claim jumper, the crooked lawman and the land-grabbing man in the good suit. He is gloom with a good reputation.<\/p><ul><li><b>His look:<\/b> a black or dark cowboy hat, a handlebar mustache, a red bandana, a vest (with or without a pocket-watch chain) and a lasso.<\/li><li><b>He is the villain, never the hero.<\/b> No white hat and no honest badge. If he wears a star, it is crooked, tarnished or stolen. The white hats belong to the posse: the Fire Spirit and the Torchbearers. The Gloomies are his gang.<\/li><li><b>Palette ideas:<\/b> desert sunset (burnt orange, rust, ochre, gold), bandana red and turquoise sky, with saddle brown, adobe, sage and midnight blue as accents.<\/li><li><b>Settings:<\/b> high desert, mesas, the Sangre de Cristos, adobe walls, the Plaza, the jailhouse, the saloon and the railroad depot.<\/li><li><b>No weapons and no guns.<\/b><\/li><li><b>With respect:<\/b> the Native, Hispano, Black, Chinese and Anglo people of the Old West are drawn as people, not caricatures. Sacred and ceremonial dress, including headdresses, should not appear.<\/li><\/ul><p>The full style guide, with films, books and history for inspiration, is on the contest page: <a href=\"https://burnzozobra.com/z27artcontest/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/z27artcontest<\/a>.<\/p>", "a_es": "<h3>Cómo dibujar a Zozobra the Kid<\/h3><p><b>Zozobra debe ser la estrella de su imagen, con el tema de la 103.ª edición.<\/b> No es un solo forajido. Es todos los villanos del Viejo Oeste a la vez: el tahúr, el vendedor de remedios milagrosos, el cuatrero, el usurpador de concesiones mineras, el alguacil corrupto y el acaparador de tierras de traje elegante. Es la tristeza con buena reputación.<\/p><ul><li><b>Su imagen:<\/b> sombrero vaquero negro u oscuro, bigote de manubrio, paliacate rojo, chaleco (con o sin cadena de reloj de bolsillo) y un lazo.<\/li><li><b>Es el villano, nunca el héroe.<\/b> Nada de sombrero blanco ni placa honesta. Si lleva una estrella, está chueca, deslustrada o robada. Los sombreros blancos son del grupo que lo persigue: el Espíritu del Fuego y los Portadores de Antorchas. Los Gloomies son su pandilla.<\/li><li><b>Ideas de colores:<\/b> atardecer del desierto (naranja quemado, óxido, ocre, dorado), rojo paliacate y cielo turquesa, con café montura, adobe, salvia y azul medianoche como acentos.<\/li><li><b>Escenarios:<\/b> el desierto alto, las mesas, la Sangre de Cristo, muros de adobe, la Plaza, la cárcel, la cantina y la estación del tren.<\/li><li><b>Sin armas ni pistolas.<\/b><\/li><li><b>Con respeto:<\/b> los pueblos nativo, hispano, afroamericano, chino y anglo del Viejo Oeste se dibujan como personas, no como caricaturas. No debe aparecer vestimenta sagrada o ceremonial, incluidos los penachos.<\/li><\/ul><p>La guía de estilo completa, con películas, libros e historia para inspirarse, está en la página del concurso: <a href=\"https://burnzozobra.com/z27artcontest/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/z27artcontest<\/a>.<\/p>"}, {"id": "artfiles", "title": "Sizes, files & how to enter", "title_es": "Tamaños, archivos y cómo inscribirse", "terms": ["dimensions|12", "file type|14", "file format|14", "file size|14", "jpg|10", "jpeg|10", "png|10", "tiff|10", "pdf|8", "resolution|12", "dpi|12", "upload|10", "how do i submit|16", "how to submit|16", "submit illustrations|16", "submit my illustration|16", "entry form|14", "mail my art|14", "hand deliver|14", "boys and girls club|14", "valentine way|14", "po box|12", "multiple entries|14", "how many entries|14", "how many can i submit|16", "one form|10", "dimensiones|6", "tipo de archivo|8", "como me inscribo|8", "como envio|8", "formulario de inscripcion|8", "enviar por correo|7", "entregar en persona|8", "club de ninos|6", "cuantas obras|7", "art size|16", "artwork size|16", "size requirement|16", "what size should my art be|18", "how big should|14", "drop off my art|16", "more than one piece|16", "more than one entry|16", "enter the contest|16", "enter the art contest|18", "how do i enter the contest|18", "mail my entry|16", "more than one design|18", "enter more than one|18", "submit more than one|18", "multiple designs|16", "mas de un diseno|8"], "related": ["artcontest", "artprize", "artyouth"], "a": "<h3>Sizes, files and how to enter<\/h3><ul><li><b>Official Poster<\/b> (all ages): must scale to 24″ wide × 36″ high.<\/li><li><b>Official T-Shirt<\/b> (all ages): 9″ wide × 11″ high.<\/li><li><b>Youth Poster<\/b> (up to age 15): 11″ wide × 14″ high.<\/li><li><b>Youth T-Shirt<\/b> (up to age 15): 9″ wide × 11″ high.<\/li><\/ul><p><b>Online (preferred):<\/b> use the entry form at <a href=\"https://burnzozobra.com/z27artcontest/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/z27artcontest<\/a>. One image per form, as a JPG, PNG, TIFF or PDF up to 25 MB. <b>Entering more than one piece? Fill out a separate form for each.<\/b> Online entries are printed on 8.5″ × 11″ white paper for the judges.<\/p><p><b>By mail:<\/b> P.O. Box 622, Santa Fe, NM 87504. Mail can be slow, and Kiwanis is not responsible for late, lost or damaged mail.<\/p><p><b>By hand:<\/b> Boys &amp; Girls Clubs of Santa Fe/Del Norte, 6600 Valentine Way, Santa Fe, Monday through Friday, 3–5 p.m. Use the main double doors and tell the receptionist you are delivering Zozobra art. Include the <a href=\"https://burnzozobra.com/wp-content/uploads/2026/09/2027_Z-ArtistAgreement-1.pdf\" target=\"_blank\" rel=\"noopener\">2027 artist agreement<\/a> and package your work securely.<\/p><p><b>All entries are due Friday, January 29, 2027, at 5 p.m.<\/b><\/p><p class=\"fine\">Put an email address and a cell number on your entry so we can reach you.<\/p>", "a_es": "<h3>Tamaños, archivos y cómo inscribirse<\/h3><ul><li><b>Póster Oficial<\/b> (todas las edades): debe poder escalarse a 24″ de ancho × 36″ de alto.<\/li><li><b>Camiseta Oficial<\/b> (todas las edades): 9″ de ancho × 11″ de alto.<\/li><li><b>Póster Juvenil<\/b> (hasta 15 años): 11″ de ancho × 14″ de alto.<\/li><li><b>Camiseta Juvenil<\/b> (hasta 15 años): 9″ de ancho × 11″ de alto.<\/li><\/ul><p><b>En línea (preferido):<\/b> use el formulario en <a href=\"https://burnzozobra.com/z27artcontest/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/z27artcontest<\/a>. Una imagen por formulario, en JPG, PNG, TIFF o PDF de hasta 25 MB. <b>¿Inscribe más de una obra? Llene un formulario para cada una.<\/b> Las obras enviadas en línea se imprimen en papel blanco de 8.5″ × 11″ para los jueces.<\/p><p><b>Por correo:<\/b> P.O. Box 622, Santa Fe, NM 87504. El correo puede tardar, y Kiwanis no se hace responsable del correo tardío, perdido o dañado.<\/p><p><b>En persona:<\/b> Boys &amp; Girls Clubs of Santa Fe/Del Norte, 6600 Valentine Way, Santa Fe, de lunes a viernes de 3 a 5 p.m. Entre por las puertas dobles principales y diga en recepción que entrega arte de Zozobra. Incluya el <a href=\"https://burnzozobra.com/wp-content/uploads/2026/09/2027_Z-ArtistAgreement-1.pdf\" target=\"_blank\" rel=\"noopener\">acuerdo del artista 2027<\/a> y empaque bien su obra.<\/p><p><b>Todas las obras vencen el viernes 29 de enero de 2027 a las 5 p.m.<\/b><\/p><p class=\"fine\">Ponga un correo electrónico y un número de celular en su inscripción para poder comunicarnos con usted.<\/p>"}, {"id": "artprize", "title": "Prizes, judging & winners", "title_es": "Premios, jueces y ganadores", "terms": ["prize|12", "prizes|12", "what do winners get|16", "what do i win|16", "winner|10", "winners|10", "vip tickets|12", "judging|14", "judges|12", "judged|12", "when are winners announced|16", "when will i know|14", "ticket art|14", "ticket image|14", "ticket design|14", "tickets image|12", "premio|6", "premios|6", "que ganan|8", "ganador|5", "ganadores|5", "boletos vip|6", "jueces|6", "evaluacion|5", "cuando anuncian|8", "arte del boleto|7", "winners announced|16", "when will winners be announced|18", "who wins|12", "anuncian a los ganadores|8"], "related": ["artcontest", "artrights", "artexhibit"], "a": "<h3>What winners receive<\/h3><p><b>Winning artists receive VIP tickets<\/b> to the 103rd Burning of Zozobra on Friday, September 3, 2027, and their art becomes the year’s official merchandise, seen by thousands of Zozobra fans. Your entry may be considered for the poster, the T-shirt, or both, and additional artwork is selected for promotional content throughout the year.<\/p><p><b>Judging is finished in April<\/b>, so the winning designs are on merchandise when tickets go on sale Tuesday, April 13, 2027.<\/p><p>Best of all, the net proceeds of poster and T-shirt sales go back to our community as grants to nonprofits that make life better for New Mexico kids.<\/p><p class=\"fine\">Not chosen? You are invited to show that same piece at the Zozobra Art Exhibit at ZozoFest this summer.<\/p>", "a_es": "<h3>Lo que reciben los ganadores<\/h3><p><b>Los artistas ganadores reciben boletos VIP<\/b> para la 103.ª Quema de Zozobra el viernes 3 de septiembre de 2027, y su arte se convierte en la mercancía oficial del año, vista por miles de aficionados de Zozobra. Su obra puede considerarse para el póster, la camiseta o ambos, y se selecciona arte adicional para contenido promocional durante el año.<\/p><p><b>La evaluación termina en abril<\/b>, para que los diseños ganadores estén en la mercancía cuando los boletos salgan a la venta el martes 13 de abril de 2027.<\/p><p>Y lo mejor: las ganancias netas de la venta de pósters y camisetas regresan a nuestra comunidad como donativos a organizaciones sin fines de lucro que mejoran la vida de los niños de Nuevo México.<\/p><p class=\"fine\">¿No fue seleccionado? Lo invitamos a exhibir esa misma obra en la Exposición de Arte de Zozobra en ZozoFest este verano.<\/p>"}, {"id": "artyouth", "title": "Young artists & parents", "title_es": "Artistas jóvenes y padres", "terms": ["young artist|16", "young artists|16", "youth category|16", "youth categories|16", "under 15|14", "age limit|14", "parent signature|14", "artista joven|8", "artistas jovenes|8", "categoria juvenil|8", "menor de 18|7", "menor de 15|7", "firma del padre|7", "can my child enter|18", "can my kid enter|18", "child enter|20", "kid enter|20", "year old enter|20", "year old|8", "kids enter the contest|18", "youth poster|16", "youth shirt|16", "youth t shirt|16", "parent sign|14", "how old do you have to be|7", "how old to enter|18", "age requirement|16", "edad minima|8", "puede participar mi hijo|10", "poster juvenil|8", "camiseta juvenil|8"], "related": ["artfiles", "artcontest", "begloomie"], "a": "<h3>Young artists welcome<\/h3><p>The <b>Youth Poster<\/b> and <b>Youth T-Shirt<\/b> categories are open to artists <b>up to age 15<\/b>. Young artists may also enter the Official Poster and Official T-Shirt, which are open to all ages.<\/p><ul><li>If the artist is <b>under 18<\/b>, a parent or guardian signs the entry form, and a parent’s email and cell number are fine for contact.<\/li><li>Youth Poster art must scale to 11″ × 14″; Youth T-Shirt art to 9″ × 11″.<\/li><li>The same rules apply: Zozobra the Kid as the star, the artist’s own original work, no AI, and no weapons or guns.<\/li><\/ul><p><b>Due Friday, January 29, 2027, at 5 p.m.<\/b> Enter at <a href=\"https://burnzozobra.com/z27artcontest/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/z27artcontest<\/a>.<\/p>", "a_es": "<h3>Bienvenidos los artistas jóvenes<\/h3><p>Las categorías de <b>Póster Juvenil<\/b> y <b>Camiseta Juvenil<\/b> están abiertas a artistas <b>de hasta 15 años<\/b>. Los artistas jóvenes también pueden participar en el Póster Oficial y la Camiseta Oficial, que están abiertos a todas las edades.<\/p><ul><li>Si el artista es <b>menor de 18 años<\/b>, un padre, madre o tutor firma el formulario, y se puede usar el correo y el celular de uno de ellos.<\/li><li>El arte del Póster Juvenil debe poder escalarse a 11″ × 14″; el de la Camiseta Juvenil, a 9″ × 11″.<\/li><li>Aplican las mismas reglas: Zozobra the Kid como estrella, obra original del artista, nada de IA y nada de armas ni pistolas.<\/li><\/ul><p><b>Fecha límite: viernes 29 de enero de 2027 a las 5 p.m.<\/b> Inscríbase en <a href=\"https://burnzozobra.com/z27artcontest/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/z27artcontest<\/a>.<\/p>"}, {"id": "artrights", "title": "Rights & getting your art back", "title_es": "Derechos y devolución de su obra", "terms": ["rights|12", "copyright|14", "who owns|14", "who owns my art|18", "ownership|12", "own my art|16", "keep my art|14", "get my art back|18", "return my art|18", "pick up my art|14", "artist agreement|16", "agreement|10", "indemnification|12", "derechos|6", "derechos de autor|8", "licencia|6", "quien es dueno|8", "devuelven mi obra|8", "recoger mi obra|8", "acuerdo del artista|8", "art license|14", "copyright license|16", "original back|18", "get it back|16", "my original|12"], "related": ["artfiles", "artprize", "trademark"], "a": "<h3>Your art and your rights<\/h3><p>When you enter, you certify that the piece is your original work and does not copy or include anyone else’s copyrighted work. You grant the Kiwanis Club of Santa Fe a <b>non-exclusive license<\/b> to use your entry, including to display, reproduce, license, adapt and make merchandise from it, for the full term of copyright. The agreement also states that the submitted entry becomes the property of the Kiwanis Club.<\/p><p><b>Getting mailed or hand-delivered work back:<\/b> arrangements are made after judging is finished in April. Artists who submit hard-copy work are responsible for contacting us to get it back, so put your full contact information on your entry form.<\/p><p class=\"fine\">Read the full artist agreement on the entry form at <a href=\"https://burnzozobra.com/z27artcontest/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/z27artcontest<\/a> before you sign. Questions: <a href=\"mailto:art@burnzozobra.com\">art@burnzozobra.com<\/a>.<\/p>", "a_es": "<h3>Su arte y sus derechos<\/h3><p>Al inscribirse, usted certifica que la obra es original suya y que no copia ni incluye obra protegida por derechos de autor de otra persona. Usted otorga al Club Kiwanis de Santa Fe una <b>licencia no exclusiva<\/b> para usar su obra, lo que incluye exhibirla, reproducirla, licenciarla, adaptarla y hacer mercancía con ella, durante todo el plazo de los derechos de autor. El acuerdo también establece que la obra inscrita pasa a ser propiedad del Club Kiwanis.<\/p><p><b>Devolución de obras enviadas por correo o entregadas en persona:<\/b> se coordina después de que termina la evaluación en abril. Los artistas que entregan obra física son responsables de comunicarse con nosotros para recuperarla, así que ponga todos sus datos de contacto en el formulario.<\/p><p class=\"fine\">Lea el acuerdo del artista completo en el formulario en <a href=\"https://burnzozobra.com/z27artcontest/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/z27artcontest<\/a> antes de firmar. Preguntas: <a href=\"mailto:art@burnzozobra.com\">art@burnzozobra.com<\/a>.<\/p>"}, {"id": "whycharge", "title": "Why is there a charge?", "title_es": "¿Por qué se cobra?", "terms": ["why is there a charge|14", "why do you charge|14", "why does it cost|14", "why isnt it free|14", "why is it not free|14", "used to be free|14", "why tickets|10", "why so expensive|12", "too expensive|10", "why pay|10", "where does ticket money go|12", "por que se cobra|8", "por que cobran|8", "por que cuesta|8", "por que no es gratis|8", "antes era gratis|8", "por que hay boletos|6", "por que tan caro|7", "muy caro|5", "demasiado caro|5", "por que pagar|6", "a donde va el dinero de los boletos|7", "cobrar|3", "gratis"], "related": ["money", "tickets", "history"], "a": "<h3>Why Zozobra has tickets<\/h3><p>The first burn in 1924 was free. Later there was a small per-car fee, and for decades the Kiwanis simply passed the hat: $1, then $3, $5, $10. After 9/11, the cost of securing a crowd this size made ticketing necessary.<\/p><p>Today, tickets and merchandise pay the bills for an event produced entirely by volunteers: security, staging, fireworks, shuttles, the late train. <b>Whatever is left goes to children’s nonprofits<\/b> through the Santa Fe Downtown Kiwanis Foundation. There are no credit card or processing fees on tickets, kids 10 and under are free in General Admission, and New Mexico residents, seniors, students and military all get a discount.<\/p>", "a_es": "<h3>Por qué Zozobra tiene boletos<\/h3><p>La primera quema, en 1924, fue gratis. Más tarde hubo una pequeña cuota por auto, y durante décadas los Kiwanis simplemente pasaban el sombrero: $1, luego $3, $5, $10. Después del 11 de septiembre (9/11), el costo de proteger a una multitud de este tamaño hizo necesaria la venta de boletos.<\/p><p>Hoy, los boletos y la mercancía pagan las cuentas de un evento producido en su totalidad por voluntarios: seguridad, escenario, fuegos artificiales, autobuses gratuitos (shuttles), el tren nocturno. <b>Todo lo que sobra va a organizaciones sin fines de lucro para niños<\/b> por medio de la Santa Fe Downtown Kiwanis Foundation. Los boletos no tienen cargos por tarjeta de crédito ni por procesamiento, los niños de 10 años o menos entran gratis en General Admission (entrada general), y los residentes de Nuevo México, las personas mayores, los estudiantes y los militares reciben descuento.<\/p>"}, {"id": "premiumlist", "title": "Premium sections: what each one is", "title_es": "Secciones premium: qué es cada una", "terms": ["premium sections|12", "list of sections|12", "which section|10", "compare sections|12", "ultimate zozobra experience|14", "uze|12", "ultimate|8", "front and center|14", "fire pit|14", "z zone|14", "z-zone|14", "zzone|14", "east of the beast|14", "west of the wild one|14", "embers edge|14", "whole enchilada|14", "stacked and delivered|14", "just delivered|12", "walk-in|8", "marshmallow|10", "la fonda dinner|10", "best seats|10", "best section|12", "closest to zozobra|12", "secciones premium|7", "lista de secciones|6", "cual seccion|5", "comparar secciones|7", "ultimate zozobra experience|8", "uze|6", "front and center|8", "fire pit|8", "z zone|8", "z-zone|8", "east of the beast|8", "west of the wild one|8", "embers edge|8", "whole enchilada|8", "stacked and delivered|8", "just delivered|7", "malvaviscos|5", "cena en la fonda|5", "mejores asientos|6", "lo mas cerca de zozobra|6"], "related": ["premium", "backdraft", "premiumemail"], "a": "<h3>The premium sections<\/h3><p>2027 sections and prices post when tickets open on April 13. For reference, these were the 2026 sections with their regular online prices:<\/p><ul><li><b>Ultimate Zozobra Experience<\/b> ($344.99, ages 6+): standing; dinner at La Fonda, a blanket, the beach ball toss, and a marshmallow roast on the embers.<\/li><li><b>Front and Center<\/b> ($109.99): standing, about 100 feet from Zozobra.<\/li><li><b>Fire Pit<\/b> ($104.99): standing, about 110 feet.<\/li><li><b>Z-Zone<\/b> ($169.99): seated platform, with coach delivery and snacks.<\/li><li><b>West of the Wild One<\/b> ($74.99): raised standing, about 175 feet.<\/li><li><b>East of the Beast<\/b> ($65.99): standing, about 145 feet. Zozobra faces this side.<\/li><li><b>Embers Edge<\/b> ($49.99): seated. The sun is in your eyes until about 7 p.m.<\/li><li><b>Whole Enchilada<\/b>, three ways: <b>Stacked &amp; Delivered<\/b> ($269.99, seated upper tier, coach delivery, about 30 stairs), <b>Just Delivered<\/b> ($219.99, seated lower tier, coach delivery), and <b>Walk-In<\/b> ($99.99, seated lower tier, you arrive on your own).<\/li><li><b>Backdraft Balcony<\/b> ($42.99): 200 seats six feet above the field.<\/li><\/ul><p class=\"fine\">Every person in a premium section needs a ticket regardless of age, discounts do not apply, and you should be in your section by 8:45 p.m. Early-bird prices were lower and day-of prices higher.<\/p>", "a_es": "<h3>Las secciones premium<\/h3><p>Las secciones y los precios de 2027 se publican cuando se abre la venta de boletos el 13 de abril. Como referencia, estas fueron las secciones de 2026 con sus precios regulares en línea:<\/p><ul><li><b>Ultimate Zozobra Experience<\/b> ($344.99, de 6 años en adelante): de pie; cena en La Fonda, una cobija, el lanzamiento de pelotas de playa y una asada de malvaviscos sobre las brasas.<\/li><li><b>Front and Center<\/b> ($109.99): de pie, a unos 100 pies de Zozobra.<\/li><li><b>Fire Pit<\/b> ($104.99): de pie, a unos 110 pies.<\/li><li><b>Z-Zone<\/b> ($169.99): plataforma con asientos, con traslado en autobús y botanas.<\/li><li><b>West of the Wild One<\/b> ($74.99): de pie en área elevada, a unos 175 pies.<\/li><li><b>East of the Beast<\/b> ($65.99): de pie, a unos 145 pies. Zozobra mira hacia este lado.<\/li><li><b>Embers Edge<\/b> ($49.99): con asientos. El sol le da en los ojos hasta alrededor de las 7 p.m.<\/li><li><b>Whole Enchilada<\/b>, en tres versiones: <b>Stacked &amp; Delivered<\/b> ($269.99, asientos en el nivel superior, traslado en autobús, unos 30 escalones), <b>Just Delivered<\/b> ($219.99, asientos en el nivel inferior, traslado en autobús) y <b>Walk-In<\/b> ($99.99, asientos en el nivel inferior, usted llega por su cuenta).<\/li><li><b>Backdraft Balcony<\/b> ($42.99): 200 asientos a seis pies sobre el campo.<\/li><\/ul><p class=\"fine\">Cada persona en una sección premium necesita boleto sin importar su edad, no se aplican descuentos, y debe estar en su sección a más tardar a las 8:45 p.m. Los precios de preventa anticipada fueron más bajos y los del día del evento, más altos.<\/p>"}, {"id": "yearround", "title": "Zozobra year-round", "title_es": "Zozobra todo el año", "terms": ["year round|12", "year-round|12", "rest of the year|12", "other events|12", "what else|8", "calendar|8", "steam night|12", "balloon museum|12", "hot air balloon|14", "zozobra balloon|14", "balloon fiesta|12", "pint glass|12", "school presentation|12", "visit my school|12", "come to our school|12", "classroom|8", "zozobra book|10", "zozobra beer|10", "july 4|8", "todo el ano|7", "durante el ano|6", "resto del ano|7", "otros eventos|7", "que mas hay|4", "calendario|5", "steam night|7", "noche steam|6", "museo del globo|6", "globo aerostatico|8", "globo de zozobra|8", "fiesta de globos|7", "balloon fiesta|7", "vaso de pinta|7", "vaso coleccionable|6", "presentacion en la escuela|7", "visitar mi escuela|7", "salon de clases|4", "libro de zozobra|6", "4 de julio|5"], "related": ["stuffday", "artcontest", "anthem"], "a": "<h3>There is Zozobra all year<\/h3><ul><li><b>January:<\/b> the Official Art Contest for posters and T-shirts closes January 29, 2027, and Zozobra STEAM Night is held at the Albuquerque Balloon Museum. Volunteer sign-up opens January 1.<\/li><li><b>January–May:<\/b> school presentations built around the Zozobra book.<\/li><li><b>April 13, 2027:<\/b> tickets and the 103rd merchandise go on sale.<\/li><li><b>May:<\/b> Public Stuff Day.<\/li><li><b>May–June:<\/b> the collectible pint glass program at local restaurants.<\/li><li><b>After April 13:<\/b> call for artists for the Zozobra Art Exhibit at ZozoFest; entries due Monday, August 2.<\/li><li><b>June 1:<\/b> Gloomie audition applications open (they close July 16).<\/li><li><b>July:<\/b> Gloomie auditions (July 17), National Anthem auditions (July 24), gloom boxes open around town, and Zozobra joins Santa Fe’s July 4th celebration.<\/li><li><b>Late August:<\/b> ZozoFest. <b>September 3:<\/b> the burn.<\/li><li><b>Fall:<\/b> the Zozobra hot air balloon flies at balloon events around the region, including the Albuquerque International Balloon Fiesta.<\/li><\/ul><p class=\"fine\">2027 dates are posted at <a href=\"https://burnzozobra.com\" target=\"_blank\" rel=\"noopener\">burnzozobra.com<\/a> as they are set.<\/p>", "a_es": "<h3>Hay Zozobra todo el año<\/h3><ul><li><b>Enero:<\/b> el Concurso Oficial de Arte para pósters y camisetas cierra el 29 de enero de 2027, y se celebra la Zozobra STEAM Night en el Balloon Museum de Albuquerque. La inscripción de voluntarios abre el 1 de enero.<\/li><li><b>Enero–mayo:<\/b> presentaciones en escuelas basadas en el libro de Zozobra.<\/li><li><b>13 de abril de 2027:<\/b> salen a la venta los boletos y la mercancía de la 103.ª.<\/li><li><b>Mayo:<\/b> Public Stuff Day (el día público para rellenar a Zozobra).<\/li><li><b>Mayo–junio:<\/b> el programa de vasos de pinta coleccionables en restaurantes locales.<\/li><li><b>Después del 13 de abril:<\/b> convocatoria para artistas para la Exposición de Arte de Zozobra en ZozoFest; las obras deben inscribirse a más tardar el lunes 2 de agosto.<\/li><li><b>1 de junio:<\/b> abren las solicitudes para la audición de Gloomies (cierran el 16 de julio).<\/li><li><b>Julio:<\/b> audiciones de Gloomies (17 de julio), audiciones del Himno Nacional (24 de julio), se abren por la ciudad las cajas de \"glooms\" (sus penas y preocupaciones), y Zozobra se une a la celebración del 4 de julio de Santa Fe.<\/li><li><b>Finales de agosto:<\/b> ZozoFest. <b>3 de septiembre:<\/b> la quema.<\/li><li><b>Otoño:<\/b> el globo aerostático de Zozobra vuela en eventos de globos por toda la región, incluida la Albuquerque International Balloon Fiesta.<\/li><\/ul><p class=\"fine\">Las fechas de 2027 se publican en <a href=\"https://burnzozobra.com\" target=\"_blank\" rel=\"noopener\">burnzozobra.com<\/a> conforme se van fijando.<\/p>"}, {"id": "zweek", "title": "Zozobra week at Fort Marcy Park", "title_es": "La semana de Zozobra en Fort Marcy Park", "terms": ["zozobra week|14", "week at fort marcy|14", "setup|8", "set up|8", "set-up|8", "setup schedule|12", "permit|8", "park closed|12", "park closures|12", "facility closures|14", "is the park open|12", "when does the park close|14", "when does the park reopen|14", "pickleball|14", "pickle ball|14", "pickleball courts|14", "tennis court|12", "tennis courts|12", "tennis court parking|14", "dog park|14", "rec complex|12", "recreation complex|14", "fort marcy complex|12", "magers|10", "magers field|14", "ballfield|10", "ballpark closed|12", "rehearsal noise|12", "dress rehearsal|8", "sound test|10", "noise|8", "stadium lights|10", "lights at night|8", "blue bus|14", "bus 255|14", "mountain trail|12", "rtd|8", "murales stop|12", "semana de zozobra|8", "semana en fort marcy|8", "montaje|5", "instalacion|4", "permiso|4", "parque cerrado|7", "cierres del parque|7", "cierre de instalaciones|8", "esta abierto el parque|7", "cuando cierra el parque|8", "cuando reabre el parque|8", "pickleball|8", "canchas de tenis|7", "estacionamiento de las canchas de tenis|8", "parque para perros|8", "complejo recreativo|7", "magers field|8", "ruido del ensayo|7", "blue bus|8", "parada murales|7"], "related": ["neighbors", "closures", "raising"], "a": "<h3>Zozobra week at Fort Marcy Park<\/h3><p>The Zozobra permit for the Fort Marcy ballpark takes effect <b>Monday, August 23, 2027, at 12:01 a.m.<\/b>, and the venue reopens <b>Sunday, September 5, at 12 noon<\/b>, when the permit expires.<\/p><ul><li><b>Sat., Aug. 28, 11 a.m.–1 p.m.<\/b>: rehearsal with minimal sound.<\/li><li><b>Wed., Sept. 1, 8–10 p.m.<\/b>: dress rehearsal, with light testing and stadium sound.<\/li><li><b>Fri., Sept. 3, about 9 a.m.<\/b>: Zozobra is raised onto his pole. All are welcome to watch.<\/li><li><b>Fri., Sept. 3<\/b>: gates open at 4 p.m. Zozobra burns at dark, weather and wind permitting. No clock time is published for the burn.<\/li><\/ul><p><b>What closes, and when it reopens:<\/b><\/p><ul><li><b>Fort Marcy ballfield (Zozobra ballfield) and the Murales parking lots<\/b>: close Mon., Aug. 23; reopen Sun., Sept. 5 at noon.<\/li><li><b>Tennis court parking lot<\/b> (next to the pickleball courts): closed from Mon., Aug. 23 so vendors can set up safely. It does <b>not reopen until Tuesday, Sept. 7<\/b>.<\/li><li><b>Pickleball courts<\/b>: open through Tue., Aug. 31; locked at 10 p.m. that night; reopen Sat., Sept. 4 at noon. Players may park on Old Taos Highway from Mon., Aug. 23 through Tue., Aug. 31, and again on Sat., Sept. 4. Thank you to pickleball leadership for working with us to shorten the closure.<\/li><li><b>Dog park<\/b>: closes Tue., Aug. 31 at 10 p.m.; reopens Sat., Sept. 4 at noon.<\/li><li><b>Fort Marcy Recreation Complex<\/b>: closes Tue., Aug. 31 at noon; reopens Sat., Sept. 4 at noon.<\/li><li><b>Magers Field<\/b>: closes Wed., Sept. 1 at noon; reopens Sat., Sept. 4 at noon.<\/li><\/ul><p><b>Blue Bus riders:<\/b> because the north lot on Murales Road is closed, the NM RTD Blue Bus #255 Mountain Trail <b>Murales stop is closed Monday, Aug. 30 through Saturday, Sept. 4<\/b>. Please use the Park and Ride lot at South Capitol Station on Cordova Road.<\/p><p class=\"fine\">Road closures on burn day are a separate answer: ask me about “road closures.” Questions: <a href=\"mailto:neighbors@burnzozobra.com\">neighbors@burnzozobra.com<\/a> or 855-ZOZOBRA.<\/p>", "a_es": "<h3>La semana de Zozobra en Fort Marcy Park<\/h3><p>El permiso de Zozobra para el campo de béisbol de Fort Marcy entra en vigor el <b>lunes 23 de agosto de 2027 a las 12:01 a.m.<\/b>, y el recinto reabre el <b>domingo 5 de septiembre a las 12 del mediodía<\/b>, cuando vence el permiso.<\/p><ul><li><b>Sáb. 28 de agosto, 11 a.m.–1 p.m.<\/b>: ensayo con sonido mínimo.<\/li><li><b>Miér. 1 de septiembre, 8–10 p.m.<\/b>: ensayo general, con pruebas de luces y sonido de estadio.<\/li><li><b>Vie. 3 de septiembre, alrededor de las 9 a.m.<\/b>: levantan a Zozobra sobre su poste. Todos son bienvenidos a mirar.<\/li><li><b>Vie. 3 de septiembre<\/b>: las puertas abren a las 4 p.m. Zozobra arde al oscurecer, si el clima y el viento lo permiten. No se publica una hora exacta para la quema.<\/li><\/ul><p><b>Qué se cierra y cuándo reabre:<\/b><\/p><ul><li><b>Campo de béisbol de Fort Marcy (campo de béisbol de Zozobra) y los estacionamientos de Murales<\/b>: cierran el lun. 23 de agosto; reabren el dom. 5 de septiembre al mediodía.<\/li><li><b>Estacionamiento de las canchas de tenis<\/b> (junto a las canchas de pickleball): cerrado desde el lun. 23 de agosto para que los vendedores puedan instalarse con seguridad. <b>No reabre hasta el martes 7 de septiembre<\/b>.<\/li><li><b>Canchas de pickleball<\/b>: abiertas hasta el mar. 31 de agosto; se cierran con llave a las 10 p.m. esa noche; reabren el sáb. 4 de septiembre al mediodía. Los jugadores pueden estacionarse en Old Taos Highway del lun. 23 de agosto al mar. 31 de agosto, y otra vez el sáb. 4 de septiembre. Gracias a los líderes de pickleball por trabajar con nosotros para acortar el cierre.<\/li><li><b>Parque para perros<\/b>: cierra el mar. 31 de agosto a las 10 p.m.; reabre el sáb. 4 de septiembre al mediodía.<\/li><li><b>Fort Marcy Recreation Complex (complejo recreativo)<\/b>: cierra el mar. 31 de agosto al mediodía; reabre el sáb. 4 de septiembre al mediodía.<\/li><li><b>Magers Field<\/b>: cierra el miér. 1 de septiembre al mediodía; reabre el sáb. 4 de septiembre al mediodía.<\/li><\/ul><p><b>Pasajeros del Blue Bus:<\/b> debido a que el estacionamiento norte en Murales Road está cerrado, en la ruta Blue Bus #255 Mountain Trail de NM RTD la <b>parada Murales está cerrada del lunes 30 de agosto al sábado 4 de septiembre<\/b>. Por favor use el estacionamiento Park and Ride en South Capitol Station, sobre Cordova Road.<\/p><p class=\"fine\">Los cierres de calles el día de la quema son una respuesta aparte: pregúnteme por “cierres de calles”. Preguntas: <a href=\"mailto:neighbors@burnzozobra.com\">neighbors@burnzozobra.com<\/a> o 855-ZOZOBRA.<\/p>"}, {"id": "made", "title": "How is he built?", "title_es": "¿Cómo lo construyen?", "terms": ["made|3", "tall", "height", "weigh", "size", "frame", "pizza", "duct tape", "wood", "paper", "build", "construct", "hecho|3", "de que esta hecho|4", "como lo construyen|4", "alto", "altura", "cuanto mide", "cuanto pesa", "peso", "tamano", "estructura", "cinta", "madera", "papel", "construir", "construyen"], "related": ["what", "gloom"], "a": "<h3>Wood, wire, cloth — and pizza pans<\/h3><p>Zozobra stands <b>50 feet 6 inches<\/b>. He's built from wood, wire, poultry netting, cotton cloth, nails, screws, pulleys, plywood, spray paint, pizza pans and duct tape, then stuffed with shredded paper — including the glooms you submit. He weighs roughly <b>3,000 pounds<\/b> before the burn. Volunteers build him every year.<\/p>", "a_es": "<h3>Madera, alambre, tela — y charolas para pizza<\/h3><p>Zozobra mide <b>50 pies 6 pulgadas<\/b> de alto. Está hecho de madera, alambre, malla gallinera, tela de algodón, clavos, tornillos, poleas, triplay, pintura en aerosol, charolas para pizza y cinta para ductos (duct tape), y luego lo rellenan con papel triturado — incluidos los \"glooms\" (sus penas y preocupaciones) que usted envía. Pesa aproximadamente <b>3,000 libras<\/b> antes de la quema. Los voluntarios lo construyen cada año.<\/p>"}, {"id": "money", "title": "Where the money goes", "title_es": "A dónde va el dinero", "terms": ["money|3", "charity", "nonprofit", "profit", "proceeds", "kiwanis", "benefit", "cause", "donate", "foundation", "who benefits", "dinero|3", "a donde va el dinero|6", "caridad", "beneficencia|3", "sin fines de lucro|3", "ganancias|3", "kiwanis|3", "club kiwanis|4", "fundacion|2", "donar|3", "donacion|3", "donativo|3", "quien se beneficia|5", "causa", "ninos", "subvenciones|3", "a quien ayuda|4", "para que es el dinero|5"], "related": ["history", "merch", "volunteer"], "a": "<h3>Volunteers, for kids<\/h3><p>The Burning of Zozobra is produced entirely by volunteers from the <b>Kiwanis Club of Santa Fe<\/b> — the city’s first service club, founded in 1921. After the event’s bills are paid, net proceeds go to the <b>Santa Fe Downtown Kiwanis Foundation<\/b> (established 1965) for grants that help the region’s underserved children. Over the years Zozobra has given back <b>$3.2 million<\/b>.<\/p><p>In 2025 alone the Foundation distributed <b>$100,000 in grants<\/b> to organizations that together serve more than <b>24,000 children<\/b> — including Girls Inc., Gerard’s House grief support, Communities In Schools, Cooking with Kids, The Sky Center’s suicide-intervention programs, the Santa Fe Children’s Museum, the National Dance Institute, adaptive sports equipment, and the Rio Arriba Imagination Library’s monthly book deliveries.<\/p><p class=\"fine\">Can’t attend but want to help? The “I’m Not Coming So I’m Pitching In” donation is a suggested $15 — about a movie or two lattes — at <a href=\"https://burnzozobra.com/fundraising/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/fundraising<\/a>. Your ticket, your glooms and your T-shirt all go to the kids.<\/p>", "a_es": "<h3>Voluntarios, por los niños<\/h3><p>La Quema de Zozobra la producen en su totalidad voluntarios del <b>Club Kiwanis de Santa Fe<\/b>, el primer club de servicio de la ciudad, fundado en 1921. Una vez pagadas las cuentas del evento, las ganancias netas van a la <b>Santa Fe Downtown Kiwanis Foundation<\/b> (establecida en 1965) para subvenciones que ayudan a los niños más desatendidos de la región. A lo largo de los años, Zozobra ha devuelto a la comunidad <b>$3.2 millones<\/b>.<\/p><p>Tan solo en 2025, la Fundación distribuyó <b>$100,000 en subvenciones<\/b> a organizaciones que en conjunto atienden a más de <b>24,000 niños<\/b>, entre ellas Girls Inc., el apoyo en el duelo de Gerard’s House, Communities In Schools, Cooking with Kids, los programas de intervención contra el suicidio de The Sky Center, el Santa Fe Children’s Museum, el National Dance Institute, equipo deportivo adaptado y las entregas mensuales de libros de la Rio Arriba Imagination Library.<\/p><p class=\"fine\">¿No puede asistir pero quiere ayudar? La donación “I’m Not Coming So I’m Pitching In” (“No voy, pero coopero”) es de $15 sugeridos, más o menos lo que cuesta una película o dos lattes, en <a href=\"https://burnzozobra.com/fundra
