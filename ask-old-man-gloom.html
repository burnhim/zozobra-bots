bo ir|12"], "related": ["firsttime", "reviews", "tips", "zozofest"], "a": "<h3>Yes, and it’s a new show every year<\/h3><p>Every year Zozobra arrives in a brand-new disguise with a brand-new theme, so whether it’s your first burn or your fiftieth, you’ll see something you’ve never seen before. There is nothing else like it: a fifty-foot marionette groaning and thrashing above a crowd of tens of thousands, fire dancing, fireworks, and a whole city chanting “Burn him!” in one voice. It has happened for over a century, and people who come once tend to come back.<\/p><p><b>What people tell us:<\/b> first-timers call it an awesome experience. Longtime fans say they’ve been twenty times since they were kids and it’s still the most underrated show in New Mexico. Parents say their kids love anything Zozobra. And one of our favorite reviews is also the shortest: if you haven’t been yet, what are you waiting for?<\/p><p>It’s a good deal, too. Kids 10 and under are free in General Admission, there are no ticket fees, and everything left over goes to local children’s nonprofits.<\/p><p>Know what you’re signing up for: a big crowd, a walk from the shuttle, a loud show after dark, and security screening at the gate. If that sounds like a lot, meet Zozobra up close for free at <b>ZozoFest<\/b> the week before.<\/p><p class=\"note\">Coming for the first time? Read the <a href=\"https://burnzozobra.com/first-timers-guide/\" target=\"_blank\" rel=\"noopener\">First Timer’s Guide<\/a>.<\/p>", "a_es": "<h3>Sí, y cada año es un espectáculo nuevo<\/h3><p>Cada año Zozobra llega con un disfraz y un tema completamente nuevos, así que sea su primera quema o la número cincuenta, verá algo que nunca ha visto. No hay nada igual: una marioneta de cincuenta pies que gime y se retuerce sobre una multitud de decenas de miles, danza de fuego, fuegos artificiales y toda una ciudad gritando “¡Quémenlo!” a una sola voz. Sucede desde hace más de un siglo, y quien viene una vez suele regresar.<\/p><p><b>Lo que nos dice la gente:<\/b> quienes vienen por primera vez dicen que es una experiencia increíble. Los fieles de siempre cuentan que han venido veinte veces desde niños y que sigue siendo el espectáculo más subestimado de Nuevo México. Los papás dicen que a sus hijos les encanta todo lo de Zozobra. Y una de nuestras reseñas favoritas es la más corta: si todavía no ha venido, ¿qué espera?<\/p><p>Además, es una buena oferta. Los niños de 10 años o menos entran gratis en Admisión General, no hay cargos por boleto, y todo lo que sobra va a organizaciones locales para niños.<\/p><p>Sepa a lo que viene: una gran multitud, una caminata desde el autobús gratuito, un espectáculo ruidoso de noche y revisión de seguridad en la entrada. Si le parece mucho, conozca a Zozobra de cerca y gratis en <b>ZozoFest<\/b> la semana anterior.<\/p><p class=\"note\">¿Viene por primera vez? Lea la <a href=\"https://burnzozobra.com/first-timers-guide/\" target=\"_blank\" rel=\"noopener\">guía para principiantes (First Timer’s Guide)<\/a>.<\/p>"}, {"id": "same", "title": "Is Zozobra the same every year?", "title_es": "¿Zozobra es igual cada año?", "terms": ["same every year|16", "the same every year|16", "look the same|14", "same zozobra|14", "same one|10", "reuse|12", "reused|12", "does he change|14", "is he different|12", "new zozobra every year|16", "build a new one|14", "new one every year|14", "igual cada ano|16", "es igual|12", "se ve igual|14", "el mismo zozobra|14", "lo reutilizan|12", "cambia cada ano|14", "es diferente|10", "uno nuevo cada ano|14", "hacen uno nuevo|14"], "related": ["whythemes", "theme", "lastyear"], "a": "<h3>At heart, always. On the outside, never<\/h3><p>The heart of him never changes: the white body, the bow tie, the ghost tail where legs should be, the groans, the Fire Spirit, the chant and the fire.<\/p><p>What changes is his costume. Every year he arrives in a new disguise, hoping it will help him win this time. In 2026 he was a tyrant king; in 2027 he rides in as <b>Zozobra the Kid<\/b>, an outlaw made of every villain of the Old West. The costume changes; the ending doesn’t.<\/p><p>Longtime fans agree: after twenty burns, it’s still a little different every year.<\/p><p class=\"fine\">Ask me “why does Zozobra change every year?” for the story behind the themes.<\/p>", "a_es": "<h3>En el fondo, siempre. Por fuera, nunca<\/h3><p>Lo esencial de él nunca cambia: el cuerpo blanco, el corbatín de moño, la cola de fantasma donde deberían ir las piernas, los gemidos, el Espíritu del Fuego (Fire Spirit), el coro y el fuego.<\/p><p>Lo que cambia es su disfraz. Cada año llega con uno nuevo, con la esperanza de que esta vez le ayude a ganar. En 2026 fue un rey tirano; en 2027 llega cabalgando como <b>Zozobra the Kid<\/b>, un forajido hecho de todos los villanos del Viejo Oeste. El disfraz cambia; el final no.<\/p><p>Los fieles de siempre lo confirman: después de veinte quemas, cada año sigue siendo un poco diferente.<\/p><p class=\"fine\">Pregúnteme “¿por qué Zozobra cambia cada año?” para conocer la historia detrás de los temas.<\/p>"}, {"id": "firsttime", "title": "First time? What to expect", "title_es": "¿Primera vez? Qué esperar", "terms": ["first time|14", "first timer|14", "my first zozobra|16", "never been before|14", "what to expect|16", "what should i expect|16", "what happens at zozobra|16", "what happens|8", "what is it like|12", "how does the night go|14", "how does it work|10", "walk me through|12", "anything i should know|14", "need to know|12", "tips|8", "advice|6", "primera vez|14", "mi primera zozobra|16", "nunca he ido|12", "que esperar|16", "que debo esperar|16", "que pasa en zozobra|16", "que pasa|6", "como es|8", "como es la noche|14", "como funciona|8", "que debo saber|14", "consejos|8", "good for first timers|18", "is it good for first timers|18", "good for a first timer|16", "first timers guide|18", "first timer guide|18", "first time guide|16", "newbie|10", "primera vez|14", "guia para principiantes|16"], "related": ["tips", "times", "parking", "bring"], "a": "<h3>Your first Zozobra<\/h3><p>Good choice. First-timers tell us it’s an awesome experience.<\/p><p>Plan on an evening, not an hour. <b>Gates open at 4:00 p.m.<\/b> with live music, food and the beer garden going from the start. Official ceremonies begin at 6:00. <b>Be inside by 8:45.<\/b><\/p><p>As it gets dark, a drone show lights the sky, the National Anthem is sung, and the pageant begins. Zozobra groans and threatens the city, the Gloomies (children in white) dance around him, the Torchbearers try and fail, and then the whole crowd chants <b>“Burn him!”<\/b> until the Fire Spirit appears. He burns, a 15-minute fireworks finale follows, and the band plays “La Fiesta de Santa Fe.”<\/p><p class=\"note\">Wear comfortable shoes, bring a layer and a clear bag, and screenshot your ticket, because cell service is limited.<\/p><p>For the full rundown, read the <a href=\"https://burnzozobra.com/first-timers-guide/\" target=\"_blank\" rel=\"noopener\">First Timer’s Guide<\/a>.<\/p>", "a_es": "<h3>Su primera Zozobra<\/h3><p>Buena decisión. Quienes vienen por primera vez dicen que es una experiencia increíble.<\/p><p>Planee una velada, no una hora. <b>Las puertas abren a las 4:00 p.m.<\/b> con música en vivo, comida y el jardín cervecero (beer garden) funcionando desde el inicio. Las ceremonias oficiales comienzan a las 6:00. <b>Esté adentro a más tardar a las 8:45.<\/b><\/p><p>Al oscurecer, un espectáculo de drones ilumina el cielo, se canta el Himno Nacional y comienza la representación. Zozobra gime y amenaza a la ciudad, los Gloomies (niños vestidos de blanco) bailan a su alrededor, los Portadores de Antorchas lo intentan y fracasan, y entonces toda la multitud corea <b>“Burn him!” (¡Quémenlo!)<\/b> hasta que aparece el Espíritu del Fuego (Fire Spirit). Él arde, sigue un gran final de 15 minutos de fuegos artificiales, y la banda toca “La Fiesta de Santa Fe”.<\/p><p class=\"note\">Use zapatos cómodos, traiga algo para abrigarse y una bolsa transparente, y tome una captura de pantalla de su boleto, porque la señal de celular es limitada.<\/p><p>Para todos los detalles, lea la <a href=\"https://burnzozobra.com/first-timers-guide/\" target=\"_blank\" rel=\"noopener\">guía para principiantes (First Timer’s Guide)<\/a>.<\/p>"}, {"id": "scarykids", "title": "Is Zozobra scary for kids?", "title_es": "¿Zozobra les da miedo a los niños?", "terms": ["scary for kids|18", "scary for children|18", "too scary|16", "is it scary|14", "is zozobra scary|16", "scared|10", "scary|8", "frighten|12", "frightening|12", "afraid|10", "nightmares|14", "will my kid be scared|18", "my child is scared|16", "da miedo|12", "le da miedo a los ninos|18", "les da miedo|16", "asusta|12", "asustan|12", "miedo|8", "se va a asustar|16", "pesadillas|14", "mi hijo tiene miedo|16"], "related": ["kids", "sensory", "zozofest"], "a": "<h3>For some little ones, a bit — and that’s part of the story<\/h3><p>He is a giant who groans, and the show is loud with fire and fireworks. Most kids end up loving it, especially once they understand that the crowd, including them, is the hero who defeats him.<\/p><ul><li>Talk them through the story beforehand.<\/li><li>Bring ear protection.<\/li><li>Pick a spot at the edge of the crowd so stepping away is easy.<\/li><\/ul><p>For a gentler first meeting, bring them to <b>ZozoFest<\/b> the week before, where they can see him up close in daylight and stuff their own glooms inside him.<\/p><p class=\"fine\">Parents tell us their kids love anything Zozobra. And yes, he’s supposed to be a little creepy.<\/p>", "a_es": "<h3>A algunos pequeños, un poco — y eso es parte de la historia<\/h3><p>Es un gigante que gime, y el espectáculo es ruidoso, con fuego y fuegos artificiales. A la mayoría de los niños termina encantándoles, sobre todo cuando entienden que la multitud, incluidos ellos, es el héroe que lo derrota.<\/p><ul><li>Cuénteles la historia antes de ir.<\/li><li>Lleve protección para los oídos.<\/li><li>Escoja un lugar en la orilla de la multitud para que sea fácil apartarse.<\/li><\/ul><p>Para un primer encuentro más tranquilo, llévelos a <b>ZozoFest<\/b> la semana anterior, donde pueden verlo de cerca a la luz del día y meter sus propios “glooms” (sus penas y preocupaciones) dentro de él.<\/p><p class=\"fine\">Los papás nos dicen que a sus hijos les encanta todo lo de Zozobra. Y sí, se supone que da un poquito de miedo.<\/p>"}, {"id": "origins", "title": "Where does the tradition come from?", "title_es": "¿De dónde viene la tradición?", "terms": ["where does it come from|16", "where did it come from|16", "where does the tradition come from|18", "origin of the tradition|16", "is it mexican|16", "mexican tradition|16", "is it native american|16", "native american|12", "indian tradition|12", "is it hispanic|16", "hispanic tradition|14", "spanish tradition|14", "is it a pueblo tradition|16", "pueblo|8", "indigenous|12", "yaqui|10", "la fonda|12", "christmas eve|12", "strips of paper|14", "genesis|12", "how did it start|16", "how did zozobra start|18", "cultural appropriation|14", "appropriation|12", "whose tradition|14", "de donde viene|16", "de donde viene la tradicion|18", "origen de la tradicion|16", "es mexicano|16", "tradicion mexicana|16", "es indigena|16", "nativo americano|12", "indigena|10", "es hispano|16", "tradicion hispana|14", "tradicion espanola|14", "como empezo|16", "como empezo zozobra|18", "nochebuena|12", "tiras de papel|14", "apropiacion cultural|14"], "related": ["history", "shuster", "religion"], "a": "<h3>Zozobra was born in Santa Fe<\/h3><p>It began at <b>La Fonda on Christmas Eve 1923<\/b>. Will Shuster, a painter from Philadelphia and one of Santa Fe’s Cinco Pintores, had his fellow artists write their glooms on strips of paper, and they burned them. That was the genesis of Zozobra.<\/p><p>Later, Shuster traveled to Mexico and watched a Yaqui Holy Week tradition in which a whole village burned an effigy together. In September 1924 he built the first Zozobra, six feet tall, and burned it in his backyard. His friend E. Dana Johnson found the name in a Spanish dictionary: <i>zozobra<\/i> means anxiety, gloom, the feeling of a ship going down.<\/p><p>A century on, it belongs to all of Santa Fe. It is carried by generations of New Mexican families, Hispanic, Native and Anglo alike, and in 2027 the Fire Spirit’s torches pass to Than Povi Martinez of Na Poh’Woh’Geh Owingeh.<\/p><p class=\"note\">Read the full story of Zozobra on our <a href=\"https://burnzozobra.com/history/\" target=\"_blank\" rel=\"noopener\">Myth &amp; History page<\/a>.<\/p>", "a_es": "<h3>Zozobra nació en Santa Fe<\/h3><p>Comenzó en <b>La Fonda, en la Nochebuena de 1923<\/b>. Will Shuster, un pintor de Filadelfia y uno de los Cinco Pintores de Santa Fe, pidió a sus compañeros artistas que escribieran sus “glooms” (sus penas y preocupaciones) en tiras de papel, y las quemaron. Ese fue el origen de Zozobra.<\/p><p>Más tarde, Shuster viajó a México y presenció una tradición yaqui de Semana Santa en la que todo un pueblo quemaba una efigie en conjunto. En septiembre de 1924 construyó el primer Zozobra, de seis pies de alto, y lo quemó en su patio trasero. Su amigo E. Dana Johnson encontró el nombre en un diccionario de español: <i>zozobra<\/i> significa angustia, pesadumbre, la sensación de un barco que se va a pique.<\/p><p>Un siglo después, le pertenece a todo Santa Fe. La mantienen viva generaciones de familias nuevomexicanas, hispanas, nativas y anglo por igual, y en 2027 las antorchas del Espíritu del Fuego (Fire Spirit) pasan a Than Povi Martinez, de Na Poh’Woh’Geh Owingeh.<\/p><p class=\"note\">Lea la historia completa de Zozobra en nuestra página <a href=\"https://burnzozobra.com/history/\" target=\"_blank\" rel=\"noopener\">El Mito y la Historia<\/a>.<\/p>"}, {"id": "gloomhelp", "title": "Does burning my gloom really help?", "title_es": "¿De verdad ayuda quemar mis penas?", "terms": ["does it really help|16", "does it help|12", "does it work|12", "does it really work|16", "really get rid|16", "get rid of my gloom|18", "will it help|12", "make me feel better|14", "does burning help|16", "is it real|8", "therapy|8", "heal|8", "de verdad ayuda|16", "sirve de algo|16", "funciona|8", "de verdad funciona|16", "me va a ayudar|14", "me sentire mejor|14", "quitarme las penas|16", "deshacerme de mis penas|16", "sanar|8"], "related": ["gloom", "burnitem", "inside"], "a": "<h3>Not by magic. By letting go, together<\/h3><p>Writing a worry down and watching it go up in flames won’t pay a bill or heal a heart overnight. What it does is let you name the thing, put it down and walk away from it, surrounded by thousands of people doing the same. That shared moment is the whole point, and people have been coming back for it for a hundred years.<\/p><p>Some bring a note. Some bring divorce papers, a wedding dress or a mortgage finally paid off.<\/p><p class=\"fine\">Ask me about “glooms” to add yours.<\/p>", "a_es": "<h3>No por arte de magia. Por soltar, en conjunto<\/h3><p>Escribir una preocupación y verla arder no va a pagar una cuenta ni a sanar un corazón de la noche a la mañana. Lo que sí hace es permitirle nombrar esa carga, dejarla y alejarse de ella, rodeado de miles de personas que hacen lo mismo. Ese momento compartido es el sentido de todo, y la gente ha vuelto por él durante cien años.<\/p><p>Algunos traen una nota. Otros traen papeles de divorcio, un vestido de novia o una hipoteca por fin liquidada.<\/p><p class=\"fine\">Pregúnteme por los “glooms” (sus penas y preocupaciones) para agregar los suyos.<\/p>"}, {"id": "dress", "title": "Why does Zozobra wear a dress?", "title_es": "¿Por qué Zozobra trae vestido?", "terms": ["wear a dress|16", "wears a dress|16", "wearing a dress|16", "in a dress|14", "does zozobra wear a dress|18", "why does zozobra wear a dress|20", "why is he wearing a dress|20", "why does he wear a dress|20", "skirt|12", "gown|12", "nightgown|14", "robe|8", "is zozobra a woman|16", "is zozobra a girl|16", "is he a woman|14", "trae vestido|16", "usa vestido|16", "lleva vestido|16", "por que trae vestido|20", "por que usa vestido|20", "por que lleva vestido|20", "falda|12", "bata|8", "es mujer|12", "zozobra es mujer|16"], "related": ["ghosttail", "what", "made"], "a": "<h3>That’s not a dress — it’s his ghost tail<\/h3><p>Zozobra isn’t wearing a dress. That long, flowing white shape below his waist is his <b>ghost tail<\/b>. Zozobra is a <b>specter<\/b>, a spirit, not a man, and just like Casper the ghost, <b>he has no legs<\/b>. He doesn’t walk; he hovers, drifts and looms over Fort Marcy.<\/p><p>And the ghost tail matters: at the end of the night, it is what the Fire Spirit finally sets alight.<\/p><p class=\"fine\">Ask me “why does Zozobra have no legs?” for more.<\/p>", "a_es": "<h3>No es un vestido: es su cola de fantasma<\/h3><p>Zozobra no trae vestido. Esa forma blanca, larga y ondulante debajo de su cintura es su <b>cola de fantasma<\/b>. Zozobra es un <b>espectro<\/b>, un espíritu, no un hombre, y al igual que el fantasma Gasparín (Casper), <b>no tiene piernas<\/b>. No camina; flota, va a la deriva y se cierne sobre Fort Marcy.<\/p><p>Y la cola de fantasma importa: al final de la noche, es lo que el Espíritu del Fuego (Fire Spirit) finalmente enciende.<\/p><p class=\"fine\">Pregúnteme “¿por qué Zozobra no tiene piernas?” para saber más.<\/p>"}, {"id": "history", "title": "History", "title_es": "Historia", "terms": ["history|6", "1926", "1933", "1964", "first", "began", "origin|4", "how old|4", "how many years|4", "how long has|4", "tradition", "kiwanis|3", "who runs", "who puts on", "organizer", "timeline|3", "historia|6", "primera", "primera quema|3", "comenzo", "empezo", "origen|4", "cuantos anos tiene|4", "cuantos anos|4", "desde cuando|4", "tradicion", "quien organiza|2", "quien lo organiza|2", "organizador", "cronologia|3", "linea de tiempo|3"], "related": ["shuster", "mythology", "burningman", "documentary"], "a": "<h3>Since 1924<\/h3><p>On Christmas Eve 1923, artist <b>Will “Shus” Shuster<\/b> — one of Santa Fe’s Cinco Pintores — proposed, after a rare sale, that his fellow painters write their troubles on scraps of paper and burn them. The next year, inspired by a Yaqui Good Friday effigy ceremony he’d seen in Mexico, he built the first <b>six-foot effigy<\/b> and burned it in his backyard in September 1924 at a party for his artist circle. He first called it Old Man Groucher; newspaperman E. Dana Johnson found the word <i>zozobra<\/i> in a Spanish dictionary. The name means gloom, anxiety — the feeling of being shipwrecked — in Spanish.<\/p><ul><li><b>1926<\/b> — first public burning: a 20-foot figure, with a procession from the Cathedral<\/li><li><b>1933<\/b> — the burn moves to Fort Marcy Park<\/li><li><b>1964<\/b> — Shuster transfers all rights to the <b>Kiwanis Club of Santa Fe<\/b>, which has produced it ever since<\/li><li><b>Today<\/b> — a 50-foot-6 marionette with moving arms, head and a groaning voice; 2027 is the <b>103rd burning<\/b><\/li><\/ul><p>The <b>Fire Spirit<\/b> was originated by Jacques Cartier, who danced it for decades and passed the torches in 1970 to his student James “Chip” Lilienthal, who held the role for over thirty years before passing it to his daughter. Santa Fe native Helene Luna danced her final Fire Spirit in 2026, and in 2027 the torches pass to Than Povi Martinez of Na Poh’Woh’Geh Owingeh. Zozobra predates Burning Man by more than 60 years. The award-winning documentary <i>Zozobra: 100 Years of Fire &amp; Redemption<\/i> tells the whole story — <a href=\"https://zozobra100film.com\" target=\"_blank\" rel=\"noopener\">zozobra100film.com<\/a>.<\/p><p class=\"note\">Read the full story of Zozobra on our <a href=\"https://burnzozobra.com/history/\" target=\"_blank\" rel=\"noopener\">Myth &amp; History page<\/a>.<\/p>", "a_es": "<h3>Desde 1924<\/h3><p>En la Nochebuena de 1923, el artista <b>Will “Shus” Shuster<\/b> —uno de los Cinco Pintores de Santa Fe— propuso, tras una venta poco común, que sus compañeros pintores escribieran sus problemas en pedacitos de papel y los quemaran. Al año siguiente, inspirado por una ceremonia yaqui de Viernes Santo con una efigie que había visto en México, construyó la primera <b>efigie de seis pies<\/b> y la quemó en su patio trasero en septiembre de 1924, en una fiesta para su círculo de artistas. Primero la llamó Old Man Groucher; el periodista E. Dana Johnson encontró la palabra <i>zozobra<\/i> en un diccionario de español. El nombre significa pesadumbre, ansiedad —la sensación de naufragar— en español.<\/p><ul><li><b>1926<\/b> — primera quema pública: una figura de 20 pies, con una procesión desde la Catedral<\/li><li><b>1933<\/b> — la quema se traslada a Fort Marcy Park<\/li><li><b>1964<\/b> — Shuster transfiere todos los derechos al <b>Club Kiwanis de Santa Fe<\/b>, que la ha producido desde entonces<\/li><li><b>Hoy<\/b> — una marioneta de 50 pies y 6 pulgadas con brazos y cabeza móviles y una voz que gime; 2027 es la <b>103.ª quema<\/b><\/li><\/ul><p>El <b>Espíritu del Fuego (Fire Spirit)<\/b> fue creado por Jacques Cartier, quien lo bailó durante décadas y en 1970 pasó las antorchas a su alumno James “Chip” Lilienthal, quien ocupó el papel durante más de treinta años antes de pasárselo a su hija. Helene Luna, originaria de Santa Fe, bailó su último Espíritu del Fuego en 2026, y en 2027 las antorchas pasan a Than Povi Martinez de Na Poh’Woh’Geh Owingeh. Zozobra es anterior a Burning Man por más de 60 años. El galardonado documental <i>Zozobra: 100 Years of Fire &amp; Redemption<\/i> cuenta toda la historia — <a href=\"https://zozobra100film.com\" target=\"_blank\" rel=\"noopener\">zozobra100film.com<\/a>.<\/p><p class=\"note\">Lea la historia completa de Zozobra en nuestra página <a href=\"https://burnzozobra.com/history/\" target=\"_blank\" rel=\"noopener\">El Mito y la Historia<\/a>.<\/p>"}, {"id": "mythology", "title": "The mythology: the story of the burn", "title_es": "La mitología: la historia de la quema", "terms": ["mythology|12", "myth|10", "story|6", "the story|8", "tell me the story|10", "zozobra story|10", "legend|8", "legend of zozobra|12", "folklore|8", "lore|8", "plot|6", "storyline|8", "pageant|8", "what happens in the show|10", "what happens during|8", "what is the show about|10", "what is the pageant|10", "canon|6", "sandoval|6", "narrative|6", "mitologia|8", "mito|8", "la historia de la quema|8", "cuenteme la historia|8", "cuentame la historia|8", "historia de zozobra|8", "leyenda|8", "leyenda de zozobra|8", "folclor|8", "trama|6", "argumento|6", "representacion|6", "que pasa en el espectaculo|8", "que pasa durante|8", "de que trata el espectaculo|8", "narrativa|6", "relato|6", "cuento|5"], "related": ["invitation", "crowdrole", "firespirit", "comesback"], "a": "<h3>The Mythology of Zozobra<\/h3><p>The burn is not just a bonfire. It is a story, told the same way every year and somehow new every year. <i>The Mythology of Zozobra<\/i>, written by Event Chairman <b>Raymond G. Sandoval<\/b>, sets the whole pageant down in one place for the first time.<\/p><p><b>The short version:<\/b> All year, Zozobra gathers out of the city’s gloom. Santa Fe’s leaders invite him to a great party in his honor, to draw him out of hiding. He comes to be celebrated, and to take. He steals the children and turns them into his <b>Gloomies<\/b>, then plunges the city into darkness. Brave <b>Torchbearers<\/b> step forward and fail, but their small light wakes the children, who run back to their parents. Then the <b>crowd<\/b> finds its voice: <b>“Burn him!”<\/b> That chant summons the <b>Fire Spirit<\/b>.<\/p><p>Zozobra strikes back. He hurls the Fire Spirit to the ground, and for one long moment Old Man Gloom is winning. It is the <b>children<\/b> who break the silence and start the chant again, and the breath of tens of thousands of voices reignites the ember. The Fire Spirit lights the firefalls, then the ghost tail, and Zozobra burns.<\/p><p class=\"fine\">Ask me about any piece of it: the Gloomies, the Torchbearers, the Fire Spirit, the Gloom Queen, why he has no legs, why a party is thrown for him, or why he comes back every year.<\/p><p class=\"note\">Read the full story of Zozobra on our <a href=\"https://burnzozobra.com/history/\" target=\"_blank\" rel=\"noopener\">Myth &amp; History page<\/a>.<\/p>", "a_es": "<h3>La Mitología de Zozobra<\/h3><p>La quema no es solo una fogata. Es una historia, contada de la misma manera cada año y, de algún modo, nueva cada año. <i>The Mythology of Zozobra<\/i> (La Mitología de Zozobra), escrita por el presidente del evento, <b>Raymond G. Sandoval<\/b>, pone por escrito toda la representación en un solo lugar por primera vez.<\/p><p><b>La versión corta:<\/b> Durante todo el año, Zozobra se va formando con la pesadumbre de la ciudad. Los líderes de Santa Fe lo invitan a una gran fiesta en su honor, para sacarlo de su escondite. Él viene a que lo celebren, y a arrebatar. Se roba a los niños y los convierte en sus <b>Gloomies<\/b>, y luego hunde a la ciudad en la oscuridad. Valientes <b>Portadores de Antorchas<\/b> dan un paso al frente y fracasan, pero su pequeña luz despierta a los niños, que corren de regreso con sus padres. Entonces el <b>público<\/b> encuentra su voz: <b>“Burn him!” (¡Quémenlo!)<\/b> Ese canto invoca al <b>Espíritu del Fuego (Fire Spirit)<\/b>.<\/p><p>Zozobra contraataca. Arroja al Espíritu del Fuego al suelo, y por un largo instante Old Man Gloom va ganando. Son los <b>niños<\/b> quienes rompen el silencio y comienzan de nuevo el canto, y el aliento de decenas de miles de voces reaviva la brasa. El Espíritu del Fuego enciende las cascadas de fuego, luego la cola fantasma, y Zozobra arde.<\/p><p class=\"fine\">Pregúnteme por cualquier parte: los Gloomies, los Portadores de Antorchas, el Espíritu del Fuego, la Gloom Queen, por qué no tiene piernas, por qué se le hace una fiesta, o por qué regresa cada año.<\/p><p class=\"note\">Lea la historia completa de Zozobra en nuestra página <a href=\"https://burnzozobra.com/history/\" target=\"_blank\" rel=\"noopener\">El Mito y la Historia<\/a>.<\/p>"}, {"id": "invitation", "title": "Why is a party thrown for Zozobra?", "title_es": "¿Por qué se le hace una fiesta a Zozobra?", "terms": ["invitation|10", "invited|8", "invite|8", "why invite|10", "bargain|10", "guest of honor|12", "why a party|10", "party|8", "thrown|6", "celebration|5", "throw a party|10", "why is there a party|10", "party for zozobra|10", "party in his name|10", "why celebrate him|8", "trap|6", "trick|5", "duplicity|8", "hiding|5", "invitacion|8", "invitado|6", "invitar|6", "por que lo invitan|8", "trato|7", "pacto|6", "invitado de honor|8", "por que una fiesta|8", "fiesta|5", "celebracion|4", "hacen una fiesta|7", "por que hay una fiesta|8", "fiesta para zozobra|8", "fiesta en su honor|8", "por que lo celebran|6", "trampa|5", "engano|5", "doblez|6", "se esconde|4"], "related": ["mythology", "gloomies", "crowdrole"], "a": "<h3>The bargain<\/h3><p>For most of the year Zozobra hides, half-formed, feeding on the small daily glooms of the city. As he grows stronger he cannot help causing mischief: arguments without cause, inexplicable bad moods, neighbors turning sour on neighbors. The city’s leaders have seen it before, and they lay a plan. They send him an invitation, sealed and ceremonious, to Santa Fe’s biggest party, thrown in his honor.<\/p><p><b>There is duplicity on both sides.<\/b> The city needs Zozobra out of hiding, in plain sight, where he can be confronted. And Zozobra, whose ego is larger than his fifty-foot frame, wants to be feted as the guest of honor and to walk straight into the heart of the city he means to claim. Each side believes it is tricking the other. Each side accepts. The party is on.<\/p><p class=\"fine\">That is why burn day begins with music, food and beach balls: you are a host at the party. He is the guest of honor at his own destruction.<\/p>", "a_es": "<h3>El trato<\/h3><p>Durante la mayor parte del año Zozobra se esconde, a medio formar, alimentándose de los pequeños “glooms” (las penas y preocupaciones) cotidianos de la ciudad. A medida que se fortalece, no puede evitar hacer travesuras: discusiones sin motivo, malos humores inexplicables, vecinos que se agrian con sus vecinos. Los líderes de la ciudad ya lo han visto antes, y trazan un plan. Le envían una invitación, sellada y ceremoniosa, a la fiesta más grande de Santa Fe, organizada en su honor.<\/p><p><b>Hay doblez en ambos lados.<\/b> La ciudad necesita que Zozobra salga de su escondite, a plena vista, donde se le pueda enfrentar. Y Zozobra, cuyo ego es más grande que su cuerpo de cincuenta pies, quiere ser agasajado como el invitado de honor y entrar directo al corazón de la ciudad que pretende reclamar. Cada lado cree que está engañando al otro. Cada lado acepta. La fiesta está en marcha.<\/p><p class=\"fine\">Por eso el día de la quema comienza con música, comida y pelotas de playa: usted es anfitrión de la fiesta. Él es el invitado de honor en su propia destrucción.<\/p>"}, {"id": "ghosttail", "title": "Why does Zozobra have no legs?", "title_es": "¿Por qué Zozobra no tiene piernas?", "terms": ["legs|10", "leg|10", "no legs|12", "ghost tail|12", "tail|8", "feet|6", "does he walk|8", "specter|8", "spectre|8", "is he a ghost|10", "ghost|6", "spirit|3", "hover|8", "float|8", "body|5", "bow tie|6", "tuxedo|6", "eyes|4", "hair|5", "ears|4", "piernas|8", "pierna|8", "no tiene piernas|8", "sin piernas|8", "cola de fantasma|8", "cola|6", "pies|4", "camina|6", "espectro|7", "es un fantasma|8", "fantasma|5", "espiritu|3", "flota|6", "cuerpo|4", "corbata de mono|5", "esmoquin|5", "ojos orejas cabello|4"], "related": ["made", "inside", "mythology"], "a": "<h3>He is a Specter, not a man<\/h3><p>Where a man would stand on legs, Zozobra trails away into a long, flowing <b>ghost tail<\/b>. He is a spirit who materializes only when there is enough negative energy in the air to take form, and a spirit, by the oldest rules of folklore, does not walk. He hovers, he drifts, he looms. The ghost tail is the visible sign that the thing standing fifty feet above Fort Marcy Park is not flesh and bone but vapor given shape: a fog of the city’s own gloom, condensed into something tall enough to set on fire.<\/p><p>The rest of him is theater: a tuxedoed gentleman in white cotton with an enormous bow tie, rolling eyes, ears like sails, a great hinged mouth that opens and closes as he moans, and hair whose color changes from year to year. He is not a static effigy. His arms wave, his head turns in furious denial, and the strings that hold him up belong to the people of Santa Fe.<\/p><p class=\"fine\">And it is the ghost tail the Fire Spirit finally ignites.<\/p>", "a_es": "<h3>Es un Espectro, no un hombre<\/h3><p>Donde un hombre se sostendría sobre sus piernas, Zozobra se desvanece en una larga y ondulante <b>cola de fantasma<\/b>. Es un espíritu que se materializa solo cuando hay suficiente energía negativa en el aire para tomar forma, y un espíritu, según las reglas más antiguas del folclor, no camina. Flota, va a la deriva, se cierne amenazante. La cola de fantasma es la señal visible de que aquello que se alza cincuenta pies sobre Fort Marcy Park no es de carne y hueso, sino vapor al que se le ha dado forma: una niebla de la propia pesadumbre de la ciudad, condensada en algo lo bastante alto como para prenderle fuego.<\/p><p>El resto de él es teatro: un caballero de esmoquin en algodón blanco con un enorme corbatín de moño, ojos que giran, orejas como velas de barco, una gran boca con bisagras que se abre y se cierra mientras gime, y un cabello cuyo color cambia de un año a otro. No es una efigie estática. Sus brazos se agitan, su cabeza gira en furiosa negación, y las cuerdas que lo sostienen pertenecen a la gente de Santa Fe.<\/p><p class=\"fine\">Y es la cola de fantasma lo que el Espíritu del Fuego (Fire Spirit) finalmente enciende.<\/p>"}, {"id": "inside", "title": "What is inside Zozobra?", "title_es": "¿Qué hay dentro de Zozobra?", "terms": ["inside|8", "what is inside|12", "whats inside|12", "stuffed with|10", "stuffed|6", "filled with|10", "what is he made of inside|10", "guitar|8", "wedding dresses|6", "ashes|8", "divorce papers|8", "what do people burn|10", "what gets burned|10", "substance|6", "accumulate|6", "where does he come from|10", "how is he born|8", "is zozobra evil|12", "evil|8", "good or bad|8", "what does he want|10", "why does he take the children|8", "adentro|6", "que hay dentro|8", "que tiene adentro|8", "relleno de|7", "relleno|5", "lleno de|6", "de que esta hecho por dentro|7", "guitarra|6", "vestidos de novia|5", "cenizas|6", "papeles de divorcio|6", "que quema la gente|7", "que se quema|6", "se acumula|5", "de donde viene|7", "como nace|6", "zozobra es malo|8", "malvado|6", "bueno o malo|6", "que quiere zozobra|7"], "related": ["gloom", "burnitem", "ghosttail"], "a": "<h3>He is made of the city’s gloom<\/h3><p>The cotton and the wood are only the outer shell. The true body of Zozobra is the gloom stuffed inside him before the burn: shredded paper, divorce decrees, eviction notices, mortgage statements paid off at last, bad report cards, hospital gowns from rooms no one wants to remember, wedding dresses from marriages that ended badly, love letters that did not work, parking tickets, once a Martin guitar a heartbroken player did not wish to play again, and handwritten notes from schoolchildren listing their small private terrors.<\/p><p>These are called <b>glooms<\/b>. A gloom is anything that weighs upon a soul: a sorrow, a regret, a worry, a fear, a failure, a grief, a debt, a doubt. Each one is written down and surrendered, so that when he burns, they burn with him.<\/p><p><b>Zozobra is not born; he accumulates.<\/b> Every grumpy morning, every mean-spirited word, every small cruelty releases a thread of negative energy into the air above Santa Fe. The threads gather and weave themselves together over the year. He is not, strictly, evil. He is older and stranger than that: gloom in the abstract, given a face so his demise can be understood. Will Shuster was emphatic that he is not a political or religious figure. And yet he is greedy. He wants the soul of the city. Each year he believes he will win. Each year he is wrong.<\/p>", "a_es": "<h3>Está hecho de la pesadumbre de la ciudad<\/h3><p>El algodón y la madera son solo la cáscara exterior. El verdadero cuerpo de Zozobra es la pesadumbre con la que se le rellena antes de la quema: papel triturado, actas de divorcio, avisos de desalojo, estados de cuenta de hipotecas por fin liquidadas, boletas de malas calificaciones, batas de hospital de cuartos que nadie quiere recordar, vestidos de novia de matrimonios que terminaron mal, cartas de amor que no funcionaron, multas de estacionamiento, una vez una guitarra Martin que un músico con el corazón roto no quiso volver a tocar, y notas escritas a mano por niños de escuela que enumeran sus pequeños terrores privados.<\/p><p>A todo esto se le llama <b>glooms<\/b> (sus penas y preocupaciones). Un “gloom” es cualquier cosa que pesa sobre un alma: una pena, un arrepentimiento, una preocupación, un miedo, un fracaso, un duelo, una deuda, una duda. Cada uno se escribe y se entrega, para que cuando él arda, ardan con él.<\/p><p><b>Zozobra no nace; se acumula.<\/b> Cada mañana de mal humor, cada palabra malintencionada, cada pequeña crueldad libera un hilo de energía negativa en el aire sobre Santa Fe. Los hilos se juntan y se entretejen a lo largo del año. No es, estrictamente, malvado. Es más antiguo y más extraño que eso: la pesadumbre en abstracto, a la que se le ha dado un rostro para que su fin pueda entenderse. Will Shuster fue enfático en que no es una figura política ni religiosa. Y sin embargo es codicioso. Quiere el alma de la ciudad. Cada año cree que va a ganar. Cada año se equivoca.<\/p>"}, {"id": "gloomies", "title": "Who are the Gloomies?", "title_es": "¿Quiénes son los Gloomies?", "terms": ["gloomies|14", "gloomie|14", "who are the gloomies|14", "children in white|10", "kids in white|10", "kids in sheets|10", "white robes|8", "little ghosts|10", "ghost children|10", "dancing ghosts|10", "minions|10", "stolen children|10", "steals the children|10", "takes the children|10", "court|6", "gloomies|8", "gloomie|8", "quienes son los gloomies|8", "ninos de blanco|8", "ninos vestidos de blanco|8", "ninos con sabanas|7", "tunicas blancas|6", "fantasmitas|8", "ninos fantasma|8", "fantasmas que bailan|7", "secuaces|6", "ninos robados|8", "se roba a los ninos|8", "se lleva a los ninos|8", "corte|4"], "related": ["torchbearers", "gloomqueen", "mythology"], "a": "<h3>The stolen children of Santa Fe<\/h3><p>Around Zozobra on the night of the pageant gathers a host of small white figures: child dancers in white robes. These are the <b>Gloomies<\/b>. They are the children of Santa Fe whose minds Old Man Gloom has clouded, whose hope he has stolen, whose joy he has bent to his own purposes. For decades they have been children from the community, dressed in white like ghosts on Halloween.<\/p><p>In the story, Zozobra takes them from their parents because nothing manufactures gloom faster. The parents’ sudden, enormous grief floods upward into him and makes him stronger. The Gloomies cavort, taunt, and mock the Torchbearers. They are what gloom does when it is allowed to spread, and the warning of what the city would become if Zozobra were left to his work.<\/p><p>And they are also how he loses. The torchlight wakes them from his spell and they run back to their parents. Later, when the Fire Spirit is thrown down and the grown-ups fall silent, it is the children who start the chant again. <b>The thing the Specter stole becomes the thing that undoes him.<\/b><\/p>", "a_es": "<h3>Los niños robados de Santa Fe<\/h3><p>Alrededor de Zozobra, en la noche del espectáculo, se reúne una multitud de pequeñas figuras blancas: niños danzantes con túnicas blancas. Son los <b>Gloomies<\/b>. Son los niños de Santa Fe a quienes Old Man Gloom (el Viejo) les ha nublado la mente, les ha robado la esperanza y cuya alegría ha torcido para sus propios fines. Durante décadas han sido niños de la comunidad, vestidos de blanco como fantasmas en Halloween.<\/p><p>En la historia, Zozobra se los quita a sus padres porque nada fabrica pesadumbre más rápido. El dolor repentino y enorme de los padres sube como una inundación hacia él y lo hace más fuerte. Los Gloomies retozan, provocan y se burlan de los Portadores de Antorchas. Son lo que la pesadumbre hace cuando se le permite extenderse, y la advertencia de en qué se convertiría la ciudad si se dejara a Zozobra hacer su trabajo.<\/p><p>Y también son la manera en que él pierde. La luz de las antorchas los despierta de su hechizo y corren de regreso con sus padres. Más tarde, cuando el Espíritu del Fuego (Fire Spirit) es derribado y los adultos enmudecen, son los niños quienes comienzan de nuevo el coro. <b>Lo que el Espectro robó se convierte en lo que lo deshace.<\/b><\/p>"}, {"id": "torchbearers", "title": "The Torchbearers", "title_es": "Los Portadores de Antorchas", "terms": ["torchbearer|14", "torch bearer|14", "torch bearers|14", "torches|8", "torch|6", "why do the torchbearers fail|14", "why do they fail|8", "people with torches|10", "men with torches|10", "citizens|5", "brave|5", "portadores de antorchas|8", "portador de antorcha|8", "portadores|6", "antorchas|7", "antorcha|6", "por que fracasan los portadores|8", "por que fracasan|6", "por que fallan|6", "gente con antorchas|8", "hombres con antorchas|8", "los de las antorchas|7", "ciudadanos|4", "valientes|4"], "related": ["gloomies", "crowdrole", "firespirit"], "a": "<h3>They must fail first<\/h3><p>Before the Fire Spirit can appear, the townsfolk themselves must try. The <b>Torchbearers<\/b> are ordinary brave citizens who confront Zozobra with their small flames and their large courage. They are sincere. They are gallant. And they are insufficient. Zozobra is so much larger than they are that he is not even alarmed. He laughs.<\/p><p>But their torches have an effect they never intended. The light, however small, reaches the Gloomies and stirs the stolen children out of their bewitchment. The Torchbearers do not defeat Zozobra. They are not meant to. They are the small fire that breaks the spell on the children, and so they set everything else in motion.<\/p><p class=\"fine\">It is one of the harder teachings of the rite: brave acts may matter most for reasons their authors never see, and ordinary courage alone is not enough. Gloom requires the answering call of the entire crowd.<\/p>", "a_es": "<h3>Primero deben fracasar<\/h3><p>Antes de que el Espíritu del Fuego (Fire Spirit) pueda aparecer, la gente del pueblo debe intentarlo por sí misma. Los <b>Portadores de Antorchas<\/b> son ciudadanos comunes y valientes que enfrentan a Zozobra con sus pequeñas llamas y su gran valor. Son sinceros. Son gallardos. Y no son suficientes. Zozobra es tanto más grande que ellos que ni siquiera se alarma. Se ríe.<\/p><p>Pero sus antorchas tienen un efecto que ellos nunca se propusieron. La luz, por pequeña que sea, llega hasta los Gloomies y saca a los niños robados de su embrujo. Los Portadores de Antorchas no derrotan a Zozobra. No es su papel. Son el pequeño fuego que rompe el hechizo sobre los niños, y así ponen en marcha todo lo demás.<\/p><p class=\"fine\">Es una de las enseñanzas más duras del rito: los actos valientes pueden importar más por razones que sus autores nunca ven, y el valor común por sí solo no basta. La pesadumbre exige la respuesta de toda la multitud.<\/p>"}, {"id": "crowdrole", "title": "Why does the crowd chant “Burn him”?", "title_es": "¿Por qué la multitud corea “Burn him” (¡Que se queme!)?", "terms": ["burn him|10", "chant|10", "why do people yell|10", "why do people shout|10", "why does the crowd|10", "why do we chant|10", "what do i yell|8", "what do we say|8", "yell|6", "shout|6", "scream|6", "role of the crowd|12", "hero of the story|10", "who defeats zozobra|12", "who kills zozobra|12", "who beats zozobra|12", "protagonist|8", "que se queme|10", "burn him|8", "que se queme|8", "quemenlo|7", "coro|6", "corear|6", "por que grita la gente|8", "por que gritan|7", "por que la multitud|7", "por que coreamos|7", "que grito|6", "que se dice|5", "gritar|5", "papel de la multitud|8", "papel del publico|8", "heroe de la historia|7", "quien derrota a zozobra|8", "quien mata a zozobra|8", "quien vence a zozobra|8", "protagonista|6"], "related": ["firespirit", "mythology", "comesback"], "a": "<h3>You are the decisive character<\/h3><p>Of all the figures in the court of Old Man Gloom, the greatest is the one most easily mistaken for spectators. The thousands gathered at Fort Marcy Park are not an audience to the rite. Nothing the Torchbearers do, nothing the Fire Spirit becomes, can happen until the crowd plays its part.<\/p><p>When the children run back to their parents, joy rises from thousands of separate reunions and begins to scatter. Then the chant starts, low and ragged, a few voices, then a hundred, then the whole field: <b>“Burn him! Burn him! Burn him!”<\/b> The chant gathers all that loose joy, binds it into one burst, and aims it at Old Man Gloom. <b>It is from that burst that the Fire Spirit materializes.<\/b> If the field fell silent, the Fire Spirit would never come.<\/p><p>And when Zozobra throws the Fire Spirit down, the chant is what saves it. Every “Burn him!” is a breath driven across the field, and breath is what a smoldering fire needs. Zozobra is defeated not by a champion but by a community willing to name its enemy aloud and demand its end, in one voice, all at once.<\/p><p class=\"fine\">So when the moment comes, do not just watch. Chant. <i>Que se queme.<\/i><\/p>", "a_es": "<h3>Usted es el personaje decisivo<\/h3><p>De todas las figuras en la corte de Old Man Gloom (el Viejo), la más grande es la que más fácilmente se confunde con simples espectadores. Los miles de personas reunidas en Fort Marcy Park no son un público del rito. Nada de lo que hacen los Portadores de Antorchas, nada de lo que llega a ser el Espíritu del Fuego (Fire Spirit), puede ocurrir hasta que la multitud haga su parte.<\/p><p>Cuando los niños corren de regreso con sus padres, la alegría se eleva desde miles de reencuentros separados y comienza a dispersarse. Entonces empieza el coro, bajo y desigual, unas cuantas voces, luego cien, luego todo el campo: <b>“Burn him! Burn him! Burn him!” (¡Que se queme!)<\/b> El coro reúne toda esa alegría suelta, la ata en un solo estallido y la apunta contra Old Man Gloom. <b>De ese estallido es de donde se materializa el Espíritu del Fuego.<\/b> Si el campo guardara silencio, el Espíritu del Fuego nunca llegaría.<\/p><p>Y cuando Zozobra derriba al Espíritu del Fuego, el coro es lo que lo salva. Cada “Burn him!” es un aliento lanzado a través del campo, y aliento es lo que necesita un fuego que apenas arde. A Zozobra no lo derrota un campeón, sino una comunidad dispuesta a nombrar a su enemigo en voz alta y a exigir su fin, con una sola voz, todos a la vez.<\/p><p class=\"fine\">Así que, cuando llegue el momento, no se quede solo mirando. Coree. <i>Que se queme.<\/i><\/p>"}, {"id": "firespirit", "title": "The Fire Spirit", "title_es": "El Espíritu del Fuego (Fire Spirit)", "terms": ["fire spirit|14", "fire dancer|14", "firedancer|14", "red dancer|12", "dancer in red|12", "who is the fire spirit|14", "who dances|8", "who lights zozobra|12", "who lights him|10", "who sets him on fire|12", "than povi|14", "martinez|8", "helene|10", "helene luna|12", "luna|6", "cartier|10", "jacques cartier|12", "lilienthal|10", "chip lilienthal|12", "is the fire spirit a man or a woman|12", "male or female|8", "gender|6", "espiritu del fuego|8", "fire spirit|8", "danzante del fuego|8", "bailarin de fuego|7", "bailarina de rojo|7", "danzante de rojo|7", "quien es el espiritu del fuego|8", "quien baila|6", "quien enciende a zozobra|8", "quien lo prende|7", "quien le prende fuego|8", "than povi|8", "martinez|6", "helene luna|8", "luna|4", "jacques cartier|8", "cartier|7", "chip lilienthal|8", "es hombre o mujer|8", "genero|5"], "related": ["gloomqueen", "crowdrole", "firefalls"], "a": "<h3>Everything Zozobra is not<\/h3><p>Dressed in flowing red, crowned with flame, armed with two blazing torches, the <b>Fire Spirit<\/b> dances out of the dark. The Fire Spirit is the personification of goodness, of warmth, of the positive energy the crowd has just released into the night: the answer to the Gloomies’ ghostly white.<\/p><p><b>The Fire Spirit is not a human being, and so is neither male nor female.<\/b> Where Zozobra condenses out of a year of accumulated gloom, the Fire Spirit ignites out of a single concentrated burst of joy. The dancers have been men and women, mentors and students, fathers and daughters, but the spirit they channel is fire itself, and fire belongs to no gender. With all that power, the Fire Spirit could grow as large as Zozobra. It chooses to stay one-tenth his size and to use the crowd’s power as ammunition instead.<\/p><p><b>Only a handful of dancers have ever held the role.<\/b> Jacques Cartier originated it and danced it for decades, breaking both ankles in service, though never, as he was careful to note, at the same time. He passed the torches to his student James “Chip” Lilienthal in 1970, who held the role for over thirty years before passing it to his own daughter. Santa Fe native Helene Luna danced her final Fire Spirit in 2026. <b>In 2027 the torches pass to Than Povi Martinez of Na Poh’Woh’Geh Owingeh<\/b>, after years of preparation as the Gloom Queen.<\/p>", "a_es": "<h3>Todo lo que Zozobra no es<\/h3><p>Vestido de rojo ondulante, coronado de llamas, armado con dos antorchas ardientes, el <b>Espíritu del Fuego (Fire Spirit)<\/b> sale danzando de la oscuridad. El Espíritu del Fuego es la personificación de la bondad, de la calidez, de la energía positiva que la multitud acaba de liberar en la noche: la respuesta al blanco fantasmal de los Gloomies.<\/p><p><b>El Espíritu del Fuego no es un ser humano, y por eso no es ni masculino ni femenino.<\/b> Así como Zozobra se condensa a partir de un año de pesadumbre acumulada, el Espíritu del Fuego se enciende a partir de un solo estallido concentrado de alegría. Los danzantes han sido hombres y mujeres, mentores y alumnos, padres e hijas, pero el espíritu que encarnan es el fuego mismo, y el fuego no pertenece a ningún género. Con todo ese poder, el Espíritu del Fuego podría crecer tanto como Zozobra. Elige quedarse en una décima parte de su tamaño y usar, en cambio, el poder de la multitud como munición.<\/p><p><b>Solo un puñado de danzantes ha tenido este papel.<\/b> Jacques Cartier lo creó y lo bailó durante décadas, rompiéndose ambos tobillos en el cumplimiento del deber, aunque nunca, como él se cuidaba de aclarar, al mismo tiempo. En 1970 pasó las antorchas a su alumno James “Chip” Lilienthal, quien tuvo el papel por más de treinta años antes de pasárselo a su propia hija. Helene Luna, originaria de Santa Fe, bailó por última vez como Espíritu del Fuego en 2026. <b>En 2027 las antorchas pasan a Than Povi Martinez, de Na Poh’Woh’Geh Owingeh<\/b>, tras años de preparación como la Gloom Queen (Reina de la Pesadumbre).<\/p>"}, {"id": "gloomqueen", "title": "The Gloom Queen", "title_es": "La Gloom Queen (Reina de la Pesadumbre)", "terms": ["gloom queen|14", "queen|8", "apprentice|8", "who is the gloom queen|14", "successor|6", "next fire spirit|12", "new fire spirit|12", "gloom queen|8", "reina de la pesadumbre|8", "reina gloom|8", "reina|6", "aprendiz|6", "quien es la gloom queen|8", "quien es la reina|7", "sucesora|5", "sucesion|4", "proximo espiritu del fuego|8", "nuevo espiritu del fuego|8", "than povi|5"], "related": ["firespirit", "gloomies", "mythology"], "a": "<h3>The apprentice in the court<\/h3><p>The <b>Gloom Queen<\/b> appears only in years of transition, when the role of the Fire Spirit must pass from one dancer to the next. She is an apprentice and a herald, observing the great pageant from within, learning its rhythms, preparing to take up the torches in her own season. It is a temporary office, created when needed and retired when the line of succession is secure.<\/p><p>She stands, in the mythology, for the truth that even our victories must be taught to the next generation, or be lost to time. Than Povi Martinez served as Gloom Queen before taking up the torches as the Fire Spirit in 2027.<\/p>", "a_es": "<h3>La aprendiz en la corte<\/h3><p>La <b>Gloom Queen (Reina de la Pesadumbre)<\/b> aparece solo en años de transición, cuando el papel del Espíritu del Fuego (Fire Spirit) debe pasar de un danzante al siguiente. Es aprendiz y heraldo: observa el gran espectáculo desde adentro, aprende sus ritmos y se prepara para tomar las antorchas cuando llegue su momento. Es un cargo temporal, que se crea cuando hace falta y se retira cuando la línea de sucesión está asegurada.<\/p><p>En la mitología, ella representa la verdad de que incluso nuestras victorias deben enseñarse a la siguiente generación, o se pierden con el tiempo. Than Povi Martinez sirvió como Gloom Queen antes de tomar las antorchas como el Espíritu del Fuego en 2027.<\/p>"}, {"id": "firefalls", "title": "The firefalls and the final battle", "title_es": "Las cascadas de fuego y la batalla final", "terms": ["firefalls|14", "firefall|14", "waterfall|12", "waterfalls|12", "niagara|10", "final battle|10", "battle|6", "fight|5", "how does zozobra die|10", "how does he die|10", "how does he burn|8", "does zozobra fight back|12", "fight back|8", "thrown down|8", "black surge|8", "does zozobra ever win|12", "does he ever win|10", "painting the sky|8", "cascadas de fuego|8", "cascada de fuego|8", "firefalls|8", "cascadas|7", "cataratas|6", "niagara|6", "batalla final|8", "batalla|5", "pelea|4", "como muere zozobra|8", "como muere|7", "como se quema|6", "zozobra se defiende|8", "se defiende|6", "lo tira al suelo|6", "oleada negra|6", "zozobra gana alguna vez|8", "alguna vez gana|7", "pintar el cielo|6"], "related": ["firespirit", "crowdrole", "fireworks"], "a": "<h3>Fireworks through ash<\/h3><p>Once summoned, the Fire Spirit punctuates the sky with fireworks, siphoning power from Zozobra with every burst while the chant feeds it. But Old Man Gloom has not survived a hundred burnings by going quietly. He calls up every gloom stuffed inside him and looses it over the field in a single black surge. The fireworks gutter and die. He seizes the Fire Spirit and <b>hurls it to the ground<\/b>, where it lies smoldering like a flame beaten down to its last ember. For one long moment, Old Man Gloom is winning.<\/p><p>The parents freeze. It is the <b>children<\/b> who break the silence and lift the cry again, and the field follows. On the breath of that chant the ember reignites. Fire is not killed by being knocked to the ground; fire is only waiting for air.<\/p><p>Then comes the final insult: the Fire Spirit ignites the <b>“Waterfalls”<\/b> on either side of him. Water, the one thing that might have saved him, becomes liquid fire, twin cascades of sparks. The <b>firefalls<\/b> sap the last of his power. Defenseless for the first time all night, he cannot stop the Fire Spirit from lighting the ghost tail. He burns from within, arms still thrashing, defiant to the end, in what Will Shuster called his way of <b>“painting the sky.”<\/b> The band strikes up “La Fiesta de Santa Fe,” and the chant becomes a song.<\/p>", "a_es": "<h3>Fuegos artificiales entre la ceniza<\/h3><p>Una vez invocado, el Espíritu del Fuego (Fire Spirit) salpica el cielo de fuegos artificiales, quitándole poder a Zozobra con cada estallido mientras el coro lo alimenta. Pero Old Man Gloom (el Viejo) no ha sobrevivido a cien quemas yéndose en silencio. Convoca cada “gloom” (las penas y preocupaciones) con que lo rellenaron y los suelta sobre el campo en una sola oleada negra. Los fuegos artificiales parpadean y mueren. Atrapa al Espíritu del Fuego y <b>lo arroja al suelo<\/b>, donde queda humeando como una llama reducida a su última brasa. Por un largo momento, Old Man Gloom va ganando.<\/p><p>Los padres se quedan paralizados. Son los <b>niños<\/b> quienes rompen el silencio y levantan el grito otra vez, y el campo los sigue. Con el aliento de ese coro la brasa vuelve a encenderse. Al fuego no se le mata tirándolo al suelo; el fuego solo está esperando aire.<\/p><p>Entonces llega el insulto final: el Espíritu del Fuego enciende las <b>“Cascadas” (Waterfalls)<\/b> a cada lado de él. El agua, lo único que quizá lo habría salvado, se convierte en fuego líquido, dos cascadas gemelas de chispas. Las <b>cascadas de fuego (firefalls)<\/b> le drenan lo último de su poder. Indefenso por primera vez en toda la noche, no puede impedir que el Espíritu del Fuego encienda la cola de fantasma. Arde desde adentro, con los brazos todavía agitándose, desafiante hasta el final, en lo que Will Shuster llamó su manera de <b>“pintar el cielo”.<\/b> La banda arranca con “La Fiesta de Santa Fe”, y el coro se convierte en canción.<\/p>"}, {"id": "whythemes", "title": "Why does Zozobra change every year?", "title_es": "¿Por qué Zozobra cambia cada año?", "terms": ["why does he change|12", "why does zozobra change|12", "why themes|12", "why a theme|10", "why a costume|10", "why is he dressed|10", "why does he wear|8", "different every year|12", "new look|8", "trickster|10", "disguise|10", "borrowed skins|10", "decades project why|10", "why the decades project|12", "art contest|10", "childrens art|10", "drawings|8", "kids drawings|10", "tradition changed|8", "used to look the same|8", "sameness|6", "por que cambia|8", "por que cambia zozobra|8", "por que hay temas|8", "por que un tema|7", "por que un disfraz|7", "por que esta vestido|7", "por que se viste|6", "diferente cada ano|8", "nuevo look|5", "embaucador|6", "disfraz|7", "pieles prestadas|6", "proyecto de las decadas|8", "decades project|8", "concurso de arte|8", "arte infantil|7", "dibujos|6", "dibujos de ninos|7", "cambio la tradicion|6", "antes se veia igual|6"], "related": ["theme", "lastyear", "mythology"], "a": "<h3>A trickster in borrowed skins<\/h3><p>For his first ninety years Zozobra looked nearly the same every summer: white cotton, black bow tie, black buttons. But a tradition that does not also breathe will, in time, suffocate. In his ninetieth year, Event Chairman Raymond G. Sandoval launched the <b>Decades Project<\/b>, dressing the giant in a new decade each year on the way to the 100th burning. It was not a popular change at first, and the criticism was considerable. The alternative was not preservation but a slow death by sameness.<\/p><p><b>The children’s art contest tells the story.<\/b> Before the themes it drew about thirty entries a year, all the same drawing. After, nearly <b>six hundred<\/b>, and Zozobra wore AirPods, Crocs, a backpack to school. The children had stopped copying him and begun to imagine him. The themes renew the volunteers too: every year the workshop gets a puzzle nobody has solved before, like sunglasses cut to the scale of pizza pans.<\/p><p><b>Do the themes change who he is? No. They reveal him.<\/b> Zozobra knows he has been defeated for a century, and he arrives each summer already plotting, looking for any advantage. He will steal a wand, a cloak, a crown, a cowboy hat, if he believes it will tilt the night his way. It is the oldest behavior of the trickster: to borrow another’s shape in the hope of slipping past the guard. Beneath every costume the bow tie is still there. The ghost tail still trails where legs should be. <b>Santa Fe is never fooled.<\/b> The chant rises all the same. He burns all the same.<\/p>", "a_es": "<h3>Un embaucador con pieles prestadas<\/h3><p>Durante sus primeros noventa años Zozobra se vio casi igual cada verano: algodón blanco, corbatín de moño negro, botones negros. Pero una tradición que no respira también, con el tiempo, se asfixia. En su año noventa, el presidente del evento, Raymond G. Sandoval, lanzó el <b>Decades Project (Proyecto de las Décadas)<\/b>, vistiendo al gigante de una década distinta cada año en el camino hacia la 100.ª Quema. Al principio no fue un cambio popular, y las críticas fueron considerables. La alternativa no era la preservación, sino una muerte lenta por monotonía.<\/p><p><b>El concurso de arte infantil cuenta la historia.<\/b> Antes de los temas recibía unos treinta dibujos al año, todos el mismo dibujo. Después, casi <b>seiscientos<\/b>, y Zozobra llevaba AirPods, Crocs, una mochila para ir a la escuela. Los niños habían dejado de copiarlo y habían empezado a imaginarlo. Los temas también renuevan a los voluntarios: cada año el taller recibe un rompecabezas que nadie ha resuelto antes, como unos lentes de sol cortados a la escala de charolas para pizza.<\/p><p><b>¿Cambian los temas quién es él? No. Lo revelan.<\/b> Zozobra sabe que lo han derrotado durante un siglo, y llega cada verano ya tramando algo, buscando cualquier ventaja. Robará una varita, una capa, una corona, un sombrero vaquero, si cree que con eso inclinará la noche a su favor. Es la conducta más antigua del embaucador: tomar prestada la forma de otro con la esperanza de burlar a la guardia. Debajo de cada disfraz el corbatín de moño sigue ahí. La cola de fantasma sigue arrastrándose donde deberían estar las piernas. <b>A Santa Fe nunca la engaña.<\/b> El coro se levanta de todos modos. Él arde de todos modos.<\/p>"}, {"id": "comesback", "title": "Why does he come back every year?", "title_es": "¿Por qué regresa cada año?", "terms": ["come back every year|12", "why does he come back|12", "zozobra come back|10", "keeps coming back|10", "come back to life|10", "burn him again|8", "why every year|10", "why do we burn him every year|12", "why burn zozobra|12", "why do we burn|10", "why do you burn|10", "meaning of the burn|12", "what does it mean|6", "point of burning|10", "purpose|6", "return|5", "returns|5", "new year|8", "scapegoat|10", "pharmakos|10", "ritual|6", "rite|6", "cleanse|6", "will he burn again|10", "inevitable|6", "regresa cada ano|8", "por que regresa|8", "por que vuelve|8", "sigue regresando|7", "vuelve a la vida|7", "quemarlo otra vez|6", "por que cada ano|7", "por que lo quemamos cada ano|8", "por que queman a zozobra|8", "por que lo queman|8", "significado de la quema|8", "que significa|4", "para que lo queman|7", "proposito|5", "ano nuevo|6", "chivo expiatorio|8", "ritual|5", "rito|5", "limpieza|4", "volvera a arder|7"], "related": ["crowdrole", "burningman", "fiestas"], "a": "<h3>He will burn again<\/h3><p>Zozobra is burned utterly. His ashes are swept from the field. The city walks home unburdened. And then, slowly, over the next twelve months, the gloom gathers again: new griefs, new worries, new shipwrecks of the heart. By the next summer there is enough sorrow to fill a fifty-foot giant all over again.<\/p><p><b>This is not a failure of the rite. This is the rite.<\/b> Zozobra does not end gloom; he metabolizes it. He gives it shape, makes it visible, and lets it be released the only way negative energy ever truly leaves a community: through light, through laughter, through the lifted voice of a crowd. He is not a once-and-for-all victory. He is the city’s annual exhale.<\/p><p>Santa Feans call the burn the city’s true New Year, set at the hinge of summer and autumn. It follows a pattern as old as fire: the scapegoat into which a community pours its troubles and drives them out through flame. What is distinctive in Santa Fe is <b>consent<\/b>. Zozobra is invited. He attends gladly, expecting to triumph. And no priest performs the rite on the city’s behalf. The whole gathered city does it with its own voice.<\/p><p class=\"fine\"><i>He will burn again. Que se queme.<\/i><\/p>", "a_es": "<h3>Volverá a arder<\/h3><p>Zozobra se quema por completo. Sus cenizas se barren del campo. La ciudad camina a casa sin su carga. Y luego, lentamente, durante los siguientes doce meses, la pesadumbre se junta otra vez: nuevos duelos, nuevas preocupaciones, nuevos naufragios del corazón. Para el verano siguiente hay suficiente pena para llenar de nuevo a un gigante de cincuenta pies.<\/p><p><b>Esto no es un fracaso del rito. Esto es el rito.<\/b> Zozobra no acaba con la pesadumbre; la metaboliza. Le da forma, la hace visible y permite que se libere de la única manera en que la energía negativa realmente sale de una comunidad: a través de la luz, de la risa, de la voz en alto de una multitud. No es una victoria de una vez y para siempre. Es la exhalación anual de la ciudad.<\/p><p>La gente de Santa Fe llama a la quema el verdadero Año Nuevo de la ciudad, situado en la bisagra entre el verano y el otoño. Sigue un patrón tan antiguo como el fuego: el chivo expiatorio en el que una comunidad vierte sus males y los expulsa por medio de las llamas. Lo distintivo en Santa Fe es el <b>consentimiento<\/b>. A Zozobra se le invita. Asiste con gusto, esperando triunfar. Y ningún sacerdote realiza el rito en nombre de la ciudad. Toda la ciudad reunida lo hace con su propia voz.<\/p><p class=\"fine\"><i>Volverá a arder. Que se queme.<\/i><\/p>"}, {"id": "burningman", "title": "Zozobra and Burning Man", "title_es": "Zozobra y Burning Man", "terms": ["burning man|14", "burningman|14", "black rock|10", "original burning man|14", "like burning man|12", "same as burning man|12", "burning man|8", "burningman|8", "black rock|7", "burning man original|8", "como burning man|8", "parecido a burning man|7", "igual que burning man|8", "es lo mismo que burning man|8", "hombre en llamas|5", "festival del desierto|5", "cual fue primero|4"], "related": ["history", "comesback"], "a": "<h3>The original burning man<\/h3><p>Zozobra predates the Burning Man of Black Rock City by <b>sixty years<\/b>, and Santa Feans will note this with a civic smile. But the two are not the same wisdom. Burning Man is a festival of self-expression in a desert that is empty until the festival fills it. Zozobra is a festival of self-release in a city that is full until the festival empties it of its sorrows.<\/p><p><b>Burning Man builds. Zozobra cleanses.<\/b> One is creative; the other is purgative. Both have their place.<\/p>", "a_es": "<h3>El burning man original<\/h3><p>Zozobra es anterior al Burning Man de Black Rock City por <b>sesenta años<\/b>, y la gente de Santa Fe se lo hará notar con una sonrisa de orgullo cívico. Pero los dos no son la misma sabiduría. Burning Man es un festival de autoexpresión en un desierto que está vacío hasta que el festival lo llena. Zozobra es un festival de liberación personal en una ciudad que está llena hasta que el festival la vacía de sus penas.<\/p><p><b>Burning Man construye. Zozobra limpia.<\/b> Uno es creativo; el otro es purgativo. Ambos tienen su lugar.<\/p>"}, {"id": "fiestas", "title": "Zozobra and the Fiestas de Santa Fe", "title_es": "Zozobra y las Fiestas de Santa Fe", "terms": ["fiesta|12", "fiestas|12", "fiestas de santa fe|14", "fiesta de santa fe|14", "part of fiesta|12", "fiesta council|8", "desfile|6", "la fiesta|8", "fiesta|6", "fiestas|7", "fiestas de santa fe|8", "fiesta de santa fe|8", "parte de las fiestas|8", "es parte de la fiesta|8", "consejo de la fiesta|6", "fiesta council|6", "desfile|5", "la fiesta|6", "dia del trabajo|5", "labor day|5"], "related": ["when", "comesback", "history"], "a": "<h3>The dark gate before the Fiestas<\/h3><p>The burn takes place on the Friday of Labor Day weekend, traditionally the eve of the Fiestas de Santa Fe. Zozobra is <b>not a formal part of Fiestas<\/b>. He is the dark gate through which the city passes before it can celebrate. The fire must come first. Then the joy. When he falls, the band strikes up “La Fiesta de Santa Fe.”<\/p>", "a_es": "<h3>La puerta oscura antes de las Fiestas<\/h3><p>La quema se realiza el viernes del fin de semana del Día del Trabajo (Labor Day), tradicionalmente la víspera de las Fiestas de Santa Fe. Zozobra <b>no es una parte formal de las Fiestas<\/b>. Es la puerta oscura por la que la ciudad pasa antes de poder celebrar. Primero debe venir el fuego. Luego la alegría. Cuando él cae, la banda arranca con “La Fiesta de Santa Fe”.<\/p>"}, {"id": "shuster", "title": "Will Shuster, the man who made Zozobra", "title_es": "Will Shuster, el hombre que creó a Zozobra", "terms": ["shuster|12", "will shuster|14", "shus|8", "who created zozobra|14", "who made zozobra|14", "who invented zozobra|14", "who started zozobra|14", "creator|8", "founder|8", "cinco pintores|12", "five painters|12", "five nuts|12", "nuts in a hut|12", "fremont ellis|8", "bakos|8", "mruk|8", "willard nash|8", "yaqui|10", "judas|10", "groucher|12", "old man groucher|14", "who named|12", "how did he get his name|12", "name mean|10", "meaning of zozobra|12", "what does zozobra mean|14", "what does the name mean|12", "dana johnson|10", "shipwreck|8", "first zozobra|10", "1924|6", "1923|6", "shuster|8", "will shuster|8", "quien creo a zozobra|8", "quien hizo a zozobra|8", "quien invento a zozobra|8", "quien empezo zozobra|8", "creador|6", "fundador|6", "cinco pintores|8", "cinco locos en una choza|7", "yaqui|7", "judas|7", "old man groucher|8", "viejo grunon|7", "quien le puso el nombre|8", "que significa zozobra|8", "significado del nombre|8", "dana johnson|7", "naufragio|6", "primer zozobra 1924|7"], "related": ["history", "mythology", "comesback"], "a": "<h3>The wounded painter<\/h3><p><b>William Howard Shuster Jr.<\/b>, “Shus” to his friends, was born in Philadelphia in 1893 and came home from the Great War with gassed lungs and a doctor’s grim arithmetic: a few months left, unless he went west to thinner, drier air. He chose Santa Fe, and lived another forty-five years. There he joined Fremont Ellis, Walter Mruk, Jozef Bakos and Willard Nash as <b>Los Cinco Pintores<\/b>, who built adobe homes side by side on Camino del Monte Sol. Locals called them “five nuts in a hut.”<\/p><p><b>Christmas Eve, 1923:<\/b> after a rare sale, Shuster proposed the painters write their troubles on scraps of paper and burn them. The first glooms were burned. <b>Spring 1924:<\/b> traveling in Mexico with E. Dana Johnson, editor of the Santa Fe New Mexican, he watched a Yaqui Holy Week tradition: an effigy of Judas paraded, jeered and set alight before a cheering crowd. What struck him was the communion of it. A whole village had agreed, for one afternoon, on a single villain.<\/p><p><b>September 1924:<\/b> the first effigy, six feet tall, burned in Shuster’s backyard. He called it <b>Old Man Groucher<\/b>, and knew the name was wrong. Johnson pulled down a Spanish dictionary and found <b>zozobra<\/b>: anguish, anxiety, gloom, and most evocatively, the sensation of a ship going down. To founder. To sink. The word was perfect.<\/p><p>In 1964 Shuster entrusted the entire tradition, his model, drawings, scripts and blueprints, to the <b>Kiwanis Club of Santa Fe<\/b>, the keepers of the rite ever since. After the first burn he wrote: <i>“Tonight, we have not just witnessed a spectacle; we have participated in a sacred rite of purification, laughter, and rebirth.”<\/i><\/p><p class=\"note\">Read the full story of Zozobra on our <a href=\"https://burnzozobra.com/history/\" target=\"_blank\" rel=\"noopener\">Myth &amp; History page<\/a>.<\/p>", "a_es": "<h3>El pintor herido<\/h3><p><b>William Howard Shuster Jr.<\/b>, “Shus” para sus amigos, nació en Filadelfia en 1893 y volvió a casa de la Gran Guerra con los pulmones dañados por el gas y la sombría aritmética de un médico: le quedaban unos cuantos meses, a menos que se fuera al oeste, a un aire más ligero y más seco. Eligió Santa Fe, y vivió otros cuarenta y cinco años. Allí se unió a Fremont Ellis, Walter Mruk, Jozef Bakos y Willard Nash como <b>Los Cinco Pintores<\/b>, quienes construyeron casas de adobe una junto a la otra en Camino del Monte Sol. La gente del lugar los llamaba “five nuts in a hut” (cinco locos en una choza).<\/p><p><b>Nochebuena de 1923:<\/b> después de una venta poco común, Shuster propuso que los pintores escribieran sus problemas en pedazos de papel y los quemaran. Se quemaron los primeros “glooms” (sus penas y preocupaciones). <b>Primavera de 1924:<\/b> de viaje por México con E. Dana Johnson, editor del Santa Fe New Mexican, presenció una tradición yaqui de Semana Santa: una efigie de Judas que era paseada, abucheada y prendida en llamas ante una multitud que vitoreaba. Lo que le impresionó fue la comunión de aquello. Todo un pueblo se había puesto de acuerdo, por una tarde, en un solo villano.<\/p><p><b>Septiembre de 1924:<\/b> la primera efigie, de seis pies de altura, ardió en el patio trasero de Shuster. La llamó <b>Old Man Groucher<\/b> (el Viejo Gruñón), y sabía que el nombre no era el correcto. Johnson bajó un diccionario de español y encontró <b>zozobra<\/b>: angustia, ansiedad, pesadumbre y, de la manera más evocadora, la sensación de un barco que se va a pique. Zozobrar. Hundirse. La palabra era perfecta.<\/p><p>En 1964 Shuster confió toda la tradición, su maqueta, dibujos, guiones y planos, al <b>Club Kiwanis de Santa Fe<\/b>, guardianes del rito desde entonces. Después de la primera quema escribió: <i>“Esta noche no solo hemos presenciado un espectáculo; hemos participado en un rito sagrado de purificación, risa y renacimiento.”<\/i><\/p><p class=\"note\">Lea la historia completa de Zozobra en nuestra página <a href=\"https://burnzozobra.com/history/\" target=\"_blank\" rel=\"noopener\">El Mito y la Historia<\/a>.<\/p>"}, {"id": "lostfound", "title": "Lost & found (phones, keys, wallets)", "title_es": "Objetos perdidos (teléfonos, llaves, carteras)", "terms": ["lost and found|14", "lost & found|14", "lost my phone|14", "lost phone|14", "lost a phone|14", "lost my keys|14", "lost keys|14", "lost my wallet|14", "lost wallet|14", "lost my id|12", "lost item|12", "lost something|12", "left my|8", "found a phone|12", "found a wallet|12", "found keys|12", "found an item|10", "turn in|6", "missing phone|10", "objetos perdidos|8", "cosas perdidas|8", "perdi mi telefono|8", "perdi mi celular|8", "celular perdido|8", "perdi mis llaves|8", "llaves perdidas|8", "perdi mi cartera|8", "cartera perdida|8", "perdi mi identificacion|7", "perdi algo|7", "se me perdio|7", "deje mi|5", "olvide mi|5", "encontre un telefono|7", "encontre un celular|7", "encontre una cartera|7", "encontre unas llaves|7", "encontre algo|6", "entregar|4"], "related": ["contact", "lost", "merchorder"], "a": "<h3>Lost &amp; found<\/h3><p><b>During the event:<\/b> lost property is turned in to, and held at, the <b>Gloom Tent on the first baseline<\/b>. If you find something, please bring it there or hand it to any volunteer wearing a Zozobra credential.<\/p><p><b>After the burn:<\/b> email <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a> or leave a voicemail at 855-ZOZOBRA (855-969-6272) with a description of the item, where you think you lost it, and how to reach you. Crews are breaking down the venue for days afterward, and items often surface during clean-up. If yours turns up, we will reach out.<\/p><p class=\"fine\">Looking for a lost child, not a lost item? Ask me about “lost kids.”<\/p>", "a_es": "<h3>Objetos perdidos y encontrados<\/h3><p><b>Durante el evento:<\/b> los objetos perdidos se entregan y se guardan en la <b>Gloom Tent, sobre la línea de primera base<\/b>. Si usted encuentra algo, por favor llévelo allí o entrégueselo a cualquier voluntario que porte una credencial de Zozobra.<\/p><p><b>Después de la quema:<\/b> escriba a <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a> o deje un mensaje de voz en el 855-ZOZOBRA (855-969-6272) con una descripción del objeto, dónde cree que lo perdió y cómo comunicarnos con usted. Las cuadrillas desmontan el lugar durante varios días después, y con frecuencia aparecen objetos durante la limpieza. Si el suyo aparece, nos pondremos en contacto.<\/p><p class=\"fine\">¿Busca a un niño perdido, no un objeto perdido? Pregúnteme por “niños perdidos”.<\/p>"}, {"id": "merchorder", "title": "Merchandise orders: shipping & problems", "title_es": "Pedidos de mercancía: envíos y problemas", "terms": ["my order|10", "merch order|12", "merchandise order|12", "order status|12", "where is my order|14", "where is my shirt|12", "shipping|10", "shipped|8", "ship|6", "when will it ship|12", "hasnt arrived|12", "has not arrived|12", "never received|10", "wrong size|12", "wrong item|12", "missing item|12", "exchange|8", "pick up my merchandise|14", "pick up merch|12", "where do i pick up|10", "cushion|10", "bleacher cushion|12", "balloon pin|10", "pin|5", "mi pedido|7", "pedido de mercancia|8", "estado del pedido|8", "donde esta mi pedido|8", "donde esta mi camiseta|7", "envio|7", "enviado|6", "cuando lo envian|8", "no ha llegado|8", "nunca llego|7", "no recibi mi pedido|8", "talla equivocada|8", "articulo equivocado|8", "falta un articulo|8", "cambio de talla|6", "recoger mi mercancia|8", "donde recojo|6", "cojin|6", "cojin para gradas|7", "pin de globo|6"], "related": ["merch", "manage", "contact"], "a": "<h3>Merchandise orders<\/h3><p>Merchandise bought online, including items added to a ticket order, is <b>shipped to you<\/b>. It is not handed out at the gate. Want something in hand on burn night? Shop in person at <b>ZozoFest<\/b> or at the <b>Merchandise Tent on Magers Field<\/b> on burn day.<\/p><p><b>Problem with an order?<\/b> Missing item, wrong size, or it has not arrived: email <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a> with the name and email on the order and what is wrong, and it goes straight to our merchandise team. You can also leave a voicemail at 855-ZOZOBRA.<\/p><p class=\"fine\">You can add merchandise to an existing ticket order from the Manage Tickets link in your confirmation email.<\/p>", "a_es": "<h3>Pedidos de mercancía<\/h3><p>La mercancía comprada en línea, incluidos los artículos agregados a un pedido de boletos, <b>se le envía a su domicilio<\/b>. No se entrega en la puerta. ¿Quiere tener algo en mano la noche de la quema? Compre en persona en <b>ZozoFest<\/b> o en la <b>Merchandise Tent (carpa de mercancía) en Magers Field<\/b> el día de la quema.<\/p><p><b>¿Problema con un pedido?<\/b> Si falta un artículo, la talla es incorrecta o no ha llegado: escriba a <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a> con el nombre y el correo electrónico del pedido y cuál es el problema, y llegará directamente a nuestro equipo de mercancía. También puede dejar un mensaje de voz en el 855-ZOZOBRA.<\/p><p class=\"fine\">Puede agregar mercancía a un pedido de boletos existente desde el enlace Manage Tickets (administrar boletos) en su correo de confirmación.<\/p>"}, {"id": "premiumemail", "title": "Premium parking pass email never arrived", "title_es": "Nunca llegó el correo del pase de estacionamiento premium", "terms": ["parking pass email|14", "second email|12", "never got the second email|14", "didnt get my parking pass|14", "no parking pass|12", "parking pass form|12", "valet pass|12", "valet email|12", "where is my parking pass|14", "coach pass|10", "valet instructions|10", "havent received my pass|12", "correo del pase de estacionamiento|8", "pase de estacionamiento|7", "segundo correo|7", "no me llego el segundo correo|8", "no recibi mi pase de estacionamiento|8", "no tengo pase de estacionamiento|8", "formulario del pase de estacionamiento|7", "pase de valet|8", "correo del valet|8", "donde esta mi pase de estacionamiento|8", "pase del autobus premium|6", "pase de coach|6", "instrucciones del valet|7", "no he recibido mi pase|8", "estacionamiento premium|6"], "related": ["premium", "premiumlist", "manage"], "a": "<h3>Premium parking and valet passes<\/h3><p>If your premium section includes coach delivery or parking, your pass and instructions come in a <b>separate email about a week before the event<\/b>, not with your ticket confirmation.<\/p><p><b>If it has not arrived:<\/b> check your spam folder and search your inbox for “Zozobra.” Still nothing? Email <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a> or call 855-ZOZOBRA with the name and email on your order and your section, and we will resend it. Please do not wait until burn day.<\/p>", "a_es": "<h3>Pases de estacionamiento premium y de valet<\/h3><p>Si su sección premium incluye traslado en autobús (coach) o estacionamiento, su pase y las instrucciones llegan en un <b>correo aparte, aproximadamente una semana antes del evento<\/b>, no con la confirmación de sus boletos.<\/p><p><b>Si no ha llegado:<\/b> revise su carpeta de correo no deseado (spam) y busque “Zozobra” en su bandeja de entrada. ¿Todavía nada? Escriba a <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a> o llame al 855-ZOZOBRA con el nombre y el correo electrónico de su pedido y su sección, y se lo reenviaremos. Por favor, no espere hasta el día de la quema.<\/p>"}, {"id": "seehim", "title": "Can I see Zozobra before gates open?", "title_es": "¿Puedo ver a Zozobra antes de que abran las puertas?", "terms": ["see zozobra before|12", "see him before|12", "see zozobra during the day|14", "during the day|8", "before the gates|8", "before gates open|10", "where is he assembled|14", "where is zozobra built|14", "where is he built|12", "where is he made|12", "where is zozobra now|12", "visit zozobra|12", "up close|6", "take a picture with zozobra|12", "photo with zozobra|12", "daytime|6", "ver a zozobra antes|7", "verlo antes|6", "ver a zozobra de dia|7", "de dia|4", "durante el dia|4", "antes de que abran las puertas|6", "antes de las puertas|4", "donde lo arman|7", "donde construyen a zozobra|7", "donde lo hacen|6", "donde esta zozobra ahora|6", "visitar a zozobra|6", "de cerca|3", "tomarme una foto con zozobra|6", "foto con zoz
