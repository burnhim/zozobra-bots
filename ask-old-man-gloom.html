ising/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/fundraising<\/a>. Su boleto, sus “glooms” (sus penas y preocupaciones) y su camiseta: todo va para los niños.<\/p>"}, {"id": "theme", "title": "2027 theme: Zozobra the Kid", "title_es": "Tema 2027: Zozobra the Kid", "terms": ["theme|3", "zozobra the kid|8", "the kid|5", "billy the kid|8", "billy|4", "santa fe ring|6", "lew wallace|6", "cowboy|4", "western|4", "country|3", "old west|5", "wild west|5", "outlaw|4", "villain|4", "gunslinger|4", "snake oil|8", "snake oil salesman|10", "salesman|5", "rustler|4", "trickster|4", "posse|3", "bandana", "lasso", "mustache", "hat", "costume", "why is he wearing", "look like", "why a cowboy|5", "tema|3", "tema de este ano|5", "vaquero|4", "por que de vaquero|5", "viejo oeste|5", "lejano oeste|5", "forajido|4", "bandido|4", "aceite de serpiente|8", "vendedor de aceite de serpiente|8", "cuatrero|4", "country western|4", "sombrero", "por que trae sombrero|4"], "related": ["costume", "lastyear", "history"], "a": "<h3>Zozobra the Kid — the 103rd Burning of Zozobra<\/h3><p>For his 103rd year, Old Man Gloom rides in as an outlaw. Not one outlaw. <b>All of them.<\/b><\/p><p>Zozobra the Kid is an amalgamation of every villain the Old West produced — the snake oil salesman, the rustler, the claim jumper, the crooked lawman, the card shark, and the land-grabbing man in the good suit who never fired a shot in his life and took more than all the others combined.<\/p><p><b>Why the outlaw fits him<\/b><\/p><p>Zozobra has never had a face of his own. That is the premise of the Decades Project and of the mythology itself: el Viejo takes the shape of whatever the age fears, and every year we give him a new one so we can see clearly what we’re burning. He has worn a crown. Now he wears a hat.<\/p><p>The Old West villain may be the truest trickster mask we have ever put on him. The outlaw takes by charm long before he takes by force. He is welcomed into towns. He is written into dime novels before the ink dries on the wanted poster. The legend grows until it is bigger and better loved than the man ever was, and by then nobody can tell the story straight anymore.<\/p><p>That is precisely what gloom does. It arrives friendly. It flatters you. It turns itself into a story you would rather tell than fix. <b>Zozobra the Kid is gloom with a good reputation.<\/b><\/p><p>New Mexico does not have to import this story. Billy the Kid sat in a jail in Santa Fe and wrote letters to Governor Lew Wallace from it, letters full of charm and bargaining and promises. The Santa Fe Ring took more land from more families with paper than any outlaw ever took with a gun. Our Old West villains were real, they were here, and some of them were respectable.<\/p><p><b>In the pageant<\/b><\/p><p>Nothing about the canon bends to accommodate a hat. The Torchbearers still fail first — the posse that rides out and comes back with nothing. The children are still taken while the lights are on. The crowd is still the one who decides. The Fire Spirit still ends him, and 2027 is Than Povi Martinez’s first year carrying that fire.<\/p><p><b>Why now<\/b><\/p><p>There is also a plain reason. People have asked us for a country western Zozobra for years — at the merchandise booth, in the mailbox, in the comments, every single season. It has been one of the most requested themes we have. In our 103rd year, with the Old West villain turning out to be one of the best masks gloom has ever worn, the ask and the mythology finally point at the same thing.<\/p><p><b>Burn him.<\/b><\/p>", "a_es": "<h3>Zozobra the Kid: la 103.ª Quema de Zozobra<\/h3><p>En su año 103, Old Man Gloom (el Viejo) llega cabalgando como forajido. No un forajido. <b>Todos ellos.<\/b><\/p><p>Zozobra the Kid es una amalgama de todos los villanos que produjo el Viejo Oeste: el vendedor de aceite de serpiente, el cuatrero, el usurpador de concesiones mineras, el agente de la ley corrupto, el tahúr y el acaparador de tierras de buen traje que jamás disparó un tiro en su vida y se llevó más que todos los demás juntos.<\/p><p><b>Por qué le queda el forajido<\/b><\/p><p>Zozobra nunca ha tenido un rostro propio. Esa es la premisa del Decades Project (Proyecto de las Décadas) y de la mitología misma: el Viejo toma la forma de lo que cada época teme, y cada año le damos una nueva para poder ver con claridad qué es lo que estamos quemando. Ya usó corona. Ahora usa sombrero.<\/p><p>El villano del Viejo Oeste quizá sea la máscara de embaucador más fiel que le hayamos puesto jamás. El forajido se lleva las cosas con encanto mucho antes de llevárselas por la fuerza. Los pueblos le dan la bienvenida. Lo escriben en novelas de a diez centavos antes de que se seque la tinta del cartel de “Se busca”. La leyenda crece hasta ser más grande y más querida de lo que el hombre fue jamás, y para entonces ya nadie puede contar la historia tal como fue.<\/p><p>Eso es precisamente lo que hace la pesadumbre. Llega amistosa. Lo adula. Se convierte en una historia que uno prefiere contar antes que arreglar. <b>Zozobra the Kid es la pesadumbre con buena reputación.<\/b><\/p><p>Nuevo México no tiene que importar esta historia. Billy the Kid estuvo en una cárcel de Santa Fe y desde ahí le escribió cartas al gobernador Lew Wallace, cartas llenas de encanto, regateos y promesas. El Santa Fe Ring les quitó más tierras a más familias con papeles de las que ningún forajido quitó jamás con una pistola. Nuestros villanos del Viejo Oeste fueron reales, estuvieron aquí, y algunos de ellos eran respetables.<\/p><p><b>En la ceremonia<\/b><\/p><p>Nada del canon se dobla para acomodar un sombrero. Los Portadores de Antorchas siguen siendo los primeros en fallar: la partida que sale a caballo y regresa con las manos vacías. A los niños todavía se los llevan con las luces encendidas. La multitud sigue siendo la que decide. El Espíritu del Fuego (Fire Spirit) sigue siendo quien acaba con él, y 2027 es el primer año en que Than Povi Martinez porta ese fuego.<\/p><p><b>Por qué ahora<\/b><\/p><p>También hay una razón sencilla. La gente nos ha pedido un Zozobra country western durante años: en el puesto de mercancía oficial, en el buzón, en los comentarios, cada temporada sin falta. Ha sido uno de los temas más solicitados que tenemos. En nuestro año 103, cuando el villano del Viejo Oeste resulta ser una de las mejores máscaras que la pesadumbre ha usado jamás, la petición y la mitología por fin apuntan a lo mismo.<\/p><p><b>Quémenlo.<\/b><\/p>"}, {"id": "costume", "title": "Costumes & what to wear", "title_es": "Disfraces y qué ponerse", "terms": ["costume|3", "wear|2", "dress up", "outfit", "dress", "shoes", "warm", "layers", "disfraz|4", "disfraces|4", "que me pongo|5", "que ponerse|4", "como vestirse|4", "vestirse|2", "ropa|2", "atuendo", "ropa vaquera|3", "zapatos", "chamarra", "abrigarse", "capas", "hace frio|2", "puedo ir disfrazado|5"], "related": ["theme", "rain", "prohibited"], "a": "<h3>Dress up!<\/h3><p>Costumes are encouraged — western wear fits this year’s <b>Zozobra the Kid<\/b> theme, and Zozobra gear is at the merchandise booth and online. Two rules: <b>no costume, prop or replica weapons<\/b> of any kind (leave the toy six-shooter at home), and no cuts, colors, wallet chains or insignia clothing.<\/p><p>Practical notes: comfortable shoes for the walk from the shuttle and the grass-and-dirt field, and a warm layer for after sunset.<\/p>", "a_es": "<h3>¡Disfrácese!<\/h3><p>Los disfraces son bienvenidos: la ropa vaquera va con el tema de este año, <b>Zozobra the Kid<\/b>, y los artículos de Zozobra están en el puesto de mercancía oficial y en línea. Dos reglas: <b>nada de armas de disfraz, de utilería ni réplicas<\/b> de ningún tipo (deje en casa el revólver de juguete), y nada de chalecos de club (“cuts”), colores de club (“colors”), cadenas para cartera ni ropa con insignias.<\/p><p>Notas prácticas: zapatos cómodos para la caminata desde el autobús gratuito (shuttle) y para el campo de pasto y tierra, y una chamarra o capa abrigadora para después de la puesta del sol.<\/p>"}, {"id": "music", "title": "Entertainment lineup", "title_es": "Programa de entretenimiento", "terms": ["music|3", "lineup|4", "who is playing|3", "who is performing|3", "who is singing|3", "band", "perform", "show", "entertainment", "headliner|4", "anthem", "chorus", "mariachi", "beach ball|3", "dance", "dancers", "musica|3", "programa|3", "cartel|3", "quien toca|4", "quien canta|4", "quien se presenta|4", "banda", "bandas|2", "grupos", "artistas|2", "entretenimiento|2", "espectaculo", "artista principal|4", "himno", "coro", "pelota de playa|3", "baile", "danzantes"], "related": ["times", "drone", "burntime"], "a": "<h3>2027 lineup — details coming<\/h3><p>The bands and performers for the 103rd Burning of Zozobra <b>haven’t been announced yet<\/b>. The lineup will be posted at <a href=\"https://burnzozobra.com\" target=\"_blank\" rel=\"noopener\">burnzozobra.com<\/a> as soon as it’s set — check back here too.<\/p><p>What doesn’t change:<\/p><ul><li><b>4:00 p.m.<\/b> — Gates open at the Scottish Rite Temple, with live music from the start<\/li><li><b>6:00 p.m.<\/b> — Official ceremonies begin<\/li><li><b>8:45 p.m.<\/b> — All ticket holders should be in the venue<\/li><li><b>At dark<\/b> — <b>ZOZOBRA BURNS<\/b>, followed by the fireworks finale<\/li><\/ul><p class=\"fine\">No clock time is published for the burn — he burns at dark, weather and wind permitting.<\/p>", "a_es": "<h3>Programa 2027: detalles próximamente<\/h3><p>Las bandas y los artistas de la 103.ª Quema de Zozobra <b>todavía no se han anunciado<\/b>. El programa se publicará en <a href=\"https://burnzozobra.com\" target=\"_blank\" rel=\"noopener\">burnzozobra.com<\/a> en cuanto esté definido; vuelva a consultar aquí también.<\/p><p>Lo que no cambia:<\/p><ul><li><b>4:00 p.m.<\/b>: Las puertas abren en el Scottish Rite Temple, con música en vivo desde el inicio<\/li><li><b>6:00 p.m.<\/b>: Comienzan las ceremonias oficiales<\/li><li><b>8:45 p.m.<\/b>: Todas las personas con boleto deben estar dentro del recinto<\/li><li><b>Al oscurecer<\/b>: <b>ZOZOBRA ARDE<\/b>, seguido del gran final de fuegos artificiales<\/li><\/ul><p class=\"fine\">No se publica una hora exacta para la quema: él arde al oscurecer, si el clima y el viento lo permiten.<\/p>"}, {"id": "drone", "title": "Drone show", "title_es": "Espectáculo de drones", "terms": ["drone show|5", "my drone|6", "fly my|5", "drones|2", "light show|3", "sky", "espectaculo de drones|6", "show de drones|6", "drones|3", "mi dron|6", "volar mi dron|6", "puedo llevar mi dron|6", "dron|3", "espectaculo de luces|3", "luces en el cielo|3", "cielo", "record guinness|3"], "related": ["music", "fireworks"], "a": "<h3>The Drone Show<\/h3><p><b>13 minutes over Fort Marcy<\/b>, flown by a <b>six-time Guinness World Record holder<\/b>, right before the National Anthem and the burn. (Your own drone stays home: personal drones are prohibited and will be confiscated.)<\/p>", "a_es": "<h3>El espectáculo de drones<\/h3><p><b>13 minutos sobre Fort Marcy<\/b>, volados por un <b>seis veces poseedor de récords Guinness<\/b>, justo antes del Himno Nacional y de la quema. (Su propio dron se queda en casa: los drones personales están prohibidos y serán confiscados.)<\/p>"}, {"id": "foodbooths", "title": "Food booths", "title_es": "Puestos de comida", "terms": ["food booth|5", "booth|3", "who is selling|3", "lemonade|3", "snow cone|3", "kettle corn|3", "custard|3", "chocolate|2", "pops", "beer garden", "puestos de comida|6", "puesto de comida|5", "puesto|3", "puestos|3", "quien vende|3", "que venden de comer|4", "vendedores de comida|4", "limonada|3", "raspados|3", "palomitas|3", "helado|2", "paletas", "jardin cervecero", "agua gratis|3", "aceptan tarjeta|3"], "related": ["food", "bring"], "a": "<h3>2027 food booths — details coming<\/h3><p>The food and beverage vendors for the 103rd Burning of Zozobra <b>haven’t been announced yet<\/b>. The list will be posted at <a href=\"https://burnzozobra.com\" target=\"_blank\" rel=\"noopener\">burnzozobra.com<\/a> once vendors are confirmed — check back here too.<\/p><p>What doesn’t change: booths line the vendor area on the ball field, open from gates until the burn, <b>cash and card accepted<\/b>, with <b>free bottled water all night<\/b>.<\/p>", "a_es": "<h3>Puestos de comida 2027: detalles próximamente<\/h3><p>Los vendedores de comida y bebida de la 103.ª Quema de Zozobra <b>todavía no se han anunciado<\/b>. La lista se publicará en <a href=\"https://burnzozobra.com\" target=\"_blank\" rel=\"noopener\">burnzozobra.com<\/a> una vez que se confirmen los vendedores; vuelva a consultar aquí también.<\/p><p>Lo que no cambia: los puestos se alinean en el área de vendedores del campo de béisbol, abiertos desde que abren las puertas hasta la quema, <b>se acepta efectivo y tarjeta<\/b>, con <b>agua embotellada gratis toda la noche<\/b>.<\/p>"}, {"id": "fireworks", "title": "Fireworks", "title_es": "Fuegos artificiales", "terms": ["fireworks|3", "finale", "after", "stay", "leave early", "end of show", "fuegos artificiales|5", "cohetes|3", "pirotecnia|4", "juegos pirotecnicos|4", "gran final|2", "final", "despues de la quema|3", "quedarse", "irse temprano|3", "salir antes|3", "fin del espectaculo|3", "cuando termina|2"], "related": ["burntime", "closures"], "a": "<h3>Don't leave when he falls<\/h3><p>A <b>15-minute fireworks finale<\/b> follows the burn. Then the party music plays while the crowd heads out. The shuttles and the late Rail Runner train wait for you, and roads reopen in stages, so there's no advantage to rushing the exits.<\/p>", "a_es": "<h3>No se vaya cuando él caiga<\/h3><p>Después de la quema viene un <b>gran final de 15 minutos de fuegos artificiales<\/b>. Luego suena la música de fiesta mientras la multitud va saliendo. Los autobuses gratuitos (shuttles) y el tren tardío del Rail Runner lo esperan, y las calles se reabren por etapas, así que no hay ninguna ventaja en correr hacia las salidas.<\/p>"}, {"id": "watch", "title": "Can I watch from home?", "title_es": "¿Puedo verlo desde casa?", "terms": ["watch|3", "live", "home", "stream", "channel", "tv", "koat", "webcast", "cant make it", "out of town", "ver|2", "verlo en vivo|5", "en vivo|3", "desde casa|4", "transmision|4", "transmiten|3", "canal|2", "television|3", "tele|2", "koat|3", "por internet|3", "en linea|2", "no puedo ir|3", "fuera de la ciudad|2", "donde lo veo|4", "what channel|14", "on tv|12", "que canal|14"], "related": ["tickets", "gloom", "discounts"], "a": "<h3>Nothing beats being there<\/h3><p>Zozobra is made to be felt in person: the heat of the fire on your face, the fireworks overhead, and tens of thousands of voices chanting “Burn him!” together. No screen comes close.<\/p><p>It’s an affordable night out, too. Kids 10 and under are free in General Admission, there are no ticket fees, and every ticket helps local kids. Tickets for the 103rd Burning go on sale <b>April 13, 2027<\/b>.<\/p><p class=\"note\">Far from Santa Fe? You can still send your gloom online to be burned with him. Ask me about “submit a gloom.”<\/p>", "a_es": "<h3>Nada se compara con estar ahí<\/h3><p>Zozobra se vive en persona: el calor del fuego en la cara, los fuegos artificiales en el cielo y decenas de miles de voces gritando “¡Quémenlo!” al mismo tiempo. Ninguna pantalla se le acerca.<\/p><p>Además, es una noche accesible. Los niños de 10 años o menos entran gratis en Admisión General, no hay cargos por boleto y cada boleto ayuda a niños de la comunidad. Los boletos para la Quema número 103 salen a la venta el <b>13 de abril de 2027<\/b>.<\/p><p class=\"note\">¿Está lejos de Santa Fe? Aun así puede enviar su pena en línea para que se queme con él. Pregúnteme por “enviar una pena”.<\/p>"}, {"id": "merch", "title": "Merchandise", "title_es": "Mercancía", "terms": ["merch|3", "buy shirt", "shop", "sell", "souvenir", "crocs", "blanket", "wristband", "cup", "mercancia|4", "mercancia oficial|4", "comprar camiseta|4", "camiseta|2", "playera|2", "tienda|2", "venden", "recuerdo|2", "recuerdos|2", "souvenir|2", "crocs|2", "cobija", "pulsera", "vaso", "sudadera", "gorra"], "related": ["money", "tickets"], "a": "<h3>Zozobra gear<\/h3><p>T-shirts, hoodies, caps, posters, blankets (50″ × 60″), Croc charms, ZozoRita glasses and more — at the <b>Merchandise Tent on Magers Field<\/b>, before the main ballpark viewing area and online alongside tickets at <a href=\"https://www.ticketsignup.io/TicketEvent/Zozobra\" target=\"_blank\" rel=\"noopener\">ticketsignup.io<\/a>. Online merchandise orders are shipped to you, and you can add merch to an existing ticket order via Manage Tickets. Merchandise sales help pay for the event and fund the Kiwanis children's grants, which is why outside groups can't give away branded apparel at the venue.<\/p>", "a_es": "<h3>Artículos de Zozobra<\/h3><p>Camisetas, sudaderas con capucha, gorras, carteles, cobijas (50″ × 60″), dijes para Crocs, vasos ZozoRita y más: en la <b>Merchandise Tent (carpa de mercancía oficial) en Magers Field<\/b>, antes del área principal para ver el evento en el campo de béisbol, y en línea junto con los boletos en <a href=\"https://www.ticketsignup.io/TicketEvent/Zozobra\" target=\"_blank\" rel=\"noopener\">ticketsignup.io<\/a>. Los pedidos de mercancía en línea se le envían a usted, y puede agregar mercancía a un pedido de boletos existente mediante Manage Tickets. Las ventas de mercancía ayudan a pagar el evento y financian las subvenciones de Kiwanis para los niños, por lo cual los grupos externos no pueden regalar ropa con marca en el recinto.<\/p>"}, {"id": "contact", "title": "Hotline & contact", "title_es": "Línea de Zozobra y contacto", "terms": ["contact|3", "hotline|3", "reach", "someone", "talk", "person", "office", "contacto|4", "contactar|3", "linea de zozobra|5", "linea directa|3", "telefono|3", "numero de telefono|4", "llamar|2", "hablar con alguien|4", "persona", "comunicarme|3", "correo|2", "email|2", "oficina", "a quien le pregunto|3"], "related": ["neighbors", "ada"], "a": "<h3>Zozobra Hotline: 855-ZOZOBRA<\/h3><p>Call <b><a href=\"tel:18559696272\">855-969-6272<\/a><\/b>. In the weeks before the burn, live operators answer <b>8 a.m.–5 p.m. daily, and 8 a.m.–8 p.m. on burn day<\/b>. Any other time, leave a voicemail: it reaches the team. Email <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a>.<\/p><p>Voicemail messages are returned within 24 hours.<\/p><p><b>Lost an item?<\/b> During the event, lost property is held at the Gloom Tent on the first baseline. Afterward, email us a description. Ask me about “lost and found.”<\/p><p class=\"note\">Please don't call the City's emergency lines with event questions — keep them clear for emergencies.<\/p>", "a_es": "<h3>Línea de Zozobra: 855-ZOZOBRA<\/h3><p>Llame al <b><a href=\"tel:18559696272\">855-969-6272<\/a><\/b>. En las semanas previas a la quema, operadores en vivo contestan de <b>8 a.m.–5 p.m. todos los días, y de 8 a.m.–8 p.m. el día de la quema<\/b>. En cualquier otro momento, deje un mensaje de voz: le llega al equipo. Correo electrónico: <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a>.<\/p><p>Los mensajes de voz se responden en un plazo de 24 horas.<\/p><p><b>¿Perdió algo?<\/b> Durante el evento, los objetos perdidos se guardan en la Gloom Tent, sobre la línea de primera base. Después, envíenos una descripción por correo electrónico. Pregúnteme por “objetos perdidos”.<\/p><p class=\"note\">Por favor, no llame a las líneas de emergencia de la Ciudad con preguntas sobre el evento: manténgalas libres para emergencias.<\/p>"}, {"id": "neighbors", "title": "Fort Marcy neighbors", "title_es": "Vecinos de Fort Marcy", "terms": ["neighbor|3", "pass|2", "neighborhood pass|3", "soft closure", "hard closure", "utility bill", "license", "guest", "guests", "party", "house", "home", "fmn", "checkpoint", "roadblock", "live near|3", "live on|3", "live in|2", "live by|3", "vecino|4", "vecinos|4", "pase|2", "pase de vecindario|6", "pase de vecino|6", "cierre parcial|3", "cierre total|3", "recibo de luz|3", "recibo de servicios|3", "licencia", "invitados|2", "fiesta|2", "casa", "fmn|3", "reten|3", "punto de control|3", "vivo cerca|5", "vivo en|3", "vivo por|3", "residente|3"], "related": ["closures", "zweek", "contact"], "a": "<h3>If you live near Fort Marcy<\/h3><p>Residents inside the closure area get through checkpoints with a <b>neighborhood pass<\/b>, a driver's license or a utility bill showing the address. Passes for your guests are requested at <a href=\"https://burnzozobra.com/fmn/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/fmn<\/a> (the password was on your neighbor postcard). The pass gets you through the roadblock — it is not an event ticket.<\/p><ul><li>A <b>soft closure<\/b> admits residents with those documents at the officer's discretion; a <b>hard closure<\/b> means no vehicles at all.<\/li><li>Guests arriving after hard closures come in <b>on foot<\/b> and are subject to search — no food, drinks, backpacks or weapons through the roadblocks. Drop party supplies at the house the day before.<\/li><li>Roads reopen roughly 45–75 minutes after the show concludes; no vehicle exceptions are possible during that window.<\/li><\/ul><ul><li><b>Park facilities:<\/b> the Fort Marcy ballfield and the Murales parking lots close Monday, Aug. 23 and reopen <b>Sunday, Sept. 5 at noon<\/b>. The pickleball courts and dog park close Tuesday, Aug. 31 at 10 p.m., the Rec Complex Tuesday, Aug. 31 at noon, and Magers Field Wednesday, Sept. 1 at noon; all four reopen <b>Saturday, Sept. 4 at noon<\/b>. The <b>tennis court parking lot does not reopen until Tuesday, Sept. 7<\/b>. Ask me about “Zozobra week at Fort Marcy” for the full schedule.<\/li><li><b>Hosting a party?<\/b> Drop all party food and drink at your home by Thursday, Sept. 2 — nothing comes through the roadblocks on Friday.<\/li><li>If you can’t get home by a detour route, be home before <b>5:30 p.m.<\/b><\/li><\/ul><p>Detour maps: <a href=\"https://burnzozobra.com/fmn-maps/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/fmn-maps<\/a>. <b>Pass problems?<\/b> If your pass printed with “0” in the guests box, the field was left blank — just submit the form again with the guest count filled in. Not receiving the neighborhood emails? Write <a href=\"mailto:neighbors@burnzozobra.com\">neighbors@burnzozobra.com<\/a> and we’ll re-add you to the residents list. Neighbor questions: <a href=\"mailto:neighbors@burnzozobra.com\">neighbors@burnzozobra.com<\/a> or 855-ZOZOBRA — a live person answers.<\/p>", "a_es": "<h3>Si usted vive cerca de Fort Marcy<\/h3><p>Los residentes dentro del área de cierre pasan los puntos de control con un <b>pase de vecindario<\/b>, una licencia de conducir o un recibo de servicios públicos que muestre la dirección. Los pases para sus invitados se solicitan en <a href=\"https://burnzozobra.com/fmn/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/fmn<\/a> (la contraseña venía en su tarjeta postal para vecinos). El pase le permite cruzar el retén vial; no es un boleto para el evento.<\/p><ul><li>Un <b>cierre parcial (soft closure)<\/b> deja pasar a los residentes con esos documentos a discreción del oficial; un <b>cierre total (hard closure)<\/b> significa que no pasa ningún vehículo.<\/li><li>Los invitados que lleguen después de los cierres totales entran <b>a pie<\/b> y están sujetos a revisión: no pasan comida, bebidas, mochilas ni armas por los retenes. Deje las cosas para la fiesta en la casa el día anterior.<\/li><li>Las calles se reabren aproximadamente 45–75 minutos después de que concluye el espectáculo; no es posible hacer excepciones para vehículos durante ese lapso.<\/li><\/ul><ul><li><b>Instalaciones del parque:<\/b> el campo de béisbol de Fort Marcy y los estacionamientos de Murales cierran el lunes 23 de agosto y reabren el <b>domingo 5 de septiembre al mediodía<\/b>. Las canchas de pickleball y el parque para perros cierran el martes 31 de agosto a las 10 p.m., el Rec Complex el martes 31 de agosto al mediodía, y Magers Field el miércoles 1 de septiembre al mediodía; los cuatro reabren el <b>sábado 4 de septiembre al mediodía<\/b>. El <b>estacionamiento de las canchas de tenis no reabre hasta el martes 7 de septiembre<\/b>. Pregúnteme por “la semana de Zozobra en Fort Marcy” para ver el calendario completo.<\/li><li><b>¿Va a dar una fiesta?<\/b> Deje toda la comida y bebida de la fiesta en su casa a más tardar el jueves 2 de septiembre; el viernes no pasa nada por los retenes.<\/li><li>Si no puede llegar a su casa por una ruta de desvío, esté en casa antes de las <b>5:30 p.m.<\/b><\/li><\/ul><p>Mapas de desvíos: <a href=\"https://burnzozobra.com/fmn-maps/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/fmn-maps<\/a>. <b>¿Problemas con el pase?<\/b> Si su pase se imprimió con “0” en la casilla de invitados, es que el campo se dejó en blanco; simplemente envíe el formulario otra vez con el número de invitados lleno. ¿No recibe los correos del vecindario? Escriba a <a href=\"mailto:neighbors@burnzozobra.com\">neighbors@burnzozobra.com<\/a> y lo volveremos a agregar a la lista de residentes. Preguntas de vecinos: <a href=\"mailto:neighbors@burnzozobra.com\">neighbors@burnzozobra.com<\/a> o 855-ZOZOBRA; contesta una persona en vivo.<\/p>"}, {"id": "volunteer", "title": "Volunteer", "title_es": "Voluntariado", "terms": ["volunteer|3", "volunteers get|6", "volunteer discount|6", "volunteer tickets|6", "sign up", "join", "participate", "get involved", "work", "crew", "voluntario|4", "voluntarios|4", "ser voluntario|6", "voluntariado|4", "descuento para voluntarios|6", "boletos para voluntarios|6", "que reciben los voluntarios|6", "inscribirme|3", "inscripcion|2", "unirme|2", "participar|2", "como ayudo|3", "quiero ayudar|3", "trabajar", "equipo"], "related": ["money", "history"], "a": "<h3>Join the crew<\/h3><p>Zozobra is built and run entirely by volunteers — more than <b>800 of them<\/b>. Departments include Construction, Gates, Tickets, Merchandise, Premium Viewing, Event Perimeter Operations, the Art Show and ZozoFest, General Event Help, and the hotline (which you can staff from home). Start at <a href=\"https://www.oldmangloom.com/new-volunteer-step-1/\" target=\"_blank\" rel=\"noopener\">oldmangloom.com/new-volunteer-step-1<\/a>. New volunteers complete a short call with our volunteer team and a background check before placement (it stays valid for two years). <b>Volunteer sign-up for the 103rd opens January 1, 2027.<\/b><\/p><p>Volunteers tell us it’s a very special experience, and whole service clubs sign up together to work the gates year after year.<\/p><p class=\"fine\">There’s no published ticket discount for volunteers’ families — standard GA discounts (senior, student, military, NM resident) apply. Questions about your situation go to <a href=\"mailto:volunteers@burnzozobra.com\">volunteers@burnzozobra.com<\/a>.<\/p>", "a_es": "<h3>Únase al equipo<\/h3><p>Zozobra lo construyen y lo operan en su totalidad voluntarios: más de <b>800 de ellos<\/b>. Los departamentos incluyen Construcción, Puertas, Boletos, Mercancía, Premium Viewing, Operaciones del Perímetro del Evento, la Exposición de Arte y ZozoFest, Ayuda General del Evento y la Línea de Zozobra (que usted puede atender desde casa). Empiece en <a href=\"https://www.oldmangloom.com/new-volunteer-step-1/\" target=\"_blank\" rel=\"noopener\">oldmangloom.com/new-volunteer-step-1<\/a>. Los voluntarios nuevos completan una breve llamada con nuestro equipo de voluntarios y una verificación de antecedentes antes de ser asignados (tiene validez por dos años). <b>La inscripción de voluntarios para la 103.ª abre el 1 de enero de 2027.<\/b><\/p><p>Los voluntarios nos dicen que es una experiencia muy especial, y clubes de servicio completos se inscriben juntos para trabajar en las entradas año tras año.<\/p><p class=\"fine\">No hay ningún descuento publicado en boletos para las familias de los voluntarios; aplican los descuentos normales de GA (General Admission, entrada general): adulto mayor, estudiante, militar, residente de NM. Las preguntas sobre su situación van a <a href=\"mailto:volunteers@burnzozobra.com\">volunteers@burnzozobra.com<\/a>.<\/p>"}, {"id": "sponsor", "title": "How to become a sponsor", "title_es": "Cómo ser patrocinador", "terms": ["sponsor|3", "booth", "vendor booth", "sell", "exhibit", "business", "advertise", "partner", "patrocinador|4", "patrocinadores|4", "patrocinio|4", "patrocinar|4", "ser patrocinador|5", "puesto", "puesto de vendedor|3", "quiero vender|3", "vender", "exhibir|2", "expositor|2", "negocio|2", "anunciar|2", "publicidad|2", "socio", "sell stuff|8", "sell things|8", "sell at zozobra|8", "be a vendor|8", "become a vendor|8", "vendor application|8", "vender cosas|8", "ser vendedor|8", "vender en zozobra|8", "become a sponsor|14", "how do i sponsor|14", "sponsor zozobra|14", "sponsorship|6", "sponsorship deck|14", "sponsor deck|14", "sponsor packet|12", "ser patrocinador|14", "como patrocino|14", "patrocinar zozobra|14", "paquete de patrocinio|12"], "related": ["sponsorwhy", "sponsorlevels", "sponsorsmall", "inkind"], "a": "<h3>Ride with us as a 2027 sponsor<\/h3><p>Sponsoring the 103rd Burning of Zozobra is simple, and <b>every level helps keep Zozobra free for kids and affordable for every family<\/b>.<\/p><ul><li><b>Look over the levels<\/b> in the <a href=\"https://burnzozobra.com/wp-content/uploads/2026/09/Zozobra-2027-Sponsorship-Deck-11x8.5.pdf\" target=\"_blank\" rel=\"noopener\">2027 Sponsorship Deck<\/a>, from a $500 Flare-Up to a custom package of $50,000 or more.<\/li><li><b>Tell us what fits you.<\/b> Any amount, any in-kind gift, or a package we build together.<\/li><li><b>Reach the Event Chairman directly:<\/b> <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a> or 855-ZOZOBRA (855-969-6272), or use the sponsor form at <a href=\"https://burnzozobra.com/sponsors/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/sponsors<\/a>.<\/li><\/ul><p class=\"fine\">Media partner and sponsor bids for the next burning are taken in January. Vendor and exhibitor questions go to <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a>.<\/p>", "a_es": "<h3>Acompáñenos como patrocinador en 2027<\/h3><p>Patrocinar la 103.ª Quema de Zozobra es sencillo, y <b>cada nivel ayuda a que Zozobra siga siendo gratis para los niños y accesible para todas las familias<\/b>.<\/p><ul><li><b>Revise los niveles<\/b> en el <a href=\"https://burnzozobra.com/wp-content/uploads/2026/09/Zozobra-2027-Sponsorship-Deck-11x8.5.pdf\" target=\"_blank\" rel=\"noopener\">folleto de patrocinio 2027 (2027 Sponsorship Deck)<\/a>, desde un Flare-Up de $500 hasta un paquete personalizado de $50,000 o más.<\/li><li><b>Díganos qué le conviene.<\/b> Cualquier cantidad, cualquier donación en especie, o un paquete que armemos juntos.<\/li><li><b>Comuníquese directamente con el Presidente del Evento:<\/b> <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a> o 855-ZOZOBRA (855-969-6272), o use el formulario de patrocinio en <a href=\"https://burnzozobra.com/sponsors/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/sponsors<\/a>.<\/li><\/ul><p class=\"fine\">Las propuestas de socios de medios y de patrocinadores para la próxima quema se reciben en enero. Preguntas de vendedores y expositores: <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a>.<\/p>"}, {"id": "sponsorwhy", "title": "Why Zozobra needs sponsors", "title_es": "Por qué Zozobra necesita patrocinadores", "terms": ["why sponsor|16", "why should i sponsor|18", "why do you need sponsors|18", "why sponsors|14", "need sponsors|12", "keep it free|14", "keep zozobra free|16", "free for kids|10", "affordable|8", "why give|12", "why donate|12", "what does my sponsorship do|16", "what does sponsorship pay for|16", "costs|6", "security costs|12", "donated tickets|12", "free tickets|8", "por que patrocinar|16", "por que necesitan patrocinadores|18", "para que sirve el patrocinio|16", "gratis para los ninos|10", "accesible|6", "por que donar|12", "boletos donados|12", "costos|6", "costo de seguridad|12"], "related": ["sponsorlevels", "sponsorsmall", "inkind"], "a": "<h3>Help us keep Zozobra free for kids<\/h3><p>For more than a century, Old Man Gloom has belonged to everyone, and keeping it that way is a choice we make every year:<\/p><ul><li><b>Kids 10 and under get in free<\/b> in General Admission.<\/li><li><b>General admission holds at $30<\/b> with no processing or credit card fees. We absorb every one of them.<\/li><li><b>We give away 5,000 tickets<\/b>, $150,000 worth, to New Mexico families who could not otherwise be there.<\/li><li><b>Security is an enormous cost:<\/b> police officers, a professional security firm, metal detectors and bag screening at every gate, and medical teams on site all night.<\/li><li><b>Free rides:<\/b> free shuttles, a free ADA shuttle, a free Bike Valet, and we pay the Rail Runner to hold the late train.<\/li><\/ul><p>We don’t begrudge a dollar of it. But we don’t want to charge for kids, and we don’t want to raise the ticket price. <b>Sponsorships and premium seating are how we hold the line<\/b>, and once all of Zozobra’s bills are paid, every dollar left goes to nonprofits serving the region’s children.<\/p><p class=\"fine\">Ask me about “sponsorship levels,” or call 855-ZOZOBRA.<\/p>", "a_es": "<h3>Ayúdenos a que Zozobra siga siendo gratis para los niños<\/h3><p>Durante más de un siglo, Old Man Gloom (el Viejo) ha sido de todos, y mantenerlo así es una decisión que tomamos cada año:<\/p><ul><li><b>Los niños de 10 años o menos entran gratis<\/b> en General Admission (entrada general).<\/li><li><b>La entrada general se mantiene en $30<\/b>, sin cargos por procesamiento ni por tarjeta de crédito. Nosotros los absorbemos todos.<\/li><li><b>Regalamos 5,000 boletos<\/b>, con un valor de $150,000, a familias de Nuevo México que de otra manera no podrían asistir.<\/li><li><b>La seguridad es un costo enorme:<\/b> oficiales de policía, una empresa de seguridad profesional, detectores de metales y revisión de bolsas en cada puerta, y equipos médicos en el lugar toda la noche.<\/li><li><b>Transporte gratis:<\/b> autobuses gratuitos (shuttles), un autobús ADA gratuito, un Bike Valet gratuito, y le pagamos al Rail Runner para que espere con el tren nocturno.<\/li><\/ul><p>No lamentamos ni un dólar de esto. Pero no queremos cobrar por los niños ni subir el precio del boleto. <b>Los patrocinios y los asientos premium son la manera de sostenerlo<\/b>, y una vez pagadas todas las cuentas de Zozobra, cada dólar que sobra va a organizaciones sin fines de lucro que sirven a los niños de la región.<\/p><p class=\"fine\">Pregúnteme por los “niveles de patrocinio”, o llame al 855-ZOZOBRA.<\/p>"}, {"id": "sponsorlevels", "title": "Sponsorship levels", "title_es": "Niveles de patrocinio", "terms": ["sponsorship levels|18", "sponsor levels|18", "levels|8", "tiers|10", "sponsorship tiers|18", "packages|10", "sponsorship packages|18", "how much to sponsor|18", "how much is a sponsorship|18", "sponsorship cost|16", "sponsorship price|16", "flare-up|14", "flare up|14", "tio coco|14", "torchbearer sponsor|16", "beach ball sponsor|16", "fire spirit sponsor|16", "zozofest sponsor|16", "tickets sponsor|16", "wristband sponsor|16", "you name it|14", "niveles de patrocinio|18", "niveles|8", "paquetes de patrocinio|18", "paquetes|8", "cuanto cuesta patrocinar|18", "precio del patrocinio|16", "costo del patrocinio|16"], "related": ["sponsorbenefits", "sponsorsmall", "sponsor"], "a": "<h3>2027 sponsorship levels<\/h3><ul><li><b>Flare-Up — $500–$1,000:<\/b> five minutes of Zozobra fame, 6–7 p.m.<\/li><li><b>Tio Coco — $1,000:<\/b> 4 General Admission, logo and banner<\/li><li><b>Gloomies — $2,500:<\/b> 2 in East of the Beast, keepsake photo<\/li><li><b>Torchbearer — $5,000:<\/b> 4 in the Fire Pit, Torchbearer patches<\/li><li><b>Beach Ball — $10,000:<\/b> your logo on 2,000 beach balls, 4 Front and Center, a named grant<\/li><li><b>Fire Spirit — $12,000:<\/b> 4 Front and Center, photo with the Fire Spirit, a named grant<\/li><li><b>ZozoFest — $15,000:<\/b> ZozoFest naming, :30 jumbotron spot, KOAT interview, 2 Ultimate Zozobra Experience<\/li><li><b>Tickets — $25,000:<\/b> your logo on every online ticket, live thank-you from the stage<\/li><li><b>Wristband — $45,000:<\/b> your logo on 45,000 wristbands, live thank-you from the stage<\/li><li><b>You Name It — $50,000+:<\/b> a custom Zozobra Experience built with you<\/li><\/ul><p>Every level includes the benefits all sponsors receive, and in-kind and trade sponsorships are welcome at any level. Full details: <a href=\"https://burnzozobra.com/wp-content/uploads/2026/09/Zozobra-2027-Sponsorship-Deck-11x8.5.pdf\" target=\"_blank\" rel=\"noopener\">2027 Sponsorship Deck<\/a>.<\/p><p class=\"fine\">Named grants are chosen from recipients the Santa Fe Downtown Kiwanis Foundation has already selected; sponsors have no role in selecting grantees.<\/p>", "a_es": "<h3>Niveles de patrocinio 2027<\/h3><ul><li><b>Flare-Up — $500–$1,000:<\/b> cinco minutos de fama en Zozobra, de 6 a 7 p.m.<\/li><li><b>Tio Coco — $1,000:<\/b> 4 entradas generales, logotipo y manta<\/li><li><b>Gloomies — $2,500:<\/b> 2 en East of the Beast, foto de recuerdo<\/li><li><b>Torchbearer — $5,000:<\/b> 4 en el Fire Pit, parches de Torchbearer<\/li><li><b>Beach Ball — $10,000:<\/b> su logotipo en 2,000 pelotas de playa, 4 en Front and Center, una subvención a su nombre<\/li><li><b>Fire Spirit — $12,000:<\/b> 4 en Front and Center, foto con el Espíritu del Fuego, una subvención a su nombre<\/li><li><b>ZozoFest — $15,000:<\/b> nombre en ZozoFest, anuncio de :30 en las pantallas, entrevista en KOAT, 2 Ultimate Zozobra Experience<\/li><li><b>Tickets — $25,000:<\/b> su logotipo en cada boleto en línea, agradecimiento en vivo desde el escenario<\/li><li><b>Wristband — $45,000:<\/b> su logotipo en 45,000 pulseras, agradecimiento en vivo desde el escenario<\/li><li><b>You Name It — $50,000+:<\/b> una experiencia de Zozobra personalizada, hecha con usted<\/li><\/ul><p>Cada nivel incluye los beneficios que reciben todos los patrocinadores, y los patrocinios en especie y por intercambio son bienvenidos en cualquier nivel. Todos los detalles: <a href=\"https://burnzozobra.com/wp-content/uploads/2026/09/Zozobra-2027-Sponsorship-Deck-11x8.5.pdf\" target=\"_blank\" rel=\"noopener\">folleto de patrocinio 2027<\/a>.<\/p><p class=\"fine\">Las subvenciones a nombre del patrocinador se eligen entre los beneficiarios que la Santa Fe Downtown Kiwanis Foundation ya seleccionó; los patrocinadores no participan en la selección.<\/p>"}, {"id": "sponsorsmall", "title": "Can I give a small amount?", "title_es": "¿Puedo dar una cantidad pequeña?", "terms": ["small amount|18", "small business|12", "small sponsorship|16", "how little|14", "minimum|12", "minimum sponsorship|16", "any amount|16", "can i give|12", "give a little|14", "just donate|12", "donate a little|14", "$100|8", "$250|8", "not much money|14", "limited budget|14", "small budget|14", "cantidad pequena|18", "negocio pequeno|12", "patrocinio pequeno|16", "minimo|12", "cualquier cantidad|16", "puedo dar|12", "dar un poco|14", "donar poco|14", "poco dinero|14", "presupuesto limitado|14", "presupuesto pequeno|14"], "related": ["inkind", "sponsorlevels", "sponsor"], "a": "<h3>No amount is too big or too small<\/h3><p><b>Everything helps.<\/b> A $500 Flare-Up and a $45,000 Wristband sponsorship do the same good work: each one keeps a family’s ticket affordable and a child’s admission free.<\/p><p>If none of our packages fits your budget, <b>tell us what does and we’ll work out a sponsorship with you<\/b>. Call 855-ZOZOBRA (855-969-6272) or email <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a>.<\/p><p class=\"fine\">Giving as an individual? The “I’m Not Coming So I’m Pitching In” donation is a suggested $15 at <a href=\"https://burnzozobra.com/fundraising/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/fundraising<\/a>.<\/p>", "a_es": "<h3>Ninguna cantidad es demasiado grande ni demasiado pequeña<\/h3><p><b>Todo ayuda.<\/b> Un Flare-Up de $500 y un patrocinio Wristband de $45,000 hacen el mismo bien: cada uno mantiene accesible el boleto de una familia y gratis la entrada de un niño.<\/p><p>Si ninguno de nuestros paquetes se ajusta a su presupuesto, <b>díganos qué le funciona y armaremos un patrocinio con usted<\/b>. Llame al 855-ZOZOBRA (855-969-6272) o escriba a <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a>.<\/p><p class=\"fine\">¿Quiere dar como persona? La donación “I’m Not Coming So I’m Pitching In” (“No voy, pero coopero”) es de $15 sugeridos en <a href=\"https://burnzozobra.com/fundraising/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/fundraising<\/a>.<\/p>"}, {"id": "inkind", "title": "In-kind sponsorships", "title_es": "Patrocinios en especie", "terms": ["in kind|18", "in-kind|18", "inkind|18", "donate products|16", "donate services|16", "donate goods|16", "trade|12", "trade sponsorship|18", "barter|14", "my products|12", "my services|12", "printing|8", "signage|8", "catering|8", "equipment|8", "en especie|18", "donar productos|16", "donar servicios|16", "intercambio|12", "patrocinio por intercambio|18", "trueque|14", "mis productos|12", "mis servicios|12", "impresion|8", "letreros|8", "banquetes|8", "equipo|6"], "related": ["sponsorsmall", "sponsorlevels", "sponsor"], "a": "<h3>In-kind helps just as much<\/h3><p>If your business has products or services that lessen our costs, that is as good as a check. <b>Every dollar we don’t have to spend leaves more net proceeds to help disadvantaged children<\/b> once all of Zozobra’s bills are paid.<\/p><ul><li><b>Goods or services we need:<\/b> printing, signage, catering, equipment and more.<\/li><li><b>Trade sponsorships:<\/b> discounts on items we use, in exchange for visibility and tickets.<\/li><li><b>Ticket or merchandise trades:<\/b> donate in exchange for Zozobra tickets or exclusive merchandise for your employees or clients.<\/li><\/ul><p>In-kind sponsors receive a tax-deductible donation letter, two General Admission tickets and an official 2027 poster, plus the benefits all sponsors receive. Email <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a> to talk it through.<\/p>", "a_es": "<h3>Lo que se dona en especie ayuda igual<\/h3><p>Si su negocio tiene productos o servicios que reducen nuestros costos, eso vale tanto como un cheque. <b>Cada dólar que no tenemos que gastar deja más ganancias netas para ayudar a los niños desfavorecidos<\/b> una vez pagadas todas las cuentas de Zozobra.<\/p><ul><li><b>Bienes o servicios que necesitamos:<\/b> impresión, letreros, comida (catering), equipo y más.<\/li><li><b>Patrocinios por intercambio:<\/b> descuentos en artículos que usamos, a cambio de visibilidad y boletos.<\/li><li><b>Intercambio por boletos o mercancía:<\/b> done a cambio de boletos de Zozobra o mercancía exclusiva para sus empleados o clientes.<\/li><\/ul><p>Los patrocinadores en especie reciben una carta de donación deducible de impuestos, dos boletos de General Admission (entrada general) y un póster oficial 2027, además de los beneficios que reciben todos los patrocinadores. Escriba a <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a> para platicarlo.<\/p>"}, {"id": "sponsorbenefits", "title": "What sponsors receive", "title_es": "Qué reciben los patrocinadores", "terms": ["sponsor benefits|18", "benefits|8", "what do sponsors get|18", "what do i get|14", "what's in it for me|14", "exposure|12", "visibility|12", "audience|8", "reach|8", "tax deductible|16", "tax deduction|16", "tax letter|14", "logo|6", "recognition|10", "beneficios|8", "beneficios del patrocinio|18", "que reciben los patrocinadores|18", "que recibo|14", "exposicion|12", "visibilidad|12", "audiencia|8", "alcance|8", "deducible de impuestos|16", "deduccion de impuestos|16", "carta de donacion|14", "reconocimiento|10"], "related": ["sponsorlevels", "sponsorwhy", "sponsor"], "a": "<h3>Your support won’t go unnoticed<\/h3><p><b>All sponsors receive:<\/b><\/p><ul><li>A tax-deductible donation letter<\/li><li>Your logo on the Zozobra website<\/li><li>Recognition as a business honoring Will Shuster’s legacy<\/li><li>A public “Thank You” from the stage during the event<\/li><\/ul><p><b>Who you reach:<\/b> 49,732 people on the field in 2026, four out of five of them Santa Fe County residents, and a total audience of 1,265,932 with the KOAT broadcast and livestream. ZozoFest drew 46,331 visits.<\/p><p class=\"fine\">Higher levels add premium viewing, banners at ZozoFest and the burn, jumbotron spots, KOAT interviews and named grants. Ask me about “sponsorship levels.”<\/p>", "a_es": "<h3>Su apoyo no pasará desapercibido<\/h3><p><b>Todos los patrocinadores reciben:<\/b><\/p><ul><li>Una carta de donación deducible de impuestos<\/li><li>Su logotipo en el sitio web de Zozobra<\/li><li>Reconocimiento como un negocio que honra el legado de Will Shuster<\/li><li>Un “Gracias” público desde el escenario durante el evento<\/li><\/ul><p><b>A quién llega:<\/b> 49,732 personas en el campo en 2026, cuatro de cada cinco residentes del condado de Santa Fe, y una audiencia total de 1,265,932 con la transmisión de KOAT y por internet. ZozoFest tuvo 46,331 visitas.<\/p><p class=\"fine\">Los niveles más altos agregan vista premium, mantas en ZozoFest y en la quema, anuncios en las pantallas gigantes, entrevistas en KOAT y subvenciones a su nombre. Pregúnteme por los “niveles de patrocinio”.<\/p>"}, {"id": "smoking", "title": "Smoking & vaping", "title_es": "Fumar y vapear", "terms": ["smoking|4", "bring", "fumar|5", "se puede fumar|6", "puedo fumar|6", "cigarro|4", "cigarros|4", "cigarrillos|4", "vapear|5", "vape|4", "vapeador|4", "encendedor|3", "marihuana|3", "tabaco|3", "llevar"], "related": ["prohibited"], "a": "<h3>Smoking<\/h3><p>Lighters, open flames and recreational drugs are prohibited inside the venue, and it's a dry, grassy field surrounded by neighbors — please don't smoke or vape in the crowd. Alcohol is available only in the Santa Fe Brewing beer garden.<\/p>", "a_es": "<h3>Fumar<\/h3><p>Los encendedores, las llamas abiertas y las drogas recreativas están prohibidos dentro del recinto, y es un campo seco y con pasto, rodeado de vecinos: por favor, no fume ni vapee entre la multitud. El alcohol está disponible solamente en el jardín cervecero (beer garden) de Santa Fe Brewing.<\/p>"}, {"id": "camera", "title": "Cameras, drones & photos", "title_es": "Cámaras, drones y fotos", "terms": ["camera|4", "drone|3", "tripod", "gopro", "professional", "press|5", "media|5", "media pass|6", "press pass|6", "bring", "camara|4", "camaras|4", "fotos|3", "tomar fotos|4", "puedo llevar camara|5", "dron|3", "drones|3", "tripie|2", "tripode|2", "profesional", "prensa|5", "medios|5", "pase de prensa|6", "pase de medios|6", "acreditacion|4", "palo de selfie|2", "llevar"], "related": ["prohibited", "watch"], "a": "<h3>Photos yes, drones no<\/h3><p>Phones and handheld cameras are welcome — share with <b>#Zozobra103<\/b> and <b>#burnmygloom<\/b> — the official accounts reshare favorites. <b>Drones are prohibited<\/b> and will be confiscated and not returned (the airspace is in use for the show). Professional cameras, detachable lenses, and audio/video recording equipment are prohibited, along with tripods, monopods and selfie sticks. Press credentials: <a href=\"mailto:press_liaison@burnzozobra.com\">press_liaison@burnzozobra.com<\/a>.<\/p>", "a_es": "<h3>Fotos sí, drones no<\/h3><p>Los teléfonos y las cámaras de mano son bienvenidos; comparta con <b>#Zozobra103<\/b> y <b>#burnmygloom<\/b>, y las cuentas oficiales vuelven a compartir sus favoritas. <b>Los drones están prohibidos<\/b> y serán confiscados y no se devolverán (el espacio aéreo está en uso para el espectáculo). Las cámaras profesionales, los lentes desmontables y el equipo de grabación de audio o video están prohibidos, junto con los tripiés, monopiés y palos para selfies. Acreditaciones de prensa: <a href=\"mailto:press_liaison@burnzozobra.com\">press_liaison@burnzozobra.com<\/a>.<\/p>"}, {"id": "weapon", "title": "Weapons", "title_es": "Armas", "terms": ["weapon|4", "carry", "permit", "self defense", "bring", "arma|5", "armas|5", "pistola|4", "cuchillo|4", "navaja|4", "gas pimienta|4", "portar|2", "portacion|3", "permiso", "defensa personal|3", "arma de juguete|4", "casilleros|2", "llevar"], "related": ["prohibited"], "a": "<h3>No weapons of any kind<\/h3><p>No knives, pocket knives, multi-tools, mace or pepper spray. <b>No firearms — no concealed carry and no open carry, even with a permit.<\/b> No costume, prop or Old West replica weapons either — toy six-shooters included. There are no lockers at the venue this year, so leave them at home.<\/p>", "a_es": "<h3>Ningún tipo de armas<\/h3><p>Nada de cuchillos, navajas de bolsillo, herramientas multiusos, gas lacrimógeno (mace) ni gas pimienta. <b>Nada de armas de fuego: ni portación oculta ni portación a la vista, ni siquiera con permiso.<\/b> Tampoco armas de disfraz, de utilería ni réplicas del Viejo Oeste, incluidos los revólveres de juguete. Este año no hay casilleros en el recinto, así que déjelas en casa.<\/p>"}, {"id": "medical", "title": "Medical supplies & sunscreen", "title_es": "Artículos médicos y protector solar", "terms": ["medical|4", "sunscreen|4", "bring", "first aid", "emt", "ambulance", "medic", "hurt", "sick", "emergency", "medico|4", "medicinas|4", "medicamentos|4", "medicina|3", "protector solar|5", "bloqueador|4", "bloqueador solar|5", "primeros auxilios|4", "paramedicos|3", "ambulancia|3", "diabetes|3", "diabetico|3", "insulina|3", "herido", "enfermo", "emergencia|2", "panales|2", "llevar"], "related": ["bring", "ada"], "a": "<h3>Medical<\/h3><p>Medications, medical supplies and diapers are welcome in a clear bag. <b>Medically necessary food and drink — like a diabetic’s emergency snacks — are handled as medical supplies, not outside food:<\/b> they stay sealed in their original packaging, no food-exchange transfer required. Carry them in your clear bag and let the officer at the gate know at the start of screening; they’ll be inspected visually but not opened. Spray sunscreen 6 oz or less, one per person. Medical teams are on site all evening — flag any volunteer, officer or security staff member and they'll get help to you.<\/p>", "a_es": "<h3>Atención médica<\/h3><p>Los medicamentos, los artículos médicos y los pañales son bienvenidos en una bolsa transparente. <b>La comida y bebida médicamente necesarias, como los refrigerios de emergencia de una persona con diabetes, se tratan como artículos médicos, no como comida de afuera:<\/b> se mantienen selladas en su empaque original, sin necesidad de pasar por el intercambio de alimentos (food exchange). Llévelas en su bolsa transparente y avísele al oficial de la puerta al inicio de la revisión; se inspeccionarán visualmente, pero no se abrirán. Protector solar en aerosol de 6 oz o menos, uno por persona. Hay equipos médicos en el lugar toda la tarde y noche: haga una seña a cualquier voluntario, oficial o integrante del personal de seguridad y le conseguirán ayuda.<\/p>"}, {"id": "crowd", "title": "How big is the crowd?", "title_es": "¿Qué tan grande es la multitud?", "terms": ["crowd|3", "how many", "big", "line", "wait", "sold out", "multitud|3", "cuanta gente|3", "cuantas personas|3", "gente", "capacidad|3", "aforo|3", "fila", "filas", "espera", "esperar", "agotado", "boletos agotados|2", "lleno", "se llena", "grande"], "related": ["times", "parking"], "a": "<h3>Up to 50,000<\/h3><p>In-person capacity is <b>50,000<\/b>, and General Admission is capped at <b>40,000<\/b> — the occupancy was deliberately reduced so everyone has more room. Hundreds of thousands more watch online. Lines are shortest before 7 p.m. — gates open at 4:00, and there's a full lineup of music from the start.<\/p>", "a_es": "<h3>Hasta 50,000<\/h3><p>La capacidad en persona es de <b>50,000<\/b>, y General Admission (entrada general) tiene un límite de <b>40,000<\/b> — el aforo se redujo a propósito para que todos tengan más espacio. Cientos de miles más lo ven en línea. Las filas son más cortas antes de las 7 p.m. — las puertas abren a las 4:00, y hay un programa completo de música desde el principio.<\/p>"}, {"id": "firstaid", "title": "First aid", "title_es": "Primeros auxilios", "terms": ["first aid|5", "aid", "medic|3", "nurse", "paramedic", "ambulance", "help", "injured", "hurt|2", "sick|2", "faint", "heat", "primeros auxilios|5", "auxilios|4", "medico|3", "medicos|3", "enfermera", "paramedico|2", "paramedicos|2", "ambulancia|2", "ayuda", "herido|2", "lastimado|2", "me lastime|2", "enfermo|2", "me siento mal|3", "desmayo", "desmayarse", "calor", "emergencia medica|3"], "related": ["medical", "restroom", "contact"], "a": "<h3>First aid — three locations<\/h3><ul><li><b>Fire Station No. 1<\/b>, at the north end of the venue<\/li><li><b>The food garden<\/b> on Magers Field<\/li><li><b>Just west of the first base dugout<\/b><\/li><\/ul><p>Need help right now? Flag the nearest uniformed officer or an usher in an orange vest — they can get help to you faster than you can walk to a tent.<\/p>", "a_es": "<h3>Primeros auxilios — tres ubicaciones<\/h3><ul><li><b>Estación de Bomberos n.º 1<\/b>, en el extremo norte del recinto<\/li><li><b>El jardín de comida<\/b> en Magers Field<\/li><li><b>Justo al oeste del dugout de primera base<\/b><\/li><\/ul><p>¿Necesita ayuda en este momento? Hágale señas al oficial uniformado más cercano o a un acomodador con chaleco anaranjado — ellos pueden hacerle llegar la ayuda más rápido de lo que usted puede caminar hasta una carpa.<\/p>"}, {"id": "beer", "title": "Beer garden", "title_es": "Jardín cervecero", "terms": ["beer|5", "beer garden|5", "alcohol|2", "margarita", "cocktail", "drink alcohol|3", "bar", "last call|4", "cerveza|5", "cervezas|5", "jardin cervecero|5", "bebidas alcoholicas|3", "coctel", "tomar alcohol|3", "venden cerveza|5", "venden alcohol|3", "ultima llamada|4", "chela|4", "chelas|4"], "related": ["food", "foodbooths"], "a": "<h3>Beer garden — by Santa Fe Brewing<\/h3><p>Two locations: <b>under the scoreboard<\/b> on the ball field side, and in the <b>north complex parking lot<\/b>. <b>Last call is 8:45 p.m. and service closes at 9:00 p.m.<\/b> — be there before 9 if you want a drink before the burn. Alcohol stays inside the beer garden areas, and no outside alcohol comes through the gates.<\/p>", "a_es": "<h3>Jardín cervecero (beer garden) — por Santa Fe Brewing<\/h3><p>Dos ubicaciones: <b>debajo del marcador<\/b> del lado del campo de béisbol, y en el <b>estacionamiento del complejo norte<\/b>. <b>La última llamada es a las 8:45 p.m. y el servicio cierra a las 9:00 p.m.<\/b> — llegue antes de las 9 si quiere una bebida antes de la quema. El alcohol se queda dentro de las áreas del jardín cervecero, y no pasa ningún alcohol de afuera por las puertas.<\/p>"}, {"id": "restroom", "title": "Restrooms & water", "title_es": "Baños y agua", "terms": ["restroom|3", "water station", "wash", "hands", "bano|3", "banos|3", "sanitario|3", "sanitarios|3", "banos portatiles|3", "donde estan los banos|4", "agua gratis|3", "agua", "estacion de agua|3", "rellenar botella|3", "botella de agua|2", "lavarse", "lavarse las manos|2", "manos"], "related": ["food", "bring"], "a": "<h3>Restrooms &amp; water<\/h3><p><b>Eleven porta-potty banks<\/b> ring the venue — along the ball field perimeter, through the food booth rows, around the Fort Marcy Complex, at the north end, at the entry gates, and toward the Scottish Rite and Montezuma Lodge lots. Several banks include ADA units, and ladies’ units carry a pink sign. The nearest bank is marked on the venue map at <a href=\"https://burnzozobra.com\" target=\"_blank\" rel=\"noopener\">burnzozobra.com<\/a>.<\/p><p><b>Free bottled water all night<\/b> — stations are marked on the venue map, and you can bring an empty hard-plastic bottle to refill. No outside drinks come through the gate.<\/p>", "a_es": "<h3>Baños y agua<\/h3><p><b>Once grupos de baños portátiles<\/b> rodean el recinto — a lo largo del perímetro del campo de béisbol, entre las filas de puestos de comida, alrededor del Fort Marcy Complex, en el extremo norte, en las puertas de entrada, y hacia los estacionamientos de Scottish Rite y Montezuma Lodge. Varios grupos incluyen unidades ADA, y las unidades para damas llevan un letrero rosa. El grupo más cercano está marcado en el mapa del recinto en <a href=\"https://burnzozobra.com\" target=\"_blank\" rel=\"noopener\">burnzozobra.com<\/a>.<\/p><p><b>Agua embotellada gratis toda la noche<\/b> — las estaciones están marcadas en el mapa del recinto, y puede traer una botella vacía de plástico duro para rellenarla. No pasa ninguna bebida de afuera por la puerta.<\/p>"}, {"id": "refund", "title": "Refunds & ticket insurance", "title_es": "Reembolsos y seguro de boletos", "terms": ["refund|8", "refunds|8", "money back|10", "cant go|8", "cant make it|8", "cancel my tickets|10", "ticket insurance|12", "insurance|8", "fanshield|12", "all sales final|10", "sell my", "terms", "reembolso|8", "reembolsos|8", "devolucion|8", "devolver el dinero|8", "me devuelven el dinero|8", "no puedo ir|8", "no voy a poder ir|8", "cancelar mis boletos|8", "cancelar boletos|8", "seguro de boletos|8", "fanshield|8", "ventas finales|8", "vender mis boletos|4", "vender mi boleto|4", "terminos", "seguro de boletos|8", "tengo seguro|6", "seguro de cancelacion|8"], "related": ["manage", "tickets", "watch"], "a": "<h3>All sales are final<\/h3><p>Zozobra burns rain or shine, and <b>tickets are not refundable<\/b>. The exception is <b>ticket insurance<\/b>: if you added it (through FanShield) when you bought, you can claim a refund for covered reasons such as illness, accidents, travel interruptions and work conflicts. File the claim at <a href=\"https://requestmyrefund.com/fanshield/refund\" target=\"_blank\" rel=\"noopener\">requestmyrefund.com/fanshield/refund<\/a>, and do it by noon on event day.<\/p><p><b>Can’t go and have no insurance?<\/b> Give your tickets to someone who can: Manage Tickets → “Transfer Tickets to Friend.” Full terms: <a href=\"https://burnzozobra.com/terms/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/terms<\/a>. Questions about a specific order: 855-ZOZOBRA or <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a>.<\/p>", "a_es": "<h3>Todas las ventas son finales<\/h3><p>Zozobra se quema llueva o truene, y <b>los boletos no son reembolsables<\/b>. La excepción es el <b>seguro de boletos<\/b>: si lo agregó (por medio de FanShield) al comprar, puede reclamar un reembolso por motivos cubiertos como enfermedad, accidentes, interrupciones de viaje y conflictos de trabajo. Presente el reclamo en <a href=\"https://requestmyrefund.com/fanshield/refund\" target=\"_blank\" rel=\"noopener\">requestmyrefund.com/fanshield/refund<\/a>, y hágalo antes del mediodía del día del evento.<\/p><p><b>¿No puede ir y no tiene seguro?<\/b> Dele sus boletos a alguien que sí pueda: Manage Tickets (administrar boletos) → “Transfer Tickets to Friend” (transferir boletos a un amigo). Términos completos: <a href=\"https://burnzozobra.com/terms/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/terms<\/a>. Preguntas sobre un pedido específico: 855-ZOZOBRA o <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a>.<\/p>"}, {"id": "reentry", "title": "Re-entry", "title_es": "Reingreso", "terms": ["reentry|3", "come back|2", "go out", "back in|2", "leave and come back|3", "leave and return|3", "reingreso|3", "reentrada|3", "volver a entrar|3", "regresar|2", "salir", "salir y regresar|3", "salir y volver a entrar|3", "salir y volver|3", "entrar otra vez|2", "puedo salir|2", "reingresar|3"], "related": ["gate", "prohibited"], "a": "<h3>Plan to stay<\/h3><p>Once you're in, plan to stay for the evening — everyone entering is screened, and gates close at 8:45 p.m. Bring what you need in a clear bag, and remember there are food vendors, free water and restrooms inside.<\/p>", "a_es": "<h3>Planee quedarse<\/h3><p>Una vez adentro, planee quedarse toda la velada — toda persona que entra pasa por revisión de seguridad, y las puertas cierran a las 8:45 p.m. Traiga lo que necesite en una bolsa transparente, y recuerde que adentro hay vendedores de comida, agua gratis y baños.<\/p>"}, {"id": "exits", "title": "Finding the exits", "title_es": "Cómo encontrar las salidas", "terms": ["exit|5", "exits|5", "leave the venue|4", "way out|4", "get out|3", "emergency exit|5", "evacuate|3", "salida|5", "salidas|5", "salir del recinto|4", "como salgo|4", "por donde salgo|4", "donde esta la salida|5", "salida de emergencia|5", "evacuar|3", "evacuacion|3", "irse", "al terminar"], "related": ["closures", "parking", "fireworks"], "a": "<h3>Finding the exits<\/h3><p>Look for the <b>lighted EXIT signage<\/b> and ushers in orange safety vests. Exits are lined with color-changing solar lights — <b>green means the exit is open; red means an usher will point you to the nearest alternate<\/b>. Arrow signs work the same way: a down arrow marks an exit, and left or right arrows lead you to the nearest one.<\/p><p class=\"fine\">You may be directed to an exit at a different location than where you entered — follow the ushers, they’re moving 50,000 people safely.<\/p>", "a_es": "<h3>Cómo encontrar las salidas<\/h3><p>Busque los <b>letreros iluminados de EXIT (salida)<\/b> y a los acomodadores con chalecos de seguridad anaranjados. Las salidas están bordeadas con luces solares que cambian de color — <b>verde significa que la salida está abierta; rojo significa que un acomodador le indicará la alternativa más cercana<\/b>. Los letreros con flechas funcionan igual: una flecha hacia abajo marca una salida, y las flechas a la izquierda o a la derecha lo llevan a la más cercana.<\/p><p class=\"fine\">Es posible que lo dirijan a una salida en un lugar distinto de donde entró — siga a los acomodadores, están moviendo a 50,000 personas de manera segura.<\/p>"}, {"id": "espanol", "title": "Información en español", "title_es": "Información en español", "terms": ["espanol|8", "en espanol|8", "spanish|6", "habla espanol|8", "hablan espanol|8", "informacion en espanol|8", "ayuda en espanol|8", "resumen|4", "resumen en espanol|8"], "related": ["tickets", "parking", "burntime"], "a": "<h3>¡Bienvenidos!<\/h3><p>La 103.ª Quema de Zozobra es el <b>viernes 3 de septiembre de 2027<\/b> en Fort Marcy Park, Santa Fe. Las puertas abren a las <b>4:00 p.m.<\/b>; por favor esté adentro antes de las <b>8:45 p.m.<\/b> Zozobra se quema al anochecer — no se publica una hora exacta porque depende del clima y del viento.<\/p><ul><!--PRE--><li><b>Los boletos salen a la venta el martes 13 de abril de 2027.<\/b><\/li><!--/PRE--><li><b>Boletos:<\/b> $30 en línea hasta el 2 de septiembre ($40 el día del evento) en <a href=\"https://www.ticketsignup.io/TicketEvent/Zozobra\" target=\"_blank\" rel=\"noopener\">ticketsignup.io<\/a>. Niños de 10 años o menos entran <b>gratis<\/b> en admisión general. Residentes de Nuevo México: $25.<\/li><li><b>Estacionamiento:<\/b> gratis en la estación del Rail Runner de South Capitol, con <b>autobús gratuito<\/b> desde las 5:00 p.m. (el último sale a las 8:45).<\/li><li><b>Bolsas transparentes solamente<\/b>; toda persona pasa por seguridad.<\/li><\/ul><p class=\"fine\">Para ayuda en español, llame a la línea de Zozobra: <b>855-969-6272<\/b>.<\/p>", "a_es": "<h3>¡Bienvenidos!<\/h3><p>La 103.ª Quema de Zozobra es el <b>viernes 3 de septiembre de 2027<\/b> en Fort Marcy Park, Santa Fe. Las puertas abren a las <b>4:00 p.m.<\/b>; por favor esté adentro antes de las <b>8:45 p.m.<\/b> Zozobra se quema al anochecer — no se publica una hora exacta porque depende del clima y del viento.<\/p><ul><!--PRE--><li><b>Los boletos salen a la venta el martes 13 de abril de 2027.<\/b><\/li><!--/PRE--><li><b>Boletos:<\/b> $30 en línea hasta el 2 de septiembre ($40 el día del evento) en <a href=\"https://www.ticketsignup.io/TicketEvent/Zozobra\" target=\"_blank\" rel=\"noopener\">ticketsignup.io<\/a>. Niños de 10 años o menos entran <b>gratis<\/b> en admisión general. Residentes de Nuevo México: $25.<\/li><li><b>Estacionamiento:<\/b> gratis en la estación del Rail Runner de South Capitol, con <b>autobús gratuito<\/b> desde las 5:00 p.m. (el último sale a las 8:45).<\/li><li><b>Bolsas transparentes solamente<\/b>; toda persona pasa por seguridad.<\/li><\/ul><p class=\"fine\">Para ayuda en español, llame a la línea de Zozobra: <b>855-969-6272<\/b>.<\/p>"}, {"id": "lastyear", "title": "Past themes & the Decades Project", "title_es": "Temas anteriores y el Decades Project", "terms": ["last year|6", "2026|5", "2025|5", "2024|5", "king george|6", "spirit of 76|6", "1776|5", "tyranny|5", "steampunk|6", "centennial|5", "100th|5", "decades|6", "decades project|8", "previous theme|6", "past themes|6", "ano pasado|6", "el ano pasado|6", "rey jorge|6", "espiritu del 76|6", "tirania|5", "centenario|5", "quema 100|5", "decadas|6", "proyecto de las decadas|8", "tema anterior|6", "temas anteriores|6", "temas pasados|6"], "related": ["theme", "history"], "a": "<h3>Recent burnings<\/h3><p><b>2026<\/b> was The Tyranny of Gloom vs. the Spirit of ’76, for America’s 250th — Zozobra as a tyrant king in powdered wig and crown. <b>2025<\/b> was the Steampunk extravaganza; <b>2024<\/b> was the Centennial — the 100th burning, with a record crowd. Before that, the <b>Decades Project<\/b> (2014–2023) walked through Zozobra’s eras one decade per year: the Roaring ’20s in 2014 through the ’90s in 2022, ending in 2023 with a Lord of the Rings and Harry Potter–inspired burning.<\/p><p>2027 is <b>Zozobra the Kid<\/b> — the country western burning.<\/p>", "a_es": "<h3>Quemas recientes<\/h3><p><b>2026<\/b> fue The Tyranny of Gloom vs. the Spirit of 76 (la Tiranía de Gloom contra el Espíritu del 76), por los 250 años de Estados Unidos — Zozobra como un rey tirano con peluca empolvada y corona. <b>2025<\/b> fue la extravagancia Steampunk; <b>2024<\/b> fue el Centenario — la quema número 100, con una multitud récord. Antes de eso, el <b>Decades Project<\/b> (Proyecto de las Décadas, 2014–2023) recorrió las épocas de Zozobra a razón de una década por año: desde los locos años 20 en 2014 hasta los años 90 en 2022, para terminar en 2023 con una quema inspirada en El Señor de los Anillos y Harry Potter.<\/p><p>2027 es <b>Zozobra the Kid<\/b> — la quema al estilo country western.<\/p>"}, {"id": "sensory", "title": "Noise, lights & sensory sensitivities", "title_es": "Ruido, luces y sensibilidades sensoriales", "terms": ["sensory|8", "autism|8", "autistic|8", "loud|4", "noise|5", "too loud|6", "strobe|7", "flashing|6", "epilepsy|8", "seizure|8", "ear protection|6", "earplugs|7", "headphones|5", "overwhelming|5", "scared of fireworks|6", "sensorial|8", "sensibilidad sensorial|8", "autismo|8", "autista|8", "ruidoso|5", "ruido|5", "mucho ruido|6", "estrobo|7", "luces estroboscopicas|7", "luces intermitentes|6", "epilepsia|8", "convulsiones|8", "proteccion para los oidos|6", "tapones|7", "tapones para los oidos|7", "audifonos|5", "orejeras|6", "abrumador|5", "miedo a los fuegos artificiales|6", "miedo a los cohetes|6"], "related": ["kids", "ada", "servicedog"], "a": "<h3>It’s loud — plan for it<\/h3><p>Honest answer: Zozobra is a pyrotechnics show. Daytime fireworks and smoke effects start in the afternoon, hours before dark. The main show is a full aerial fireworks display with concussion and crackling effects, Zozobra groans through a stadium sound system, there’s live amplified music from late afternoon on, a drone show, <b>flashing lights<\/b>, and the smell of smoke everywhere. The noise is loud, close, and sustained.<\/p><ul><li><b>Ear protection<\/b> (earmuffs or earplugs) is a very good idea for children and anyone sensitive to noise.<\/li><li>Guests sensitive to flashing lights should know the finale includes bright pyrotechnics and strobing effects.<\/li><li>An <b>edge or rear position<\/b> in your section makes stepping away easier, and the exits are marked with lighted signage all night.<\/li><li>Need help during the show? Find any volunteer wearing a Zozobra credential or an usher in an orange vest.<\/li><\/ul>", "a_es": "<h3>Es ruidoso — vaya preparado<\/h3><p>Respuesta honesta: Zozobra es un espectáculo de pirotecnia. Los fuegos artificiales diurnos y los efectos de humo empiezan por la tarde, horas antes de que oscurezca. El espectáculo principal es una exhibición completa de fuegos artificiales aéreos con efectos de estruendo y chisporroteo, Zozobra gime a través de un sistema de sonido de estadio, hay música en vivo amplificada desde media tarde en adelante, un espectáculo de drones, <b>luces intermitentes<\/b>, y olor a humo por todas partes. El ruido es fuerte, cercano y sostenido.<\/p><ul><li><b>La protección para los oídos<\/b> (orejeras o tapones) es muy buena idea para los niños y para cualquier persona sensible al ruido.<\/li><li>Las personas sensibles a las luces intermitentes deben saber que el final incluye pirotecnia brillante y efectos estroboscópicos.<\/li><li>Un <b>lugar en la orilla o en la parte de atrás<\/b> de su sección hace más fácil apartarse un momento, y las salidas están marcadas con letreros iluminados toda la noche.<\/li><li>¿Necesita ayuda durante el espectáculo? Busque a cualquier voluntario que lleve una credencial de Zozobra o a un acomodador con chaleco anaranjado.<\/li><\/ul>"}, {"id": "atm", "title": "ATM & paying on site", "title_es": "Cajero automático y pagos en el evento", "terms": ["atm|8", "cash|5", "cash only|5", "card|3", "credit card|4", "debit|4", "pay|2", "apple pay|4", "cajero|8", "cajero automatico|8", "efectivo|5", "solo efectivo|5", "tarjeta|3", "tarjeta de credito|4", "aceptan tarjeta|5", "debito|4", "tarjeta de debito|4", "pagar|2", "como pago|3", "sacar dinero|6"], "related": ["foodbooths", "merch"], "a": "<h3>No ATM — bring cash or cards<\/h3><p>There is <b>no ATM at the venue<\/b>, so bring cash or have your cards on you. The food booths and the Merchandise Tent accept <b>both cash and card<\/b>.<\/p>", "a_es": "<h3>No hay cajero automático — traiga efectivo o tarjetas<\/h3><p><b>No hay cajero automático (ATM) en el recinto<\/b>, así que traiga efectivo o lleve sus tarjetas consigo. Los puestos de comida y la carpa de mercancía oficial (Merchandise Tent) aceptan <b>tanto efectivo como tarjeta<\/b>.<\/p>"}, {"id": "groups", "title": "Group & school tickets", "title_es": "Boletos para grupos y escuelas", "terms": ["group|5", "groups|5", "school group|8", "school trip|8", "field trip|8", "group rate|8", "group tickets|8", "group discount|8", "bus load|5", "large party|5", "grupo|5", "grupos|5", "grupo escolar|8", "escuela|5", "escuelas|5", "viaje escolar|8", "excursion escolar|8", "paseo escolar|8", "tarifa de grupo|8", "precio de grupo|8", "boletos para grupos|8", "boletos de grupo|8", "descuento de grupo|8", "descuento para grupos|8", "autobus lleno|5", "grupo grande|5"], "related": ["tickets", "contact"], "a": "<h3>Group &amp; school tickets<\/h3><!--PRE--><p class=\"note\"><b>Tickets for the 103rd go on sale Tuesday, April 13, 2027<\/b> — the Kid’s Judgment Day. Prices and details below are what to expect; nothing can be purchased before then.<\/p><!--/PRE--><p>Yes — group and school ticket arrangements are available, handled <b>group by group<\/b> with our Event Chair and Ticketing Chairwoman. Reach out through the Zozobra Hotline at <b>855-ZOZOBRA (855-969-6272)<\/b> or email <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a> and we’ll set yours up.<\/p>", "a_es": "<h3>Boletos para grupos y escuelas<\/h3><!--PRE--><p class=\"note\"><b>Los boletos para la 103.ª salen a la venta el martes 13 de abril de 2027<\/b> — el Día del Juicio del Kid. Los precios y detalles a continuación son lo que se puede esperar; no se puede comprar nada antes de esa fecha.<\/p><!--/PRE--><p>Sí — hay arreglos de boletos para grupos y escuelas, que se manejan <b>grupo por grupo<\/b> con nuestro presidente del evento y nuestra presidenta de boletos. Comuníquese por medio de la Línea de Zozobra al <b>855-ZOZOBRA (855-969-6272)<\/b> o escriba a <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a> y le prepararemos el suyo.<\/p>"}, {"id": "tailgate", "title": "Tailgating", "title_es": "Tailgating (fiesta en el estacionamiento)", "terms": ["tailgate|8", "tailgating|8", "party in the lot|6", "hang out at south capitol|6", "fiesta en el estacionamiento|6", "convivir en el estacionamiento|6", "quedarse en south capitol|6", "carne asada en el estacionamiento|6", "asador|5", "parrillada|5", "hielera en el estacionamiento|5", "pasar el rato en el estacionamiento|6"], "related": ["parking", "foodbooths", "music"], "a": "<h3>Come inside instead<\/h3><p>Tailgating isn’t really a thing at South Capitol or nearby — and honestly, you wouldn’t want it to be. Everyone heads into the venue to take advantage of the food vendors and an amazing pre-show entertainment lineup that runs from the moment gates open at 4:00. Park, hop the free shuttle, and don’t miss out.<\/p>", "a_es": "<h3>Mejor venga adentro<\/h3><p>El tailgating (la fiesta en el estacionamiento) en realidad no se acostumbra en South Capitol ni en los alrededores — y, la verdad, usted no querría que se acostumbrara. Todos se dirigen al recinto para aprovechar los vendedores de comida y un programa increíble de entretenimiento previo al espectáculo que empieza desde el momento en que las puertas abren a las 4:00. Estaciónese, súbase al autobús gratuito (shuttle), y no se lo pierda.<\/p>"}, {"id": "outside", "title": "Watching from outside the venue", "title_es": "Ver desde afuera del recinto", "terms": ["watch from outside|8", "outside the venue|8", "from the hills|8", "nearby street|6", "watch for free|8", "see it for free|8", "without a ticket|8", "sneak|5", "free view|6", "ver desde afuera|8", "afuera del recinto|8", "fuera del recinto|8", "desde los cerros|8", "desde las lomas|8", "desde la calle|6", "calle cercana|6", "ver gratis|8", "verlo gratis|8", "sin boleto|8", "sin pagar|8", "colarse|5", "vista gratis|6", "desde mi carro|5"], "related": ["tickets", "watch", "closures"], "a": "<h3>Don’t try it — here’s why<\/h3><p>We <b>highly discourage<\/b> trying to watch from the hills or nearby streets. Most streets around the venue are closed off, and you may be moved along by law enforcement.<\/p><p>And here’s the thing — this is an amazing, affordable night. For the price of a New Mexico resident General Admission ticket, <b>$25<\/b>, you get top food vendors, <b>free water<\/b>, a lineup running from young local bands to professional headliners, a drone show flown by a <b>six-time Guinness World Record holder<\/b>, the fireworks — and Zozobra himself.<\/p>", "a_es": "<h3>No lo intente — y le explico por qué<\/h3><p><b>Desaconsejamos enfáticamente<\/b> tratar de ver desde los cerros o las calles cercanas. La mayoría de las calles alrededor del recinto están cerradas, y es posible que las autoridades le pidan retirarse.<\/p><p>Y el asunto es este — es una noche increíble y accesible para el bolsillo. Por el precio de un boleto de General Admission (entrada general) para residentes de Nuevo México, <b>$25<\/b>, usted recibe vendedores de comida de primera, <b>agua gratis<\/b>, un programa que va desde bandas locales jóvenes hasta artistas estelares profesionales, un espectáculo de drones volado por un <b>poseedor de seis récords mundiales Guinness<\/b>, los fuegos artificiales — y Zozobra en persona.<\/p>"}, {"id": "zozofest", "title": "ZozoFest (Aug. 25 and 27–29)", "title_es": "ZozoFest (25 y 27–29 de agosto)", "terms": ["zozofest|14", "zozofest hours|14", "zozofest schedule|14", "zozofest agenda|14", "car show|9", "lowrider|7", "lowriders|7", "crafts|5", "craft|5", "selfie with zozobra|6", "meet zozobra|8", "see zozobra|6", "up close|5", "mall|5", "santa fe place|6", "forever 21|6", "preview|4", "sneak peek|6", "dj|4", "week before|4", "zozofest|8", "horario de zozofest|8", "programa de zozofest|8", "cuando es zozofest|8", "exhibicion de autos|8", "car show|8", "manualidades|5", "selfie con zozobra|6", "conocer a zozobra|8", "ver a zozobra de cerca|6", "de cerca|5", "centro comercial|5", "exposicion de arte|5", "semana antes|4"], "related": ["gloom", "merch", "when"], "a": "<h3>ZozoFest — the free festival the week before the burn<\/h3><p>ZozoFest is <b>not<\/b> burn day. It is a separate, <b>free<\/b> event where you meet Zozobra up close before he goes to Fort Marcy. It runs the <b>Wednesday, Friday, Saturday and Sunday before the burn<\/b> at <b>Santa Fe Place Mall<\/b>, 4250 Cerrillos Road, at the western end in the former Forever 21 space.<\/p><ul><li><b>Wednesday, August 25, 2027 · 5–8 p.m.<\/b> — Sneak peek: first look at Zozobra and the Zozobra Art Show, with tickets and merchandise on sale and a DJ.<\/li><li><b>Friday, August 27, 2027 · 5–8 p.m.<\/b> — Meet Zozobra, the art show, merchandise and a DJ.<\/li><li><b>Saturday, August 28, 2027 · 10 a.m.–6 p.m.<\/b> — The big day: Zozobra viewing and selfies, free crafts tables (make your own Zozobra art and gloom box), the art show, merchandise, and DJs all day. The <b>ZozoFest Car Show<\/b> runs <b>noon–4 p.m.<\/b> in the parking lot — lowriders, trucks and bikes.<\/li><li><b>Sunday, August 29, 2027 · 11 a.m.–4 p.m.<\/b> — Last chance: final day of the art show, free crafts, photos, and <b>stuff your glooms inside Zozobra himself<\/b>.<\/li><\/ul><p>There is no ZozoFest on Thursday. Admission to ZozoFest and the art show is free. <b>No food or drinks inside the ZozoFest area<\/b> — we have to keep our monster in pristine condition.<\/p><p class=\"fine\">Artists: enter the Zozobra Art Exhibit (deadline Monday, August 2, 2027) at <a href=\"https://burnzozobra.com/zozobra-art-prospectus/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/zozobra-art-prospectus<\/a>. Full details: <a href=\"https://burnzozobra.com/zozofest/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/zozofest<\/a>.<\/p><p class=\"note\">The Burning of Zozobra itself is <b>Friday, September 3, 2027<\/b> at Fort Marcy Park — ask me about “burn day” for gate times.<\/p>", "a_es": "<h3>ZozoFest — el festival gratuito de la semana anterior a la quema<\/h3><p>ZozoFest <b>no<\/b> es el día de la quema. Es un evento aparte y <b>gratuito<\/b> donde usted conoce a Zozobra de cerca antes de que se vaya a Fort Marcy. Se lleva a cabo el <b>miércoles, viernes, sábado y domingo anteriores a la quema<\/b> en <b>Santa Fe Place Mall<\/b>, 4250 Cerrillos Road, en el extremo oeste, en el local que antes era Forever 21.<\/p><ul><li><b>Miércoles 25 de agosto de 2027 · 5–8 p.m.<\/b> — Adelanto: primer vistazo a Zozobra y a la Exposición de Arte de Zozobra, con boletos y mercancía a la venta y un DJ.<\/li><li><b>Viernes 27 de agosto de 2027 · 5–8 p.m.<\/b> — Conozca a Zozobra, la exposición de arte, mercancía y un DJ.<\/li><li><b>Sábado 28 de agosto de 2027 · 10 a.m.–6 p.m.<\/b> — El gran día: ver a Zozobra y tomarse selfies, mesas de manualidades gratis (haga su propio arte de Zozobra y su caja de “glooms” (sus penas y preocupaciones)), la exposición de arte, mercancía, y DJs todo el día. El <b>ZozoFest Car Show<\/b> (exhibición de autos) es de <b>mediodía a 4 p.m.<\/b> en el estacionamiento — lowriders, trocas y motos.<\/li><li><b>Domingo 29 de agosto de 2027 · 11 a.m.–4 p.m.<\/b> — Última oportunidad: último día de la exposición de arte, manualidades gratis, fotos, y <b>meta sus “glooms” dentro del mismísimo Zozobra<\/b>.<\/li><\/ul><p>No hay ZozoFest el jueves. La entrada a ZozoFest y a la exposición de arte es gratis. <b>No se
