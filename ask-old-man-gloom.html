  --bg:#181412; --bg-2:#221D1A; --bg-3:#2D2622;

  --red:#F0803A; --red-ink:#1F1208; --red-soft:#3A2415;
    --tint:rgba(16,12,10,.62); --glass:rgba(24,20,18,.90); --mark:#2A150B;
  --ember:#F08A3E;
  --bot:#1F1C1A; --user:#F0803A; --user-ink:#1F1208;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(var(--tint),var(--tint)),var(--bgimg) center/cover no-repeat fixed,var(--bg);color:var(--ink);font-family:"Bitter",Georgia,"Times New Roman",serif;font-size:16.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100dvh;max-width:760px;margin:0 auto;background:transparent}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);position:sticky;top:0;z-index:2}
.mark{width:44px;height:44px;flex:none}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-family:"Rye",Georgia,serif;font-weight:400;font-size:22px;letter-spacing:.01em;line-height:1;margin:0;color:var(--ink);text-wrap:balance}
.brand p{margin:3px 0 0;font-size:13px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;line-height:1.2}
.hotline{margin-left:auto;text-align:right;font-size:13px;color:var(--ink-2);line-height:1.25;flex:none}
.hotline b{display:block;font-family:"Rye",Georgia,serif;font-weight:400;font-size:15px;letter-spacing:.02em;color:var(--red)}
.hotline a{color:inherit;text-decoration:none}
.langbtn{display:block;margin:0 0 4px auto;font:inherit;font-size:13px;font-weight:700;padding:3px 11px;border-radius:999px;border:1.5px solid var(--red);background:transparent;color:var(--red);cursor:pointer}
.langbtn:hover{background:var(--red);color:var(--red-ink)}
@media (max-width:480px){.hotline span{display:none}.brand h1{font-size:18px}.brand p{font-size:10.5px}}
main{flex:1;overflow-y:auto;padding:18px 18px 8px;scroll-behavior:smooth;display:flex;flex-direction:column}
main>.msg:first-child{margin-top:auto}
.msg{flex:none}
@media (prefers-reduced-motion:reduce){main{scroll-behavior:auto}}
.msg{display:flex;margin:0 0 14px;max-width:88%}
.msg.bot{justify-content:flex-start}
.msg.user{justify-content:flex-end;margin-left:auto}
.bubble{padding:12px 16px;border-radius:18px;box-shadow:var(--shadow),0 2px 14px rgba(40,20,8,.18);font-size:16.5px}
.bot .bubble{background:var(--bot);border:1px solid var(--line);border-top-left-radius:6px;color:var(--ink)}
.user .bubble{background:var(--user);color:var(--user-ink);border-top-right-radius:6px}
.bubble h3{font-family:"Rye",Georgia,serif;font-weight:400;font-size:19px;letter-spacing:.01em;margin:0 0 6px;color:var(--red);line-height:1.1}
.bubble p{margin:0 0 8px}
.bubble p:last-child{margin-bottom:0}
.bubble ul{margin:0 0 8px;padding-left:20px}
.bubble li{margin:2px 0}
.bubble a{color:var(--red);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.bubble .note{font-size:14px;color:var(--ink-2);border-left:3px solid var(--ember);padding:2px 0 2px 10px;margin:8px 0 0}
.bubble .fine{font-size:14px;color:var(--ink-3)}
.bubble hr.split{border:0;border-top:1px dashed var(--line-2);margin:12px 0}
.related{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-2)}
.related span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);width:100%}
.rbtn{font:inherit;font-size:14px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--ink);cursor:pointer}
.rbtn:hover{border-color:var(--red);color:var(--red)}
footer{border-top:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:10px 18px 14px;position:sticky;bottom:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--red);color:var(--red)}
form{display:flex;gap:8px}
input{flex:1;font:inherit;font-size:17px;padding:12px 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--ink);min-width:0}
input::placeholder{color:var(--ink-3)}
button.send{font-family:"Rye",Georgia,serif;font-size:17px;letter-spacing:.03em;padding:0 22px;border-radius:999px;border:0;background:var(--red);color:var(--red-ink);cursor:pointer}
button.send:hover{filter:brightness(1.08)}
:is(input,button,.chip,.rbtn):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.legal{font-size:12px;color:var(--ink-2);margin:8px 2px 0;line-height:1.35}

sidents<\/b> — $5 off ($25)<\/li><li><b>Seniors<\/b> — $10 off ($20)<\/li><li><b>Active military and veterans<\/b> — $10 off ($20)<\/li><li><b>Students ages 11–23<\/b> — $15<\/li><li><b>Kids 10 and under<\/b> — free with a General Admission ticket<\/li><\/ul><p><b>Discounts apply to General Admission only<\/b> — they cannot be used on premium viewing sections. Discounted tickets are sold online through September 2 at <a href=\"https://www.ticketsignup.io/TicketEvent/Zozobra\" target=\"_blank\" rel=\"noopener\">ticketsignup.io<\/a>. Bring the ID that matches your discount to the gate.<\/p>", "a_es": "<h3>Descuentos en General Admission (entrada general)<\/h3><!--PRE--><p class=\"note\"><b>Los boletos para la 103.ª salen a la venta el martes 13 de abril de 2027<\/b> — el Día del Juicio (Judgment Day) de the Kid. Los precios y detalles a continuación son lo que puede esperar; no se puede comprar nada antes de esa fecha.<\/p><!--/PRE--><ul><li><b>Residentes de Nuevo México<\/b> — $5 de descuento ($25)<\/li><li><b>Adultos mayores<\/b> — $10 de descuento ($20)<\/li><li><b>Militares en servicio activo y veteranos<\/b> — $10 de descuento ($20)<\/li><li><b>Estudiantes de 11 a 23 años<\/b> — $15<\/li><li><b>Niños de 10 años o menos<\/b> — gratis con un boleto de General Admission<\/li><\/ul><p><b>Los descuentos aplican solo a General Admission<\/b> — no se pueden usar en las secciones de vista premium. Los boletos con descuento se venden en línea hasta el 2 de septiembre en <a href=\"https://www.ticketsignup.io/TicketEvent/Zozobra\" target=\"_blank\" rel=\"noopener\">ticketsignup.io<\/a>. Traiga a la puerta la identificación que corresponda a su descuento.<\/p>"}, {"id": "premium", "title": "Premium viewing sections", "title_es": "Secciones de vista premium", "terms": ["premium|3", "parking pass|3", "seat|2", "chair", "reserved", "vip", "valet", "coach", "delivered", "zone", "enchilada", "fire pit", "east of the beast", "west of the wild one", "balcony", "backdraft", "ember", "front and center", "ultimate", "sit", "sitting", "best view|2", "close", "closer", "front", "pase de estacionamiento|3", "asiento|2", "asientos|2", "silla", "reservado", "sentarse", "mejor vista|2", "cerca", "al frente"], "related": ["tickets", "parking", "ada"], "a": "<h3>Premium viewing<\/h3><!--PRE--><p class=\"note\"><b>Tickets for the 103rd go on sale Tuesday, April 13, 2027<\/b> — the Kid’s Judgment Day. Prices and details below are what to expect; nothing can be purchased before then.<\/p><!--/PRE--><p>Zozobra offers several premium viewing areas closer to Old Man Gloom — some seated, some standing, and a few that include coach delivery right to the venue. What's still available and current prices are on the ticket site: <a href=\"https://www.ticketsignup.io/TicketEvent/Zozobra\" target=\"_blank\" rel=\"noopener\">ticketsignup.io/TicketEvent/Zozobra<\/a>.<\/p><p>Premium ticket holders use the <b>Green Chile Gate<\/b> on the west side of the Scottish Rite Temple. If your section includes coach delivery or parking, your parking pass and instructions arrive by a <b>separate email about a week before the event<\/b> — have them with you on event night.<\/p><p class=\"fine\">Ask me for “the premium sections” to see each one. Seated sections have open seating — choose your seat when you arrive. Camping chairs are not allowed in premium sections.<\/p>", "a_es": "<h3>Vista premium<\/h3><!--PRE--><p class=\"note\"><b>Los boletos para la 103.ª salen a la venta el martes 13 de abril de 2027<\/b> — el Día del Juicio (Judgment Day) de the Kid. Los precios y detalles a continuación son lo que puede esperar; no se puede comprar nada antes de esa fecha.<\/p><!--/PRE--><p>Zozobra ofrece varias áreas de vista premium más cerca de Old Man Gloom (el Viejo) — algunas con asientos, otras de pie, y unas cuantas que incluyen traslado en autobús tipo coach hasta el mismo recinto. Lo que todavía está disponible y los precios actuales están en el sitio de boletos: <a href=\"https://www.ticketsignup.io/TicketEvent/Zozobra\" target=\"_blank\" rel=\"noopener\">ticketsignup.io/TicketEvent/Zozobra<\/a>.<\/p><p>Las personas con boleto premium usan la <b>Green Chile Gate<\/b>, en el lado oeste del Scottish Rite Temple. Si su sección incluye traslado en autobús tipo coach o estacionamiento, su pase de estacionamiento y las instrucciones llegan en un <b>correo electrónico aparte, aproximadamente una semana antes del evento<\/b> — téngalos consigo la noche del evento.<\/p><p class=\"fine\">Pídame “las secciones premium” para ver cada una. Las secciones con asientos son de asiento libre — elija su asiento al llegar. No se permiten sillas de campamento en las secciones premium.<\/p>"}, {"id": "manage", "title": "Managing your tickets (QR code, transfers, changes)", "title_es": "Administrar sus boletos (código QR, transferencias, cambios)", "terms": ["qr|5", "qr code|5", "manage|4", "manage tickets|5", "ticket help|6", "ticket faq|6", "ticket problem|6", "ticket issue|6", "ticket question|6", "help with my ticket|6", "lost ticket|8", "lost tickets|8", "my tickets are lost|8", "find my ticket|8", "cant find my ticket|8", "find my tickets|8", "help|3", "faq|4", "problem|3", "issue|3", "trouble|3", "transfer|5", "give my ticket|4", "someone else|2", "change my ticket|5", "confirmation|3", "confirmation email|4", "resend|4", "lost my ticket|8", "my ticket is lost|8", "ticket is lost|8", "didnt get|2", "never got|2", "share|2", "screenshot", "insurance|5", "add items|3", "verification code|3", "upgrade|5", "codigo qr|5", "administrar boletos|5", "ayuda con boletos|6", "problema con mi boleto|6", "perdi mi boleto|8", "perdi mis boletos|8", "boleto perdido|8", "no encuentro mi boleto|8", "transferir|5", "transferir boletos|5", "cambiar mi boleto|5", "correo de confirmacion|4", "reenviar|4", "no me llego|3", "agregar articulos|3", "codigo de verificacion|3", "mejorar boleto|5", "seguro de boletos|5"], "related": ["tickets", "refund", "premium"], "a": "<h3>Ticket help<\/h3><p>The official answers live on the <b><a href=\"https://www.ticketsignup.io/TicketEvent/Zozobra/Page/TicketFAQ\" target=\"_blank\" rel=\"noopener\">Zozobra Ticket FAQ<\/a><\/b>. The short version — everything is handled from the <b>Manage Tickets<\/b> link in your confirmation email (enter the verification code from that email):<\/p><ul><li><b>One QR code per purchase<\/b> — it covers every ticket you bought and is scanned at entry. You can share it among your group, and it becomes invalid once all ticket holders have checked in.<\/li><li><b>Give tickets to someone else<\/b> — Manage Tickets → “Transfer Tickets to Friend.”<\/li><li><b>Change or upgrade ticket type<\/b> — Manage Tickets → “Ticket Transfer,” adjust your selection, and pay any price difference.<\/li><li><b>Add merchandise or glooms to your order<\/b> — Manage Tickets → “Add Items to My Order.” All merchandise orders are shipped to you.<\/li><li><b>Didn’t get your confirmation email?<\/b> — use the <a href=\"https://www.ticketsignup.io/TicketEvent/Zozobra/Page/TicketLookup\" target=\"_blank\" rel=\"noopener\">Ticket Lookup<\/a> form to have it resent. Or share tickets by forwarding the confirmation email or a screenshot of the QR code.<\/li><li><b>Premium parking passes<\/b> arrive by separate email about a week before the event.<\/li><\/ul><p class=\"fine\">Optional <b>ticket insurance<\/b> (through FanShield) covers the tickets only — accidents, illness, travel interruptions, emergencies, layoffs, jury duty and work conflicts; view terms and file claims on FanShield’s site. Still stuck? Call 855-ZOZOBRA.<\/p>", "a_es": "<h3>Ayuda con los boletos<\/h3><p>Las respuestas oficiales están en las <b><a href=\"https://www.ticketsignup.io/TicketEvent/Zozobra/Page/TicketFAQ\" target=\"_blank\" rel=\"noopener\">preguntas frecuentes de boletos de Zozobra (Zozobra Ticket FAQ)<\/a><\/b>. La versión corta — todo se maneja desde el enlace <b>Manage Tickets<\/b> (administrar boletos) en su correo de confirmación (ingrese el código de verificación de ese correo):<\/p><ul><li><b>Un código QR por compra<\/b> — cubre todos los boletos que compró y se escanea en la entrada. Puede compartirlo con su grupo, y deja de ser válido una vez que todas las personas con boleto han ingresado.<\/li><li><b>Dar boletos a otra persona<\/b> — Manage Tickets → “Transfer Tickets to Friend” (transferir boletos a un amigo).<\/li><li><b>Cambiar o mejorar el tipo de boleto<\/b> — Manage Tickets → “Ticket Transfer”, ajuste su selección y pague cualquier diferencia de precio.<\/li><li><b>Agregar mercancía o “glooms” (sus penas y preocupaciones) a su pedido<\/b> — Manage Tickets → “Add Items to My Order” (agregar artículos a mi pedido). Todos los pedidos de mercancía se le envían a domicilio.<\/li><li><b>¿No recibió su correo de confirmación?<\/b> — use el formulario <a href=\"https://www.ticketsignup.io/TicketEvent/Zozobra/Page/TicketLookup\" target=\"_blank\" rel=\"noopener\">Ticket Lookup<\/a> (búsqueda de boletos) para que se lo reenvíen. O comparta boletos reenviando el correo de confirmación o una captura de pantalla del código QR.<\/li><li><b>Los pases de estacionamiento premium<\/b> llegan en un correo aparte aproximadamente una semana antes del evento.<\/li><\/ul><p class=\"fine\">El <b>seguro de boletos<\/b> opcional (a través de FanShield) cubre solo los boletos — accidentes, enfermedad, interrupciones de viaje, emergencias, despidos, servicio de jurado y conflictos de trabajo; consulte los términos y presente reclamos en el sitio de FanShield. ¿Sigue con problemas? Llame al 855-ZOZOBRA.<\/p>"}, {"id": "backdraft", "title": "Backdraft Balcony", "title_es": "Backdraft Balcony", "terms": ["backdraft|5", "balcony|5", "elevated", "new section|3", "more seats|3", "seats left|3", "seats available|3", "any seats|3", "balcon|5", "elevado", "elevada", "seccion nueva|3", "nueva seccion|3", "mas asientos|3", "quedan asientos|3", "asientos disponibles|3", "hay asientos|3", "42.99|3"], "related": ["tickets", "premium", "ada"], "a": "<h3>The Backdraft Balcony<\/h3><!--PRE--><p class=\"note\"><b>Tickets for the 103rd go on sale Tuesday, April 13, 2027<\/b> — the Kid’s Judgment Day. Prices and details below are what to expect; nothing can be purchased before then.<\/p><!--/PRE--><p>The <b>Backdraft Balcony<\/b> — <b>200 seats, six feet above the field<\/b>, along the first baseline just south of the first base dugout, looking straight down the line at the burn.<\/p><p><b>$42.99 per seat<\/b> — an affordable seated option for New Mexico families. Once they’re gone, they’re gone: <a href=\"https://www.ticketsignup.io/TicketEvent/Zozobra\" target=\"_blank\" rel=\"noopener\">ticketsignup.io/TicketEvent/Zozobra<\/a>.<\/p>", "a_es": "<h3>El Backdraft Balcony<\/h3><!--PRE--><p class=\"note\"><b>Los boletos para la 103.ª salen a la venta el martes 13 de abril de 2027<\/b> — el Día del Juicio (Judgment Day) de the Kid. Los precios y detalles a continuación son lo que puede esperar; no se puede comprar nada antes de esa fecha.<\/p><!--/PRE--><p>El <b>Backdraft Balcony<\/b> — <b>200 asientos, a seis pies sobre el campo<\/b>, a lo largo de la línea de primera base, justo al sur del dugout de primera base, con vista directa por la línea hacia la quema.<\/p><p><b>$42.99 por asiento<\/b> — una opción con asiento y accesible de precio para las familias de Nuevo México. Cuando se acaben, se acabaron: <a href=\"https://www.ticketsignup.io/TicketEvent/Zozobra\" target=\"_blank\" rel=\"noopener\">ticketsignup.io/TicketEvent/Zozobra<\/a>.<\/p>"}, {"id": "kids", "title": "Kids & families", "title_es": "Niños y familias", "terms": ["kid|3", "year old|5", "years old|5", "age|2", "how old|4", "free", "stroller", "wagon", "lost", "family", "friendly", "young", "scary", "loud", "safe", "ear", "nino|3", "ninos|3", "hijos|3", "anos de edad|5", "cuantos anos|4", "edad|2", "bebe|3", "gratis", "carriola", "carrito", "perdido", "familia", "familiar", "pequenos", "da miedo", "ruidoso", "seguro", "oidos", "ninos entran gratis|5", "es seguro para ninos|6", "seguro para ninos|6", "safe for kids|6", "safe for children|6"], "related": ["stroller", "lost", "tickets"], "a": "<h3>Bring the kids<\/h3><p>Zozobra is a family event. <b>Kids 10 and under are free<\/b> with a General Admission ticket, and students ages 11–23 are $15. In premium and seated sections every person needs a ticket, even a baby on a lap: that is a Fire Marshal rule.<\/p><ul><li><b>Strollers and wagons<\/b> aren't allowed inside the venue, but you can check them free at the Bike Valet in the Montezuma Lodge parking lot on Paseo de Peralta.<\/li><li>Register your children at the <a href=\"https://burnzozobra.com/the-lost-kids-booth/\" target=\"_blank\" rel=\"noopener\">Lost Kids Booth<\/a> so a wristband gets them back to you fast if you're separated.<\/li><li>Diapers and medical supplies are welcome in a clear bag.<\/li><li>Fireworks and the burn are loud — ear protection for little ones is a good idea.<\/li><\/ul>", "a_es": "<h3>Traiga a los niños<\/h3><p>Zozobra es un evento familiar. <b>Los niños de 10 años o menos entran gratis<\/b> con un boleto de General Admission (entrada general), y los estudiantes de 11 a 23 años pagan $15. En las secciones premium y con asientos cada persona necesita un boleto, incluso un bebé en brazos: es una regla del jefe de bomberos (Fire Marshal).<\/p><ul><li><b>Las carriolas y los carritos de jalar (wagons)<\/b> no se permiten dentro del recinto, pero puede dejarlos encargados gratis en el Bike Valet, en el estacionamiento de Montezuma Lodge sobre Paseo de Peralta.<\/li><li>Registre a sus hijos en el <a href=\"https://burnzozobra.com/the-lost-kids-booth/\" target=\"_blank\" rel=\"noopener\">Lost Kids Booth (puesto de niños perdidos)<\/a> para que una pulsera los regrese con usted rápidamente si se separan.<\/li><li>Los pañales y los artículos médicos son bienvenidos en una bolsa transparente.<\/li><li>Los fuegos artificiales y la quema son ruidosos — es buena idea llevar protección para los oídos de los más pequeños.<\/li><\/ul>"}, {"id": "stroller", "title": "Strollers & wagons", "title_es": "Carriolas y carritos (wagons)", "terms": ["stroller|4", "wagon|4", "bike valet", "check", "bring", "carriola|4", "carriolas|4", "carrito|4", "carritos|4", "cochecito|4", "dejar encargado", "guardar", "traer", "puedo llevar carriola|5"], "related": ["kids", "bike", "bring"], "a": "<h3>Strollers &amp; wagons<\/h3><p>Not allowed inside the venue — but you can <b>check them for free at the Bike Valet<\/b>, on the west side of the Montezuma Lodge parking lot on Paseo de Peralta, and pick them up on your way out.<\/p>", "a_es": "<h3>Carriolas y carritos (wagons)<\/h3><p>No se permiten dentro del recinto — pero puede <b>dejarlos encargados gratis en el Bike Valet<\/b>, en el lado oeste del estacionamiento de Montezuma Lodge sobre Paseo de Peralta, y recogerlos a la salida.<\/p>"}, {"id": "lost", "title": "Lost kids", "title_es": "Niños perdidos", "terms": ["lost|2", "lost kid|10", "lost child|10", "child is lost|12", "kid is lost|12", "lost my child|14", "lost my kid|14", "cant find my child|14", "cant find my kid|14", "separated from my child|12", "lost kids booth|6", "child is missing|8", "kid is missing|8", "separated|3", "reunification|4", "wristband", "missing|2", "booth", "perdido|2", "nino perdido|8", "ninos perdidos|8", "mi hijo se perdio|8", "se perdio mi hijo|8", "perdi a mi hijo|8", "perdi a mi nino|8", "no encuentro a mi hijo|8", "no encuentro a mi nino|8", "me separe de mi hijo|8", "puesto de ninos perdidos|6", "nino desaparecido|8", "separados|3", "reunificacion|4", "pulsera", "desaparecido|2", "puesto", "objetos perdidos|3", "lose my kid|12", "lose my child|12", "lose my children|12", "if i lose|6", "si pierdo a mi hijo|8"], "related": ["kids", "contact"], "a": "<h3>Registration Booth &amp; Reunification Tent<\/h3><p><b>Before the event<\/b>, register your children at <a href=\"https://burnzozobra.com/the-lost-kids-booth/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/the-lost-kids-booth<\/a> — photograph them in the clothes they’ll wear that night, and use the cell number you’ll actually be carrying.<\/p><ul><li><b>When you arrive<\/b>, stop at the <b>Registration Booth<\/b> — Magers Field, northeast corner, next to the Jumbotron — to get your child’s wristband with your name and cell number. Walk your child there so they’ve seen the spot.<\/li><li><b>If you’re separated<\/b>, find the nearest police officer — that’s the fastest route to the <b>Reunification Tent<\/b>, along the first baseline near the dugout. Both booths are staffed all night.<\/li><\/ul><p class=\"fine\">Lost items (not people) are held at the Gloom Tent on the first baseline.<\/p>", "a_es": "<h3>Registration Booth (puesto de registro) y Reunification Tent (carpa de reunificación)<\/h3><p><b>Antes del evento<\/b>, registre a sus hijos en <a href=\"https://burnzozobra.com/the-lost-kids-booth/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/the-lost-kids-booth<\/a> — tómeles una foto con la ropa que llevarán esa noche, y use el número del celular que realmente traerá consigo.<\/p><ul><li><b>Al llegar<\/b>, pase por el <b>Registration Booth<\/b> — Magers Field, esquina noreste, junto al Jumbotron — para recoger la pulsera de su hijo con el nombre y el número de celular de usted. Lleve a su hijo caminando hasta ahí para que conozca el lugar.<\/li><li><b>Si se separan<\/b>, busque al oficial de policía más cercano — es la ruta más rápida a la <b>Reunification Tent<\/b>, a lo largo de la línea de primera base, cerca del dugout. Ambos puestos tienen personal toda la noche.<\/li><\/ul><p class=\"fine\">Los objetos perdidos (no las personas) se guardan en la Gloom Tent, sobre la línea de primera base.<\/p>"}, {"id": "parking", "title": "Parking & free shuttle", "title_es": "Estacionamiento y autobús gratuito", "terms": ["park|3", "shuttle|3", "south capitol", "free", "garage", "convention center", "meter", "meters", "downtown", "get there|3", "getting there|3", "how do i get|2", "drive", "near", "close", "walk", "distance", "far", "last shuttle|3", "pickup", "pick up", "drop", "return", "estacionamiento|3", "estacionarse|3", "estacionar|3", "donde me estaciono|7", "autobus gratuito|3", "camion|2", "gratis", "parquimetro", "parquimetros", "como llego|3", "como llegar|3", "cerca", "caminar", "ultimo autobus|3", "autobus de regreso|2", "donde me dejan", "regreso"], "related": ["ada", "railrunner", "bike", "closures"], "a": "<h3>Park at South Capitol, ride the free shuttle<\/h3><p>The easiest way in: park free at the <b>South Capitol Rail Runner station lot<\/b> (southwest corner of Cordova Road and St. Francis Drive) and take the <b>free shuttle<\/b>.<\/p><ul><li>Shuttles run continuously from <b>5:00 p.m.<\/b>; the <b>last shuttle leaves South Capitol at 8:45 p.m.<\/b><\/li><li>You're dropped at Washington Avenue and Paseo de Peralta, about six-tenths of a mile from the gates.<\/li><li>After the show, catch the return shuttle on the south side of Paseo de Peralta just east of Washington Avenue.<\/li><\/ul><p><b>Other options:<\/b> the Santa Fe Convention Center garage offers a prepaid $10 all-day rate, but expect an hour or more to exit after the show because of the street closures. All Santa Fe Trails city buses are <b>free all day<\/b> courtesy of the City, dropping on Washington Street just south of Paseo de Peralta — track any route, including the event shuttles, in the <b>Passio GO!<\/b> app. City meters are free after 6 p.m. (never park at a red-bagged meter — you will be ticketed). Parking at Fort Marcy Park itself is extremely limited — don't count on it.<\/p><p class=\"note\">Guests needing assistance: see the ADA shuttle. Riding a bike? Use the free Bike Valet.<\/p>", "a_es": "<h3>Estaciónese en South Capitol y tome el autobús gratuito<\/h3><p>La manera más fácil de llegar: estaciónese gratis en el <b>estacionamiento de la estación South Capitol del Rail Runner<\/b> (esquina suroeste de Cordova Road y St. Francis Drive) y tome el <b>autobús gratuito (shuttle)<\/b>.<\/p><ul><li>Los autobuses circulan de forma continua desde las <b>5:00 p.m.<\/b>; el <b>último autobús sale de South Capitol a las 8:45 p.m.<\/b><\/li><li>Lo dejan en Washington Avenue y Paseo de Peralta, a unas seis décimas de milla de las puertas.<\/li><li>Después del espectáculo, tome el autobús de regreso en el lado sur de Paseo de Peralta, justo al este de Washington Avenue.<\/li><\/ul><p><b>Otras opciones:<\/b> el estacionamiento techado del Santa Fe Convention Center ofrece una tarifa prepagada de $10 por todo el día, pero calcule una hora o más para salir después del espectáculo debido a los cierres de calles. Todos los autobuses urbanos de Santa Fe Trails son <b>gratis todo el día<\/b>, cortesía de la Ciudad, y dejan pasajeros en Washington Street, justo al sur de Paseo de Peralta — siga cualquier ruta, incluidos los autobuses del evento, en la aplicación <b>Passio GO!<\/b> Los parquímetros de la ciudad son gratis después de las 6 p.m. (nunca se estacione en un parquímetro cubierto con una bolsa roja — le pondrán una multa). El estacionamiento en el propio Fort Marcy Park es extremadamente limitado — no cuente con él.<\/p><p class=\"note\">Personas que necesitan asistencia: vea el autobús ADA. ¿Viene en bicicleta? Use el Bike Valet gratuito.<\/p>"}, {"id": "ada", "title": "ADA access & shuttle", "title_es": "Acceso ADA y autobús ADA", "terms": ["ada|5", "ada seats|5", "asl|8", "sign language|8", "closed caption|8", "closed captioning|8", "captioning|8", "captions|8", "deaf|8", "hard of hearing|8", "hearing|4", "interpreter|6", "assist", "assistance", "companion", "helper", "attendant", "caregiver", "terrain", "grass", "scooter", "cane", "elderly", "senior", "shuttle", "ramp", "accommodation", "accommodations", "special needs", "asientos ada|5", "accesibilidad|5", "discapacidad|5", "silla de ruedas|5", "lengua de senas|8", "lenguaje de senas|8", "subtitulos|8", "sordo|8", "dificultad auditiva|8", "interprete|6", "asistencia", "acompanante", "cuidador", "andadera", "adulto mayor", "autobus ada|5", "necesidades especiales", "animal de servicio|4", "discapacitado|6", "estacionamiento para discapacitados|10", "estacionamiento ada|8", "handicap parking|8", "ada parking|8"], "related": ["parking", "premium", "contact"], "a": "<h3>ADA shuttle &amp; access<\/h3><p>There's plenty of ADA parking at the <b>South Capitol Rail Runner station<\/b>, and a free <b>ADA shuttle<\/b> runs from there.<\/p><ul><li>Tickets are taken and guests are screened by security <b>before boarding<\/b>, and unlike the general shuttle, the ADA bus drops you <b>inside the venue<\/b>, on paved, level ground close to the accessible viewing area. The ADA shuttle is optional: you may also come to the gates at the Scottish Rite on your own.<\/li><li>We <b>ask<\/b> for one companion per ADA rider so everyone who needs the bus can board quickly — it’s a request, not a limit, and your whole party may ride with you. General Admission ticket holders may ride the ADA shuttle when they’re accompanying someone who uses it.<\/li><li>The ADA shuttle runs <b>5:00–8:15 p.m.<\/b> — present your Zozobra ticket to board; bags stay in your vehicle at the station. Arrive early to be sure of a seat.<\/li><li>Return shuttles leave the drop-off point 30 minutes after the show ends.<\/li><\/ul><p><b>ADA ticket options:<\/b> ADA General Admission plus ADA seats in several premium sections (including seated platform sections and valet-delivered options) — see <a href=\"https://www.ticketsignup.io/TicketEvent/Zozobra/Page/ADATicketOptions\" target=\"_blank\" rel=\"noopener\">ADA Ticket Options<\/a> on the ticket site. A personal care attendant is welcome (one per guest) and needs their own ticket. The general admission area is mowed grass over ground that’s firm but not perfectly smooth — a wheelchair handles it better than a walker. <b>Need to leave early?<\/b> You will not be stranded: find any volunteer wearing a Zozobra credential, or go to the nearest gate and say you need transport out, and we’ll get you to a vehicle and back to South Capitol. <b>ASL interpretation and closed captioning<\/b> are provided for deaf and hard-of-hearing guests — the National Anthem is signed, and captioning runs on the big screen. Interpreters are at center stage and appear picture-in-picture on the Jumbotron; there is no separate deaf seating section, because the Fire Marshal does not allow barriers inside General Admission. Trained service animals are welcome. Questions: <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a> or 855-ZOZOBRA.<\/p>", "a_es": "<h3>Autobús ADA y acceso ADA (accesibilidad)<\/h3><p>Hay bastante estacionamiento ADA en la <b>estación South Capitol del Rail Runner<\/b>, y desde ahí sale un <b>autobús ADA<\/b> gratuito (shuttle).<\/p><ul><li>Los boletos se recogen y el personal de seguridad revisa a los asistentes <b>antes de abordar<\/b>, y a diferencia del autobús general, el autobús ADA lo deja <b>dentro del recinto<\/b>, sobre terreno pavimentado y nivelado, cerca del área de vista accesible. El autobús ADA es opcional: también puede llegar por su cuenta a las puertas en el Scottish Rite.<\/li><li><b>Pedimos<\/b> un acompañante por cada pasajero ADA para que todas las personas que necesitan el autobús puedan abordar rápidamente — es una petición, no un límite, y todo su grupo puede viajar con usted. Las personas con boleto de General Admission (entrada general) pueden viajar en el autobús ADA cuando acompañan a alguien que lo usa.<\/li><li>El autobús ADA funciona de <b>5:00 a 8:15 p.m.<\/b> — presente su boleto de Zozobra para abordar; las bolsas se quedan en su vehículo en la estación. Llegue temprano para asegurar un asiento.<\/li><li>Los autobuses de regreso salen del punto de descenso 30 minutos después de que termina el espectáculo.<\/li><\/ul><p><b>Opciones de boletos ADA:<\/b> General Admission ADA, además de asientos ADA en varias secciones premium (incluidas secciones con asientos sobre plataforma y opciones con traslado tipo valet) — vea <a href=\"https://www.ticketsignup.io/TicketEvent/Zozobra/Page/ADATicketOptions\" target=\"_blank\" rel=\"noopener\">ADA Ticket Options<\/a> en el sitio de boletos. Un asistente de cuidado personal es bienvenido (uno por persona) y necesita su propio boleto. El área de General Admission es de pasto cortado sobre un terreno firme pero no perfectamente liso — una silla de ruedas lo maneja mejor que una andadera. <b>¿Necesita irse temprano?<\/b> No se quedará sin transporte: busque a cualquier voluntario que porte una credencial de Zozobra, o vaya a la puerta más cercana y diga que necesita transporte para salir, y lo llevaremos a un vehículo y de regreso a South Capitol. Se ofrece <b>interpretación en lengua de señas americana (ASL) y subtítulos (closed captioning)<\/b> para las personas sordas o con dificultades auditivas — el Himno Nacional se interpreta en señas, y los subtítulos se muestran en la pantalla grande. Los intérpretes están en el centro del escenario y aparecen en un recuadro (picture-in-picture) en el Jumbotron; no hay una sección de asientos separada para personas sordas, porque el jefe de bomberos (Fire Marshal) no permite barreras dentro de General Admission. Los animales de servicio entrenados son bienvenidos. Preguntas: <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a> o 855-ZOZOBRA.<\/p>"}, {"id": "railrunner", "title": "Rail Runner & coming from Albuquerque", "title_es": "Rail Runner y cómo llegar desde Albuquerque", "terms": ["railrunner|3", "albuquerque|4", "from albuquerque|4", "train", "late", "last train", "commute", "airport", "nmshuttle", "rio metro", "rail runner|3", "desde albuquerque|4", "vengo de albuquerque|4", "tren|3", "tarde", "ultimo tren|3", "tren de regreso|3", "transporte", "aeropuerto", "sunport", "avion"], "related": ["parking", "hotel"], "a": "<h3>Take the train<\/h3><p>The <b>New Mexico Rail Runner<\/b> holds a late train after the event so riders from Albuquerque and points south can get home — a great way to skip the traffic. Ride to the <b>South Capitol station<\/b>, where the free Zozobra shuttle picks up. The <b>last train is held until every ticketed passenger is aboard<\/b>. Check the schedule at <a href=\"https://www.riometro.org\" target=\"_blank\" rel=\"noopener\">riometro.org<\/a>.<\/p><p>Flying in? NMShuttle connects the Albuquerque Sunport to Santa Fe: <a href=\"https://nmshuttle.com\" target=\"_blank\" rel=\"noopener\">nmshuttle.com<\/a> or (505) 545-2964.<\/p>", "a_es": "<h3>Tome el tren<\/h3><p>El <b>New Mexico Rail Runner<\/b> retiene un tren nocturno después del evento para que los pasajeros de Albuquerque y puntos al sur puedan regresar a casa — una excelente manera de evitar el tráfico. Viaje hasta la <b>estación South Capitol<\/b>, donde recoge el autobús gratuito (shuttle) de Zozobra. El <b>último tren espera hasta que todos los pasajeros con boleto estén a bordo<\/b>. Consulte el horario en <a href=\"https://www.riometro.org\" target=\"_blank\" rel=\"noopener\">riometro.org<\/a>.<\/p><p>¿Llega en avión? NMShuttle conecta el Albuquerque Sunport con Santa Fe: <a href=\"https://nmshuttle.com\" target=\"_blank\" rel=\"noopener\">nmshuttle.com<\/a> o (505) 545-2964.<\/p>"}, {"id": "bike", "title": "Bike Valet", "title_es": "Bike Valet (guardabicicletas)", "terms": ["bike|3", "valet", "ride", "cycling", "lock", "montezuma", "walk", "walking", "scooter", "skateboard", "bicicleta|3", "bici|3", "bike valet|3", "en bicicleta|3", "ciclismo", "candado", "caminar", "caminando", "patineta", "monociclo", "hoverboard", "donde dejo mi bici|4"], "related": ["parking", "stroller"], "a": "<h3>Free Bike Valet<\/h3><p>Ride in and skip the traffic. The <b>Bike Santa Fe Valet<\/b> is free, on Paseo de Peralta in the Montezuma Lodge parking lot, staffed all evening. Strollers and wagons can be checked there too.<\/p><p>Bicycles, unicycles, skateboards, hoverboards and e-scooters aren't allowed inside the venue.<\/p>", "a_es": "<h3>Bike Valet gratuito<\/h3><p>Llegue en bicicleta y evite el tráfico. El <b>Bike Santa Fe Valet<\/b> es gratuito, está sobre Paseo de Peralta en el estacionamiento de Montezuma Lodge y tiene personal toda la tarde y noche. Ahí también se pueden dejar encargadas las carriolas y los carritos (wagons).<\/p><p>No se permiten bicicletas, monociclos, patinetas, hoverboards ni scooters eléctricos dentro del recinto.<\/p>"}, {"id": "rideshare", "title": "Uber, Lyft & drop-off", "title_es": "Uber, Lyft y dónde bajarse", "terms": ["rideshare|3", "drop off", "dropoff", "drop-off", "pick up", "pickup", "taxi", "ride", "uber|4", "lyft|4", "viaje por aplicacion|3", "transporte por aplicacion|3", "taxi|2", "donde me dejan|4", "donde me recogen|4", "punto de bajada|3", "punto de recogida|3", "dejar pasajeros|2", "recoger pasajeros|2", "bajada", "recogida", "didi", "que me lleven", "aventon", "dropped off|8", "drop me off|8", "get dropped|8", "drop off|6", "dejarme|5", "que me dejen|6"], "related": ["parking", "closures"], "a": "<h3>Rideshare<\/h3><p>Uber and Lyft <b>drop-off and pick-up is at the South Capitol Rail Runner station<\/b> — then take the free shuttle in. Streets around Fort Marcy close in the afternoon, so drivers can't get you near the gates.<\/p>", "a_es": "<h3>Viajes por aplicación (rideshare)<\/h3><p>Uber y Lyft <b>dejan y recogen pasajeros en la estación South Capitol del Rail Runner<\/b>; de ahí tome el autobús gratuito (shuttle) para llegar. Las calles alrededor de Fort Marcy se cierran por la tarde, así que los conductores no pueden acercarle a las puertas.<\/p>"}, {"id": "gate", "title": "Which gate do I use?", "title_es": "¿Qué puerta debo usar?", "terms": ["gate|3", "entrance|3", "where is the entrance|4", "where is the gate|4", "where do i enter|4", "which gate|4", "enter", "scottish rite", "green chile", "red chile", "way in", "line", "lines", "how do i get in", "puerta|3", "puertas|3", "entrada|3", "donde esta la entrada|4", "donde esta la puerta|4", "por donde entro|4", "que puerta|4", "cual puerta|4", "como entro|3", "entrar", "scottish rite|2", "green chile|2", "red chile|2", "chile verde", "chile rojo", "fila", "filas", "acceso", "pulsera|2", "security|6", "is it safe|3", "screening|6", "metal detector|8", "searched|6", "search|3", "seguridad|6", "detector de metales|8", "revision de seguridad|6", "es seguro el evento|8"], "related": ["times", "premium", "parking"], "a": "<h3>Two gates at the Scottish Rite Temple<\/h3><p>All entry is on foot at the Scottish Rite Temple — the big pink building at Bishop’s Lodge Road and Paseo de Peralta. Everyone is searched and passes a metal detector, and there is no re-entry.<\/p><ul><li><b>General Admission — Red Chile Gate<\/b>, east side. Two lines on Bishop’s Lodge: <b>RIGHT if you have a ticket, LEFT if you need one<\/b>.<\/li><li><b>Premium Viewing — Green Chile Gate<\/b>, west side on Paseo de Peralta. Your ticket is scanned and you get a <b>color-coded wristband for your section — don’t leave the gate without it<\/b>. Then up Bishop’s Lodge, across the land bridge (no stopping on the bridge), up the east side of the field to your section.<\/li><\/ul><p>Have your ticket ready — screenshot the QR code, and turn your screen brightness up. Keep clear bags open and chairs out of their sleeves for a quick check.<\/p><p class=\"note\">Plan to complete entry by <b>8:15 p.m.<\/b> — at 8:30 all gates convert to General Admission to move the crowd, and premium check-in is no longer guaranteed. Want to upgrade on event day? Look for the premium viewing signs on the west side of the Scottish Rite before getting in any line.<\/p>", "a_es": "<h3>Dos puertas en el Scottish Rite Temple<\/h3><p>Toda la entrada es a pie por el Scottish Rite Temple, el gran edificio rosa en Bishop’s Lodge Road y Paseo de Peralta. A todas las personas se les revisa y pasan por un detector de metales, y no hay reingreso.<\/p><ul><li><b>General Admission (entrada general) — Red Chile Gate<\/b>, lado este. Dos filas en Bishop’s Lodge: <b>a la DERECHA si ya tiene boleto, a la IZQUIERDA si necesita uno<\/b>.<\/li><li><b>Premium Viewing (zona preferente) — Green Chile Gate<\/b>, lado oeste, sobre Paseo de Peralta. Se escanea su boleto y recibe una <b>pulsera con el color de su sección; no se aleje de la puerta sin ella<\/b>. Después suba por Bishop’s Lodge, cruce el puente de tierra (no se permite detenerse en el puente) y suba por el lado este del campo hasta su sección.<\/li><\/ul><p>Tenga su boleto listo: tome una captura de pantalla del código QR y suba el brillo de su pantalla. Mantenga las bolsas transparentes abiertas y las sillas fuera de sus fundas para una revisión rápida.<\/p><p class=\"note\">Planee terminar de entrar a más tardar a las <b>8:15 p.m.<\/b>; a las 8:30 todas las puertas pasan a ser de General Admission para agilizar el paso del público, y ya no se garantiza el registro de Premium. ¿Quiere mejorar su boleto el día del evento? Busque los letreros de Premium Viewing en el lado oeste del Scottish Rite antes de formarse en cualquier fila.<\/p>"}, {"id": "closures", "title": "Road closures", "title_es": "Cierres de calles", "terms": ["closure|3", "road|2", "traffic", "bishop", "bishops lodge", "old taos", "paseo", "murales", "washington", "griffin", "guadalupe", "artist", "hyde park", "rosario", "reopen", "map", "detour", "exit", "leave|2", "get out", "how do i get home|3", "get home|2", "cierre|3", "cierres de calles|4", "calles cerradas|4", "calle cerrada|4", "calle|2", "carretera|2", "trafico", "transito", "paseo de peralta", "reabren|2", "mapa", "desvio|2", "salir|2", "como regreso a casa|3"], "related": ["parking", "garage", "neighbors"], "a": "<h3>Road closures — Friday, Sept. 3<\/h3><p><b>Soft closure<\/b>: residents with a driver’s license or utility bill showing a neighborhood address, or a Zozobra neighborhood pass, may pass through in a vehicle. <b>Hard closure<\/b>: no vehicles, without exception.<\/p><ul><li><b>Thursday, Sept. 2, 7:00 a.m.<\/b> — Murales Rd closes for fireworks setup from the fire station to Cuesta del Norte (one lane open for emergency services only, no foot traffic, through Saturday)<\/li><li><b>Friday 7:00 a.m. (hard)<\/b> — Murales Rd, east of the fire station to the tennis courts (through 12:01 a.m. Sat); Calle Estado, Governor Dempsey Dr and Mansion Dr become local traffic only<\/li><li><b>Noon (hard)<\/b> — Bishop’s Lodge Rd, Paseo de Peralta to Artist Road<\/li><li><b>4:00 p.m. (hard)<\/b> — Bishop’s Lodge Rd, Paseo de Peralta to Hillcrest Drive; Murales Rd, Bishop’s Lodge to the pickleball courts<\/li><li><b>5:00 p.m. (hard)<\/b> — Murales Rd complete, Bishop’s Lodge to Old Taos Hwy<\/li><li><b>5:00 soft / 5:30 hard<\/b> — Old Taos Hwy (Paseo to Rendon), Paseo de Peralta (Guadalupe to Bishop’s Lodge), Artist/Hyde Park Rd (Bishop’s Lodge to Gonzales), Rosario Blvd, Washington Ave, Hillside Ave, Griffin St, Sunset St, Kearney Ave<\/li><\/ul><p>Gonzales Road stays open but congests — allow extra time. Emergency vehicles keep access throughout. Roads begin reopening roughly <b>45–75 minutes after the show concludes<\/b>, one at a time as the crowd clears. No individual vehicle exceptions or passes are issued during that window. If pedestrian volume is unexpectedly heavy, city safety officials may decline vehicle access even to residents with valid documents; the officer on scene holds final authority.<\/p><p>Detour maps: <a href=\"https://burnzozobra.com/fmn-maps/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/fmn-maps<\/a> — Bishop’s Lodge Road (3–11 p.m.), Old Taos Highway via NM 599, and Rio Grande–Juniper (4–11 p.m.).<\/p>", "a_es": "<h3>Cierres de calles — viernes 3 de septiembre<\/h3><p><b>Cierre parcial (soft closure)<\/b>: los residentes con licencia de conducir o recibo de servicios públicos que muestre una dirección del vecindario, o con un pase vecinal de Zozobra, pueden pasar en vehículo. <b>Cierre total (hard closure)<\/b>: ningún vehículo, sin excepción.<\/p><ul><li><b>Jueves 2 de septiembre, 7:00 a.m.<\/b> — Murales Rd se cierra para la instalación de los fuegos artificiales, desde la estación de bomberos hasta Cuesta del Norte (un carril abierto solo para servicios de emergencia, sin paso peatonal, hasta el sábado)<\/li><li><b>Viernes 7:00 a.m. (total)<\/b> — Murales Rd, al este de la estación de bomberos hasta las canchas de tenis (hasta las 12:01 a.m. del sábado); Calle Estado, Governor Dempsey Dr y Mansion Dr quedan solo para tránsito local<\/li><li><b>Mediodía (total)<\/b> — Bishop’s Lodge Rd, de Paseo de Peralta a Artist Road<\/li><li><b>4:00 p.m. (total)<\/b> — Bishop’s Lodge Rd, de Paseo de Peralta a Hillcrest Drive; Murales Rd, de Bishop’s Lodge a las canchas de pickleball<\/li><li><b>5:00 p.m. (total)<\/b> — Murales Rd completa, de Bishop’s Lodge a Old Taos Hwy<\/li><li><b>5:00 parcial / 5:30 total<\/b> — Old Taos Hwy (de Paseo a Rendon), Paseo de Peralta (de Guadalupe a Bishop’s Lodge), Artist/Hyde Park Rd (de Bishop’s Lodge a Gonzales), Rosario Blvd, Washington Ave, Hillside Ave, Griffin St, Sunset St, Kearney Ave<\/li><\/ul><p>Gonzales Road permanece abierta pero se congestiona; calcule tiempo adicional. Los vehículos de emergencia mantienen el acceso en todo momento. Las calles comienzan a reabrirse aproximadamente <b>entre 45 y 75 minutos después de que termina el espectáculo<\/b>, una por una conforme se despeja el público. Durante ese lapso no se otorgan excepciones ni pases a vehículos individuales. Si el volumen de peatones es inesperadamente alto, los funcionarios de seguridad de la ciudad pueden negar el acceso vehicular incluso a residentes con documentos válidos; el oficial presente en el lugar tiene la autoridad final.<\/p><p>Mapas de desvíos: <a href=\"https://burnzozobra.com/fmn-maps/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/fmn-maps<\/a> — Bishop’s Lodge Road (3–11 p.m.), Old Taos Highway por la NM 599, y Rio Grande–Juniper (4–11 p.m.).<\/p>"}, {"id": "garage", "title": "Convention Center garage exit", "title_es": "Salida del estacionamiento del Convention Center", "terms": ["garage|3", "convention center|3", "exit", "idle", "idling", "engine", "stuck", "wait", "centro de convenciones|4", "estacionamiento techado|3", "estacionamiento del centro de convenciones|5", "garaje|3", "salida del estacionamiento|4", "salir del estacionamiento|4", "motor|2", "apagar el motor|3", "atorado", "esperar", "espera", "salida"], "related": ["closures", "parking"], "a": "<h3>Leaving the Convention Center garage<\/h3><p>The garage backs up after the burn because of the street closures. Please <b>turn your engine off while you wait<\/b>. The posted exit route is <b>west on Federal Place, west on Catron Street, then south on Guadalupe<\/b>. Expect an hour or more — or park at South Capitol and let the free shuttle do the driving.<\/p>", "a_es": "<h3>Al salir del estacionamiento del Convention Center<\/h3><p>Después de la quema, el estacionamiento techado del Convention Center (Centro de Convenciones) se satura por los cierres de calles. Por favor <b>apague el motor mientras espera<\/b>. La ruta de salida señalada es <b>al oeste por Federal Place, al oeste por Catron Street y luego al sur por Guadalupe<\/b>. Calcule una hora o más; o estaciónese en South Capitol y deje que el autobús gratuito (shuttle) maneje por usted.<\/p>"}, {"id": "bring", "title": "What can I bring?", "title_es": "¿Qué puedo llevar?", "terms": ["bring|3", "allowed|3", "allow", "permitted", "ok", "okay", "clear bag|3", "bag|2", "bag policy", "umbrella", "blanket", "chair", "sunscreen", "jacket", "flashlight", "que puedo llevar|4", "que puedo traer|4", "llevar|3", "traer|3", "permitido", "se permite", "se puede", "bolsa transparente|3", "bolsas transparentes|3", "bolsa|2", "politica de bolsas|2", "paraguas", "sombrilla", "cobija", "silla", "protector solar", "bloqueador", "chamarra", "linterna", "cangurera"], "related": ["prohibited", "food", "chairs"], "a": "<h3>What you can bring<\/h3><ul><li><b>Clear plastic bags only<\/b> — up to 12\" × 6\" × 12\" (one-gallon size), no buckles or grommets. Clear NFL-style backpacks are fine.<\/li><li>A small clutch purse (4.5\" × 6.5\") or a one-pocket fanny pack, subject to inspection.<\/li><li><b>Small cloth collapsible camping chairs<\/b> — General Admission only, opened for screening.<\/li><li>Small folding umbrellas under 12\" across (no spiked tops).<\/li><li>Picnic food in clear containers with plastic utensils (see the food exchange station).<\/li><li>Empty hard-plastic water bottles — free water stations are throughout the venue.<\/li><li>Spray sunscreen, 6 oz or less, one per person.<\/li><li>Diapers and medical supplies in a clear bag.<\/li><\/ul><p>Evenings get cool after dark — bring a layer. And dress up if you like!<\/p>", "a_es": "<h3>Lo que puede llevar<\/h3><ul><li><b>Solo bolsas de plástico transparente<\/b> — de hasta 12\" × 6\" × 12\" (tamaño de un galón), sin hebillas ni ojales. Las mochilas transparentes estilo NFL están permitidas.<\/li><li>Una bolsa de mano pequeña tipo clutch (4.5\" × 6.5\") o una cangurera de un solo bolsillo, sujetas a inspección.<\/li><li><b>Sillas de campamento pequeñas, plegables y de tela<\/b> — solo en General Admission (entrada general), abiertas para la revisión.<\/li><li>Paraguas plegables pequeños de menos de 12\" de ancho (sin punta afilada).<\/li><li>Comida para picnic en recipientes transparentes con cubiertos de plástico (consulte la estación de intercambio de comida).<\/li><li>Botellas de agua vacías de plástico rígido; hay estaciones de agua gratuitas por todo el recinto.<\/li><li>Protector solar en aerosol, de 6 oz o menos, uno por persona.<\/li><li>Pañales y suministros médicos en una bolsa transparente.<\/li><\/ul><p>Las noches refrescan al oscurecer; lleve una chamarra o algo para abrigarse. ¡Y vístase para la ocasión si gusta!<\/p>"}, {"id": "prohibited", "title": "Prohibited items", "title_es": "Artículos prohibidos", "terms": ["prohibited|3", "not allowed|3", "banned", "ban", "forbidden", "cant bring|3", "weapon|3", "laser", "flashlight", "drone", "speaker", "sign", "banner", "cooler", "glass", "tent", "tripod", "selfie", "frisbee", "ball", "balloon", "vape", "lighter", "sparkler", "glitter", "silly string", "pocket knife", "pepper spray", "concealed", "flag|4", "flags|4", "prohibido|3", "prohibidos|3", "articulos prohibidos|4", "no se permite|3", "no permitido|3", "no puedo llevar|3", "arma|3", "armas|3", "linterna", "dron", "bocina", "pancarta", "hielera", "vidrio", "carpa", "encendedor", "navaja", "gas pimienta", "bandera|4"], "related": ["bring", "locker", "smoking"], "a": "<h3>Leave these at home<\/h3><ul><li>Purses, backpacks, opaque bags, coolers<\/li><li>Strollers or wagons (free check at the Bike Valet)<\/li><li>Canned or bottled liquids, glass containers, alcohol, recreational drugs<\/li><li><b>Weapons of any kind<\/b> — knives, pocket knives, multi-tools, mace, pepper spray, firearms (no concealed or open carry, even with a permit), and costume, prop or Old West replica weapons — toy six-shooters and holsters included<\/li><li>Metal chairs, tables, tents, tripods, poles, sticks, selfie sticks<\/li><li>Large or pointed umbrellas<\/li><li>Pets (ADA service animals welcome)<\/li><li>Lasers, flashlights and drones — confiscated and not returned<\/li><li>Fireworks, sparklers, flares, lighters, hairspray, spray paint, silly string, glitter<\/li><li>Banners, signs, megaphones, air horns, whistles, portable speakers, musical instruments<\/li><li>Balloons, inflatables, frisbees, kites, balls<\/li><li>Bicycles, skateboards, hoverboards, e-scooters inside the venue<\/li><li>Cuts, colors, wallet chains or insignia clothing<\/li><\/ul><p class=\"note\">There are <b>no lockers at the venue this year<\/b>, so leave anything on this list in your car.<\/p>", "a_es": "<h3>Deje esto en casa<\/h3><ul><li>Bolsos, mochilas, bolsas opacas, hieleras<\/li><li>Carriolas o carritos de jalar (resguardo gratuito en el Bike Valet)<\/li><li>Líquidos enlatados o embotellados, envases de vidrio, alcohol, drogas recreativas<\/li><li><b>Armas de cualquier tipo<\/b> — cuchillos, navajas de bolsillo, herramientas multiusos, gas mace, gas pimienta, armas de fuego (no se permite portarlas ocultas ni a la vista, ni siquiera con permiso), y armas de disfraz, de utilería o réplicas del Viejo Oeste, incluidos los revólveres de juguete y las fundas<\/li><li>Sillas de metal, mesas, carpas, trípodes, postes, palos, palos para selfies<\/li><li>Paraguas grandes o con punta<\/li><li>Mascotas (los animales de servicio ADA son bienvenidos)<\/li><li>Láseres, linternas y drones: se confiscan y no se devuelven<\/li><li>Fuegos artificiales, luces de bengala, bengalas de señalización, encendedores, spray para el cabello, pintura en aerosol, serpentina en aerosol (silly string), brillantina<\/li><li>Pancartas, letreros, megáfonos, bocinas de aire, silbatos, bocinas portátiles, instrumentos musicales<\/li><li>Globos, inflables, frisbees, papalotes, pelotas<\/li><li>Bicicletas, patinetas, hoverboards y scooters eléctricos dentro del recinto<\/li><li>Chalecos de club («cuts»), colores de club o pandilla («colors»), cadenas para cartera o ropa con insignias<\/li><\/ul><p class=\"note\">Este año <b>no hay casilleros (lockers) en el recinto<\/b>, así que deje en su auto cualquier cosa de esta lista.<\/p>"}, {"id": "locker", "title": "Lockers", "title_es": "Casilleros (lockers)", "terms": ["locker|3", "storage", "store", "hold", "keep", "somewhere to put", "casillero|3", "casilleros|3", "lockers|3", "guardar|2", "guardar cosas|3", "guardarropa|2", "donde guardo|3", "donde dejo mis cosas|3", "almacenar", "resguardo", "paqueteria", "donde poner"], "related": ["prohibited", "bring"], "a": "<h3>No lockers this year<\/h3><p>There are no locker trucks at the 103rd burn. Please leave prohibited items in your car or at home — anything that doesn't pass security can't be held for you.<\/p>", "a_es": "<h3>Este año no hay casilleros<\/h3><p>No hay camiones con casilleros en la 103.ª quema. Por favor deje los artículos prohibidos en su auto o en casa; lo que no pase por seguridad no se le puede guardar.<\/p>"}, {"id": "food", "title": "Food & drinks", "title_es": "Comida y bebidas", "terms": ["food|4", "water bottle|5", "unopened|6", "sealed|6", "drink|2", "vendor", "bring", "eat", "bring food|3", "outside food|3", "beer garden|2", "alcohol", "water", "bottle", "thirsty", "hungry", "snack", "cup", "cups", "exchange", "container", "comida|4", "botella de agua|5", "sin abrir|6", "sellada|6", "sellado|6", "bebida|2", "bebidas|2", "vendedores de comida|2", "comer", "llevar comida|3", "comida de fuera|3", "jardin cervecero|2", "cerveza|2", "agua", "botella", "sed", "hambre", "botana", "intercambio de comida|3"], "related": ["bring", "prohibited"], "a": "<h3>Food &amp; drinks<\/h3><p><b>Yes, you can bring your own food.<\/b> Stop at a <b>Food Exchange Station<\/b> at the gate, take everything out of its packaging and transfer it into the free clear food-grade bags we provide, so it can be held up and cleared at security.<\/p><ul><li>Plenty of <b>food vendors<\/b> and a <b>beer garden by Santa Fe Brewing<\/b> are inside the venue.<\/li><li><b>Free water stations<\/b> throughout the venue with decorative cups — bring an empty hard-plastic bottle to refill.<\/li><li>No canned or bottled liquids, glass, or outside alcohol — <b>sealed or unopened bottles cannot come through the checkpoint<\/b>. Bring an empty hard-plastic bottle and refill it inside as often as you like.<\/li><li><b>Medical exception:<\/b> medically necessary food and drink stays sealed and skips the exchange — it’s treated as medical supplies. Tell the officer at the start of screening.<\/li><\/ul>", "a_es": "<h3>Comida y bebidas<\/h3><p><b>Sí, puede llevar su propia comida.<\/b> Pase a una <b>Food Exchange Station (estación de intercambio de comida)<\/b> en la puerta, saque todo de su empaque y páselo a las bolsas transparentes de grado alimenticio que le damos gratis, para que se pueda mostrar y aprobar en seguridad.<\/p><ul><li>Hay muchos <b>vendedores de comida<\/b> y un <b>jardín cervecero (beer garden) de Santa Fe Brewing<\/b> dentro del recinto.<\/li><li><b>Estaciones de agua gratuitas<\/b> por todo el recinto, con vasos decorativos; lleve una botella vacía de plástico rígido para rellenarla.<\/li><li>No se permiten líquidos enlatados o embotellados, vidrio ni alcohol de fuera; <b>las botellas selladas o sin abrir no pueden pasar por el punto de revisión<\/b>. Lleve una botella vacía de plástico rígido y rellénela adentro cuantas veces quiera.<\/li><li><b>Excepción médica:<\/b> la comida y bebida médicamente necesarias permanecen selladas y no pasan por el intercambio; se tratan como suministros médicos. Avísele al oficial al inicio de la revisión.<\/li><\/ul>"}, {"id": "chairs", "title": "Chairs & blankets", "title_es": "Sillas y cobijas", "terms": ["chair|4", "blanket|2", "sit|3", "sitting|3", "where can i sit|5", "ground", "lawn", "camping", "bring", "silla|4", "sillas|4", "cobija|2", "cobijas|2", "sentarse|3", "sentarme|3", "sentado|3", "donde me siento|5", "donde puedo sentarme|5", "asiento", "suelo", "pasto", "cesped", "silla plegable|3", "silla de campamento|3", "llevar"], "related": ["bring", "premium"], "a": "<h3>Chairs<\/h3><p><b>Small cloth collapsible camping chairs are allowed in General Admission only<\/b> — open them for security screening. No metal chairs, tables or tents. Chairs aren't permitted in premium viewing sections (those sections are either seated already or standing-room).<\/p><p>Blankets are fine. The general admission area is mowed grass over ground that’s firm but not perfectly smooth — a wheelchair handles it better than a walker. <b>Need to leave early?<\/b> You will not be stranded: find any volunteer wearing a Zozobra credential, or go to the nearest gate and say you need transport out, and we’ll get you to a vehicle and back to South Capitol.<\/p>", "a_es": "<h3>Sillas<\/h3><p><b>Las sillas de campamento pequeñas, plegables y de tela se permiten solo en General Admission (entrada general)<\/b>; ábralas para la revisión de seguridad. No se permiten sillas de metal, mesas ni carpas. No se permiten sillas en las secciones de Premium Viewing (esas secciones ya tienen asientos o son para estar de pie).<\/p><p>Las cobijas están permitidas. El área de General Admission es pasto cortado sobre un terreno firme pero no perfectamente parejo; una silla de ruedas lo maneja mejor que un andador. <b>¿Necesita irse temprano?<\/b> No se quedará varado: busque a cualquier voluntario con credencial de Zozobra, o vaya a la puerta más cercana y diga que necesita transporte para salir, y le llevaremos a un vehículo y de regreso a South Capitol.<\/p>"}, {"id": "servicedog", "title": "Service dogs", "title_es": "Perros de servicio", "terms": ["service dog|8", "service animal|8", "service dogs|8", "guide dog|8", "my dog|4", "trained dog|5", "vest|3", "certification|4", "paperwork|3", "task|2", "esa|5", "emotional support|6", "perro de servicio|8", "perros de servicio|8", "animal de servicio|8", "animales de servicio|8", "perro guia|8", "perro lazarillo|8", "mi perro|4", "perro entrenado|5", "chaleco|3", "certificacion|4", "documentos|2", "papeles|3", "tarea|2", "apoyo emocional|6", "animal de apoyo emocional|6", "proteccion auditiva|3"], "related": ["ada", "dog", "bring"], "a": "<h3>Service dogs are welcome<\/h3><p><b>Yes.<\/b> Service dogs are welcome at the Burning of Zozobra, as they are at every public event we produce. Under the ADA we don’t require paperwork, a vest, or any kind of certification. At the gate, security may ask the two questions the law allows — whether the dog is a service animal required because of a disability, and what task it has been trained to perform — and then you’ll go through the same screening as everyone else. Your dog is admitted to any section you hold a ticket for. This applies to trained service animals only; emotional support animals and pets can’t come into the venue.<\/p><p><b>We want to be candid about what the night looks like.<\/b> Zozobra is a pyrotechnics show first and foremost. Daytime fireworks and red smoke mines start in the afternoon, hours before dark. The main show is a full aerial fireworks display fired from the field — ground effects, concussion, crackling — culminating in a fifty-foot marionette burning while tens of thousands roar. Zozobra groans through a stadium sound system for the better part of an hour, with live amplified music from late afternoon on, a drone show, flashing lights, and the smell of smoke everywhere. It is loud, close, and sustained in a way very few dogs, even well-trained ones, have experienced.<\/p><ul><li>Gates open at 4:00 p.m.; be inside by 8:45. The field gets very crowded — an edge or rear position in your section makes leaving easier if your dog needs to.<\/li><li>Using the ADA shuttle from South Capitol? There’s plenty of ADA parking, your ticket is taken and security check happens before boarding, the bus drops you inside the venue, and <b>your dog rides with you<\/b>.<\/li><li>Free bottled water is available throughout the venue, and there’s grass at the perimeter for relief. <b>Canine ear protection<\/b> isn’t required but is a very good idea — bringing it lets you make that call on the night. Common brands are Rex Specs Ear Pro and Mutt Muffs; the best local bet is REI in the Railyard (500 Market Street). Let your dog wear them at home first so event night isn’t their first time.<\/li><li>If your dog is in distress at any point, find any volunteer in a Zozobra credential and we’ll help you get out quickly and safely.<\/li><\/ul><p class=\"fine\">Questions before Friday? Call 855-ZOZOBRA. We’d love to have you both with us.<\/p>", "a_es": "<h3>Los perros de servicio son bienvenidos<\/h3><p><b>Sí.<\/b> Los perros de servicio son bienvenidos en la Quema de Zozobra, como en todos los eventos públicos que producimos. Conforme a la ley ADA no exigimos documentos, chaleco ni ningún tipo de certificación. En la puerta, el personal de seguridad puede hacer las dos preguntas que la ley permite —si el perro es un animal de servicio necesario debido a una discapacidad, y qué tarea ha sido entrenado para realizar— y después usted pasará por la misma revisión que todos los demás. Su perro es admitido en cualquier sección para la que usted tenga boleto. Esto aplica únicamente a animales de servicio entrenados; los animales de apoyo emocional y las mascotas no pueden entrar al recinto.<\/p><p><b>Queremos ser francos sobre cómo es la noche.<\/b> Zozobra es, ante todo, un espectáculo de pirotecnia. Los fuegos artificiales diurnos y las minas de humo rojo comienzan por la tarde, horas antes de que oscurezca. El espectáculo principal es una exhibición completa de fuegos artificiales aéreos lanzados desde el campo —efectos a nivel del suelo, estruendos, chisporroteo— que culmina con una marioneta de cincuenta pies ardiendo mientras decenas de miles de personas rugen. Zozobra gime a través de un sistema de sonido de estadio durante casi una hora, con música en vivo amplificada desde el final de la tarde, un espectáculo de drones, luces intermitentes y olor a humo por todas partes. Es ruidoso, cercano y sostenido de una manera que muy pocos perros, incluso los bien entrenados, han experimentado.<\/p><ul><li>Las puertas abren a las 4:00 p.m.; esté adentro a más tardar a las 8:45. El campo se llena muchísimo; un lugar en la orilla o al fondo de su sección facilita salir si su perro lo necesita.<\/li><li>¿Va a usar el autobús ADA desde South Capitol? Hay bastante estacionamiento ADA, se recoge su boleto y la revisión de seguridad se hace antes de abordar, el autobús le deja dentro del recinto, y <b>su perro viaja con usted<\/b>.<\/li><li>Hay agua embotellada gratis por todo el recinto, y hay pasto en el perímetro para que su perro haga sus necesidades. La <b>protección auditiva canina<\/b> no es obligatoria, pero es muy buena idea; llevarla le permite tomar esa decisión esa misma noche. Las marcas comunes son Rex Specs Ear Pro y Mutt Muffs; la mejor opción local es REI en el Railyard (500 Market Street). Deje que su perro la use primero en casa para que la noche del evento no sea su primera vez.<\/li><li>Si su perro muestra angustia en cualquier momento, busque a cualquier voluntario con credencial de Zozobra y le ayudaremos a salir de forma rápida y segura.<\/li><\/ul><p class=\"fine\">¿Preguntas antes del viernes? Llame al 855-ZOZOBRA. Nos encantaría tenerlos a ambos con nosotros.<\/p>"}, {"id": "dog", "title": "Pets", "title_es": "Mascotas", "terms": ["dog|4", "leash", "pet|4", "bring", "perro|4", "perros|4", "mascota|4", "mascotas|4", "correa", "gato|2", "animal|2", "animales|2", "puedo llevar a mi perro|4", "llevar mascota|4", "llevar", "traer"], "related": ["servicedog", "prohibited"], "a": "<h3>Pets stay home<\/h3><p>Pets aren't allowed — the crowd, the fire and the fireworks are hard on animals. <b>Trained service dogs are welcome<\/b> — no paperwork, vest or certification required — but emotional support and comfort animals are not permitted. Ask me about “service dogs” for the full details and what the night is like for a dog.<\/p>", "a_es": "<h3>Las mascotas se quedan en casa<\/h3><p>No se permiten mascotas; la multitud, el fuego y los fuegos artificiales son muy duros para los animales. <b>Los perros de servicio entrenados son bienvenidos<\/b> —sin necesidad de documentos, chaleco ni certificación— pero no se permiten animales de apoyo emocional ni de confort. Pregúnteme por “perros de servicio” para conocer todos los detalles y cómo es la noche para un perro.<\/p>"}, {"id": "rain", "title": "Weather", "title_es": "Clima", "terms": ["rain|3", "shade|8", "shaded|8", "covered|4", "sun|3", "cold|3", "hot|2", "temperature|3", "how cold|4", "jacket", "coat", "forecast", "snow", "lightning", "lluvia|3", "llueve|3", "si llueve|4", "sombra|8", "techado|4", "cubierto|4", "sol|3", "frio|3", "calor|2", "temperatura|3", "que tanto frio|4", "clima|3", "tiempo", "chamarra", "abrigo", "pronostico", "nieve", "rayos", "relampagos", "viento|2"], "related": ["burntime", "bring"], "a": "<h3>Rain or shine — he will burn<\/h3><p>The Burning of Zozobra happens <b>rain or shine<\/b>. The burn itself is weather and wind dependent, which is why no burn time is published; be inside by 8:45 p.m. and the show will find you.<\/p><p><b>Shade:<\/b> there is shade in covered areas, but much of the field is open — spray sunscreen (6 oz or less) is allowed and a good idea for the afternoon. Santa Fe evenings then turn cool after sunset, even in early September — bring a layer. Small folding umbrellas under 12\" are allowed; large or pointed ones are not.<\/p>", "a_es": "<h3>Con lluvia o con sol, él arderá<\/h3><p>La Quema de Zozobra se realiza <b>con lluvia o con sol<\/b>. La quema en sí depende del clima y del viento, por eso no se publica una hora de quema; esté adentro a más tardar a las 8:45 p.m. y el espectáculo le encontrará.<\/p><p><b>Sombra:<\/b> hay sombra en las áreas cubiertas, pero gran parte del campo está al descubierto; el protector solar en aerosol (6 oz o menos) está permitido y es buena idea para la tarde. Luego, las noches de Santa Fe refrescan después de la puesta del sol, incluso a principios de septiembre; lleve una chamarra o algo para abrigarse. Se permiten paraguas plegables pequeños de menos de 12\"; los grandes o con punta, no.<\/p>"}, {"id": "burnitem", "title": "Burning a personal item in Zozobra", "title_es": "Quemar un objeto personal en Zozobra", "terms": ["burn my|4", "burn a|3", "burn an|3", "uniform|5", "wedding dress|5", "put in zozobra|6", "inside zozobra|5", "memento|5", "belongings|3", "personal item|6", "quemar mi|4", "quemar un|3", "quemar una|3", "uniforme|5", "vestido de novia|5", "poner en zozobra|6", "meter en zozobra|6", "dentro de zozobra|5", "recuerdo|5", "recuerdos|5", "pertenencias|3", "objeto personal|6", "articulo personal|6", "quiero quemar|4"], "related": ["gloom", "contact"], "a": "<h3>Burning a personal item<\/h3><p>Yes — people bring us uniforms, wedding dresses, legal papers, photographs and other flammable mementos every year, and we are honored to place them in Zozobra. For anything larger than what fits in the Gloom Tent box, <b>contact us ahead of the event<\/b> — call 855-ZOZOBRA (855-969-6272) or email <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a> — and we’ll arrange a handoff during event week.<\/p><p class=\"fine\">No dangerous or hazardous items.<\/p>", "a_es": "<h3>Quemar un objeto personal<\/h3><p>Sí: cada año la gente nos trae uniformes, vestidos de novia, documentos legales, fotografías y otros recuerdos inflamables, y es un honor para nosotros colocarlos dentro de Zozobra. Para cualquier cosa más grande de lo que cabe en la caja de la Gloom Tent, <b>comuníquese con nosotros antes del evento<\/b> —llame al 855-ZOZOBRA (855-969-6272) o escriba a <a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a>— y coordinaremos la entrega durante la semana del evento.<\/p><p class=\"fine\">No se aceptan artículos peligrosos ni materiales de riesgo.<\/p>"}, {"id": "gloom", "title": "Glooms & the Gloom Box", "title_es": "Los glooms y la Gloom Box", "terms": ["gloom|3", "submit", "write", "note", "paper", "certificate", "anxiety", "bad", "divorce", "letter", "stuff", "burn my", "glooms|3", "gloom box|3", "caja de glooms|3", "penas|3", "preocupaciones|3", "tristezas|2", "enviar", "escribir", "nota", "papel", "certificado|2", "ansiedad", "divorcio", "carta", "quemar mis penas|4", "quemar mi", "cosas malas"], "related": ["what", "history"], "a": "<h3>Give him your glooms<\/h3><p>Zozobra is stuffed with thousands of written glooms — bad habits, hurt feelings, worries — that burn with him. Ways to add yours:<\/p><ul><li><b>Online:<\/b> the Gloom Box page at <a href=\"https://burnzozobra.com\" target=\"_blank\" rel=\"noopener\">burnzozobra.com<\/a> — $1 per gloom, with a Certificate of Destruction signed by the Fire Spirit.<\/li><li><b>At ZozoFest<\/b> (Aug. 25 and 27–29, Santa Fe Place Mall) — stuff your glooms inside Zozobra himself.<\/li><li><b>Gloom boxes<\/b> around Santa Fe in the weeks before the event.<\/li><li><b>Gloom boxes<\/b> at the New Mexico Tourism and Tourism Santa Fe visitor centers until noon Wednesday, Sept. 1.<\/li><li><b>Event day:<\/b> the Gloom Tent near the first baseline, until 8:00 p.m. Notes, divorce decrees, legal papers, photos — anything flammable you want gone.<\/li><\/ul><p>Use the hashtags <b>#Zozobra103<\/b> and <b>#burnmygloom<\/b> to share your night — the official accounts reshare favorites.<\/p>", "a_es": "<h3>Entréguele sus glooms<\/h3><p>Zozobra va relleno de miles de \"glooms\" (sus penas y preocupaciones) escritos —malos hábitos, sentimientos heridos, preocupaciones— que arden con él. Formas de agregar los suyos:<\/p><ul><li><b>En línea:<\/b> la página Gloom Box en <a href=\"https://burnzozobra.com\" target=\"_blank\" rel=\"noopener\">burnzozobra.com<\/a> — $1 por gloom, con un Certificado de Destrucción firmado por el Espíritu del Fuego (Fire Spirit).<\/li><li><b>En ZozoFest<\/b> (25 y del 27 al 29 de agosto, Santa Fe Place Mall) — meta sus \"glooms\" dentro del mismísimo Zozobra.<\/li><li><b>Cajas de glooms (gloom boxes)<\/b> por todo Santa Fe en las semanas previas al evento.<\/li><li><b>Cajas de glooms (gloom boxes)<\/b> en los centros de visitantes de New Mexico Tourism y Tourism Santa Fe hasta el mediodía del miércoles 1 de septiembre.<\/li><li><b>El día del evento:<\/b> la Gloom Tent cerca de la línea de primera base, hasta las 8:00 p.m. Notas, sentencias de divorcio, documentos legales, fotos: cualquier cosa inflamable que quiera ver desaparecer.<\/li><\/ul><p>Use los hashtags <b>#Zozobra103<\/b> y <b>#burnmygloom<\/b> para compartir su noche; las cuentas oficiales vuelven a compartir sus favoritos.<\/p>"}, {"id": "what", "title": "What is Zozobra?", "title_es": "¿Qué es Zozobra?", "terms": ["what is zozobra|4", "what is it|2", "whats zozobra|4", "who is zozobra|4", "zozobra", "old man gloom|2", "marionette", "puppet", "effigy", "meaning", "why", "explain", "mean", "tradition", "about", "que es zozobra|4", "que es|2", "que es eso|2", "quien es zozobra|4", "el viejo|2", "marioneta|2", "titere|2", "efigie", "muneco|2", "monigote", "significado", "que significa|2", "por que", "explicar", "tradicion", "de que se trata|3"], "related": ["mythology", "history", "made", "gloom"], "a": "<h3>Old Man Gloom<\/h3><p>Zozobra — \"Old Man Gloom\" — is a <b>50-foot-6-inch marionette<\/b>, one of the largest functioning marionettes in the world. He embodies the gloom and anxiety of the past year. Each fall, Santa Feans stuff him with their written glooms, and as darkness falls he groans, moans and fights the Fire Spirit before going down in flames — taking the year's troubles with him.<\/p><p>The crowd is the hero of the story: when the Fire Spirit appears, everyone shouts <b>\"Burn him!\"<\/b><\/p><p class=\"fine\">Want the whole story? Ask me about “the mythology.”<\/p><p class=\"note\">Read the full story of Zozobra on our <a href=\"https://burnzozobra.com/history/\" target=\"_blank\" rel=\"noopener\">Myth &amp; History page<\/a>.<\/p>", "a_es": "<h3>Old Man Gloom<\/h3><p>Zozobra —\"Old Man Gloom\" (el Viejo)— es una <b>marioneta de 50 pies y 6 pulgadas<\/b>, una de las marionetas funcionales más grandes del mundo. Encarna la pesadumbre y la ansiedad del año que pasó. Cada otoño, los santafesinos lo rellenan con sus \"glooms\" (sus penas y preocupaciones) escritos, y al caer la oscuridad gime, se queja y pelea contra el Espíritu del Fuego (Fire Spirit) antes de caer envuelto en llamas, llevándose consigo los problemas del año.<\/p><p>El público es el héroe de la historia: cuando aparece el Espíritu del Fuego, todos gritan <b>\"Burn him!\" (¡Quémenlo!)<\/b><\/p><p class=\"fine\">¿Quiere la historia completa? Pregúnteme por “la mitología”.<\/p><p class=\"note\">Lea la historia completa de Zozobra en nuestra página <a href=\"https://burnzozobra.com/history/\" target=\"_blank\" rel=\"noopener\">El Mito y la Historia<\/a>.<\/p>"}, {"id": "whyburn", "title": "Why do they burn Zozobra?", "title_es": "¿Por qué queman a Zozobra?", "terms": ["why do they burn|16", "why do they burn zozobra|18", "why do you burn|16", "why do we burn|16", "why burn|14", "why burn him|16", "why is zozobra burned|16", "why is he burned|14", "why is he burnt|14", "why set him on fire|14", "purpose of burning|12", "point of the burn|12", "reason for the burn|12", "what is the point|6", "por que lo queman|16", "por que queman a zozobra|18", "por que se quema zozobra|16", "para que lo queman|14", "por que le prenden fuego|14", "cual es el proposito|8", "razon de la quema|12"], "related": ["mythology", "comesback", "gloom"], "a": "<h3>Because gloom needs somewhere to go<\/h3><p>All year, the worries, grudges, griefs and bad habits of a whole city pile up. Zozobra gives them a face and a body, fifty feet tall, stuffed with thousands of glooms people have written down and handed over. When he burns, those glooms burn with him.<\/p><p>It is a letting-go done out loud, together, by tens of thousands of people at once. Santa Feans call it the city’s true New Year: you walk in carrying something and walk home lighter.<\/p><p class=\"fine\">Ask me about “the mythology” for the full story, or “why does he come back every year.”<\/p><p class=\"note\">Read the full story of Zozobra on our <a href=\"https://burnzozobra.com/history/\" target=\"_blank\" rel=\"noopener\">Myth &amp; History page<\/a>.<\/p>", "a_es": "<h3>Porque la pesadumbre necesita a dónde irse<\/h3><p>Durante todo el año se acumulan las preocupaciones, los rencores, los duelos y los malos hábitos de toda una ciudad. Zozobra les da rostro y cuerpo, de cincuenta pies de alto, relleno con miles de “glooms” (sus penas y preocupaciones) que la gente ha escrito y entregado. Cuando él arde, esos glooms arden con él.<\/p><p>Es una forma de soltar, en voz alta y en conjunto, hecha por decenas de miles de personas a la vez. La gente de Santa Fe llama a la quema el verdadero Año Nuevo de la ciudad: uno llega cargando algo y regresa a casa más ligero.<\/p><p class=\"fine\">Pregúnteme por “la mitología” para la historia completa, o “¿por qué regresa cada año?”.<\/p><p class=\"note\">Lea la historia completa de Zozobra en nuestra página <a href=\"https://burnzozobra.com/history/\" target=\"_blank\" rel=\"noopener\">El Mito y la Historia<\/a>.<\/p>"}, {"id": "religion", "title": "Is Zozobra religious or political?", "title_es": "¿Zozobra es religioso o político?", "terms": ["religious|14", "religion|14", "political|14", "politics|12", "is zozobra religious|18", "is zozobra political|18", "satanic|16", "satan|14", "devil|12", "demon|12", "pagan|14", "cult|14", "witchcraft|12", "occult|14", "church|8", "christian|10", "catholic|10", "anti christian|14", "against god|12", "god|5", "faith|8", "party|2", "democrat|10", "republican|10", "trump|10", "religioso|14", "religion|14", "politico|14", "politica|12", "es religioso|16", "es politico|16", "satanico|16", "satanas|14", "diablo|12", "demonio|12", "pagano|14", "secta|14", "brujeria|12", "ocultismo|14", "iglesia|8", "cristiano|10", "catolico|10", "contra dios|12", "dios|5", "fe|3"], "related": ["origins", "whyburn", "inside"], "a": "<h3>Neither<\/h3><p>Will Shuster, who created Zozobra, was emphatic that he is not a political or religious figure, and the Kiwanis Club of Santa Fe has kept it that way. Zozobra doesn’t stand for any person, party, faith or group. He stands for gloom itself, the thing every one of us carries.<\/p><p>The idea began at La Fonda on Christmas Eve 1923, when Shuster had his artist friends write their glooms on strips of paper and burn them. Later, in Mexico, he saw a Yaqui Holy Week tradition in which a village burned an effigy together. What moved him was the sense of community, not the religion, and what he built in Santa Fe is a civic rite open to everyone.<\/p><p>People of every faith and none, every politics and none, stand shoulder to shoulder on that field and shout the same two words: <b>“Burn him!”<\/b><\/p>", "a_es": "<h3>Ninguna de las dos cosas<\/h3><p>Will Shuster, quien creó a Zozobra, fue enfático en que no es una figura política ni religiosa, y el Club Kiwanis de Santa Fe lo ha mantenido así. Zozobra no representa a ninguna persona, partido, fe ni grupo. Representa la pesadumbre misma, eso que todos cargamos.<\/p><p>La idea nació en La Fonda en la Nochebuena de 1923, cuando Shuster pidió a sus amigos artistas que escribieran sus “glooms” (sus penas y preocupaciones) en tiras de papel y las quemaran. Más tarde, en México, presenció una tradición yaqui de Semana Santa en la que todo un pueblo quemaba una efigie en conjunto. Lo que lo conmovió fue el sentido de comunidad, no la religión, y lo que construyó en Santa Fe es un rito cívico abierto a todos.<\/p><p>Personas de todas las creencias y de ninguna, de todas las posturas políticas y de ninguna, están hombro con hombro en ese campo y gritan las mismas dos palabras: <b>“Burn him!” (¡Quémenlo!)<\/b><\/p>"}, {"id": "attend", "title": "Should I attend Zozobra?", "title_es": "¿Debería ir a Zozobra?", "terms": ["should i attend|16", "should i go|16", "should we go|16", "is it worth going|16", "is it worth it|14", "worth going|14", "worth seeing|14", "worth the trip|14", "is it any good|12", "is it fun|12", "why should i go|14", "why attend|12", "convince me|10", "never been|10", "deberia ir|16", "vale la pena|16", "vale la pena ir|16", "es divertido|12", "por que deberia ir|14", "nunca he ido|10", "merece la pena|14", "is it worth the drive|14", "worth the drive|12", "should i go to zozobra|18", "why should i go to zozobra|18", "vale la pena|12", "de
