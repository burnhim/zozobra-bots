 permiten alimentos ni bebidas dentro del área de ZozoFest<\/b> — tenemos que mantener a nuestro monstruo en condiciones impecables.<\/p><p class=\"fine\">Artistas: inscríbanse en la Exhibición de Arte de Zozobra (fecha límite: lunes 2 de agosto de 2027) en <a href=\"https://burnzozobra.com/zozobra-art-prospectus/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/zozobra-art-prospectus<\/a>. Todos los detalles: <a href=\"https://burnzozobra.com/zozofest/\" target=\"_blank\" rel=\"noopener\">burnzozobra.com/zozofest<\/a>.<\/p><p class=\"note\">La Quema de Zozobra en sí es el <b>viernes 3 de septiembre de 2027<\/b> en Fort Marcy Park — pregúnteme por “el día de la quema” para los horarios de las puertas.<\/p>"}, {"id": "documentary", "title": "The documentary", "title_es": "El documental", "terms": ["documentary|3", "film", "movie", "stream", "documental|3", "el documental|3", "pelicula|2", "filme", "cine", "ver en linea", "streaming", "rentar pelicula|2", "100 anos de fuego|3", "donde veo el documental|3"], "related": ["history"], "a": "<h3>Zozobra: 100 Years of Fire &amp; Redemption<\/h3><p>The award-winning 42-minute documentary (Winner, Best Story, Santa Fe Film Festival) is available to rent or own at <a href=\"https://zozobra100film.com\" target=\"_blank\" rel=\"noopener\">zozobra100film.com<\/a>. All proceeds go to Santa Fe children's charities.<\/p>", "a_es": "<h3>Zozobra: 100 Years of Fire &amp; Redemption<\/h3><p>El galardonado documental de 42 minutos (ganador a la Mejor Historia, Santa Fe Film Festival) está disponible para rentar o comprar en <a href=\"https://zozobra100film.com\" target=\"_blank\" rel=\"noopener\">zozobra100film.com<\/a>. Todas las ganancias se destinan a organizaciones benéficas para los niños de Santa Fe.<\/p>"}, {"id": "hotel", "title": "Where to stay", "title_es": "Dónde hospedarse", "terms": ["hotel|3", "stay", "where to stay|3", "place to stay|3", "visiting", "visitor", "trip", "tourist", "plaza", "downtown", "hoteles|3", "hospedaje|3", "hospedarse|3", "alojamiento|3", "donde hospedarse|3", "donde quedarse|3", "donde me quedo|3", "visita", "visitante", "viaje", "turista", "centro", "where should i stay|16", "where can i stay|16", "hotel partners|14", "partner hotels|14", "cheap hotel|12", "affordable hotel|12", "budget hotel|12", "cerrillos|8", "drury|10", "residence inn|10", "donde hospedarme|14", "donde quedarme|14", "bobcat|12", "bobcat inn|14", "lodging|10", "luxury hotel|12", "nice hotel|10", "hotel rates|12", "hotel discount|14", "zozobra rate|14", "bed and breakfast|10", "b&b|8", "la fonda|20", "stay at la fonda|22", "la fonda partner|22", "hotel partner|16", "is a partner|10"], "related": ["rv", "parking", "railrunner"], "a": "<h3>Where to stay<\/h3><p>Zozobra falls on Labor Day weekend, one of Santa Fe’s busiest of the year. Rooms go fast and prices run higher than usual, so <b>book as early as you can<\/b>.<\/p><p><b>Our partners with special Zozobra rates<\/b> (ask for the Zozobra rate when you book):<\/p><ul><li><b>Drury Plaza Hotel Santa Fe:<\/b> downtown, a few blocks from the Plaza and an easy walk to the gates.<\/li><li><b>Residence Inn by Marriott Santa Fe:<\/b> 1698 Galisteo Street, a short drive south of downtown. Suites with kitchens and free parking make it a good fit for families.<\/li><\/ul><p><b>Make it a Premium night:<\/b> <b>La Fonda on the Plaza<\/b> is where Will Shuster and his friends burned their glooms on Christmas Eve 1923, the night the idea for Zozobra was born. It’s a short walk to Fort Marcy Park and a perfect match for Premium Viewing.<\/p><p><b>Country quiet:<\/b> the <b>Bobcat Inn<\/b> is a small adobe bed-and-breakfast on the Old Las Vegas Highway, about 15 minutes from the Plaza, with Northern New Mexico breakfasts and big sunset views.<\/p><p><b>A realistic look at cost:<\/b> hotels downtown near the Plaza are the priciest in town, especially this weekend. For more budget-friendly rooms, look in the middle of town and south along <b>Cerrillos Road<\/b>, then park free at South Capitol and ride the free shuttle.<\/p><p class=\"note\">Coming in an RV? Ask me about “RV parking.”<\/p>", "a_es": "<h3>Dónde hospedarse<\/h3><p>Zozobra cae en el fin de semana del Día del Trabajo, uno de los más concurridos del año en Santa Fe. Las habitaciones se llenan rápido y los precios suben más de lo normal, así que <b>reserve lo antes posible<\/b>.<\/p><p><b>Nuestros socios con tarifas especiales de Zozobra<\/b> (pida la tarifa de Zozobra al reservar):<\/p><ul><li><b>Drury Plaza Hotel Santa Fe:<\/b> en el centro, a unas cuadras de la Plaza y a una caminata corta de las puertas.<\/li><li><b>Residence Inn by Marriott Santa Fe:<\/b> 1698 Galisteo Street, a pocos minutos en carro al sur del centro. Sus suites con cocina y estacionamiento gratis son ideales para familias.<\/li><\/ul><p><b>Para una noche Premium:<\/b> <b>La Fonda on the Plaza<\/b> es donde Will Shuster y sus amigos quemaron sus penas en la Nochebuena de 1923, la noche en que nació la idea de Zozobra. Está a una caminata corta de Fort Marcy Park y es la pareja perfecta para Premium Viewing.<\/p><p><b>Tranquilidad del campo:<\/b> el <b>Bobcat Inn<\/b> es un pequeño bed-and-breakfast de adobe sobre Old Las Vegas Highway, a unos 15 minutos de la Plaza, con desayunos del norte de Nuevo México y atardeceres espectaculares.<\/p><p><b>Una idea realista de los costos:<\/b> los hoteles del centro, cerca de la Plaza, son los más caros de la ciudad, sobre todo ese fin de semana. Para opciones más económicas, busque en el centro de la ciudad y hacia el sur por <b>Cerrillos Road<\/b>; luego estacione gratis en South Capitol y tome el autobús gratuito.<\/p><p class=\"note\">¿Viene en casa rodante? Pregúnteme por “estacionamiento para RV”.<\/p>"}, {"id": "rv", "title": "Where to stay with an RV", "title_es": "Dónde quedarse con una casa rodante (RV)", "terms": ["rv|10", "rvs|10", "camper|8", "motorhome|8", "motor home|8", "travel trailer|8", "fifth wheel|8", "5th wheel|8", "rv park|14", "rv parking|16", "park my rv|18", "where can i park my rv|20", "campground|8", "camping|6", "casa rodante|12", "autocaravana|10", "estacionamiento para rv|16"], "related": ["hotel", "parking", "rideshare"], "a": "<h3>Santa Fe’s RV parks are your home base<\/h3><p>These RV parks make an easy base for Zozobra weekend:<\/p><ul><li><b>Los Sueños de Santa Fe RV Park<\/b>: off Cerrillos Road, the closest to town, with a city bus stop at the entrance.<\/li><li><b>Santa Fe Skies RV Park<\/b>: big-rig friendly, on the Turquoise Trail about 20 minutes from the Plaza.<\/li><li><b>Rancheros de Santa Fe<\/b>: on the Old Las Vegas Highway, about 11 miles from downtown.<\/li><\/ul><p>On burn day, leave the rig at camp and come in by car, rideshare or a free city bus. Drivers can park free at South Capitol, a lot set up for cars, and ride the free shuttle to the gates.<\/p><p class=\"note\">September is busy in Santa Fe. Reserve your site early.<\/p>", "a_es": "<h3>Los parques para RV de Santa Fe son su base<\/h3><p>Estos parques para casas rodantes son una base cómoda para el fin de semana de Zozobra:<\/p><ul><li><b>Los Sueños de Santa Fe RV Park<\/b>: junto a Cerrillos Road, el más cercano a la ciudad, con parada de autobús en la entrada.<\/li><li><b>Santa Fe Skies RV Park<\/b>: apto para vehículos grandes, sobre el Turquoise Trail, a unos 20 minutos de la Plaza.<\/li><li><b>Rancheros de Santa Fe<\/b>: sobre Old Las Vegas Highway, a unas 11 millas del centro.<\/li><\/ul><p>El día de la quema, deje la casa rodante en el parque y venga en carro, en un servicio de transporte o en un autobús de la ciudad gratuito. Quienes vienen en carro pueden estacionar gratis en South Capitol, un lote preparado para carros, y tomar el autobús gratuito hasta las puertas.<\/p><p class=\"note\">Septiembre es temporada alta en Santa Fe. Reserve su lugar con tiempo.<\/p>"}, {"id": "reviews", "title": "What do people say about Zozobra?", "title_es": "¿Qué dice la gente de Zozobra?", "terms": ["reviews|12", "review|10", "what do people say|18", "what people say|16", "what do people think|16", "ratings|10", "rating|8", "testimonials|12", "feedback|6", "is it good|10", "resenas|12", "opiniones|12", "que dice la gente|16"], "related": ["attend", "firsttime", "same"], "a": "<h3>People keep coming back<\/h3><p>Here’s what we hear from the crowd:<\/p><ul><li>First-timers call it an awesome experience, and an amazing, inexpensive night out.<\/li><li>Longtime fans say they’ve been twenty times since they were kids, and it’s still the most underrated show in New Mexico, a little different every year.<\/li><li>Guests say the night is well organized, with plenty of security, and they feel safe.<\/li><li>People rave about the music, the drone show and the fireworks, and whole sections sing along.<\/li><li>And the simplest review of all: you write down your gloom, it goes inside him, and when it gets dark the fire burns it away.<\/li><\/ul><p>The honest tips from reviewers: bring a camp chair for General Admission, and get closer to the stage for the best sound.<\/p>", "a_es": "<h3>La gente siempre regresa<\/h3><p>Esto es lo que nos dice el público:<\/p><ul><li>Quienes vienen por primera vez dicen que es una experiencia increíble, y una noche maravillosa y económica.<\/li><li>Los fieles de siempre cuentan que han venido veinte veces desde niños, y que sigue siendo el espectáculo más subestimado de Nuevo México, un poco diferente cada año.<\/li><li>Los asistentes dicen que el evento está bien organizado, con mucha seguridad, y que se sienten seguros.<\/li><li>A la gente le encantan la música, el espectáculo de drones y los fuegos artificiales, y secciones enteras cantan juntas.<\/li><li>Y la reseña más sencilla de todas: uno escribe su pena, la meten dentro de él, y cuando oscurece el fuego se la lleva.<\/li><\/ul><p>Los consejos honestos de quienes han venido: traiga una silla plegable para Admisión General, y acérquese al escenario para escuchar mejor.<\/p>"}, {"id": "safe", "title": "Is Zozobra safe?", "title_es": "¿Es seguro Zozobra?", "terms": ["is it safe|18", "is zozobra safe|18", "safe|8", "safety|8", "security|8", "secure|6", "feel safe|12", "metal detector|12", "screening|8", "es seguro|16", "seguridad|8", "seguro|6"], "related": ["prohibited", "firstaid", "lost"], "a": "<h3>Safety comes first<\/h3><p>The whole venue is fenced, and everyone entering goes through security screening with a metal detector. Clear bags only, and no weapons of any kind, including pocket knives. Security and first aid are on site all night, and there’s a lost-kid registry and a lost-and-found at the Gloom Tent.<\/p><p>Guests tell us the event is well organized and they feel safe, and the City’s review of the 2026 burn found it ran smoothly.<\/p><p class=\"note\">The lighter you travel, the faster you get through the gate.<\/p>", "a_es": "<h3>La seguridad es lo primero<\/h3><p>Todo el recinto está cercado, y todos los que entran pasan por revisión de seguridad con detector de metales. Solo se permiten bolsas transparentes, y ningún tipo de arma, incluidas las navajas de bolsillo. Hay seguridad y primeros auxilios toda la noche, un registro para niños perdidos y objetos perdidos en la Gloom Tent.<\/p><p>Los asistentes nos dicen que el evento está bien organizado y que se sienten seguros, y la revisión de la Ciudad sobre la quema de 2026 encontró que todo salió bien.<\/p><p class=\"note\">Mientras menos cosas traiga, más rápido pasa por la entrada.<\/p>"}, {"id": "tips", "title": "Tips for the best night", "title_es": "Consejos para disfrutar la noche", "terms": ["tips|12", "tip|8", "advice|8", "best experience|14", "best spot|12", "where to sit|12", "pro tip|12", "insider tips|14", "how to enjoy|12", "make the most of|12", "consejos|12", "recomendaciones|10"], "related": ["times", "chairs", "parking", "firsttime"], "a": "<h3>How to have your best burn<\/h3><ul><li><b>Come early.<\/b> Gates open at 4:00 p.m., and lines move fastest before 7.<\/li><li><b>Bring a cloth camp chair<\/b> for General Admission. Chairs aren’t allowed in Premium Viewing.<\/li><li><b>Get closer for sound.<\/b> The music carries best near the stage.<\/li><li><b>Ride the free shuttle<\/b> from South Capitol. The last one leaves at 8:45 p.m.<\/li><li><b>Screenshot your ticket.<\/b> Cell service at the park is limited.<\/li><li><b>Clear bag, comfortable shoes and a warm layer.<\/b> Evenings cool off fast.<\/li><li><b>Write your gloom ahead of time<\/b> so it’s ready for the Gloom Box.<\/li><\/ul><p class=\"note\">First time? Read the <a href=\"https://burnzozobra.com/first-timers-guide/\" target=\"_blank\" rel=\"noopener\">First Timer’s Guide<\/a>.<\/p>", "a_es": "<h3>Cómo disfrutar al máximo la quema<\/h3><ul><li><b>Llegue temprano.<\/b> Las puertas abren a las 4:00 p.m., y las filas avanzan más rápido antes de las 7.<\/li><li><b>Traiga una silla plegable de tela<\/b> para Admisión General. No se permiten sillas en las secciones Premium.<\/li><li><b>Acérquese para escuchar mejor.<\/b> La música se oye mejor cerca del escenario.<\/li><li><b>Tome el autobús gratuito<\/b> desde South Capitol. El último sale a las 8:45 p.m.<\/li><li><b>Guarde una captura de pantalla de su boleto.<\/b> La señal de celular en el parque es limitada.<\/li><li><b>Bolsa transparente, zapatos cómodos y una capa abrigadora.<\/b> Las noches refrescan rápido.<\/li><li><b>Escriba su pena con anticipación<\/b> para tenerla lista para la Gloom Box.<\/li><\/ul><p class=\"note\">¿Primera vez? Lea la <a href=\"https://burnzozobra.com/first-timers-guide/\" target=\"_blank\" rel=\"noopener\">guía para principiantes (First Timer’s Guide)<\/a>.<\/p>"}, {"id": "late", "title": "Running late?", "title_es": "¿Va a llegar tarde?", "terms": ["running late|18", "arrive late|16", "arriving late|16", "get there late|16", "late|6", "after 8 45|12", "work late|12", "after work|10", "miss the gate|12", "gates close|12", "llegar tarde|16", "tarde|6"], "related": ["times", "parking", "watch"], "a": "<h3>Be inside by 8:45 p.m.<\/h3><p>Gates close at <b>8:45 p.m.<\/b>, and the last free shuttle leaves South Capitol at 8:45 too, so plan to be through the gate by then. The burn itself happens after dark.<\/p><p>If you know you’ll be cutting it close, call the hotline at <b><a href=\"tel:18559696272\">855-969-6272<\/a><\/b> before burn day.<\/p>", "a_es": "<h3>Esté adentro antes de las 8:45 p.m.<\/h3><p>Las puertas cierran a las <b>8:45 p.m.<\/b>, y el último autobús gratuito sale de South Capitol también a las 8:45, así que planee pasar la entrada antes de esa hora. La quema es después del anochecer.<\/p><p>Si sabe que va a llegar justo, llame a la línea al <b><a href=\"tel:18559696272\">855-969-6272<\/a><\/b> antes del día de la quema.<\/p>"}, {"id": "vendor", "title": "Becoming a vendor", "title_es": "Ser vendedor en Zozobra", "terms": ["vendor|10", "become a vendor|20", "vendor application|20", "sell food|14", "food vendor|14", "food truck|14", "sell at zozobra|18", "booth|8", "have a booth|16", "merchandise vendor|14", "vender|10", "vendedor|12", "puesto|10", "ser vendedor|18", "vender comida|16"], "related": ["foodbooths", "sponsor", "volunteer"], "a": "<h3>Selling at Zozobra<\/h3><p>Food, beverage and other vendors line the vendor area on the ball field from the moment the gates open until the burn. To apply for a booth, email our vendor team at <b><a href=\"mailto:vendors@burnzozobra.com\">vendors@burnzozobra.com<\/a><\/b>. They’ll send the application, the requirements and the deadlines for the year.<\/p><p class=\"note\">Booths fill up, so reach out early in the year.<\/p>", "a_es": "<h3>Vender en Zozobra<\/h3><p>Los vendedores de comida, bebidas y otros productos ocupan el área de vendedores en el campo de béisbol desde que abren las puertas hasta la quema. Para solicitar un puesto, escriba a nuestro equipo de vendedores a <b><a href=\"mailto:vendors@burnzozobra.com\">vendors@burnzozobra.com<\/a><\/b>. Le enviarán la solicitud, los requisitos y las fechas límite del año.<\/p><p class=\"note\">Los puestos se llenan, así que escríbanos temprano en el año.<\/p>"}, {"id": "balloon", "title": "Zozobra the hot air balloon", "title_es": "Zozobra, el globo aerostático", "terms": ["balloon|10", "hot air balloon|18", "zozobra balloon|18", "balloon fiesta|14", "balloon glow|14", "globo|10", "globo aerostatico|18", "fiesta de globos|14"], "related": ["yearround", "sponsor"], "a": "<h3>Old Man Gloom takes to the sky<\/h3><p>Zozobra also flies as a hot air balloon, shaped like Old Man Gloom himself. Each fall he appears at balloon events around the region, including the Albuquerque International Balloon Fiesta.<\/p><p>For where he’s flying next, and how to sponsor him, visit the <a href=\"https://burnzozobra.com/balloon/\" target=\"_blank\" rel=\"noopener\">Zozobra Balloon page<\/a>.<\/p>", "a_es": "<h3>El Viejo Gloom sube al cielo<\/h3><p>Zozobra también vuela como globo aerostático con la forma del mismísimo Viejo Gloom. Cada otoño aparece en eventos de globos de la región, incluida la Albuquerque International Balloon Fiesta.<\/p><p>Para saber dónde volará y cómo patrocinarlo, visite la <a href=\"https://burnzozobra.com/balloon/\" target=\"_blank\" rel=\"noopener\">página del globo de Zozobra<\/a>.<\/p>"}, {"id": "otherevents", "title": "Other events we put on", "title_es": "Otros eventos que organizamos", "terms": ["other events|18", "fourth of july|14", "july 4th|14", "4th of july|14", "dia de los muertos|14", "day of the dead|14", "new years eve|14", "new year's eve|14", "nye|10", "what else do you do|16", "cuatro de julio|14", "dia de muertos|14", "ano nuevo|12", "fin de ano|12", "otros eventos|18"], "related": ["yearround", "volunteer", "sponsor"], "a": "<h3>More free celebrations in Santa Fe<\/h3><p>The team behind Zozobra also brings free community celebrations to Santa Fe through the year:<\/p><ul><li><b>Fourth of July:<\/b> <a href=\"https://burnzozobra.com/4th/\" target=\"_blank\" rel=\"noopener\">Santa Fe’s July 4th celebration<\/a>.<\/li><li><b>Día de los Muertos:<\/b> <a href=\"https://burnzozobra.com/dia/\" target=\"_blank\" rel=\"noopener\">Día de los Muertos on the Santa Fe Plaza<\/a>, including the community ofrenda where you can honor a loved one.<\/li><li><b>New Year’s Eve:<\/b> <a href=\"https://burnzozobra.com/free-new-years-eve-on-the-santa-fe-plaza/\" target=\"_blank\" rel=\"noopener\">free New Year’s Eve on the Santa Fe Plaza<\/a>.<\/li><\/ul>", "a_es": "<h3>Más celebraciones gratuitas en Santa Fe<\/h3><p>El equipo detrás de Zozobra también ofrece celebraciones comunitarias gratuitas en Santa Fe durante el año:<\/p><ul><li><b>Cuatro de Julio:<\/b> <a href=\"https://burnzozobra.com/4th/\" target=\"_blank\" rel=\"noopener\">la celebración del 4 de julio en Santa Fe<\/a>.<\/li><li><b>Día de los Muertos:<\/b> <a href=\"https://burnzozobra.com/dia/\" target=\"_blank\" rel=\"noopener\">Día de los Muertos en la Plaza de Santa Fe<\/a>, con la ofrenda comunitaria donde puede honrar a un ser querido.<\/li><li><b>Año Nuevo:<\/b> <a href=\"https://burnzozobra.com/free-new-years-eve-on-the-santa-fe-plaza/\" target=\"_blank\" rel=\"noopener\">Año Nuevo gratis en la Plaza de Santa Fe<\/a>.<\/li><\/ul>"}, {"id": "press", "title": "Press and media", "title_es": "Prensa y medios", "terms": ["press|12", "media|10", "reporter|12", "journalist|12", "press pass|18", "press credential|20", "media credential|20", "media pass|18", "interview|10", "news crew|14", "photographer|10", "film crew|12", "prensa|12", "medios|10", "periodista|12", "credencial de prensa|20", "entrevista|10"], "related": ["camera", "contact", "documentary"], "a": "<h3>Covering Zozobra<\/h3><p>Members of the media are welcome. For press credentials, interviews, photos and story ideas, contact <b>Lisa Jaramillo<\/b>, our press liaison, at <b><a href=\"mailto:press_liaison@burnzozobra.com\">press_liaison@burnzozobra.com<\/a><\/b>.<\/p><p class=\"note\">Please request credentials well before burn day.<\/p>", "a_es": "<h3>Cobertura de Zozobra<\/h3><p>Los medios son bienvenidos. Para credenciales de prensa, entrevistas, fotos e ideas para reportajes, comuníquese con <b>Lisa Jaramillo<\/b>, nuestra enlace de prensa, en <b><a href=\"mailto:press_liaison@burnzozobra.com\">press_liaison@burnzozobra.com<\/a><\/b>.<\/p><p class=\"note\">Solicite su credencial con buena anticipación al día de la quema.<\/p>"}, {"id": "perform", "title": "Performing at Zozobra", "title_es": "Presentarse en Zozobra", "terms": ["perform|12", "performer|12", "my band|18", "band play|16", "play at zozobra|20", "perform at zozobra|22", "dance group|14", "musician|12", "act|6", "booking|10", "talent|8", "tocar en zozobra|20", "mi banda|18", "presentarse|12", "grupo de baile|14", "musico|12"], "related": ["music", "anthem", "begloomie"], "a": "<h3>Want to take the stage?<\/h3><p>Bands, dance groups and other performers who’d like to be part of the show can reach out to our Event Chairman, <b>Raymond Sandoval<\/b>, at <b><a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a><\/b>. Tell us who you are, send a link to your work, and let us know what you’d bring to the night.<\/p><p class=\"note\">Singers can also try out for the National Anthem each July, and kids can audition to be Gloomies. Ask me about “National Anthem” or “be a Gloomie.”<\/p>", "a_es": "<h3>¿Quiere subir al escenario?<\/h3><p>Las bandas, grupos de baile y otros artistas que quieran formar parte del espectáculo pueden escribir a nuestro presidente del evento, <b>Raymond Sandoval<\/b>, a <b><a href=\"mailto:burnhim@burnzozobra.com\">burnhim@burnzozobra.com<\/a><\/b>. Cuéntenos quiénes son, envíe un enlace a su trabajo y díganos qué traerían a la noche.<\/p><p class=\"note\">Los cantantes también pueden audicionar para el Himno Nacional cada julio, y los niños pueden audicionar para ser Gloomies. Pregúnteme por “Himno Nacional” o “ser Gloomie”.<\/p>"}, {"id": "updates", "title": "Get Zozobra updates", "title_es": "Reciba noticias de Zozobra", "terms": ["updates|14", "email list|18", "mailing list|18", "newsletter|16", "sign up for updates|22", "sign up for emails|22", "get updates|18", "stay informed|14", "notify me|16", "let me know when tickets|20", "when tickets go on sale|10", "subscribe|14", "join the list|18", "noticias|12", "boletin|14", "lista de correo|18", "inscribirme|14", "suscribirme|16", "avisarme|14"], "related": ["onsale", "yearround", "volunteer"], "a": "<h3>Stay in the Gloom Loop<\/h3><p>Be the first to know when tickets go on sale, what Zozobra’s new theme is, and what’s happening at ZozoFest, plus calls for volunteers, artists and National Anthem singers. It’s just a few emails a year.<\/p><p><b><a href=\"https://lp.constantcontactpages.com/sl/TkLIoAj\" target=\"_blank\" rel=\"noopener\">Sign up for Zozobra updates<\/a><\/b><\/p><p class=\"note\">You can also follow along on Facebook at The Official Burning of Zozobra and on Instagram at @burnzozobra.<\/p>", "a_es": "<h3>Reciba las noticias de Zozobra<\/h3><p>Entérese primero de cuándo salen a la venta los boletos, cuál es el nuevo tema de Zozobra y qué pasa en ZozoFest, además de convocatorias para voluntarios, artistas y cantantes del Himno Nacional. Son solo unos cuantos correos al año.<\/p><p><b><a href=\"https://lp.constantcontactpages.com/sl/TkLIoAj\" target=\"_blank\" rel=\"noopener\">Inscríbase para recibir noticias de Zozobra<\/a><\/b><\/p><p class=\"note\">También puede seguirnos en Facebook como The Official Burning of Zozobra y en Instagram como @burnzozobra.<\/p>"}];
