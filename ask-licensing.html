<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Ask the Licensing Desk · Kiwanis Club of Santa Fe</title>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Bitter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF6EC;--ink:#1E1A16;--red:#E8192B;--deep:#9E1420;--brown:#4A2412;--line:#E2D6C2;--orange:#E87722;--sand:#F3E7D0;}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:'Bitter',Georgia,serif;color:var(--ink);background:#FFFFFF;display:flex;flex-direction:column;}
#bg{position:fixed;inset:0;background:#FFFFFF url('https://burnhim.github.io/zozobra-bots/img/license-bg.jpg') center 58% / min(86vw,520px) no-repeat;opacity:.30;pointer-events:none;}
#bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 0;position:relative;z-index:2;flex:0 0 auto;}
#bar .t{display:flex;align-items:center;gap:10px;}
#bar .t img{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:50%;border:2px solid var(--red);padding:4px;}
#bar h1{font-family:'Rye',Georgia,serif;font-weight:400;font-size:24px;margin:0;color:var(--brown);}
#bar .r{display:flex;align-items:center;gap:10px;}
#bar button{background:var(--red);color:#fff;-webkit-text-fill-color:#fff;border:0;border-radius:18px;padding:8px 16px;font-weight:700;font-size:19px;cursor:pointer;font-family:inherit;}
#bar button:hover{background:var(--deep);}
#chat{flex:1 1 auto;overflow-y:auto;padding:16px;position:relative;z-index:1;}
.msg{max-width:90%;padding:13px 16px;border-radius:16px;margin-bottom:12px;line-height:1.5;font-size:19px;white-space:pre-line;}
.bot{background:#fff;border:2px solid var(--line);border-top-left-radius:4px;color:var(--ink);}
.me{background:var(--red);color:#fff;margin-left:auto;border-top-right-radius:4px;}
.note{font-size:19px;color:var(--deep);font-style:italic;}
#chips{padding:2px 16px 10px;display:flex;flex-wrap:nowrap;gap:8px;position:relative;z-index:1;flex:0 0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch;}
#chips button{flex:0 0 auto;white-space:nowrap;}
#chips button{background:#fff;border:2px solid var(--red);color:var(--deep);border-radius:22px;padding:7px 14px;font-size:19px;font-weight:700;cursor:pointer;font-family:inherit;}
#chips button:hover{background:var(--red);color:#fff;}
form{display:flex;gap:8px;padding:12px 16px;background:var(--brown);flex:0 0 auto;position:relative;z-index:1;}
input{flex:1;min-width:0;border:0;border-radius:24px;padding:12px 16px;font-size:19px;font-family:inherit;color:var(--ink);background:#fff;}
form button{background:var(--orange);color:#fff;border:0;border-radius:24px;padding:12px 20px;font-weight:700;cursor:pointer;font-size:19px;font-family:inherit;}
form button:hover{background:var(--red);}
footer{background:var(--brown);color:#fff;-webkit-text-fill-color:#fff;text-align:center;font-size:19px;padding:0 16px 12px;position:relative;z-index:1;flex:0 0 auto;}
footer a{color:#FFD7A8;-webkit-text-fill-color:#FFD7A8;}
.bot a{color:var(--deep);-webkit-text-fill-color:var(--deep);font-weight:700;text-decoration:underline;word-break:break-word;}
</style>
</head>
<body>

<button type="submit" id="send">Send</button>

var EN = {
  hdr:"Ask the Licensing Desk", lang:"Español", ph:"Ask about selling Zozobra merchandise…", send:"Send",
  foot:'Kiwanis Club of Santa Fe · Zozobra Licensing · v1 · <a href="mailto:burnhim@burnzozobra.com">burnhim@burnzozobra.com</a>',
  hello:"Hi! I answer questions about making and selling Zozobra merchandise: who needs a license, how to apply, fees and commission, the design rules, the trademark notice, and general information about copyright and trademarks.\n\nPuedes preguntarme en español también: toca el botón de arriba.",
  chips:["Do I need a license?","How do I apply?","Fees & commission","Fee waiver","The design rules","Trademark notice","How long is a license?","What happens after I apply?","Copyright vs. trademark","™ and ®","Can I copyright my design?","Selling at ZozoFest or the burn","Selling without a license","Report a violator"],
  note:"General information only, not legal advice.",
  fallback:"I'm not sure about that one. Try asking about who needs a license, how to apply, fees, the commission, a fee waiver, the design rules, the trademark notice, renewals, sales reports, AI art, copyright or trademarks. You can also apply right away through the " + APPLY + ", or email " + EMAIL + ".",
  kb:[
   {k:["need a license","do i need","put zozobra","on a mug","mug","t-shirt","shirt","sticker","earring","jewelry","ornament","license required","who needs","have to get a license","permission","allowed to sell","can i sell","sell zozobra","make zozobra","use zozobra","use the name","use the image","legal to sell"],
    a:"Anyone who sells anything with the Zozobra name or image needs a license from the Kiwanis Club of Santa Fe, which owns Zozobra. That covers T-shirts, stickers, jewelry, prints, books, ornaments, food packaging, anything you sell, in a shop, at a market or online.\n\nThe names Zozobra, Will Shuster's Zozobra and Old Man Gloom, and the Zozobra image, are registered trademarks of the Kiwanis Club.\n\nApply through the " + APPLY + ". Part of every licensed sale supports the youth programs and scholarships Zozobra funds.\n\nFree uses by nonprofits, schools and public agencies don't go through the application. Email " + EMAIL + " instead."},
   {k:["apply","application","how do i","sign up","get a license","get licensed","start","become a licensee","form"],
    a:"Apply online through the " + APPLY + ". It takes about 15 minutes:\n\n1. Tell us if you're new, renewing or adding designs.\n2. Your name, business and contact information.\n3. What you'd like to make: products, quantities, retail price and where you'll sell.\n4. Upload images or mockups of every product and design.\n5. Choose how you pay: the application fee, or ask us to waive it.\n6. Certify you follow city, state and federal permit, license and tax rules.\n7. Read and agree to the design rules.\n8. Agree to put the trademark notice on everything.\n9. Type your name and sign.\n\nYou'll get an email confirmation with your application number."},
   {k:["fee","fees","cost","how much","price of a license","commission","percent","%","royalt","net profit","pay"],
    a:"You choose how you pay:\n\n• Pay the one-time application fee: a sliding scale by the size of your run, starting at $100. Your commission is 25% of net profit.\n• Ask us to waive the fee: your commission is 35% of net profit. The Art Committee decides on waivers.\n\nNet profit means your sales of licensed products, less your direct cost of making them (materials, printing, shipping to you), sales tax collected and refunds. Overhead like rent and salaries isn't deducted.\n\nFees and commissions are paid by credit card on the " + PAY + "."},
   {k:["waive","waiver","can't afford","cant afford","no fee","free license","skip the fee"],
    a:"Yes, you can ask us to waive the application fee on the application. With a waiver your commission is 35% of net profit instead of 25%. Tell us why you're asking (optional), and the Art Committee decides along with your designs."},
   {k:["sales report","annual report","report my sales","when is commission due","due date","september 15","audit"],
    a:"Each year, by September 15, licensees send a sales report (units sold by product, gross sales, direct costs and net profit) and pay the commission. We email you a reminder in August with the link. The Kiwanis Club may audit sales records. Pay by credit card on the " + PAY + "."},
   {k:["rule","rules","allowed","not allowed","can't","cannot","restriction","guideline","denied","declined","reject"],
    a:"The Art Committee reviews every design to protect Zozobra. Applications that break these rules are declined:\n\n• No religious or political portrayal, and nothing that puts Zozobra in a bad light.\n• Original, hand-made artwork only. AI-generated designs are not eligible.\n• Never call your product \"official\" or suggest the Kiwanis Club made or endorses it.\n• Don't combine Zozobra with another organization's name or marks (for example, Fiestas de Santa Fe).\n• Zozobra is never shown as female.\n• Nothing that shows how to build, mount or burn a Zozobra.\n• Sell only approved designs. New products or designs come back to us for approval first.\n• No vending inside the performance area or within 50 yards of the Fort Marcy Park or Magers Field entrances on burn night."},
   {k:["theme","zozobra the kid","cowboy","western","this year","classic zozobra","old design"],
    a:"Your design doesn't have to follow this year's theme. A classic Zozobra is welcome. Just follow the design rules, and keep it original, hand-made artwork."},
   {k:[" ai ","a.i.","artificial intelligence","midjourney","chatgpt","dall","generated","generator","stable diffusion"],
    a:"AI-generated designs are not eligible, in whole or in part. Every design must be original, human-made artwork that you created or have the rights to use.\n\nGood to know: the U.S. Copyright Office generally won't register material generated by AI, so AI art is hard to protect anyway."},
   {k:["the notice","trademark notice","notice","disclaimer","label","tag","sticker","trademark notice","what do i print","8 point"],
    a:"Every licensed item must carry this notice in at least 8-point type, printed on the item or on a sticker:\n\n\"" + NOTICE + "\"\n\nIt also goes on every online listing or post and on display wherever you sell. We send you a notice kit with your approval."},
   {k:["how long","term","expire","provisional","standard license","one year","two year","renew","renewal"],
    a:"First-time licensees receive a one-year Provisional License. Returning licensees in good standing may receive a longer Standard License, up to two years.\n\nWe email you before your license expires. To renew, choose \"I've been licensed before\" on the " + APPLY + "."},
   {k:["after i apply","what happens","next step","how long does it take","approval","approved","decision","review","committee","hear back"],
    a:"Here's what happens:\n\n1. You get an email confirmation with your application number.\n2. The Art Committee of the Kiwanis Club of Santa Fe reviews your designs.\n3. We email you the decision. If changes are needed, we tell you what to revise.\n4. If you're approved, you pay the application fee (unless it's waived), sign your license agreement electronically, and get your trademark notice kit.\n\nPlease don't produce or sell any Zozobra merchandise until your license is approved and signed."},
   {k:["new design","add a design","add product","more products","another design","change my design"],
    a:"New products or designs need approval before you make or sell them. Apply through the " + APPLY + " and choose \"I'm licensed now and want to add products or designs.\" Have your license number handy (it looks like ZL-2027-004)."},
   {k:["permit","business license","tax","gross receipts","crs","city license"],
    a:"On the application you certify that you are, and will stay, in compliance with all city, state and federal permitting, business licensing and tax requirements. We don't collect copies; it's your responsibility to have what your business needs."},
   {k:["zozofest","burn night","at the burn","booth","vend","market","fort marcy","art show"],
    a:"A license lets you sell your approved Zozobra designs wherever you sell: your shop, your website, Etsy or markets.\n\nOn burn night, licensed items can't be sold inside the performance area or within 50 yards of the Fort Marcy Park or Magers Field entrances.\n\nWant a booth at one of our events? That's the vendor program: start on the " + VENDORS + ". Artists can also show and sell in the ZozoFest art show through the summer call for artists."},
   {k:["official","official merch","sell my design to","kiwanis store","art contest","t-shirt contest","poster contest"],
    a:"Licensed products can never be called \"official.\" Official Z Merch is made by the Kiwanis Club and sold at the " + STORE + ".\n\nWant your art on official merchandise? Enter the Zozobra art contest each January. Merchandise questions: merchandise@burnzozobra.com."},
   {k:["buy","where can i buy","shop","store","merch"],
    a:"Official Z Merch is at the " + STORE + ". Licensed artists also sell their own Zozobra designs; look for the trademark notice that starts \"Sold under license from the Kiwanis Club of Santa Fe.\""},
   {k:["violat","bootleg","report","someone selling","unlicensed","knock","fake","counterfeit","stealing"],
    a:"See Zozobra merchandise being sold without a license, at a market, in a shop or online? Let us know on the " + REPORT + " page. You can report anonymously and add photos or links. It protects Zozobra and the artists who do it the right way."},
   {k:["already selling","been selling","got a letter","cease","notice from","case number","stop selling"],
    a:"If you're already selling Zozobra items without a license, please stop selling them and apply through the " + APPLY + ". If you received a notice from us, your case number is in it; you can enter it on the application. We'd much rather have you as a licensed partner.\n\nThe Kiwanis Club has an obligation to protect the Zozobra trademark. If we can't reach an agreement with someone selling without a license, we follow up, and that can include legal action."},
   {k:["without a license","what happens if","get caught","sue","sued","legal action","lawsuit","enforce","consequence","penalt"],
    a:"We always start by inviting sellers into a license. The Kiwanis Club has an obligation to protect the Zozobra trademark, though: a mark that isn't defended can be lost. If someone keeps selling without a license and we can't reach an agreement, we follow up with a final notice, and that can include legal action.\n\nThe easy way to avoid all of it: apply through the " + APPLY + " before you make or sell anything."},
   {k:["copyright vs","difference","trademark vs","copyright or trademark","what is a trademark","what is copyright","trademark mean","copyright mean"],
    a:"General information, not legal advice:\n\n• A trademark protects a name, logo or image that tells buyers who a product comes from, like Zozobra. It lasts as long as the owner keeps using and renewing it.\n• A copyright protects an original creative work, like a drawing, photo, song or book. It exists the moment you create the work, and lasts for the author's life plus 70 years.\n\nZozobra's name and image are trademarks of the Kiwanis Club. Your original artwork is your copyright, but if it shows Zozobra, selling it still needs a Zozobra license."},
   {k:["™","®","tm","registered","r in a circle","symbol"],
    a:"General information, not legal advice:\n\n• ™ means someone claims a name or image as their trademark. Anyone can use it.\n• ® means the trademark is registered with the " + USPTO + ". Only registered marks may use it.\n\nZozobra is a federally registered trademark of the Kiwanis Club of Santa Fe (U.S. Reg. No. 4,908,122)."},
   {k:["copyright my","register my","protect my","my own design","my art","my artwork","own the design","who owns"],
    a:"General information, not legal advice:\n\nYou own the copyright in your original artwork from the moment you create it. Registering it with the " + COPYRIGHT + " is optional, but it gives you a public record and is generally needed before you can sue over a U.S. work.\n\nTwo things to keep in mind:\n• Your license lets you use Zozobra on your approved products. It doesn't give you any ownership of the Zozobra name or image.\n• You can't register or claim Zozobra, Old Man Gloom or a look-alike name or image as your own trademark, or use them in a business name, website address or social media handle."},
   {k:["trademark my","register a trademark","my brand","my business name","my logo","uspto"],
    a:"General information, not legal advice:\n\nYou can register your own business name or logo with the " + USPTO + ", as long as it doesn't include Zozobra, Old Man Gloom or anything confusingly similar. Those belong to the Kiwanis Club, and licensees agree not to register or claim them."},
   {k:["public domain","100 years","1924","expired","too old","shuster died","everyone knows"],
    a:"Zozobra isn't in the public domain. The Zozobra name and image are registered trademarks of the Kiwanis Club of Santa Fe, which has burned Zozobra every year since Will Shuster handed it to the Club. A trademark doesn't expire with age; it stays protected as long as it's used and renewed."},
   {k:["fan art","for myself","personal","gift","not selling","post","social media","draw","painting","costume","halloween"],
    a:"Drawing, painting or dressing up as Zozobra for yourself is fine. You need a license once you sell it, or use Zozobra to promote a business or product. If you're unsure, email " + EMAIL + "."},
   {k:["parody","fair use","satire","free speech","first amendment"],
    a:"General information, not legal advice:\n\nFair use and parody are narrow and depend on the facts, so only a lawyer can tell you whether they apply. Merchandise that uses the Zozobra name or image to sell a product needs a license, and the safest route is to apply through the " + APPLY + "."},
   {k:["photo","picture","photograph","my photos","pictures i took"],
    a:"Photos you take of Zozobra are your copyright, and you can share them. Putting Zozobra photos on products to sell (prints, shirts, calendars, mugs) needs a license, just like any other design."},
   {k:["nonprofit","school","church","library","city","county","state","agency","charity","fundraiser","free use"],
    a:"Free uses by nonprofits, schools and public agencies don't go through the license application. Email " + EMAIL + " and tell us what you'd like to do. We usually ask to see the image before it's final."},
   {k:["why","where does the money go","what does it support","scholarship","youth"],
    a:"The Kiwanis Club of Santa Fe owns Zozobra and protects it so it stays special for everyone. Part of every licensed sale supports the youth programs and scholarships Zozobra funds."},
   {k:["contact","email","phone","talk to","person","question"],
    a:"Email " + EMAIL + " with your name and what you'd like to make. To get started right away, use the " + APPLY + "."},
   {k:["hello","hi ","hey","good morning","good afternoon"],
    a:"Hi! Ask me anything about licensing Zozobra merchandise."},
   {k:["thank","thanks"],
    a:"You're welcome! We look forward to seeing your designs. ¡Viva el Viejo!"}
  ]
};

  chips:["¿Necesito licencia?","¿Cómo solicito?","Cuotas y comisión","Exención de cuota","Reglas de diseño","Aviso de marca","¿Cuánto dura?","¿Qué pasa después?","Derechos de autor vs. marca","™ y ®","¿Puedo registrar mi diseño?","Vender en ZozoFest o la quema","Vender sin licencia","Reportar a un infractor"],

  kb:[
   {k:["necesito licencia","necesito una licencia","quien necesita","permiso","puedo vender","vender zozobra","usar zozobra","usar el nombre","usar la imagen","es legal"],

   {k:["solicit","aplicar","como obtengo","formulario","empezar","inscrib"],

   {k:["cuota","costo","cuanto","comision","porcentaje","%","regalia","ganancia","pago","pagar"],

   {k:["reporte de ventas","reporte anual","fecha","15 de septiembre","auditoria"],

   {k:["regla","permitido","prohibido","no se puede","restriccion","rechaz","negad"],

   {k:["tema","vaquero","western","este ano","zozobra clasico"],

var L = (location.search.indexOf('lang=es') > -1) ? ES : EN;
var chat = document.getElementById('chat');

function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}

function answer(text){
  var q = ' ' + norm(text) + ' ', best = null, score = 0;
  for (var i=0;i<L.kb.length;i++){
    var s = 0;
    for (var j=0;j<L.kb[i].k.length;j++){
      var key = norm(L.kb[i].k[j]);
      var hit = key.trim().length <= 3 ? new RegExp('(^|[^a-z])' + key.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '([^a-z]|$)').test(q) : q.indexOf(key) > -1;
      if (hit) s += key.trim().length;
    }
    if (s > score){ score = s; best = L.kb[i]; }
  }
  return best ? best.a : L.fallback;
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rich(s){
  var h = esc(s);
  h = h.replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,})/g, '<a href="mailto:$1">$1</a>');
  return h;
}

function add(text, who){
  var d = document.createElement('div');
  d.className = 'msg ' + who;
  if (who === 'bot') d.innerHTML = rich(text); else d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function chips(){
  var box = document.getElementById('chips');
  box.innerHTML = '';
  L.chips.forEach(function(c){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = c;
    b.onclick = function(){ ask(c); };
    box.appendChild(b);
  });
}

function ask(text){
  add(text,'me');
  setTimeout(function(){ add(answer(text),'bot'); }, 280);
}

function paint(){
  document.getElementById('hdr').textContent = L.hdr;
  document.getElementById('lang').textContent = L.lang;
  document.getElementById('q').placeholder = L.ph;
  document.getElementById('send').textContent = L.send;
  document.getElementById('foot').innerHTML = L.foot;
  document.documentElement.lang = (L === ES) ? 'es' : 'en';
  chat.innerHTML = '';
  add(L.hello,'bot');
  chips();
}

document.getElementById('lang').onclick = function(){
  L = (L === EN) ? ES : EN;
  paint();
};

document.getElementById('f').onsubmit = function(e){
  e.preventDefault();
  var v = document.getElementById('q').value.trim();
  if (!v) return;
  document.getElementById('q').value = '';
  ask(v);
};

paint();
</script>
</body>
</html>
