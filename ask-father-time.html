header{padding:14px 16px 10px;background:rgba(255,251,244,.94);display:flex;align-items:center;gap:12px}
.glass{flex:0 0 44px;height:44px}
.ttl{flex:1;min-width:0}
h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:24px;line-height:1.05;margin:0;color:var(--night)}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.lang{display:flex;border:2px solid var(--night);border-radius:999px;overflow:hidden;flex:0 0 auto}
.lang button{border:0;background:transparent;font:700 13px 'Atkinson Hyperlegible',sans-serif;color:var(--night);padding:6px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--night);color:#fff}
.clock{margin:10px 16px 0;background:rgba(20,27,52,.82);border:1px solid rgba(242,181,68,.5);color:#fff;border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.clock b{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:22px;color:var(--gold);white-space:nowrap}
#log{flex:1;overflow-y:auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;line-height:1.5;font-size:16px}
.bot{background:rgba(255,255,255,.96);border:1px solid var(--sand2);box-shadow:0 2px 10px rgba(0,0,0,.25);border-bottom-left-radius:4px;align-self:flex-start}
.bot .who{display:block;font-family:'DM Serif Display',Georgia,serif;font-size:14px;color:var(--gold-dk);margin-bottom:2px}
.me{background:var(--ember);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);border-bottom-right-radius:4px;align-self:flex-end}
.bot a{color:var(--ember);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 8px}
.chips button{border:1.5px solid var(--gold);background:rgba(255,251,244,.95);color:var(--night);border-radius:999px;padding:6px 12px;font:14px 'Atkinson Hyperlegible',sans-serif;cursor:pointer}
.chips button:hover{background:var(--gold);border-color:var(--gold)}
form{display:flex;gap:8px;padding:10px 16px 26px}
input{border-color:rgba(255,255,255,.6)}
input{flex:1;min-width:0;border:2px solid var(--sand2);border-radius:999px;padding:11px 16px;font:16px 'Atkinson Hyperlegible',sans-serif;background:#fff;color:var(--ink)}
input:focus{outline:3px solid var(--gold);outline-offset:1px;border-color:var(--night)}
form button{border:0;background:var(--gold);color:#141B34;border-radius:999px;padding:0 18px;font:700 16px 'Atkinson Hyperlegible',sans-serif;cursor:pointer}
form button:hover{background:#fff}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.foot{font-size:11px;color:#D9DCE8;text-align:center;margin:-18px 0 10px}
@media (max-width:420px){h1{font-size:20px}.sub{display:none}}
</style>

 {k:['dog','dogs','pet','pets','perro','perros','mascota','mascotas'],

 {k:['ada','accessible','accessibility','wheelchair','disability','disabled','accesible','accesibilidad','silla de ruedas','discapacidad'],

 {k:['hopes','dreams','wish','wishes','banner','deseo','deseos','sueno','suenos','esperanza','manta'],

  es:'La Noche Vieja en la Plaza es una celebraci\u00f3n de la <b>Ciudad de Santa Fe</b> organizada por el <b>Kiwanis Club de Santa Fe</b>, los mismos voluntarios de la Quema de Zozobra. 2026 es la 12.\u00aa celebraci\u00f3n anual.'},

var WEAK=['where','donde','who','quien','when','cuando','time','hora','city','ciudad','help','ayudar','fire','plaza'];
function norm(s){return (' '+s+' ').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9:\s]/g,' ').replace(/\s+/g,' ');}
function answer(q){var n=norm(q),best=null,score=0;
 KB.forEach(function(e){var s=0;e.k.forEach(function(k){var kk=norm(k).trim();if(kk.indexOf(' ')>-1?n.indexOf(' '+kk+' ')>-1:n.indexOf(' '+kk+' ')>-1||(kk.length>4&&n.indexOf(kk)>-1))s+=(WEAK.indexOf(kk)>-1)?0.5:(kk.length>6?2:1);});if(s>score){score=s;best=e;}});
 return best?best[LANG]:UI[LANG].miss;}
var log=document.getElementById('log');
function add(html,who){var d=document.createElement('div');d.className='msg '+who;if(who==='bot'){d.innerHTML='<span class="who">'+(LANG==='es'?'Padre Tiempo':'Father Time')+'</span>'+html;}else{d.textContent=html;}log.appendChild(d);log.scrollTop=log.scrollHeight;}
function ask(q){q=q.trim();if(!q)return;add(q,'me');setTimeout(function(){add(answer(q),'bot');},250);}
function render(){var u=UI[LANG];document.documentElement.lang=LANG;
 document.getElementById('t-title').textContent=u.title;document.getElementById('t-sub').textContent=u.sub;
 document.getElementById('c-label').textContent=u.clock;document.getElementById('q').placeholder=u.ph;
 document.getElementById('q').setAttribute('aria-label',u.ph);document.getElementById('send').textContent=u.send;document.getElementById('foot').textContent=u.foot;
 document.getElementById('b-en').setAttribute('aria-pressed',LANG==='en');document.getElementById('b-es').setAttribute('aria-pressed',LANG==='es');
 var c=document.getElementById('chips');c.innerHTML='';u.chips.forEach(function(t){var b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=function(){ask(t);};c.appendChild(b);});
 log.innerHTML='';add(u.hello,'bot');tick();}
function tick(){var u=UI[LANG],target=new Date('2027-01-01T00:00:00-07:00').getTime(),now=Date.now(),ms=target-now,el=document.getElementById('c-val');
 if(ms<=0&&ms>-3600000){el.textContent=u.now;return;} if(ms<=0){el.textContent=u.past;return;}
 var d=Math.floor(ms/86400000),h=Math.floor(ms%86400000/3600000),m=Math.floor(ms%3600000/60000);
 el.textContent=d>0?(d+' '+u.d+', '+h+' '+u.h):(h+':'+String(m).padStart(2,'0'));}
document.getElementById('b-en').onclick=function(){LANG='en';render();};
document.getElementById('b-es').onclick=function(){LANG='es';render();};
document.getElementById('f').onsubmit=function(e){e.preventDefault();var i=document.getElementById('q');ask(i.value);i.value='';};
setInterval(tick,30000);render();
</script>
