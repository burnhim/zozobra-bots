<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the Vendor Desk · Kiwanis Club of Santa Fe</title>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Bitter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF6EC;--ink:#1E1A16;--red:#E8192B;--deep:#9E1420;--brown:#4A2412;--line:#E2D6C2;--orange:#E87722;--sand:#F3E7D0;}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:'Bitter',Georgia,serif;color:var(--ink);background:#FFFFFF;display:flex;flex-direction:column;}
#bg{position:fixed;inset:0;background:#FFFFFF url('https://burnhim.github.io/zozobra-bots/img/vendor-bg.jpg') center 58% / min(78vw,420px) no-repeat;opacity:.32;pointer-events:none;}
#bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 0;position:relative;z-index:2;flex:0 0 auto;}
#bar .t{display:flex;align-items:center;gap:8px;}
#bar .t img{width:38px;height:38px;object-fit:contain;}
#bar h1{font-family:'Rye',Georgia,serif;font-weight:400;font-size:20px;margin:0;color:var(--brown);}
#bar .r{display:flex;align-items:center;gap:10px;}
#bar button{background:var(--red);color:#fff;-webkit-text-fill-color:#fff;border:0;border-radius:16px;padding:7px 16px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
#bar button:hover{background:var(--deep);}
#ver{font-size:11px;font-weight:700;color:var(--deep);letter-spacing:.5px;}
#chat{flex:1 1 auto;overflow-y:auto;padding:16px;position:relative;z-index:1;}
.msg{max-width:88%;padding:12px 15px;border-radius:16px;margin-bottom:12px;line-height:1.55;font-size:15.5px;white-space:pre-line;}
.bot{background:#fff;border:2px solid var(--line);border-top-left-radius:4px;color:var(--ink);}
.me{background:var(--red);color:#fff;margin-left:auto;border-top-right-radius:4px;}
#chips{padding:0 16px 10px;display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1;flex:0 0 auto;}
#chips button{background:#fff;border:2px solid var(--red);color:var(--deep);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
#chips button:hover{background:var(--red);color:#fff;}
form{display:flex;gap:8px;padding:12px 16px;background:var(--brown);flex:0 0 auto;position:relative;z-index:1;}
input{flex:1;border:0;border-radius:24px;padding:12px 16px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff;}
form button{background:var(--orange);color:#fff;border:0;border-radius:24px;padding:12px 20px;font-weight:700;cursor:pointer;font-size:15px;font-family:inherit;}
form button:hover{background:var(--red);}
footer{background:var(--brown);color:#fff;-webkit-text-fill-color:#fff;text-align:center;font-size:11.5px;padding:0 16px 10px;position:relative;z-index:1;flex:0 0 auto;}
footer a{color:#FFD7A8;-webkit-text-fill-color:#FFD7A8;}
.bot a{color:var(--deep);-webkit-text-fill-color:var(--deep);font-weight:700;text-decoration:underline;word-break:break-word;}
</style>
</head>
<body>
<div id="bg"></div>
<div id="bar">
<span class="t"><img src="https://burnhim.github.io/zozobra-bots/img/vendor-logo.png" alt=""><h1 id="hdr">Ask the Vendor Desk</h1></span>
<span class="r"><span id="ver">v3</span><button id="lang" type="button">Español</button></span>
</div>
<div id="chat"></div>
<div id="chips"></div>
<form id="f" autocomplete="off">
<input id="q" placeholder="Ask about vending at our events…">
<button type="submit" id="send">Send</button>
</form>
<footer id="foot"></footer>

<script>
var APPLY = "[burnzozobra.com/vendors](https://burnzozobra.com/vendors)";
var EMAIL = "vendors@burnzozobra.com";

/* Official sources (checked Oct. 2026) */
var U = {
  tfe:"https://www.env.nm.gov/foodprogram/retail-food-application/",
  handler:"https://www.env.nm.gov/foodprogram/food-handler-and-food-manager-training/",
  homemade:"https://www.env.nm.gov/foodprogram/homemade-food-act/",
  nmedContact:"https://www.env.nm.gov/foodprogram/contact-us/",
  tap:"https://tap.state.nm.us/tap/",
  trdEvents:"https://www.tax.newmexico.gov/businesses/?p=730",
  cityLicense:"https://santafenm.gov/land-use/doing-business-with-the-city/new-business-license",
  fmo:"https://santafenm.gov/fire-department/fire-prevention-education",
  booth:"https://santafenm.gov/media/files/fire/SPECIAL_EVENT-FOOD_BOOTH_REQUIREMENT_%28UPDATED_2024%29.pdf",
  truck:"https://santafenm.gov/media/files/fire/Itinerant_Mobile_Food_Vendors_%28Updated_2024%29.pdf",
  parks:"https://santafenm.gov/media/files/public_works/Park_Rules_3-23-25.pdf",
  lp:"https://www.srca.nm.gov/parts/title19/19.15.0040.pdf",
  abc:"https://www.rld.nm.gov/abc/how-do-i/apply-for/special-events-permits-public-celebration-special-dispenser-tasting-permit/",
  wc:"https://workerscomp.nm.gov/node/49"
};
function L_(label,key){ return "[" + label + "](" + U[key] + ")"; }

var EN = {
  hdr:"Ask the Vendor Desk", lang:"Español", ph:"Ask about vending at our events…", send:"Send",
  foot:'Kiwanis Club of Santa Fe Vendor Program · <b>v3</b> · <a href="mailto:vendors@burnzozobra.com">vendors@burnzozobra.com</a>',
  hello:"Hi! I answer questions about being a vendor at New Year's Eve on the Santa Fe Plaza, the Fourth of July, and the Burning of Zozobra: fees, the deposit, deadlines, insurance, your State food permit, tax ID, the City license, fire and propane inspections, and what to bring.\n\nPuedes preguntarme en español también: toca el botón de arriba.",
  chips:["How do I apply?","Fees","Deposit","NMED food permit","Tax ID (CRS)","Fire & propane","Inspections","Insurance","Day-of checklist","Getting my deposit back"],
  fallback:"I'm not sure about that one. Try asking about fees, the deposit, deadlines, insurance, the NMED food permit, food handler cards, the tax ID, the City license, fire extinguishers, propane, generators, tents, inspections, alcohol, setup times or how to apply. For anything else, email " + EMAIL + " with your business name and the event.",
  kb:[
   {k:["apply","application","sign up","signup","register","how do i","become a vendor","be a vendor","get a booth","form"],
    a:"Apply, sign and pay online at " + APPLY + ".\n\nChoose your event, upload your documents, e-sign the vendor policies, the cleanup deposit terms and the Vendor Indemnification Agreement, and pay by card. It takes about 15 minutes.\n\nHave these ready first: your certificate of insurance, your New Mexico tax ID (CRS number), and, for food, your NMED permit or Temporary Food Establishment application. One application per event."},
   {k:["fee","fees","cost","price","how much","booth fee","pay","charge"],
    a:"Booth fees, plus a refundable cleanup deposit of 40% of the booth fee:\n\n• New Year's Eve on the Santa Fe Plaza: $500 + $200 deposit\n• Fourth of July: $700 + $280 deposit per booth\n• Burning of Zozobra: $1,450 + $580 deposit per booth\n• Zozobra, two or more booths: $1,400 + $560 deposit per booth\n• Zozobra nonprofit or agency information table: $500 + $200 deposit\n\nThe form shows the booth fee and the deposit separately before you pay.\n\nSeparate from our fees: the State charges $25 per event for a Temporary Food Establishment permit, and the Fire Department and State propane inspector collect their own inspection fees at the event."},
   {k:["coupon","promo","discount","code","waiver","waive"],
    a:"If the Kiwanis vendor team gave you a coupon code, enter it in the payment section of the form. A code lowers the booth fee and the deposit by the same percentage, and each code only works for its own event. We don't publish codes; ask " + EMAIL + " if you think you qualify."},
   {k:["multiple booth","multi","two booths","2 booths","more than one booth","several booths"],
    a:"At the Burning of Zozobra, vendors with two or more booths pay the multi-booth rate: $1,400 per booth plus a $560 deposit per booth. Enter the number of booths on the application and the form calculates it."},
   {k:["deposit","40%","40 percent","refundable"],
    a:"Every vendor pays a refundable cleanup deposit equal to 40% of the booth fee, charged with your booth fee when you apply.\n\nYou get it back, to the card you paid with, within 4 to 6 weeks after the City clears the spaces, if you leave your space clean. Ask me \"how do I get my deposit back?\" for the full list."},
   {k:["deposit back","get my deposit back","get my deposit","refund my deposit","deposit refund","when do i get","cleanup","clean up","clean","trash","waste","dumpster"],
    a:"To get your full deposit back, leave your space exactly as you found it:\n\n• No food waste or perishables, including ice and condiments\n• No paper or packaging waste\n• No boxes, cardboard, crates or pallets\n• No grease, oil, gray water or ice melt on the ground or down drains. Grease goes only in the barrels we provide\n• No stains or spills\n• No debris: zip ties, tape, cigarette butts, tar paper, mats\n• All your equipment out by the move-out deadline\n\nUse the vendor dumpsters, and never climb into one. Kiwanis may keep part or all of the deposit to cover cleanup. If the City or Parks charges us to clean your space or issues a fine, you pay those charges, even beyond your deposit.\n\nRefunds go to your card within 4 to 6 weeks. If too much time has passed for a card refund, we use the backup you chose on the form."},
   {k:["venmo","paypal","zelle","cash app","cashapp","apple pay"],
    a:"Deposits are refunded to the card you paid with. Only if too much time has passed for a card refund do we use the backup you picked on the form: Venmo, PayPal (fee applies), Cash App, Apple Pay or Zelle."},
   {k:["deadline","due","last day","too late","cutoff","cut off","late"],
    a:"Booth reservation deadlines:\n\n• Fourth of July: June 6, 2027\n• Burning of Zozobra: July 6, 2027\n• New Year's Eve on the Plaza: apply early. Space on the Plaza is limited.\n\nAfter a deadline we can't add vendors, because Kiwanis files the vendor list with the City at least 30 days before the event. Start your State permits early too."},
   {k:["when","date","dates","where","location","what events","which events","events","opportunit"],
    a:"Vendor opportunities:\n\n• New Year's Eve on the Santa Fe Plaza: Thursday, December 31, 2026\n• Fourth of July: Sunday, July 4, 2027, Franklin E. Miles Park\n• 103rd Burning of Zozobra: Friday, September 3, 2027, Fort Marcy Park\n\nArtisans for Día de los Muertos (Oct. 30–31, Santa Fe Plaza) sell through the Kiwanis merchandise booth. Details at " + APPLY + "."},
   {k:["insurance","coi","certificate of insurance","liability","additional insured","insured","auto policy","liquor liability"],
    a:"Every vendor needs a certificate of insurance for general liability, including nonprofits and info tables.\n\n• Certificate holder and additional insured: Kiwanis Club of Santa Fe, PO Box 622, Santa Fe, NM 87504\n• Also name the City of Santa Fe as additional insured\n\nMinimums starting with 2027 events:\n• General liability: $1,000,000 per occurrence / $2,000,000 aggregate\n• Food trucks and vehicles on site: $1,000,000 auto liability\n• Alcohol sales: $1,000,000 liquor liability\n\nYou upload it with your application, so ask your insurance agent a few days ahead."},
   {k:["crs","grt","gross receipts","tax number","tax id","btin","nmbtin","taxes","sales tax","tap"],
    a:"Every vendor that sells anything needs a New Mexico Business Tax ID (NMBTIN, still often called a CRS or GRT number). Out-of-state vendors too.\n\n• Register free online at " + L_("Taxpayer Access Point (TAP)","tap") + ": choose \"Apply for a Business Tax ID\" and check the \"Special Event\" box. It usually takes about one business day.\n• Tax isn't collected at the event. You file and pay gross receipts tax through TAP by the 25th of the month after the event.\n• Not filing can keep you out of future special events.\n\nDetails: " + L_("NM Taxation & Revenue, special event vendors","trdEvents") + ". Questions: 1-866-285-2996.\n\nInformation-only booths that sell nothing can type \"info only\" on our form."},
   {k:["business license","city license","license","special event license","licensing"],
    a:"The City of Santa Fe requires a Special Event License for every vendor. Kiwanis files it for the whole event: we send the City the list of approved vendors and their New Mexico tax IDs at least 30 days before the event. That's why your tax ID is required on our form, and why we can't add vendors after the deadline.\n\nYou also agree to file and pay gross receipts tax on your event sales. Display your license and your health permit at your booth.\n\nCity info: " + L_("City of Santa Fe business licensing","cityLicense") + "."},
   {k:["food permit","permit","nmed","tfe","temporary food","health permit","catering","environment department","health department","health inspector"],
    a:"Anyone serving food or drinks needs a permit from the New Mexico Environment Department (NMED), which covers Santa Fe:\n\n• Food trucks and caterers: your NMED Mobile or Catering permit. The City only accepts these two for trucks and caterers.\n• Everyone else: a Temporary Food Establishment (TFE) permit for the event. The fee is $25 per event (waived if you only sell foods that don't need temperature control, like packaged snacks).\n\nHow to get a TFE: download the application from " + L_("NMED's food permit page","tfe") + ", fill in your menu, equipment, handwashing and dishwashing setup, then call the Santa Fe field office at 505-827-1840 (2540 Camino Edward Ortiz, Mon–Fri 8–5). They explain how to submit, pay and schedule your inspection. There's no online portal, so start a few weeks ahead.\n\nThe person in charge of your booth must have a food handler card or food manager certificate before the permit is issued.\n\nUpload your permit with our application, or send it to " + EMAIL + ". Your booth isn't confirmed until we have it."},
   {k:["food handler","handler","food safety","food manager","cfpm","servsafe","certificate"],
    a:"At a temporary event, NMED requires the person in charge of your booth to hold a food handler card or be a Certified Food Protection Manager, before your permit is issued. Booths with a complex menu need a Certified Food Protection Manager.\n\nOther workers don't each need a card, but you must give them basic food safety training before they handle food and keep a record of it.\n\nCards come from ANSI-accredited courses (many are online) and last 3 years. List: " + L_("NMED food handler and manager training","handler") + ".\n\nUpload the certificates with our application, or email them to " + EMAIL + "."},
   {k:["homemade","home made","cottage","home kitchen","baked goods","bake","cookies","jam","from home"],
    a:"Under New Mexico's Homemade Food Act, you can sell some low-risk foods made in your home kitchen at festivals without an NMED permit: baked goods without cream fillings, candy, popcorn, dried fruit, granola, roasted coffee, and high-sugar jams.\n\n• You need a food handler card before you start making it.\n• Label every item (or post a sign): \"This product is home produced and is exempt from state licensing and inspection. This product may contain allergens.\" plus your name, address, phone, email and ingredients.\n• Not allowed from home: meat or jerky, salsa, cut produce, dairy, canned or pickled goods, pepper jelly, cream or cheesecake items, drinks.\n\nDetails: " + L_("NMED Homemade Food Act","homemade") + ". You still need our application, insurance and a tax ID."},
   {k:["food truck","truck","trailer","mobile","mobile unit","commissary","servicing area"],
    a:"Food trucks and trailers need:\n\n• Your NMED Mobile food permit (displayed). Trucks that aren't self-contained must use a New Mexico servicing area for cleaning, water and waste.\n• A hood with an automatic fire-suppression system if you cook commercially.\n• A 2A:10BC extinguisher, plus a Class K if you fry, serviced and tagged within the year.\n• Propane tanks outside the truck or in a vented compartment, 5 ft from your main exit, with a \"NO SMOKING\" sign in 4-inch letters.\n• Refuel generators at least 20 ft from the truck and never where the public is.\n• $1,000,000 auto liability (2027 events).\n\nA truck parked at the event more than 24 hours also has to meet the food booth rules. City rules: " + L_("Mobile food vendor fire requirements","truck") + "."},
   {k:["handwash","hand wash","wash hands","handwashing","sink","sanitizer","sanitize","dishes","dishwashing","3 compartment","three compartment","utensils","gloves","bare hand","thermometer","temperature","hot holding","cold holding","booth setup","floor","flooring","canopy","cover"],
    a:"What NMED looks for at a temporary food booth:\n\n• Handwashing: a container with a turn-on spigot, warm water (at least 100°F), a catch bucket, liquid soap, paper towels and a trash can.\n• Dishwashing: wash, rinse and sanitize in three basins (or bring enough extra utensils for short events), with chlorine, quat or iodine sanitizer and test strips.\n• No bare hands on ready-to-eat food: use tongs, deli paper or gloves.\n• Anyone taking money doesn't handle food at the same time.\n• Thermometers to check food. Keep cold food at 41°F or colder and hot food at 135°F or hotter. Ice chests and slow cookers can't hot-hold.\n• A weather-resistant cover over food areas and a cleanable floor surface.\n• Ice used to chill food can't be served as food.\n\nFull application and rules: " + L_("NMED temporary food permit","tfe") + "."},
   {k:["alcohol","beer","wine","liquor","spirits","beer garden","brewery","distiller","dispenser"],
    a:"Only businesses that already hold a New Mexico liquor license can sell alcohol at an event; there's no one-time permit for others.\n\n• Dispenser license holders: Special Dispenser Permit, $50 per day, filed through NM-PLUS at least 10 days before the event.\n• NM small brewers, winegrowers and craft distillers: Public Celebration Permit, $10 per day, at least 10 days ahead.\n• Everyone serving needs a current New Mexico alcohol server permit.\n• Plan on about 1 security person per 100 attendees, and an enclosed serving area.\n• 2027 events: $1,000,000 liquor liability insurance.\n\nOn our form choose \"Alcohol\" as your vendor type to upload your license and security plan. State rules: " + L_("NM Alcoholic Beverage Control special event permits","abc") + "."},
   {k:["extinguisher","class k","k class","fire blanket","first aid","fryer","fry","deep fry","oil"],
    a:"City fire rules for food booths:\n\n• One 2A-10BC fire extinguisher in every food booth.\n• Frying: one Class K extinguisher for up to 4 fryers, plus one more for each additional 4. Keep 16 inches or an 8-inch steel baffle between a fryer and other burners.\n• Extinguishers must have an inspection tag from the last 12 months (or the receipt, if new).\n• A fire blanket and a first-aid kit in every booth.\n\nFull list: " + L_("City food booth fire requirements","booth") + "."},
   {k:["propane","lp","lpg","gas","tank","cylinder","bottle"],
    a:"Propane rules (State LP Gas Bureau and City Fire Department):\n\n• Tanks go outside your booth, upright and chained or strapped so they can't fall.\n• Tanks white or aluminum, no heavy rust or dents. Cylinders over 12 years old need a requalification date.\n• One spare tank only; remove empties right away.\n• At least 5 ft from any ignition source and 10 ft from building doors and windows.\n• Approved LP hoses only, kept out of foot traffic, and a shut-off valve you can reach at each appliance.\n• Leak-test with soapy water every day before opening and after every tank change.\n• No refilling at your booth.\n\nThe State propane inspector checks your setup at the event and collects a fee, so bring cash. Rules: " + L_("NM LP gas rule (19.15.40, special events)","lp") + "."},
   {k:["generator","power","electric","electricity","fuel","gasoline"],
    a:"Generators:\n\n• Keep them away from the public and at least 10 ft from anything that can burn.\n• Store fuel at least 20 ft away, and refuel away from the public. No gas cans near booths.\n• Put a grill mat or concrete board under the generator.\n• No generators running overnight (City noise ordinance).\n\nList every generator on your application; the Fire Department counts them. " + L_("City food booth fire requirements","booth") + "."},
   {k:["tent","stake","stakes","staking","weights","canopy","tar paper","flame retardant","nfpa"],
    a:"Tents and booths:\n\n• No stakes. City Park Rule 6H bans staking in parks and on the Plaza. Use weights on every leg; buckets of sand or water with lids work.\n• Tents must be flame-retardant (NFPA 701 tag or certificate).\n• Tar paper (or a non-flammable equivalent) under your whole booth, and a grill mat or concrete board (like HardieBacker or WonderBoard) under cooking equipment and generators.\n• No gas heaters inside tents; decorations 6 ft from heat sources.\n• Keep displays and signs inside your space, not in walkways.\n\n" + L_("City park rules","parks") + " · " + L_("City food booth fire requirements","booth")},
   {k:["grill","charcoal","wood","smoker","bbq","barbecue","open flame","fire pit"],
    a:"Charcoal and wood cooking follow City fire rules: keep ash in a lidded fire-resistant container, keep pits and smokers 10 ft from anything that can burn, and never put them under a canopy. The Fire Marshal can limit open flame during burn restrictions.\n\nNo grilling in the park on the Fourth of July."},
   {k:["spacing","fire lane","distance","hydrant","next to","how far"],
    a:"The Fire Department sets spacing. Cooking booths need 20 ft from other booths (10 ft where space is tight), fire lanes stay at least 20 ft wide, and hydrants stay clear. That's why booth locations can change on site: the Fire Marshal's direction always overrides the planned map."},
   {k:["inspection","inspections","inspector","inspect","fire marshal","fire department","fire inspection"],
    a:"On event day, food and cooking booths are inspected before you can serve:\n\n1. City Fire inspection (fee paid directly to the inspector).\n2. State LP gas inspection, if you use propane (bring cash).\n3. NMED food inspection for your permit.\n4. City inspection.\n\nYou may start serving once every authority approves you. At Zozobra, booths must be fully set by 8 AM and inspections start around 9–10 AM; on the Fourth of July, booths are set by 1 PM. Exact times come in the \"Must Read\" email.\n\nFire Marshal's office: 505-955-3310, " + L_("Fire Prevention","fmo") + "."},
   {k:["checklist","bring","what to bring","what do i need","day of","pack","supplies"],
    a:"Day-of checklist:\n\n☐ Business license and NMED permit, displayed\n☐ Fire extinguisher (2A-10BC; Class K if you fry), tagged\n☐ Fire blanket and first-aid kit\n☐ Tent weights (no stakes) and tar paper for the whole booth\n☐ Grill mats or concrete board under cooking gear and generators\n☐ Handwashing station, soap, paper towels, catch bucket\n☐ Three basins, sanitizer and test strips; thermometer; gloves or tongs\n☐ Cash for the propane inspection, payment for the fire inspection\n☐ Caution tape for trailer tongues, cords and other hazards\n☐ Clear bags (security screens everyone)\n☐ Wagon or hand truck\n☐ Trash bags; grease goes in our barrels\n\nWe also strongly encourage compostable plates, cups and utensils."},
   {k:["water","potable","ice","grease barrel","gray water","grey water"],
    a:"At Zozobra, potable water comes from the water truck in the Fort Marcy Complex parking lot, and if you ordered ice, we send the ice-truck code Friday morning (no one under 18 on the truck). Grease barrels are provided at every event.\n\nNever dump grease, gray water or ice melt on the ground or into drains. That's a City and NMED rule and it costs you your deposit."},
   {k:["bag","bags","plastic","styrofoam","foam","compostable","biodegradable","straw"],
    a:"The City of Santa Fe bans single-use plastic carryout bags, so use paper or reusable bags. We strongly encourage compostable or biodegradable plates, cups and utensils (US Foods and Sysco New Mexico carry them)."},
   {k:["security","clear bag","screening","search"],
    a:"All vendors and staff can be screened by security at any time, and you must use clear bags or backpacks during the event. Wear your vendor credential bracelet the whole time."},
   {k:["approve","approval","approved","accepted","hear back","decision","confirm","confirmation"],
    a:"Applying is not approval. Our Vendor Chair reviews every application. Once you're approved, we email your booth assignment, the vendor credential link for your staff, and parking details.\n\nIf we can't approve your application, we refund your payment in full."},
   {k:["cancel","refund booth","booth fee back","rain","weather","can't make it","cant make it","withdraw"],
    a:"Every event is rain or shine. Booth fees are not refundable once your booth is approved, and Kiwanis isn't responsible for unused product or lost sales. If we can't approve your application, you get a full refund. For anything else, email " + EMAIL + "."},
   {k:["placement","spot","booth location","where will i be","where will my booth","my booth be","which spot","assigned","map","booth number","space"],
    a:"No particular space is guaranteed. The Fire Marshal's direction always overrides the planned map, because safety and security come first. Your booth assignment comes in your approval email and in the \"Must Read\" email before the event."},
   {k:["setup","set up","load in","load-in","load out","move out","teardown","tear down","arrive","what time","drive","grass"],
    a:"Setup times are in the \"Must Read\" email we send before each event. In general:\n\n• Zozobra: load-in is Wednesday afternoon and Thursday of event week; only food and perishables come in Friday. Booths are set by 8 AM Friday, and everything is out by noon Saturday.\n• Fourth of July: booths are set by 1 PM, when inspections begin.\n\nNever drive on grass or sidewalks. Move extra vehicles to the lots right away, and no vehicle moves after the event until law enforcement clears it."},
   {k:["parking","park","credential","wristband","staff pass","passes","bracelet"],
    a:"Once you're approved, we send a vendor credential link for each person staffing your booth, plus your vendor parking details. Vendors have their own lot with a limited number of passes. Bracelets are handed out during setup."},
   {k:["nonprofit","non-profit","agency","information table","info table","informational","giveaway","giveaways","handout","handouts","flyer","flyers","litter","qr code","swag","free stuff","give away","hand out","t-shirt","t-shirts","promo items"],
    a:"Nonprofits and agencies can have an information table at the Burning of Zozobra for $500 plus a $200 refundable deposit. You still need insurance.\n\nInformation booths follow the City's litter-free ordinance:\n• We discourage paper handouts of any kind. Share information with a QR code instead.\n• Any giveaway or handout needs our approval in advance. The application asks what you plan to hand out or give away, so tell us there."},
   {k:["dia","día","muertos","artisan","consign","consignment","merchandise booth","plaza vendor"],
    a:"For Día de los Muertos on the Plaza (Oct. 30–31), City ordinance allows one merchandise booth, and that's the Kiwanis booth. Artisans can sell work to us outright or consign it with us. Email merchandise@burnzozobra.com."},
   {k:["sponsor","sponsorship","activation","brand","advertise"],
    a:"Want an activation space rather than a vending booth? Start with a sponsorship: [burnzozobra.com/sponsors](https://burnzozobra.com/sponsors)."},
   {k:["outside","cerrillos","street","sidewalk","outside the venue","outside the park"],
    a:"Please sell only inside the event. Approved vendors who set up outside the venue to sell to attendees can be barred from future events, and the City can fine us when it happens."},
   {k:["indemnity","indemnification","agreement","sign","signature","contract"],
    a:"You e-sign everything in the application: the vendor policies, the cleanup deposit terms, the workers' compensation notice and the Vendor Indemnification Agreement. There's nothing to sign separately later."},
   {k:["workers comp","workers' comp","workers compensation","employees","staff","employee"],
    a:"New Mexico requires workers' compensation coverage for any business with 3 or more workers. Owners who work in the business, family members, and part-time, temporary and seasonal workers all count toward the three.\n\nDetails: " + L_("NM Workers' Compensation Administration","wc") + " or (505) 841-6851."},
   {k:["card","credit","debit","check","cash","payment method","how do i pay"],
    a:"You pay by credit or debit card when you submit the application. Payments are processed securely by Stripe for the Kiwanis Club of Santa Fe."},
   {k:["contact","email","phone","talk to","question","help","person","human"],
    a:"Email the vendor team at " + EMAIL + ". Please include your business name and the event you're asking about."},
   {k:["hi","hello","hola","hey"],
    a:"Hi! Ask me anything about vending at New Year's Eve, the Fourth of July or the Burning of Zozobra."},
   {k:["thank","thanks"],
    a:"You're welcome! We hope to see your booth at the event. ¡Viva el Viejo!"}
  ]
};

var ES = {
  hdr:"Pregunta a Vendedores", lang:"English", ph:"Pregunta sobre vender en nuestros eventos…", send:"Enviar",
  foot:'Programa de Vendedores del Kiwanis Club of Santa Fe · <b>v3</b> · <a href="mailto:vendors@burnzozobra.com">vendors@burnzozobra.com</a>',
  hello:"¡Hola! Respondo preguntas sobre ser vendedor en la Víspera de Año Nuevo en la Plaza de Santa Fe, el Cuatro de Julio y la Quema de Zozobra: tarifas, el depósito, fechas límite, seguro, tu permiso estatal de comida, número de impuestos, la licencia de la Ciudad, inspecciones de bomberos y propano, y qué traer.\n\nYou can switch to English with the button above.",
  chips:["¿Cómo solicito?","Tarifas","Depósito","Permiso de NMED","Número CRS","Bomberos y propano","Inspecciones","Seguro","Lista del día","Recuperar mi depósito"],
  fallback:"No estoy seguro de eso. Pregúntame sobre tarifas, el depósito, fechas límite, seguro, el permiso de NMED, tarjetas de manejo de alimentos, el número de impuestos, la licencia de la Ciudad, extintores, propano, generadores, carpas, inspecciones, alcohol, horarios de montaje o cómo solicitar. Para cualquier otra cosa, escribe a " + EMAIL + " con el nombre de tu negocio y el evento.",
  kb:[
   {k:["solicitar","solicito","solicitud","aplicar","inscrib","registr","como","ser vendedor","puesto","formulario"],
    a:"Solicita, firma y paga en línea en " + APPLY + ".\n\nElige tu evento, sube tus documentos, firma electrónicamente las políticas, los términos del depósito de limpieza y el Acuerdo de Indemnización, y paga con tarjeta. Toma unos 15 minutos.\n\nTen listo primero: tu certificado de seguro, tu número de impuestos de Nuevo México (CRS) y, si vendes comida, tu permiso de NMED o tu solicitud de Establecimiento Temporal de Comida. Una solicitud por evento. El formulario está en inglés; si necesitas ayuda, escribe a " + EMAIL + "."},
   {k:["tarifa","tarifas","costo","precio","cuanto","cuánto","pagar","cobr"],
    a:"Tarifas por puesto, más un depósito reembolsable de limpieza del 40% de la tarifa:\n\n• Víspera de Año Nuevo en la Plaza: $500 + $200 de depósito\n• Cuatro de Julio: $700 + $280 de depósito por puesto\n• Quema de Zozobra: $1,450 + $580 de depósito por puesto\n• Zozobra, dos o más puestos: $1,400 + $560 de depósito por puesto\n• Mesa informativa para organizaciones en Zozobra: $500 + $200 de depósito\n\nEl formulario muestra la tarifa y el depósito por separado antes de pagar.\n\nAparte de nuestras tarifas: el Estado cobra $25 por evento por el permiso de Establecimiento Temporal de Comida, y Bomberos y el inspector estatal de propano cobran sus propias inspecciones en el evento."},
   {k:["cupon","cupón","codigo","código","descuento","promo"],
    a:"Si el equipo de vendedores de Kiwanis te dio un código de cupón, escríbelo en la sección de pago del formulario. El código baja la tarifa y el depósito en el mismo porcentaje, y cada código solo funciona para su evento. No publicamos códigos; escribe a " + EMAIL + " si crees que calificas."},
   {k:["varios puestos","dos puestos","mas de un puesto","más de un puesto"],
    a:"En la Quema de Zozobra, los vendedores con dos o más puestos pagan $1,400 por puesto más $560 de depósito por puesto. Escribe el número de puestos en la solicitud y el formulario lo calcula."},
   {k:["deposito","depósito","40%","reembolsable"],
    a:"Cada vendedor paga un depósito reembolsable de limpieza igual al 40% de la tarifa del puesto, que se cobra junto con la tarifa al solicitar.\n\nSe reembolsa a tu tarjeta de 4 a 6 semanas después de que la Ciudad revise los espacios, si dejas tu espacio limpio. Pregúntame \"¿cómo recupero mi depósito?\" para ver la lista completa."},
   {k:["recupero mi deposito","recuperar mi deposito","recuper","devolver","devolucion","devolución","reembolso","limpieza","limpio","basura","desperdicio","contenedor"],
    a:"Para recuperar todo tu depósito, deja tu espacio tal como lo encontraste:\n\n• Sin restos de comida ni perecederos, incluido hielo y condimentos\n• Sin papel ni empaques\n• Sin cajas, cartón, huacales ni tarimas\n• Sin grasa, aceite, aguas grises ni hielo derretido en el suelo o en las coladeras. La grasa va solo en los barriles que proporcionamos\n• Sin manchas ni derrames\n• Sin basura: cinchos, cinta, colillas, papel de techar, tapetes\n• Todo tu equipo fuera antes de la hora límite\n\nUsa los contenedores para vendedores y nunca te metas en uno. Kiwanis puede quedarse con parte o todo el depósito para cubrir la limpieza. Si la Ciudad o Parques nos cobra o pone una multa, tú pagas esos cargos, aunque superen tu depósito.\n\nLos reembolsos van a tu tarjeta en 4 a 6 semanas. Si pasó demasiado tiempo, usamos la opción que elegiste en el formulario."},
   {k:["venmo","paypal","zelle","cash app","apple pay"],
    a:"Los depósitos se reembolsan a la tarjeta con la que pagaste. Solo si pasó demasiado tiempo usamos la opción que elegiste en el formulario: Venmo, PayPal (con comisión), Cash App, Apple Pay o Zelle."},
   {k:["fecha limite","fecha límite","fechas limite","fechas límite","plazo","ultimo dia","último día","tarde"],
    a:"Fechas límite para reservar puesto:\n\n• Cuatro de Julio: 6 de junio de 2027\n• Quema de Zozobra: 6 de julio de 2027\n• Víspera de Año Nuevo en la Plaza: solicita pronto, el espacio es limitado.\n\nDespués de la fecha límite no podemos agregar vendedores, porque Kiwanis entrega la lista a la Ciudad al menos 30 días antes del evento. Empieza también tus permisos estatales con tiempo."},
   {k:["cuando","cuándo","fecha","fechas","donde","dónde","eventos","oportunidad"],
    a:"Oportunidades para vendedores:\n\n• Víspera de Año Nuevo en la Plaza de Santa Fe: jueves 31 de diciembre de 2026\n• Cuatro de Julio: domingo 4 de julio de 2027, Franklin E. Miles Park\n• 103.ª Quema de Zozobra: viernes 3 de septiembre de 2027, Fort Marcy Park\n\nLos artesanos del Día de los Muertos (30 y 31 de octubre, Plaza de Santa Fe) venden a través del puesto de mercancía de Kiwanis. Detalles en " + APPLY + "."},
   {k:["seguro","coi","certificado de seguro","responsabilidad","asegurado"],
    a:"Todo vendedor necesita un certificado de seguro de responsabilidad civil general, incluidas las mesas informativas.\n\n• Titular del certificado y asegurado adicional: Kiwanis Club of Santa Fe, PO Box 622, Santa Fe, NM 87504\n• Nombra también a la Ciudad de Santa Fe (City of Santa Fe) como asegurado adicional\n\nMínimos a partir de los eventos de 2027:\n• Responsabilidad general: $1,000,000 por incidente / $2,000,000 en total\n• Food trucks y vehículos en el sitio: $1,000,000 de seguro de auto\n• Venta de alcohol: $1,000,000 de responsabilidad por licores\n\nLo subes con tu solicitud; pídelo a tu agente con unos días de anticipación."},
   {k:["crs","grt","impuesto","impuestos","ingresos brutos","numero de impuesto","número de impuesto","btin","tap"],
    a:"Todo vendedor que venda algo necesita un número de identificación fiscal de negocios de Nuevo México (NMBTIN, que muchos todavía llaman número CRS o GRT). También los vendedores de otros estados.\n\n• Regístrate gratis en " + L_("Taxpayer Access Point (TAP)","tap") + ": elige \"Apply for a Business Tax ID\" y marca la casilla \"Special Event\". Normalmente tarda un día hábil.\n• El impuesto no se cobra en el evento. Declaras y pagas el impuesto sobre ingresos brutos en TAP a más tardar el día 25 del mes siguiente al evento.\n• Si no declaras, puedes quedar fuera de futuros eventos especiales.\n\nDetalles: " + L_("Impuestos de NM, vendedores de eventos especiales","trdEvents") + ". Preguntas: 1-866-285-2996.\n\nLas mesas solo informativas que no venden nada pueden escribir \"info only\"."},
   {k:["licencia","licencia de negocio","licencia de la ciudad"],
    a:"La Ciudad de Santa Fe exige una Licencia de Evento Especial para cada vendedor. Kiwanis la tramita para todo el evento: enviamos a la Ciudad la lista de vendedores aprobados con sus números de impuestos al menos 30 días antes. Por eso tu número de impuestos es obligatorio y no podemos agregar vendedores después de la fecha límite.\n\nTambién te comprometes a declarar y pagar el impuesto sobre tus ventas. Exhibe tu licencia y tu permiso de salud en tu puesto.\n\nInformación: " + L_("Licencias de la Ciudad de Santa Fe","cityLicense") + "."},
   {k:["permiso","nmed","tfe","comida temporal","salud","catering","medio ambiente","inspector de salud"],
    a:"Quien sirva comida o bebida necesita un permiso del Departamento del Medio Ambiente de Nuevo México (NMED), que cubre Santa Fe:\n\n• Food trucks y servicios de catering: tu permiso Móvil o de Catering de NMED. La Ciudad solo acepta estos dos para ellos.\n• Todos los demás: un permiso de Establecimiento Temporal de Comida (TFE) para el evento. Cuesta $25 por evento (gratis si solo vendes alimentos que no necesitan control de temperatura, como botanas empacadas).\n\nCómo obtenerlo: descarga la solicitud en " + L_("la página de permisos de NMED","tfe") + ", llena tu menú, equipo, lavado de manos y de trastes, y llama a la oficina de Santa Fe al 505-827-1840 (2540 Camino Edward Ortiz, lunes a viernes de 8 a 5). Te explican cómo entregarla, pagar y programar la inspección. No hay portal en línea, así que empieza con unas semanas de anticipación.\n\nLa persona a cargo de tu puesto debe tener tarjeta de manejo de alimentos o certificado de gerente antes de que se emita el permiso.\n\nSube tu permiso con nuestra solicitud o envíalo a " + EMAIL + "."},
   {k:["manipulador","manejo de alimentos","certificado de alimentos","tarjeta de alimentos","gerente de alimentos"],
    a:"En un evento temporal, NMED exige que la persona a cargo del puesto tenga tarjeta de manejo de alimentos o sea Gerente Certificado en Protección de Alimentos, antes de que se emita el permiso. Los puestos con menú complejo necesitan un Gerente Certificado.\n\nLos demás trabajadores no necesitan tarjeta, pero debes darles una capacitación básica antes de manejar comida y guardar constancia.\n\nLas tarjetas vienen de cursos acreditados por ANSI (muchos en línea) y duran 3 años: " + L_("capacitación de NMED","handler") + "."},
   {k:["casero","casera","hecho en casa","cocina de casa","pan","galletas","mermelada","postres"],
    a:"Con la Ley de Alimentos Caseros de Nuevo México puedes vender en festivales algunos alimentos de bajo riesgo hechos en tu cocina, sin permiso de NMED: pan y repostería sin relleno de crema, dulces, palomitas, fruta seca, granola, café tostado y mermeladas con mucha azúcar.\n\n• Necesitas tarjeta de manejo de alimentos antes de empezar.\n• Etiqueta cada producto (o pon un letrero) con la frase en inglés que exige el Estado, más tu nombre, dirección, teléfono, correo e ingredientes.\n• No se permite hacer en casa: carne o cecina, salsa, fruta picada, lácteos, enlatados o encurtidos, jalea de chile, postres con crema, bebidas.\n\nDetalles: " + L_("Ley de Alimentos Caseros (NMED)","homemade") + ". Igual necesitas nuestra solicitud, seguro y número de impuestos."},
   {k:["food truck","troca","camion","camión","remolque","trailer","movil","móvil"],
    a:"Los food trucks y remolques necesitan:\n\n• Tu permiso Móvil de NMED (a la vista). Si no es autónomo, debe usar un área de servicio en Nuevo México para limpieza, agua y desechos.\n• Campana con sistema automático contra incendios si cocinas comercialmente.\n• Un extintor 2A:10BC y uno Clase K si fríes, con revisión y etiqueta del último año.\n• Tanques de propano fuera del camión o en compartimiento ventilado, a 5 pies de la salida principal, con letrero \"NO SMOKING\" de 4 pulgadas.\n• Cargar gasolina al generador a 20 pies o más del camión y nunca donde esté el público.\n• $1,000,000 de seguro de auto (eventos de 2027).\n\nReglas de la Ciudad: " + L_("requisitos de bomberos para food trucks","truck") + "."},
   {k:["lavar manos","lavado de manos","lavamanos","desinfect","trastes","tres tinas","guantes","termometro","termómetro","temperatura","piso","toldo","cubierta"],
    a:"Lo que revisa NMED en un puesto temporal de comida:\n\n• Lavado de manos: recipiente con llave, agua tibia (al menos 100°F), cubeta para el agua usada, jabón líquido, toallas de papel y bote de basura.\n• Trastes: lavar, enjuagar y desinfectar en tres tinas (o traer suficientes utensilios extra en eventos cortos), con cloro, cuaternario o yodo y tiras de prueba.\n• Nada de manos desnudas con comida lista: usa pinzas, papel o guantes.\n• Quien cobra no maneja comida al mismo tiempo.\n• Termómetro. Comida fría a 41°F o menos y caliente a 135°F o más. Las hieleras y ollas lentas no sirven para mantener caliente.\n• Cubierta contra el clima sobre la comida y piso fácil de limpiar.\n• El hielo para enfriar comida no se sirve.\n\nSolicitud y reglas: " + L_("permiso temporal de NMED","tfe") + "."},
   {k:["alcohol","cerveza","vino","licor","cerveceria","cervecería","destiler"],
    a:"Solo los negocios que ya tienen licencia de licores de Nuevo México pueden vender alcohol en un evento; no hay permiso de una sola vez para otros.\n\n• Licencia de Dispenser: Permiso Especial de Dispenser, $50 por día, por NM-PLUS al menos 10 días antes.\n• Cerveceros, vinicultores y destiladores artesanales de NM: Permiso de Celebración Pública, $10 por día, al menos 10 días antes.\n• Todo quien sirva necesita permiso vigente de servidor de alcohol de NM.\n• Calcula 1 persona de seguridad por cada 100 asistentes y un área cercada.\n• Eventos de 2027: $1,000,000 de seguro de responsabilidad por licores.\n\nEn el formulario elige \"Alcohol\". Reglas estatales: " + L_("permisos de eventos especiales de ABC","abc") + "."},
   {k:["extintor","clase k","manta","botiquin","botiquín","freidora","freir","freír","aceite"],
    a:"Reglas de bomberos de la Ciudad para puestos de comida:\n\n• Un extintor 2A-10BC en cada puesto de comida.\n• Si fríes: un extintor Clase K por cada 4 freidoras. Deja 16 pulgadas o una barrera de acero de 8 pulgadas entre la freidora y otros quemadores.\n• Etiqueta de inspección de los últimos 12 meses (o el recibo, si es nuevo).\n• Manta contra incendios y botiquín en cada puesto.\n\nLista completa: " + L_("requisitos de bomberos para puestos","booth") + "."},
   {k:["propano","gas","tanque","cilindro"],
    a:"Reglas de propano (Oficina Estatal de Gas LP y Bomberos de la Ciudad):\n\n• Tanques fuera del puesto, de pie y encadenados o sujetos para que no se caigan.\n• Tanques blancos o de aluminio, sin óxido ni abolladuras fuertes. Los cilindros de más de 12 años necesitan fecha de recalificación.\n• Solo un tanque de repuesto; retira los vacíos de inmediato.\n• A 5 pies de cualquier fuente de ignición y a 10 pies de puertas y ventanas.\n• Mangueras aprobadas para gas LP, fuera del paso, y válvula de cierre accesible en cada aparato.\n• Prueba de fugas con agua jabonosa cada día antes de abrir y después de cambiar tanque.\n• No se rellenan tanques en tu puesto.\n\nEl inspector estatal revisa tu instalación en el evento y cobra, así que trae efectivo. Reglas: " + L_("regla de gas LP de NM","lp") + "."},
   {k:["generador","electricidad","luz","combustible","gasolina"],
    a:"Generadores:\n\n• Lejos del público y a 10 pies de cualquier cosa que pueda quemarse.\n• Combustible guardado a 20 pies y carga lejos del público. Sin bidones de gasolina cerca de los puestos.\n• Tapete o placa de concreto debajo del generador.\n• No se dejan prendidos de noche (ordenanza de ruido).\n\nAnota cada generador en tu solicitud; Bomberos los cuenta. " + L_("requisitos de bomberos","booth")},
   {k:["carpa","toldo","estacas","pesas","papel de techar","retardante"],
    a:"Carpas y puestos:\n\n• Sin estacas. La Regla 6H de Parques las prohíbe en parques y en la Plaza. Usa pesas en cada pata; cubetas con arena o agua y tapa funcionan.\n• Carpas retardantes de fuego (etiqueta o certificado NFPA 701).\n• Papel de techar (o equivalente no inflamable) bajo todo el puesto, y tapete o placa de concreto bajo el equipo de cocina y generadores.\n• Sin calentadores de gas dentro de carpas; adornos a 6 pies de fuentes de calor.\n• Exhibiciones y letreros dentro de tu espacio, no en los pasillos.\n\n" + L_("reglas de parques","parks") + " · " + L_("requisitos de bomberos","booth")},
   {k:["parrilla","asar","carbon","carbón","leña","ahumador","fuego abierto"],
    a:"Cocinar con carbón o leña sigue las reglas de bomberos: ceniza en un recipiente con tapa resistente al fuego, asadores y ahumadores a 10 pies de cualquier cosa que pueda quemarse y nunca bajo un toldo. Bomberos puede limitar el fuego abierto durante restricciones.\n\nNo se permite asar en el parque el Cuatro de Julio."},
   {k:["distancia","carril","hidrante","separacion","separación"],
    a:"Bomberos define la distancia. Los puestos de cocina necesitan 20 pies de otros puestos (10 pies si falta espacio), los carriles de bomberos quedan de al menos 20 pies y los hidrantes despejados. Por eso la ubicación puede cambiar en el sitio: la indicación del Jefe de Bomberos siempre manda."},
   {k:["inspeccion","inspección","inspecciones","inspector","bomberos"],
    a:"El día del evento, los puestos de comida y cocina se inspeccionan antes de servir:\n\n1. Inspección de Bomberos de la Ciudad (pagas directo al inspector).\n2. Inspección estatal de gas LP, si usas propano (trae efectivo).\n3. Inspección de comida de NMED para tu permiso.\n4. Inspección de la Ciudad.\n\nPuedes empezar a servir cuando todas las autoridades te aprueben. En Zozobra los puestos deben estar listos a las 8 a.m. y las inspecciones empiezan entre 9 y 10 a.m.; el Cuatro de Julio, listos a la 1 p.m. Los horarios exactos llegan en el correo \"Must Read\".\n\nOficina del Jefe de Bomberos: 505-955-3310, " + L_("Prevención de Incendios","fmo") + "."},
   {k:["lista","traer","que traer","qué traer","que necesito","qué necesito","dia del evento","día del evento"],
    a:"Lista para el día del evento:\n\n☐ Licencia y permiso de NMED a la vista\n☐ Extintor (2A-10BC; Clase K si fríes) con etiqueta\n☐ Manta contra incendios y botiquín\n☐ Pesas para carpa (sin estacas) y papel de techar para todo el puesto\n☐ Tapetes o placas de concreto bajo cocina y generadores\n☐ Estación de lavado de manos, jabón, toallas de papel, cubeta\n☐ Tres tinas, desinfectante y tiras de prueba; termómetro; guantes o pinzas\n☐ Efectivo para la inspección de propano y pago para bomberos\n☐ Cinta de precaución para enganches, cables y otros riesgos\n☐ Bolsas transparentes (seguridad revisa a todos)\n☐ Carretilla o diablito\n☐ Bolsas de basura; la grasa va en nuestros barriles\n\nRecomendamos platos, vasos y cubiertos compostables."},
   {k:["agua","potable","hielo","barril de grasa","aguas grises"],
    a:"En Zozobra, el agua potable viene del camión de agua en el estacionamiento del Fort Marcy Complex, y si pediste hielo, enviamos el código del camión de hielo el viernes por la mañana (nadie menor de 18 en el camión). Hay barriles de grasa en todos los eventos.\n\nNunca tires grasa, aguas grises ni hielo derretido en el suelo o las coladeras: es regla de la Ciudad y de NMED, y te cuesta el depósito."},
   {k:["bolsa","bolsas","plastico","plástico","unicel","compostable","biodegradable","popote"],
    a:"La Ciudad de Santa Fe prohíbe las bolsas de plástico de un solo uso; usa bolsas de papel o reutilizables. Recomendamos platos, vasos y cubiertos compostables o biodegradables (US Foods y Sysco New Mexico los venden)."},
   {k:["seguridad","bolsa transparente","revision","revisión"],
    a:"Seguridad puede revisar a vendedores y personal en cualquier momento, y deben usar bolsas o mochilas transparentes durante el evento. Lleva puesta tu pulsera de vendedor todo el tiempo."},
   {k:["aprob","aceptad","respuesta","decision","decisión","confirm"],
    a:"Solicitar no es aprobación. Nuestro encargado de vendedores revisa cada solicitud. Al aprobarte, te enviamos tu puesto asignado, el enlace de credenciales para tu personal y los detalles de estacionamiento.\n\nSi no podemos aprobar tu solicitud, te reembolsamos el pago completo."},
   {k:["cancelar","lluvia","clima","no puedo ir","retirar"],
    a:"Todos los eventos son con lluvia o sol. La tarifa del puesto no es reembolsable una vez aprobado, y Kiwanis no se hace responsable por producto no vendido ni ventas perdidas. Si no aprobamos tu solicitud, el reembolso es completo."},
   {k:["ubicacion","ubicación","lugar","asignado","mi puesto","donde estara","dónde estará","mapa","numero de puesto","número de puesto","espacio"],
    a:"No se garantiza un espacio en particular. Las indicaciones del Jefe de Bomberos siempre tienen prioridad. Tu puesto asignado llega en tu correo de aprobación y en el correo \"Must Read\" antes del evento."},
   {k:["montaje","montar","instalar","llegar","desmontar","hora","horario","manejar","pasto"],
    a:"Los horarios de montaje están en el correo \"Must Read\" que enviamos antes de cada evento. En general:\n\n• Zozobra: el montaje es el miércoles en la tarde y el jueves; el viernes solo entran comida y perecederos. Puestos listos a las 8 a.m. del viernes y todo fuera al mediodía del sábado.\n• Cuatro de Julio: puestos listos a la 1 p.m., cuando empiezan las inspecciones.\n\nNunca manejes sobre el pasto ni las banquetas, y ningún vehículo se mueve después del evento hasta que la policía lo autorice."},
   {k:["estacionamiento","estacionar","credencial","pulsera","pase","pases"],

var L = (location.search.indexOf('lang=es') > -1) ? ES : EN;
var chat = document.getElementById('chat');

function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}

function answer(text){
  var q = ' ' + norm(text) + ' ', best = null, score = 0;
  for (var i=0;i<L.kb.length;i++){
    var s = 0;
    for (var j=0;j<L.kb[i].k.length;j++){
      var key = norm(L.kb[i].k[j]);
      var hit = key.length <= 3 ? new RegExp('[^a-z]' + key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '[^a-z]').test(q) : q.indexOf(key) > -1;
      if (hit) s += key.length;
    }
    if (s > score){ score = s; best = L.kb[i]; }
  }
  return best ? best.a : L.fallback;
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rich(s){
  var h = esc(s);
  h = h.replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,})/g, '<a href="mailto:$1">$1</a>');
  return h;
}

function add(text, who){
  var d = document.createElement('div');
  d.className = 'msg ' + who;
  if (who === 'bot') d.innerHTML = rich(text); else d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function chips(){
  var box = document.getElementById('chips');
  box.innerHTML = '';
  L.chips.forEach(function(c){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = c;
    b.onclick = function(){ ask(c); };
    box.appendChild(b);
  });
}

function ask(text){
  add(text,'me');
  setTimeout(function(){ add(answer(text),'bot'); }, 280);
}

function paint(){
  document.getElementById('hdr').textContent = L.hdr;
  document.getElementById('lang').textContent = L.lang;
  document.getElementById('q').placeholder = L.ph;
  document.getElementById('send').textContent = L.send;
  document.getElementById('foot').innerHTML = L.foot;
  document.documentElement.lang = (L === ES) ? 'es' : 'en';
  chat.innerHTML = '';
  add(L.hello,'bot');
  chips();
}

document.getElementById('lang').onclick = function(){
  L = (L === EN) ? ES : EN;
  paint();
};

document.getElementById('f').onsubmit = function(e){
  e.preventDefault();
  var v = document.getElementById('q').value.trim();
  if (!v) return;
  document.getElementById('q').value = '';
  ask(v);
};

paint();
</script>
