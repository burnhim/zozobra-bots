.msg{max-width:88%;padding:12px 15px;border-radius:16px;margin-bottom:12px;line-height:1.55;font-size:15.5px;white-space:pre-line;}
.bot{background:#fff;border:2px solid var(--lilac);border-top-left-radius:4px;color:#1d1424;}

form{display:flex;gap:8px;padding:12px 16px;background:var(--deep);flex:0 0 auto;position:relative;z-index:1;}
input{flex:1;border:0;border-radius:24px;padding:12px 16px;font-size:15px;font-family:inherit;color:#1d1424;background:#fff;}
form button{background:var(--orange);color:var(--black);border:0;border-radius:24px;padding:12px 20px;font-weight:700;cursor:pointer;font-size:15px;font-family:inherit;}
footer{background:var(--deep);color:#fff;-webkit-text-fill-color:#fff;text-align:center;font-size:11.5px;padding:0 16px 10px;position:relative;z-index:1;flex:0 0 auto;}

var L = (location.search.indexOf('lang=es') > -1) ? ES : EN;
var chat = document.getElementById('chat');

function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}

function answer(text){
  var q = norm(text), best = null, score = 0;
  for (var i=0;i<L.kb.length;i++){
    var s = 0;
    for (var j=0;j<L.kb[i].k.length;j++){
      var key = norm(L.kb[i].k[j]);
      if (q.indexOf(key) > -1) s += key.length;
    }
    if (s > score){ score = s; best = L.kb[i]; }
  }
  return best ? best.a : L.fallback;
}

function add(text, who){
  var d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function chips(){
  var box = document.getElementById('chips');
  box.innerHTML = '';
  L.chips.forEach(function(c){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = c;
    b.onclick = function(){ ask(c); };
    box.appendChild(b);
  });
}

function ask(text){
  add(text,'me');
  setTimeout(function(){ add(answer(text),'bot'); }, 280);
}

function paint(){
  document.getElementById('lang').textContent = L.lang;
  document.getElementById('q').placeholder = L.ph;
  document.getElementById('send').textContent = L.send;
  document.getElementById('foot').innerHTML = L.foot;
  document.documentElement.lang = (L === ES) ? 'es' : 'en';
  chat.innerHTML = '';
  add(L.hello,'bot');
  chips();
}

document.getElementById('lang').onclick = function(){
  L = (L === EN) ? ES : EN;
  paint();
};

document.getElementById('f').onsubmit = function(e){
  e.preventDefault();
  var v = document.getElementById('q').value.trim();
  if (!v) return;
  document.getElementById('q').value = '';
  ask(v);
};

paint();
</script>
